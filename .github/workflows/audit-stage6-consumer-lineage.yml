name: Build core consumer-lineage batch
on:
  push:
    branches: [audit/full-lineage-20260923-1350]
    paths:
      - docs/audits/2026-09-23/build_stage6_consumer_lineage.py
      - .github/workflows/audit-stage6-consumer-lineage.yml
permissions:
  contents: write
jobs:
  lineage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build consumer lineage batch
        run: python -u docs/audits/2026-09-23/build_stage6_consumer_lineage.py
      - name: Persist results to audit branch
        run: |
          mkdir -p docs/audits/2026-09-23/stage6-consumer-lineage
          cp .audit-stage6/*.json docs/audits/2026-09-23/stage6-consumer-lineage/
          git config user.name "TowerSignal Audit"
          git config user.email "actions@users.noreply.github.com"
          git add docs/audits/2026-09-23/stage6-consumer-lineage
          git commit -m "audit: persist core consumer-lineage batch"
          git push origin HEAD:audit/full-lineage-20260923-1350
