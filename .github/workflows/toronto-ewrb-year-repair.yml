name: Toronto EWRB Year Repair

on:
  push:
    branches:
      - agent/toronto-ewrb-projection-20260904
    paths:
      - .github/workflows/toronto-ewrb-year-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/toronto-ewrb-projection-20260904
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch year parser and repair persisted EWRB years
        shell: python
        run: |
          import json
          import re
          from pathlib import Path

          script = Path('scripts/pull_ontario_open_building_environment.py')
          text = script.read_text(encoding='utf-8')
          old = '''def resource_year(resource: dict[str, Any]) -> int | None:\n    text = " ".join(str(resource.get(key) or "") for key in ("name", "description", "url"))\n    years = re.findall(r"\\b(20\\d{2})\\b", text)\n    return max((int(year) for year in years), default=None)\n'''
          new = '''def resource_year(resource: dict[str, Any]) -> int | None:\n    # Publisher resource names are authoritative when they carry a reporting year.\n    # Do not let publication/update years in descriptions override a named vintage.\n    for key in ("name", "url", "description"):\n        years = re.findall(r"\\b(20\\d{2})\\b", str(resource.get(key) or ""))\n        if years:\n            return max(int(year) for year in years)\n    return None\n'''
          if old not in text:
              raise SystemExit('resource_year anchor changed')
          script.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('tests/python/test_ontario_open_building_environment.py')
          test.write_text('''from __future__ import annotations\n\nimport unittest\n\nfrom scripts.pull_ontario_open_building_environment import resource_year\n\n\nclass OntarioOpenBuildingEnvironmentTests(unittest.TestCase):\n    def test_resource_name_year_wins_over_later_metadata_year(self) -> None:\n        resource = {\n            "name": "2022",\n            "description": "Updated publication prepared in 2023",\n            "url": "https://example.invalid/energy_large_building_energy_water_ghgs_2022.xlsx",\n        }\n        self.assertEqual(resource_year(resource), 2022)\n\n    def test_url_year_is_fallback_when_name_has_no_year(self) -> None:\n        resource = {\n            "name": "Annual report",\n            "description": "Published in 2025",\n            "url": "https://example.invalid/compliance-2024.csv",\n        }\n        self.assertEqual(resource_year(resource), 2024)\n\n    def test_description_year_is_last_fallback(self) -> None:\n        self.assertEqual(resource_year({"name": "Dataset", "url": "", "description": "Reporting year 2021"}), 2021)\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding='utf-8')

          warehouse = Path('data/toronto/warehouse/current/open_licensed/ontario_ewrb_large_buildings.json')
          payload = json.loads(warehouse.read_text(encoding='utf-8'))
          repaired_rows = 0
          for row in payload.get('toronto_rows', []):
              if str(row.get('_towersignal_source_resource_name') or '').strip() == '2022' and row.get('_towersignal_source_year') != 2022:
                  row['_towersignal_source_year'] = 2022
                  repaired_rows += 1
          repaired_resources = 0
          for resource in (payload.get('metadata') or {}).get('resources', []):
              if str(resource.get('name') or '').strip() == '2022' and resource.get('year') != 2022:
                  resource['year'] = 2022
                  repaired_resources += 1
          if repaired_rows != 2445:
              raise SystemExit(f'Expected 2445 repaired 2022 Toronto rows, got {repaired_rows}')
          if repaired_resources != 1:
              raise SystemExit(f'Expected one repaired 2022 resource, got {repaired_resources}')
          warehouse.write_text(json.dumps(payload, separators=(',', ':'), ensure_ascii=False, default=str), encoding='utf-8')

          report = {
              'status': 'PASSED',
              'contract': 'Resource name reporting year takes precedence over later publication/update years in descriptions or URLs.',
              'repaired_resource_name': '2022',
              'repaired_toronto_rows': repaired_rows,
              'repaired_resources': repaired_resources,
              'property_identity_effect': 'NONE',
              'tower_evidence_effect': 'NONE',
              'relationship_effect': 'NONE',
          }
          Path('data/toronto/warehouse/current/open_licensed/ontario_ewrb_year_repair_report.json').write_text(json.dumps(report, indent=2), encoding='utf-8')
      - name: Verify parser and repaired snapshot
        env:
          PYTHONPATH: .:scripts
        run: |
          python -m unittest tests.python.test_ontario_open_building_environment -v
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          payload = json.loads(Path('data/toronto/warehouse/current/open_licensed/ontario_ewrb_large_buildings.json').read_text(encoding='utf-8'))
          rows = payload['toronto_rows']
          years = Counter(row.get('_towersignal_source_year') for row in rows)
          resources = {item.get('name'): item.get('year') for item in payload['metadata']['resources']}
          assert resources['2022'] == 2022, resources
          assert years[2022] == 2445, years
          assert sum(years.values()) == 11595
          assert not any('address' in str(key).lower() for row in rows[:500] for key in row)
          print('EWRB_YEAR_COUNTS=', dict(sorted(years.items(), key=lambda item: (item[0] is None, item[0] or 0))))
          PY
      - name: Persist repair
        run: |
          git config user.name "TowerSignal Ontario Data Bot"
          git config user.email "towersignal-ontario@users.noreply.github.com"
          git rm .github/workflows/toronto-ewrb-projection-preview.yml .github/workflows/toronto-ewrb-year-repair.yml
          git add scripts/pull_ontario_open_building_environment.py tests/python/test_ontario_open_building_environment.py data/toronto/warehouse/current/open_licensed/ontario_ewrb_large_buildings.json data/toronto/warehouse/current/open_licensed/ontario_ewrb_year_repair_report.json
          git commit -m "Toronto: repair Ontario EWRB reporting-year normalization"
          git push origin HEAD:agent/toronto-ewrb-projection-20260904
          echo "EWRB_REPAIR_SHA=$(git rev-parse HEAD)"
