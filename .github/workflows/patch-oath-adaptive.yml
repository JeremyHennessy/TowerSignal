name: Apply adaptive OATH fallback patch

on:
  push:
    branches:
      - agent/oath-adaptive-exact-fallback-20260907
    paths:
      - '.github/workflows/patch-oath-adaptive.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/oath-adaptive-exact-fallback-20260907
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch adaptive timeout splitting
        run: |
          python - <<'PY'
          from pathlib import Path

          oath = Path('scripts/towersignal/oath.py')
          text = oath.read_text()
          constants_old = 'OATH_RATE_LIMIT_RETRIES = 4\nOATH_REQUEST_RETRIES = 1'
          constants_new = (
              'OATH_RATE_LIMIT_RETRIES = 4\n'
              'OATH_TIMEOUT_SPLIT_AFTER_ATTEMPTS = 2\n'
              'OATH_MIN_SPLIT_BATCH_SIZE = 25\n'
              'OATH_REQUEST_RETRIES = 1'
          )
          if constants_old not in text:
              raise SystemExit('expected OATH constants anchor not found')
          text = text.replace(constants_old, constants_new, 1)

          start = text.index('def _fetch_exact_ticket_batch(')
          end = text.index('\ndef _merge_exact_ticket_batch', start)
          new_block = '''def _is_timeout_oath_error(exc: SourceFetchError) -> bool:
              message = str(exc).lower()
              return "timeout" in message or "timed out" in message


          def _fetch_exact_ticket_batch(batch: list[str]) -> tuple[list[str], list[dict[str, Any]]]:
              quoted = ",".join("'" + ticket.replace("'", "''") + "'" for ticket in batch)
              where = f"ticket_number in ({quoted})"
              last_error: SourceFetchError | None = None
              for attempt in range(OATH_RATE_LIMIT_RETRIES):
                  try:
                      rows = fetch_where(
                          OATH_DATASET_ID,
                          where,
                          select=OATH_SELECT,
                          request_retries=OATH_REQUEST_RETRIES,
                          request_timeout=OATH_REQUEST_TIMEOUT_SECONDS,
                      )
                      return batch, rows
                  except SourceFetchError as exc:
                      last_error = exc
                      if not _is_transient_oath_error(exc):
                          raise
                      if (
                          _is_timeout_oath_error(exc)
                          and len(batch) > OATH_MIN_SPLIT_BATCH_SIZE
                          and attempt + 1 >= OATH_TIMEOUT_SPLIT_AFTER_ATTEMPTS
                      ):
                          raise
                      if attempt + 1 >= OATH_RATE_LIMIT_RETRIES:
                          raise
                      delay = 10 * (attempt + 1)
                      print(
                          f"[oath] Transient OATH source error while fetching {len(batch):,} exact tickets; "
                          f"retrying in {delay}s",
                          flush=True,
                      )
                      time.sleep(delay)
              raise last_error or SourceFetchError("OATH exact-ticket batch failed")


          def _fetch_exact_ticket_batch_resilient(batch: list[str]) -> tuple[list[str], list[dict[str, Any]]]:
              try:
                  return _fetch_exact_ticket_batch(batch)
              except SourceFetchError as exc:
                  if not _is_timeout_oath_error(exc) or len(batch) <= OATH_MIN_SPLIT_BATCH_SIZE:
                      raise
                  midpoint = len(batch) // 2
                  left = batch[:midpoint]
                  right = batch[midpoint:]
                  if not left or not right:
                      raise
                  print(
                      f"[oath] Exact-ticket query for {len(batch):,} tickets timed out repeatedly; "
                      f"splitting into {len(left):,} + {len(right):,} tickets",
                      flush=True,
                  )
                  _, left_rows = _fetch_exact_ticket_batch_resilient(left)
                  _, right_rows = _fetch_exact_ticket_batch_resilient(right)
                  return batch, [*left_rows, *right_rows]
          '''.replace('          ', '')
          text = text[:start] + new_block + text[end:]
          submit_old = 'executor.submit(_fetch_exact_ticket_batch, batch)'
          if text.count(submit_old) != 2:
              raise SystemExit(f'expected two exact-ticket submit sites, found {text.count(submit_old)}')
          text = text.replace(submit_old, 'executor.submit(_fetch_exact_ticket_batch_resilient, batch)')
          oath.write_text(text)

          tests = Path('tests/python/test_oath_fetch.py')
          test_text = tests.read_text()
          anchor = '    @patch("towersignal.oath.fetch_metadata", return_value={"name": "OATH test", "source_last_updated_at": "2026-09-06T00:00:00Z"})\n    @patch("towersignal.oath.fetch_where")\n    def test_large_ticket_set_uses_stable_cooling_tower_agency_slice'
          if anchor not in test_text:
              raise SystemExit('expected OATH test anchor not found')
          added = '''    @patch("towersignal.oath.OATH_MIN_SPLIT_BATCH_SIZE", 2)
              @patch("towersignal.oath.time.sleep")
              @patch("towersignal.oath.fetch_metadata", return_value={"name": "OATH test", "source_last_updated_at": "2026-09-06T00:00:00Z"})
              @patch("towersignal.oath.fetch_where")
              def test_repeated_large_batch_timeout_splits_until_queries_succeed(
                  self, fetch_where_mock, _fetch_metadata_mock, sleep_mock
              ):
                  requested = [f"{index:010d}" for index in range(8)]
                  calls_by_size = {}

                  def fetch_side_effect(
                      dataset_id,
                      where,
                      order_by=None,
                      select=None,
                      api_root=None,
                      request_retries=None,
                      request_timeout=None,
                  ):
                      tickets = re.findall(r"'([^']+)'", where)
                      size = len(tickets)
                      calls_by_size[size] = calls_by_size.get(size, 0) + 1
                      if size > 2:
                          raise SourceFetchError("The read operation timed out")
                      return [{"ticket_number": ticket, "hearing_status": "HEARING COMPLETED"} for ticket in tickets]

                  fetch_where_mock.side_effect = fetch_side_effect
                  cases, metadata = fetch_oath_cases(requested, batch_size=8, max_workers=1)

                  self.assertEqual(set(cases), set(requested))
                  self.assertEqual(metadata["matched_ticket_count"], 8)
                  self.assertEqual(calls_by_size[8], 2)
                  self.assertEqual(calls_by_size[4], 4)
                  self.assertEqual(calls_by_size[2], 4)
                  self.assertGreaterEqual(sleep_mock.call_count, 3)

              @patch("towersignal.oath.OATH_MIN_SPLIT_BATCH_SIZE", 2)
              @patch("towersignal.oath.time.sleep")
              @patch("towersignal.oath.fetch_metadata", return_value={"name": "OATH test", "source_last_updated_at": "2026-09-06T00:00:00Z"})
              @patch("towersignal.oath.fetch_where")
              def test_smallest_timeout_batch_still_fails_closed(
                  self, fetch_where_mock, _fetch_metadata_mock, _sleep_mock
              ):
                  requested = ["0880900460", "0880900470"]
                  fetch_where_mock.side_effect = SourceFetchError("The read operation timed out")
                  with self.assertRaises(SourceFetchError):
                      fetch_oath_cases(requested, batch_size=2, max_workers=1)
                  self.assertEqual(fetch_where_mock.call_count, 4)

          '''.replace('              ', '')
          test_text = test_text.replace(anchor, added + anchor, 1)
          tests.write_text(test_text)
          PY
      - name: Run focused OATH tests
        run: python -m unittest tests.python.test_oath_fetch -v
      - name: Commit source and tests
        run: |
          git config user.name 'TowerSignal Source Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/towersignal/oath.py tests/python/test_oath_fetch.py
          git commit -m 'Split repeated OATH timeout batches adaptively'
          git push origin HEAD:agent/oath-adaptive-exact-fallback-20260907
