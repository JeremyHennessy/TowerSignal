name: Apply authorized company evidence migration 013

on:
  push:
    branches: [ops/apply-company-evidence-013-20260925]
    paths: ['.github/workflows/company-data-audit.yml']

permissions:
  contents: read

concurrency:
  group: company-evidence-production-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 155fd601ac89b3c48bd0afb98ebcfcbbb90c7088
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'psycopg[binary]==3.2.10'
      - name: Apply approved migration atomically and verify preserved company records
        env:
          DATABASE_URL: ${{ secrets.TOWERSIGNAL_DATABASE_URL_UNPOOLED }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import psycopg
          from psycopg import sql
          expected = ['company_parent_entities','company_parent_relationships','company_enrichment_sources','company_enrichment_runs','company_enrichment_candidates']
          migration = Path('database/migrations/013_company_parent_enrichment.sql').read_text().strip()
          assert migration.startswith('BEGIN;') and migration.endswith('COMMIT;')
          with psycopg.connect(os.environ['DATABASE_URL']) as conn:
              with conn.cursor() as cur:
                  cur.execute("SET LOCAL lock_timeout='10s'; SET LOCAL statement_timeout='60s'")
                  cur.execute("SELECT pg_advisory_xact_lock(hashtext('towersignal-company-evidence-migration-013'))")
                  cur.execute("SELECT tablename FROM pg_tables WHERE schemaname='public' AND tablename LIKE 'company_%' ORDER BY tablename")
                  existing = [row[0] for row in cur.fetchall()]
                  def fingerprint(table):
                      cur.execute(sql.SQL("SELECT count(*), md5(coalesce(string_agg(h,'' ORDER BY h),'')) FROM (SELECT md5(to_jsonb(t)::text) h FROM public.{} t) s").format(sql.Identifier(table)))
                      return cur.fetchone()
                  for table in existing:
                      cur.execute(sql.SQL('LOCK TABLE public.{} IN SHARE MODE').format(sql.Identifier(table)))
                  before = {table: fingerprint(table) for table in existing}
                  cur.execute(migration[len('BEGIN;'):-len('COMMIT;')])
                  after = {table: fingerprint(table) for table in existing}
                  assert before == after, 'Existing company records changed; rolling back'
                  for table in expected:
                      cur.execute("SELECT relrowsecurity FROM pg_class WHERE oid=%s::regclass", ('public.'+table,))
                      assert cur.fetchone() == (True,), 'RLS missing'
                      cur.execute("SELECT count(*) FROM pg_policies WHERE schemaname='public' AND tablename=%s AND policyname='admin_only' AND roles=ARRAY['authenticated']::name[] AND qual LIKE '%%towersignal_is_admin%%' AND with_check LIKE '%%towersignal_is_admin%%'", (table,))
                      assert cur.fetchone() == (1,), 'Admin policy missing'
                      cur.execute("SELECT has_table_privilege('authenticated',%s,'SELECT')", ('public.'+table,))
                      assert cur.fetchone() == (True,), 'Admin SELECT grant missing'
                      assert fingerprint(table)[0] == 0, 'Unexpected evidence rows; rolling back'
                  cur.execute("SELECT has_table_privilege('authenticated','public.company_enrichment_candidates','INSERT'), has_table_privilege('authenticated','public.company_enrichment_runs','INSERT'), has_column_privilege('authenticated','public.company_enrichment_candidates','status','UPDATE')")
                  assert cur.fetchone() == (False,False,True), 'Worker/reviewer privilege boundary invalid'
                  cur.execute('SET LOCAL ROLE authenticated')
                  cur.execute('SELECT public.towersignal_is_admin()')
                  assert cur.fetchone() == (False,), 'Unidentified session unexpectedly admin'
                  for table in expected:
                      cur.execute(sql.SQL('SELECT count(*) FROM public.{}').format(sql.Identifier(table)))
                      assert cur.fetchone() == (0,), 'Non-admin evidence read unexpected'
                  cur.execute('RESET ROLE')
              print(f'MIGRATION_013_VALIDATED tables={len(expected)} preserved_existing_tables={len(existing)}')
          print('MIGRATION_013_COMMITTED=PASS; AUTOMATIC_ENRICHMENT=DISABLED')
          PY
      - name: Read post-migration mapping integrity and enrichment coverage
        env:
          DATABASE_URL: ${{ secrets.TOWERSIGNAL_DATABASE_URL_UNPOOLED }}
          PGOPTIONS: -c default_transaction_read_only=on -c statement_timeout=30000
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -P pager=off -At -f database/audits/company_parent_enrichment.sql
