name: Build 016F bearer diagnostic cleanup

on:
  push:
    branches: [agent/build016f-fast-verify]

permissions:
  contents: read

jobs:
  bearer-diagnostic-cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Revoke disposable diagnostic sessions
        shell: bash
        env:
          AUTH_BASE: https://ep-silent-moon-au2icaki.neonauth.c-10.us-east-1.aws.neon.tech/neondb/auth
          TEST_EMAIL: towersignal-e2e-33112994937-1-desktop@example.com
          TEST_PASSWORD: TowerSignal-E2E-2026!
          TRUSTED_ORIGIN: https://jeremyhennessy.github.io
        run: |
          set -euo pipefail
          body="$(mktemp)"
          jar="$(mktemp)"

          sign_status="$(curl --silent --show-error \
            --request POST "$AUTH_BASE/sign-in/email" \
            --header "Origin: $TRUSTED_ORIGIN" \
            --header 'Content-Type: application/json' \
            --cookie-jar "$jar" \
            --output "$body" \
            --write-out '%{http_code}' \
            --data "{\"email\":\"$TEST_EMAIL\",\"password\":\"$TEST_PASSWORD\",\"rememberMe\":false}")"
          echo "cleanup_sign_in_http=$sign_status"
          [[ "$sign_status" == '200' ]]

          revoke_status="$(curl --silent --show-error \
            --request POST "$AUTH_BASE/revoke-other-sessions" \
            --header "Origin: $TRUSTED_ORIGIN" \
            --header 'Content-Type: application/json' \
            --cookie "$jar" \
            --cookie-jar "$jar" \
            --output /dev/null \
            --write-out '%{http_code}' \
            --data '{}')"
          echo "revoke_other_sessions_http=$revoke_status"
          [[ "$revoke_status" == '200' ]]

          signout_status="$(curl --silent --show-error \
            --request POST "$AUTH_BASE/sign-out" \
            --header "Origin: $TRUSTED_ORIGIN" \
            --header 'Content-Type: application/json' \
            --cookie "$jar" \
            --cookie-jar "$jar" \
            --output /dev/null \
            --write-out '%{http_code}' \
            --data '{}')"
          echo "cleanup_sign_out_http=$signout_status"
          [[ "$signout_status" == '200' ]]

          session_status="$(curl --silent --show-error \
            --request GET "$AUTH_BASE/get-session" \
            --header "Origin: $TRUSTED_ORIGIN" \
            --cookie "$jar" \
            --output "$body" \
            --write-out '%{http_code}')"
          has_user="$(jq -r 'if ((.user.email // .data.user.email // "") | length) > 0 then "yes" else "no" end' "$body" 2>/dev/null || echo no)"
          echo "post_cleanup_get_session_http=$session_status"
          echo "post_cleanup_authenticated_user=$has_user"
          [[ "$has_user" == 'no' ]]
          echo 'diagnostic_cleanup=PASS'
