name: Build 016F hosting integration diagnostic

on:
  push:
    branches: [agent/build016f-fast-verify]

permissions:
  contents: read

jobs:
  hosting-integration-diagnostic:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Detect configured hosting credentials without exposing them
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]] && echo 'cloudflare_api_token_configured=yes' || echo 'cloudflare_api_token_configured=no'
          [[ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]] && echo 'cloudflare_account_id_configured=yes' || echo 'cloudflare_account_id_configured=no'
          [[ -n "${VERCEL_TOKEN:-}" ]] && echo 'vercel_token_configured=yes' || echo 'vercel_token_configured=no'
          [[ -n "${VERCEL_ORG_ID:-}" ]] && echo 'vercel_org_id_configured=yes' || echo 'vercel_org_id_configured=no'
          [[ -n "${VERCEL_PROJECT_ID:-}" ]] && echo 'vercel_project_id_configured=yes' || echo 'vercel_project_id_configured=no'

      - name: List existing Cloudflare Pages projects when credentials are available
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(mktemp)"
          status="$(curl --silent --show-error \
            --request GET "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects" \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header 'Content-Type: application/json' \
            --output "$response" \
            --write-out '%{http_code}')"
          echo "cloudflare_pages_api_http=$status"
          jq -c '{success, project_count:(.result|length), projects:[.result[]? | {name, subdomain, production_branch}]}' "$response"
