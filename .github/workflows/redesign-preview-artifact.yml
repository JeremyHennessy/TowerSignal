name: Redesign Preview Artifact

on:
  push:
    branches:
      - agent/product-redesign-20260826

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies for disposable preview
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Recover deterministic preview fixture from parent preview commit
        shell: bash
        run: |
          git show HEAD^:.github/workflows/redesign-preview-artifact.yml > /tmp/parent-preview.yml
          sed -n "/python - <<'PY'/,/^          PY$/p" /tmp/parent-preview.yml | sed '1d;$d;s/^          //' > /tmp/preview_data.py
          python /tmp/preview_data.py
      - name: Build preview
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: towersignal-redesign-preview
          path: dist
          retention-days: 1
