name: Toronto Apartment Evaluation Identity Diagnostic

on:
  push:
    branches:
      - agent/toronto-apartment-identity-diagnostic-20260904
    paths:
      - .github/workflows/toronto-apartment-identity-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/toronto-apartment-identity-diagnostic-20260904
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Measure deterministic shared-identifier recovery
        env:
          PYTHONPATH: .:scripts
        run: |
          python - <<'PY'
          import json, re
          from collections import Counter, defaultdict
          from pathlib import Path
          from toronto_final_identity_cleanup import iter_records
          from toronto_source_identity import find_source_record, stable_source_record_id

          source_key = 'apartment_building_evaluation'
          market = Path('data/toronto/market/current')
          warehouse = Path('data/toronto/warehouse/current/open_licensed')
          source = json.loads((warehouse / 'apartment_building_evaluation.json').read_text(encoding='utf-8'))
          rows = [row for row in iter_records(source) if isinstance(row, dict)]
          links_payload = json.loads((market / 'property_source_links.json').read_text(encoding='utf-8'))
          links = [link for link in links_payload.get('links', []) if isinstance(link, dict) and link.get('source_key') == source_key]
          graph = json.loads((market / 'entity_graph.json').read_text(encoding='utf-8'))

          key_counts = Counter(key for row in rows for key in row)
          normalized_keys = defaultdict(list)
          for key in key_counts:
              normalized_keys[re.sub(r'[^a-z0-9]', '', key.lower())].append(key)
          candidate_identifier_keys = []
          for normalized, keys in normalized_keys.items():
              if normalized in {'rsn','buildingid','buildingrsn','propertyrsn','siteid','registrationid'} or ('rsn' in normalized and 'person' not in normalized):
                  candidate_identifier_keys.extend(keys)

          by_stable_id = {}
          unresolved_existing = []
          for link in links:
              record = find_source_record(source_key, str(link.get('source_record_id') or ''), rows)
              if not record:
                  unresolved_existing.append(link)
                  continue
              sid = stable_source_record_id(source_key, record)
              pid = str(link.get('property_id') or '').strip()
              if sid in by_stable_id and by_stable_id[sid] != pid:
                  raise SystemExit(f'Existing apartment row maps to conflicting properties: {sid}')
              by_stable_id[sid] = pid

          rentsafe_rsn_to_properties = defaultdict(set)
          for edge in graph.get('edges', []):
              if not isinstance(edge, dict) or edge.get('source_key') != 'rentsafe_registration':
                  continue
              rsn = str((edge.get('evidence') or {}).get('rsn') or '').strip()
              pid = str(edge.get('property_id') or edge.get('to_node') or '').strip()
              if rsn and pid:
                  rentsafe_rsn_to_properties[rsn].add(pid)

          row_identifier_maps = {key: defaultdict(set) for key in candidate_identifier_keys}
          linked_consistency = {key: {'checked': 0, 'agree': 0, 'conflict': 0, 'no_rentsafe': 0} for key in candidate_identifier_keys}
          for row in rows:
              sid = stable_source_record_id(source_key, row)
              pid = by_stable_id.get(sid)
              for key in candidate_identifier_keys:
                  value = str(row.get(key) or '').strip()
                  if not value:
                      continue
                  if pid:
                      row_identifier_maps[key][value].add(pid)
                      mapped = rentsafe_rsn_to_properties.get(value, set())
                      linked_consistency[key]['checked'] += 1
                      if not mapped:
                          linked_consistency[key]['no_rentsafe'] += 1
                      elif mapped == {pid}:
                          linked_consistency[key]['agree'] += 1
                      else:
                          linked_consistency[key]['conflict'] += 1

          recoveries = []
          ambiguous = []
          by_key = Counter()
          for index, row in enumerate(rows):
              sid = stable_source_record_id(source_key, row)
              if sid in by_stable_id:
                  continue
              candidate_pids = []
              bases = []
              detail = {}
              for key in candidate_identifier_keys:
                  value = str(row.get(key) or '').strip()
                  if not value:
                      continue
                  linked_map = row_identifier_maps[key].get(value, set())
                  rentsafe_map = rentsafe_rsn_to_properties.get(value, set())
                  detail[key] = {'value': value, 'apartment_linked_properties': sorted(linked_map), 'rentsafe_properties': sorted(rentsafe_map)}
                  if len(linked_map) == 1:
                      candidate_pids.append(next(iter(linked_map)))
                      bases.append(f'UNIQUE_{key}_FROM_EXISTING_APARTMENT_LINK')
                  if key.lower() == 'rsn' and len(rentsafe_map) == 1:
                      candidate_pids.append(next(iter(rentsafe_map)))
                      bases.append('UNIQUE_RSN_FROM_RENTSAFE_RELATIONSHIP')
              if candidate_pids and len(set(candidate_pids)) == 1:
                  pid = candidate_pids[0]
                  basis = '+'.join(sorted(set(bases)))
                  by_key[basis] += 1
                  recoveries.append({
                      'source_row_index': index,
                      'source_record_id': sid,
                      'property_id': pid,
                      'basis': basis,
                      'identifiers': detail,
                      'sample': {key: row.get(key) for key in list(row)[:15]},
                  })
              elif candidate_pids or any(v['apartment_linked_properties'] or v['rentsafe_properties'] for v in detail.values()):
                  ambiguous.append({'source_row_index': index, 'source_record_id': sid, 'identifiers': detail})

          report = {
              'source_records': len(rows),
              'existing_source_links': len(links),
              'existing_links_resolved': len(by_stable_id),
              'existing_links_unresolved': len(unresolved_existing),
              'unlinked_rows': len(rows) - len(by_stable_id),
              'candidate_identifier_keys': candidate_identifier_keys,
              'identifier_key_presence': {key: key_counts[key] for key in candidate_identifier_keys},
              'linked_identifier_consistency': linked_consistency,
              'rentsafe_unique_rsn_count': sum(len(v) == 1 for v in rentsafe_rsn_to_properties.values()),
              'rentsafe_ambiguous_rsn_count': sum(len(v) > 1 for v in rentsafe_rsn_to_properties.values()),
              'deterministically_recoverable_rows': len(recoveries),
              'recoverable_properties': len({row['property_id'] for row in recoveries}),
              'recovery_basis_counts': dict(by_key),
              'ambiguous_rows_not_forced': len(ambiguous),
              'sample_recoveries': recoveries[:30],
              'sample_ambiguous': ambiguous[:20],
              'top_source_keys': key_counts.most_common(40),
              'contract': 'Recovery is allowed only when a publisher identifier already maps uniquely to the same canonical property through an existing apartment-evaluation link or, for RSN, a source-backed RentSafe relationship. Conflicts and ambiguous identifiers are withheld. No tower or organization role is created.',
          }
          Path('/tmp/toronto-apartment-identity-diagnostic.json').write_text(json.dumps(report, indent=2, default=str), encoding='utf-8')
          print(json.dumps(report, indent=2, default=str))
          assert report['source_records'] == 6252, report
          assert report['existing_source_links'] == 5288, report
          assert report['existing_links_resolved'] == 5288, report
          assert report['existing_links_unresolved'] == 0, report
          assert report['unlinked_rows'] == 964, report
          assert report['candidate_identifier_keys'] == ['RSN'], report
          assert report['linked_identifier_consistency']['RSN']['conflict'] == 0, report
          assert report['rentsafe_ambiguous_rsn_count'] == 0, report
          assert report['deterministically_recoverable_rows'] == 26, report
          assert report['recoverable_properties'] == 14, report
          assert report['ambiguous_rows_not_forced'] == 0, report
          PY
      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: toronto-apartment-identity-diagnostic
          path: /tmp/toronto-apartment-identity-diagnostic.json
