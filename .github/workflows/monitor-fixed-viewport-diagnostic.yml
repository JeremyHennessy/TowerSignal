name: Diagnose Monitor WebKit viewport without production changes
on:
  push:
    branches: [work/monitor-fixed-viewport-20260916]
permissions:
  contents: read
  actions: read
jobs:
  fixed-viewport:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d1549c62a850b8837af4bc55106e3eff285a04bd
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: nyc-evidence-tested-candidate
          run-id: 35032234529
          github-token: ${{ github.token }}
          path: .baseline/archive
      - name: Build unchanged candidate; do not retain the failed sticky-header experiment
        run: |
          npm install --no-audit --no-fund
          npm run build
          mkdir -p .baseline/site diagnostics
          tar -xzf .baseline/archive/candidate.tgz -C .baseline/site
          cp -a .baseline/site/data/. dist/data/
          git diff --exit-code -- src
      - name: Isolate the hidden header in an ephemeral browser DOM, not in application source
        run: |
          cat > tests/e2e/monitor-header-isolation.spec.ts <<'TS'
          import {writeFileSync} from 'node:fs'
          import {expect,test} from './fixtures'
          test.use({viewport:{width:320,height:844},screen:{width:320,height:844}})
          test('isolate whether the hidden header causes the filter transition failure',async({page})=>{
            test.setTimeout(90000)
            const states:unknown[]=[]
            async function capture(name:string){
              const data=await page.evaluate(()=>{
                const box=(e:Element)=>{const r=e.getBoundingClientRect(),s=getComputedStyle(e);return {tag:e.tagName,cls:e.className,text:(e.textContent||'').slice(0,80),x:r.x,y:r.y,width:r.width,height:r.height,right:r.right,scrollWidth:e.scrollWidth,scrollHeight:e.scrollHeight,position:s.position,overflow:s.overflow,transform:s.transform,contain:s.contain}}
                return {innerWidth,bodyWidth:document.body.scrollWidth,documentWidth:document.documentElement.scrollWidth,viewport:visualViewport?{width:visualViewport.width,scale:visualViewport.scale}:null,containers:[...document.querySelectorAll('body,#root,.reference-main,.product-page,.change-table-workspace,.reference-table-card,.monitor-event-scroll,.change-reference-table,thead,tbody')].map(box),outside:[...document.querySelectorAll('body *')].filter(e=>{const r=e.getBoundingClientRect();return e.getClientRects().length&&r.width>0&&(r.right>322||r.x< -2)}).slice(0,80).map(box)}
              })
              states.push({name,data});writeFileSync('diagnostics/header-isolation.json',JSON.stringify(states,null,2))
              await page.screenshot({path:`diagnostics/${name}.png`,scale:'css',animations:'disabled',timeout:10000})
              expect(data.innerWidth).toBe(320);expect(data.bodyWidth).toBeLessThanOrEqual(322)
            }
            await page.evaluate(()=>{location.hash='#/monitor'})
            const monitor=page.getByRole('region',{name:'TowerSignal changes'})
            await expect(monitor.locator('.change-reference-row').first()).toBeVisible()
            await monitor.locator('thead').evaluate(e=>e.remove())
            await expect(monitor.locator('thead')).toHaveCount(0)
            await monitor.getByRole('tab',{name:/^Property \/ contact/}).click()
            await monitor.locator('.change-reference-row').first().scrollIntoViewIfNeeded()
            await capture('header-absent-before-selection')
            await monitor.getByLabel(/^Change type/).selectOption('OATH_PENALTY_CHANGED')
            await expect(monitor.locator('.change-reference-row').first()).toContainText('$')
            await monitor.locator('.change-reference-row').first().scrollIntoViewIfNeeded()
            await capture('header-absent-after-selection')
          })
          TS
      - run: npx playwright install --with-deps webkit
      - name: Run single diagnostic with original source and styles
        env:
          CANDIDATE_ROOT: dist
          BASE_URL: https://jeremyhennessy.github.io/TowerSignal/
        run: npx playwright test tests/e2e/monitor-header-isolation.spec.ts --project=iphone
      - name: Retain geometry and images; this run cannot deploy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitor-header-isolation
          path: diagnostics/
          retention-days: 7
