name: Diagnose Monitor WebKit viewport without production changes
on:
  push:
    branches: [work/monitor-fixed-viewport-20260916]
permissions:
  contents: read
  actions: read
jobs:
  fixed-viewport:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d1549c62a850b8837af4bc55106e3eff285a04bd
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: nyc-evidence-tested-candidate
          run-id: 35032234529
          github-token: ${{ github.token }}
          path: .baseline/archive
      - name: Build unchanged candidate against accepted source data
        run: |
          npm install --no-audit --no-fund
          npm run build
          mkdir -p .baseline/site diagnostics
          tar -xzf .baseline/archive/candidate.tgz -C .baseline/site
          cp -a .baseline/site/data/. dist/data/
      - name: Trace native control and exact overflowing DOM boxes
        run: |
          cat > tests/e2e/monitor-layout-trace.spec.ts <<'TS'
          import {writeFileSync} from 'node:fs'
          import {expect,test} from './fixtures'
          test.use({viewport:{width:320,height:844},screen:{width:320,height:844}})
          test('observe OATH filter transition without changing production styles',async({page},info)=>{
            test.setTimeout(180000)
            const states:unknown[]=[]
            async function state(name:string){
              const data=await page.evaluate(()=>{
                const describe=(e:Element)=>{
                  const r=e.getBoundingClientRect(),s=getComputedStyle(e)
                  return {tag:e.tagName,cls:e.className,id:e.id,text:(e.textContent||'').trim().slice(0,100),rect:{x:r.x,y:r.y,w:r.width,h:r.height,right:r.right},client:e.clientWidth,scroll:e.scrollWidth,style:{display:s.display,width:s.width,minWidth:s.minWidth,maxWidth:s.maxWidth,padding:s.padding,boxSizing:s.boxSizing,overflow:s.overflow,fontSize:s.fontSize,position:s.position,whiteSpace:s.whiteSpace}}
                }
                return {innerWidth,innerHeight,scrollX,scrollY,screen:{width:screen.width,height:screen.height},viewport:visualViewport?{width:visualViewport.width,height:visualViewport.height,scale:visualViewport.scale,offsetLeft:visualViewport.offsetLeft,offsetTop:visualViewport.offsetTop}:null,body:describe(document.body),html:describe(document.documentElement),active:document.activeElement?describe(document.activeElement):null,controls:[...document.querySelectorAll('.changes-table-view select')].map(describe),outside:[...document.querySelectorAll('body *')].filter(e=>{const r=e.getBoundingClientRect();return e.getClientRects().length&&r.width>0&&(r.right>322||r.x< -2)}).slice(0,120).map(describe)}
              })
              states.push({name,time:new Date().toISOString(),data});writeFileSync('diagnostics/layout.json',JSON.stringify(states,null,2))
              await page.screenshot({path:`diagnostics/${name}.png`,scale:'css',animations:'disabled',timeout:15000}).catch(e=>writeFileSync(`diagnostics/${name}-screenshot-error.txt`,String(e)))
            }
            await page.evaluate(()=>{location.hash='#/monitor'})
            const monitor=page.getByRole('region',{name:'TowerSignal changes'})
            await expect(monitor.locator('.change-reference-row').first()).toBeVisible()
            await monitor.getByRole('tab',{name:/^Property \/ contact/}).click()
            await monitor.locator('.change-reference-row').first().scrollIntoViewIfNeeded()
            await state('before-selection')
            await monitor.getByLabel(/^Change type/).selectOption('OATH_PENALTY_CHANGED')
            await expect(monitor.locator('.change-reference-row').first()).toContainText('$')
            await state('after-selection-before-scroll')
            await monitor.locator('.change-reference-row').first().scrollIntoViewIfNeeded()
            await state('after-scroll')
            await page.evaluate(()=>{if(document.activeElement instanceof HTMLElement)document.activeElement.blur()})
            await state('after-blur')
            expect(states.length).toBe(4)
          })
          TS
      - run: npx playwright install --with-deps webkit
      - name: Run single unchanged-UI 320-pixel WebKit diagnostic
        env:
          CANDIDATE_ROOT: dist
          BASE_URL: https://jeremyhennessy.github.io/TowerSignal/
        run: npx playwright test tests/e2e/monitor-layout-trace.spec.ts --project=iphone
      - name: Preserve exact geometry and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitor-control-geometry
          path: diagnostics/
          retention-days: 7
