name: Diagnose Monitor WebKit viewport without production changes
on:
  push:
    branches: [work/monitor-fixed-viewport-20260916]
permissions:
  contents: read
  actions: read
jobs:
  fixed-viewport:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d1549c62a850b8837af4bc55106e3eff285a04bd
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: nyc-evidence-tested-candidate
          run-id: 35032234529
          github-token: ${{ github.token }}
          path: .baseline/archive
      - name: Test one isolated CSS hypothesis and retain stricter viewport checks
        run: |
          mkdir -p diagnostics
          python - <<'PY'
          from pathlib import Path
          p=Path('src/styles/monitor-event-table.css')
          p.write_text(p.read_text()+'\n/* Hidden mobile headings must not retain desktop sticky positioning. */\n@media(max-width:900px){.monitor-change-table-card .change-reference-table thead th{position:static}}\n')
          p=Path('tests/e2e/monitor-format.spec.ts');text=p.read_text()
          text=text.replace('await expectContained(page)\n    const metrics=', 'await expectContained(page)\n    expect(await page.evaluate(() => innerWidth)).toBe(page.viewportSize()!.width)\n    const metrics=')
          p.write_text(text)
          fixed=text.replace('const categories =','test.use({ viewport: { width: 320, height: 844 }, screen: { width: 320, height: 844 } })\n\nconst categories =')
          fixed=fixed.replace("const widths=testInfo.project.name==='iphone'?[390,320]:[1280,1024,768,1440]",'const widths=[320]')
          fixed=fixed.replace('await page.setViewportSize({width,height:original.height})','expect(page.viewportSize()?.width).toBe(width)').replace('await page.setViewportSize(original)','expect(page.viewportSize()).toEqual(original)')
          Path('tests/e2e/monitor-fixed320.spec.ts').write_text(fixed)
          Path('diagnostics/fixed320-test.ts').write_text(fixed)
          Path('diagnostics/resize-test.ts').write_text(text)
          PY
          git diff > diagnostics/isolated-change.diff
      - name: Build candidate UI with only the hidden-header correction
        run: |
          npm install --no-audit --no-fund
          npm run build
          mkdir -p .baseline/site
          tar -xzf .baseline/archive/candidate.tgz -C .baseline/site
          cp -a .baseline/site/data/. dist/data/
      - run: npx playwright install --with-deps webkit
      - name: Verify fresh 320px and original 390-to-320px tests without weaker assertions
        env:
          CANDIDATE_ROOT: dist
          BASE_URL: https://jeremyhennessy.github.io/TowerSignal/
        run: npx playwright test tests/e2e/monitor-format.spec.ts tests/e2e/monitor-fixed320.spec.ts --project=iphone
      - name: Retain complete diagnostic screenshots and assertions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitor-hidden-header-proof
          path: |
            diagnostics/
            playwright-report/
            test-results/
            !test-results/.auth/**
          retention-days: 7
