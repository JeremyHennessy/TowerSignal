name: PR206 OATH concurrency experiment

on:
  push:
    branches:
      - agent/oath-adaptive-agency-pages-20260907
    paths:
      - .github/workflows/pr206-oath-concurrency-experiment.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/oath-adaptive-agency-pages-20260907
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply single concurrency hypothesis
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^DEFAULT_MAX_WORKERS = 2$' scripts/towersignal/oath.py
          sed -i 's/^DEFAULT_MAX_WORKERS = 2$/DEFAULT_MAX_WORKERS = 4/' scripts/towersignal/oath.py
          grep -q '^DEFAULT_MAX_WORKERS = 4$' scripts/towersignal/oath.py
      - name: Run focused OATH regressions
        run: python -m unittest tests.python.test_oath_fetch -v
      - name: Commit experiment if tests pass
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'TowerSignal Reliability Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/towersignal/oath.py
          git diff --cached --quiet && exit 0
          git commit -m 'Increase OATH exact fallback concurrency to four workers'
          git push origin HEAD:agent/oath-adaptive-agency-pages-20260907
