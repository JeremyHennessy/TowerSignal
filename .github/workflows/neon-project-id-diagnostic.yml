name: Inspect TowerSignal Neon auth inventory access

on:
  push:
    branches:
      - agent/neon-auth-inventory-diagnostic-20260923

permissions:
  contents: read

jobs:
  inspect-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      TOWERSIGNAL_DATABASE_URL: ${{ secrets.TOWERSIGNAL_DATABASE_URL }}
      POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
    steps:
      - name: Read auth-user counts without exposing identities
        shell: bash
        run: |
          set -euo pipefail
          connection=""
          source_name=""
          for candidate in DATABASE_URL NEON_DATABASE_URL TOWERSIGNAL_DATABASE_URL POSTGRES_URL; do
            value="${!candidate:-}"
            if [ -n "$value" ]; then
              connection="$value"
              source_name="$candidate"
              break
            fi
          done
          if [ -z "$connection" ]; then
            echo "DATABASE_CONNECTION_SECRET_MISSING"
            exit 6
          fi
          echo "DATABASE_CONNECTION_SECRET_PRESENT=$source_name"
          if ! command -v psql >/dev/null 2>&1; then
            echo "PSQL_NOT_AVAILABLE"
            exit 7
          fi
          psql "$connection" -v ON_ERROR_STOP=1 -At <<'SQL'
          SELECT 'TOTAL_USERS=' || count(*) FROM neon_auth."user";
          SELECT 'GENERATED_TEST_USERS=' || count(*) FROM neon_auth."user"
            WHERE lower(email) LIKE 'towersignal-e2e-%@example.com'
               OR lower(email) LIKE 'towersignal-hosted-%@example.com'
               OR lower(email) LIKE 'towersignal-workflow-%@example.com'
               OR lower(email) LIKE 'towersignal-isolation-%@example.com';
          SELECT 'NON_GENERATED_USERS=' || count(*) FROM neon_auth."user"
            WHERE NOT (
              lower(email) LIKE 'towersignal-e2e-%@example.com'
              OR lower(email) LIKE 'towersignal-hosted-%@example.com'
              OR lower(email) LIKE 'towersignal-workflow-%@example.com'
              OR lower(email) LIKE 'towersignal-isolation-%@example.com'
            );
          SQL
