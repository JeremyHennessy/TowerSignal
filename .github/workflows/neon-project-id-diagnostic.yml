name: Inspect TowerSignal hosted credential availability

on:
  push:
    branches:
      - agent/neon-auth-inventory-diagnostic-20260923

permissions:
  contents: read

jobs:
  inspect-credentials:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      TOWERSIGNAL_E2E_EMAIL: ${{ secrets.TOWERSIGNAL_E2E_EMAIL }}
      TOWERSIGNAL_E2E_PASSWORD: ${{ secrets.TOWERSIGNAL_E2E_PASSWORD }}
    steps:
      - name: Check pre-provisioned hosted-test credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${TOWERSIGNAL_E2E_EMAIL:-}" ] && [ -n "${TOWERSIGNAL_E2E_PASSWORD:-}" ]; then
            echo "TOWERSIGNAL_E2E_CREDENTIALS_PRESENT"
            exit 0
          fi
          echo "TOWERSIGNAL_E2E_CREDENTIALS_MISSING"
          exit 8
