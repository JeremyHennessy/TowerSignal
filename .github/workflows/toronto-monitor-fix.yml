name: Toronto Monitor Test Fix

on:
  push:
    branches:
      - agent/toronto-approved-recovery-20260831
    paths:
      - .github/workflows/toronto-monitor-fix.yml

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/toronto-approved-recovery-20260831
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply deterministic Monitor test window
        shell: python
        run: |
          from pathlib import Path
          path = Path('tests/frontend/App.test.tsx')
          text = path.read_text(encoding='utf-8')
          old = """  await user.click(screen.getByRole('button', { name:'Monitor' }))
  expect(screen.getByRole('heading', { name:'Monitor workspace', level:1 })).toBeInTheDocument()
  expect(screen.getAllByText('New public sample reported').length).toBeGreaterThan(0)
"""
          new = """  await user.click(screen.getByRole('button', { name:'Monitor' }))
  expect(screen.getByRole('heading', { name:'Monitor workspace', level:1 })).toBeInTheDocument()
  await user.selectOptions(screen.getByLabelText('Time range'), '0')
  expect(screen.getAllByText('New public sample reported')).toHaveLength(2)
"""
          if old not in text:
              raise SystemExit('Monitor test anchor changed')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Verify Monitor test
        run: npm test -- tests/frontend/App.test.tsx --reporter=verbose
      - name: Commit only verified test correction
        run: |
          git config user.name "TowerSignal Recovery Bot"
          git config user.email "towersignal-recovery@users.noreply.github.com"
          git add tests/frontend/App.test.tsx
          git commit -m "Test: make Monitor retained-history assertion deterministic"
          git push origin HEAD:agent/toronto-approved-recovery-20260831
