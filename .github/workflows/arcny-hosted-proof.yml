name: ArcNY hosted acceptance proof

on:
  push:
    branches:
      - agent/arcny-hosted-proof-20260917

permissions:
  contents: read

jobs:
  hosted-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact PR 270 candidate
        uses: actions/checkout@v4
        with:
          ref: f9a9540a520c39b78d047ae2d271aecf3ef75722
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Install hosted-test browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Prove ArcNY isolated Workflow state on live Pages
        env:
          BASE_URL: https://jeremyhennessy.github.io/TowerSignal/
          CI: 'true'
        run: >-
          npx playwright test
          tests/e2e/auth.setup.ts
          tests/e2e/workflow-external-leads.spec.ts
          --project=setup-desktop
          --project=desktop-chromium
          --project=setup-iphone
          --project=iphone
      - name: Upload focused browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arcny-hosted-proof
          path: playwright-report
          retention-days: 14
