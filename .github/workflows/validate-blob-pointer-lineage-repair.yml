name: Validate Blob cross-workflow pointer repair
on:
  push:
    branches: [repair/blob-pointer-lineage-20260923]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Targeted Blob publisher tests
        run: python -m unittest tests.python.test_blob_release_publisher -v
      - name: Full Python suite
        run: python -m unittest discover -s tests/python -p 'test_*.py' -v
