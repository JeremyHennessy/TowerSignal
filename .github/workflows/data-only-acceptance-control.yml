name: Data-only migration acceptance control
on:
  push:
    branches: [agent/data-only-control-20260911]
    paths: [.github/workflows/data-only-acceptance-control.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bc29f20b4be89989ce7b29c781944e722fc4fd2a
          persist-credentials: false
      - name: Archive exact tracked source without credentials or Git configuration
        run: |
          test "$(git rev-parse HEAD)" = bc29f20b4be89989ce7b29c781944e722fc4fd2a
          git archive --format=tar.gz --output="$RUNNER_TEMP/source-bc29f20.tar.gz" HEAD
          sha256sum "$RUNNER_TEMP/source-bc29f20.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: data-only-pinned-source
          path: ${{ runner.temp }}/source-bc29f20.tar.gz
          retention-days: 1
