name: Data-only migration acceptance control
on:
  push:
    branches: [agent/data-only-control-20260911]
    paths: [.github/workflows/data-only-acceptance-control.yml]
permissions:
  contents: read
  pull-requests: read
  actions: write
concurrency:
  group: data-only-acceptance-dispatch
  cancel-in-progress: false
jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # This unmerged control branch has no Azure environment/key and no data-writing steps.
      - uses: actions/github-script@v7
        with:
          script: |
            const repo = {owner: 'JeremyHennessy', repo: 'TowerSignal'};
            const mainSha = '29c7c90e9d3c178535641692f33c13d4d9388017';
            const candidate = '94adcdae8cc21fd8741d5bdd89599fef14832616';
            const workflow = 'azure-data-refresh.yml';
            if (context.repo.owner !== repo.owner || context.repo.repo !== repo.repo ||
                context.ref !== 'refs/heads/agent/data-only-control-20260911') {
              throw new Error('Unexpected data-only acceptance context');
            }
            const main = (await github.rest.git.getRef({...repo, ref: 'heads/main'})).data;
            if (main.object.sha !== mainSha) throw new Error('Main moved before controlled dispatch');
            const pr = (await github.rest.pulls.get({...repo, pull_number: 225})).data;
            if (!pr.merged || pr.head.sha !== candidate || pr.merge_commit_sha !== mainSha) {
              throw new Error('PR 225 is not the exact tested merge');
            }
            const ci = (await github.rest.actions.getWorkflowRun({...repo, run_id: 34603958297})).data;
            if (ci.head_sha !== candidate || ci.status !== 'completed' || ci.conclusion !== 'success') {
              throw new Error('Exact candidate repository CI has not passed');
            }
            const browser = (await github.rest.actions.getWorkflowRun({...repo, run_id: 34604029778})).data;
            if (browser.head_sha !== '715de6e7b82a674028e53bf2b7b1958c59448bd9' ||
                browser.status !== 'completed' || browser.conclusion !== 'success') {
              throw new Error('Pinned baseline Chromium/WebKit acceptance has not passed');
            }
            for (const [path, sha] of [
              ['.github/workflows/' + workflow, '3b4a654d5b50a09a086be6835b9a4f766ac9e305'],
              ['scripts/blob_data_refresh.py', '8a149d00525f0c0e33385c42e73a6e2177a5459b'],
              ['playwright.data-only.config.ts', '95aaa133f2ea923063c4b131d3e219848b88485a'],
              ['tests/data-only/runtime.spec.ts', '6f55b782c8cbf3707457b1eb29aec7bd1b3679d4']
            ]) {
              const file = (await github.rest.repos.getContent({...repo, path, ref: mainSha})).data;
              if (file.type !== 'file' || file.sha !== sha) throw new Error('Reviewed data-only file differs');
            }
            const runs = (await github.rest.actions.listWorkflowRuns({...repo, workflow_id: workflow,
              head_sha: mainSha, event: 'workflow_dispatch', per_page: 100})).data;
            if (runs.total_count > 0) {
              core.info('The first data refresh was already requested; no duplicate run.');
              return;
            }
            const checked = (await github.rest.git.getRef({...repo, ref: 'heads/main'})).data;
            if (checked.object.sha !== mainSha) throw new Error('Main moved during dispatch checks');
            await github.rest.actions.createWorkflowDispatch({...repo, workflow_id: workflow,
              ref: 'main', inputs: {require_acris: 'false'}});
            core.info('Started only the reviewed data-only refresh. This is not a data freshness or publication result.');
