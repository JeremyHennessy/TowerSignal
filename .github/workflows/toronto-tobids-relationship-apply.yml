name: Toronto TOBids Relationship Apply

on:
  push:
    branches:
      - agent/toronto-tobids-relationship-apply-20260903
    paths:
      - .github/workflows/toronto-tobids-relationship-apply.yml

permissions:
  contents: write

concurrency:
  group: toronto-tobids-relationship-apply
  cancel-in-progress: false

jobs:
  apply-verify-and-persist:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact TOBids apply branch
        uses: actions/checkout@v4
        with:
          ref: agent/toronto-tobids-relationship-apply-20260903
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Compile bounded TOBids implementation
        run: python -m py_compile scripts/apply_toronto_tobids_relationships.py

      - name: Run TOBids and source-identity regressions
        run: |
          PYTHONPATH=.:scripts python -m unittest \
            tests.python.test_toronto_tobids_relationship_apply \
            tests.python.test_toronto_source_identity_regression \
            tests.python.test_toronto_chemtrac_regression \
            tests.python.test_toronto_identity_exceptions -v

      - name: Apply only verified exact-address TOBids links and bidder edges
        run: python scripts/apply_toronto_tobids_relationships.py

      - name: Recompute coverage and Toronto public payload without source refresh
        run: |
          python scripts/toronto_final_coverage.py
          python scripts/build_toronto_app_data.py

      - name: Validate source actions in strict mode
        run: python scripts/validate_toronto_source_actions.py --strict --record-sample-size 5

      - name: Audit semantics and row resolution in strict mode
        run: |
          python scripts/audit_toronto_source_semantics.py --strict
          python scripts/audit_toronto_public_notice_cardinality.py
          python scripts/audit_toronto_source_row_resolution.py --strict

      - name: Validate final market and evidence contract
        run: |
          python scripts/validate_toronto_market.py
          python scripts/toronto_final_validate.py
          python - <<'PY'
          import json
          from pathlib import Path

          market = Path('data/toronto/market/current')
          graph = json.loads((market / 'entity_graph.json').read_text(encoding='utf-8'))
          report = json.loads((market / 'tobids_relationship_apply_report.json').read_text(encoding='utf-8'))
          edges = [edge for edge in graph.get('edges', []) if isinstance(edge, dict) and edge.get('source_key') == 'tobids_awarded_contracts']
          assert edges, 'TOBids relationship edges missing'
          assert all(edge.get('relationship') == 'SUCCESSFUL_BIDDER_AT_PROPERTY' for edge in edges)
          assert report.get('status') == 'PASSED'
          metrics = report.get('metrics') or {}
          assert metrics.get('new_links') == 12
          assert metrics.get('new_relationship_edges') == 12
          assert metrics.get('final_successful_bidder_edges') == 17
          assert metrics.get('final_successful_bidder_properties') == 13
          print(json.dumps({'status': 'TOBIDS_ROLE_CONTRACT_PASSED', 'metrics': metrics}, indent=2))
          PY

      - name: Verify frontend and production build
        run: |
          npm run lint
          npm run typecheck
          VITE_ENABLE_TORONTO=true VITE_TORONTO_PREVIEW=true npm exec vitest run -- tests/frontend/TorontoMarket.test.tsx
          VITE_ENABLE_TORONTO=true VITE_TORONTO_PREVIEW=true npm exec vite build -- --base=/ --outDir=dist-tobids-relationship

      - name: Persist verified TOBids relationship expansion
        run: |
          git config user.name "TowerSignal Relationship Bot"
          git config user.email "towersignal-relationships@users.noreply.github.com"
          git add \
            data/toronto/market/current/property_source_links.json \
            data/toronto/market/current/entity_graph.json \
            data/toronto/market/current/coverage_report.json \
            data/toronto/market/current/tobids_relationship_apply_report.json \
            data/toronto/market/current/source_action_qa.json \
            data/toronto/market/current/source_semantic_audit.json \
            data/toronto/market/current/public_notice_cardinality_audit.json \
            data/toronto/market/current/source_row_resolution_audit.json \
            data/toronto/market/current/qa_report.json \
            public/data/toronto-market.json
          git diff --cached --quiet && { echo "No verified TOBids changes to persist"; exit 1; }
          git commit -m "Toronto: expand exact TOBids successful-bidder relationships"
          git push origin HEAD:agent/toronto-tobids-relationship-apply-20260903
          echo "TOBIDS_RELATIONSHIP_SHA=$(git rev-parse HEAD)"
