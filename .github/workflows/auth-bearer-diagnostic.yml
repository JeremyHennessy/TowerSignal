name: Diagnose Neon bearer session

on:
  push:
    branches: [agent/auth-bearer-diagnostic]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe bearer session support
        run: node scripts/diagnose_neon_bearer.mjs
