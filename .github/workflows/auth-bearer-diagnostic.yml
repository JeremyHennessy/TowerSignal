name: Diagnose Neon WebKit session

on:
  push:
    branches: [agent/auth-bearer-diagnostic]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Install WebKit
        run: npx playwright install --with-deps webkit
      - name: Probe immediate WebKit Neon session
        run: node scripts/diagnose_webkit_cookie.mjs
