name: Toronto Coordinate Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - agent/toronto-market-20260828
    paths:
      - .github/workflows/toronto-coordinate-diagnostic.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Inspect current Address Points coordinate fields
        shell: python
        run: |
          import csv, io, urllib.request
          url='https://ckan0.cf.opendata.inter.prod-toronto.ca/dataset/abedd8bc-e3dd-4d45-8e69-79165a76e4fa/resource/64d4e54b-738f-4cd9-a9e7-8050fac8a52f/download/address-points-4326.csv'
          req=urllib.request.Request(url,headers={'User-Agent':'TowerSignal-Toronto-Coordinate-Diagnostic/0.2'})
          with urllib.request.urlopen(req,timeout=120) as response:
              raw=response.read()
          reader=csv.DictReader(io.StringIO(raw.decode('utf-8-sig',errors='replace')))
          print('COORD_FIELDS=', [f for f in (reader.fieldnames or []) if any(x in f.upper() for x in ('LAT','LON',' X',' Y','COORD','GEOM'))])
          for row in reader:
              if row.get('ADDRESS_POINT_ID')=='6735910':
                  print('TARGET=',{'ADDRESS_POINT_ID':row.get('ADDRESS_POINT_ID'),'ADDRESS_FULL':row.get('ADDRESS_FULL'),'geometry':row.get('geometry')})
                  break
