name: Apply Workflow Account UX round 2

on:
  push:
    branches: [agent/workflow-account-ux-round2-20260911]
    paths:
      - scripts/apply_workflow_account_round2.py
      - .github/workflows/apply-workflow-account-round2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/workflow-account-ux-round2-20260911
      - name: Narrow the known two-match App patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply_workflow_account_round2.py')
          text = p.read_text(encoding='utf-8')
          old = '''    count = text.count(old)\n    if count != 1:\n        raise SystemExit(f'{path}: expected exactly one match, found {count}: {old[:120]!r}')\n    p.write_text(text.replace(old, new, 1), encoding='utf-8')'''
          new = '''    count = text.count(old)\n    expected = 2 if path == 'src/App.tsx' and old == "historyStartedAt={changes.history_started_at} workflowSection={" else 1\n    if count != expected:\n        raise SystemExit(f'{path}: expected exactly {expected} match(es), found {count}: {old[:120]!r}')\n    p.write_text(text.replace(old, new, expected), encoding='utf-8')'''
          if old not in text:
              raise SystemExit('Could not locate replace_once helper block')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Apply focused repository patches
        run: python scripts/apply_workflow_account_round2.py
      - name: Constrain full-report UX and update release contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          detail = Path('src/components/DetailPanel.tsx')
          text = detail.read_text(encoding='utf-8')
          old = '''      <AccountDecisionSummary row={row} detail={detail} historyEvents={historyEvents} workflowAccount={workflowAccount} />\n      <AccountModeTabs />'''
          new = '''      {isFullAccountReport && <><AccountDecisionSummary row={row} detail={detail} historyEvents={historyEvents} workflowAccount={workflowAccount} /><AccountModeTabs /></>}'''
          if old not in text:
              raise SystemExit('Decision-summary insertion not found after patch')
          text = text.replace(old, new, 1)
          old_timeline = '      <AccountUnifiedTimeline detail={detail} historyEvents={historyEvents} />'
          if old_timeline not in text:
              raise SystemExit('Unified-timeline insertion not found after patch')
          text = text.replace(old_timeline, '      {isFullAccountReport && <AccountUnifiedTimeline detail={detail} historyEvents={historyEvents} />}', 1)
          detail.write_text(text, encoding='utf-8')

          release = Path('.github/workflows/workflow-ui-release.yml')
          text = release.read_text(encoding='utf-8')
          text = text.replace('Open account to manage', 'Open full account')
          path_anchor = '      - src/components/WorkflowWorkspacePage.tsx\n'
          extra = (
              '      - src/components/AccountDecisionSummary.tsx\n'
              '      - src/components/AccountModeTabs.tsx\n'
              '      - src/components/AccountUnifiedTimeline.tsx\n'
              '      - src/components/DetailPanel.tsx\n'
              '      - src/components/WorkflowQuickEditor.tsx\n'
              '      - src/App.tsx\n'
              '      - src/styles/workflow-account-round2.css\n'
          )
          if 'src/components/AccountDecisionSummary.tsx' not in text:
              if path_anchor not in text:
                  raise SystemExit('UI-release path anchor not found')
              text = text.replace(path_anchor, path_anchor + extra, 1)
          release.write_text(text, encoding='utf-8')

          for test_path in [Path('tests/e2e/workflow-command-center.spec.ts'), Path('tests/frontend/WorkflowScaleWorkspace.test.tsx')]:
              if not test_path.exists():
                  continue
              test_text = test_path.read_text(encoding='utf-8')
              test_text = test_text.replace('Open account to manage →', 'Open full account →')
              test_text = test_text.replace('Open account to manage', 'Open full account')
              test_path.write_text(test_text, encoding='utf-8')
          PY
      - name: Remove one-shot patch machinery
        run: git rm -f scripts/apply_workflow_account_round2.py .github/workflows/apply-workflow-account-round2.yml
      - name: Commit patched UX
        run: |
          git config user.name "TowerSignal Agent"
          git config user.email "actions@users.noreply.github.com"
          git add src tests .github/workflows/workflow-ui-release.yml
          git commit -m "Implement Workflow and account UX round 2"
          git push origin HEAD:agent/workflow-account-ux-round2-20260911
