name: Toronto AIC Detail Role Diagnostic

on:
  push:
    branches:
      - agent/toronto-aic-detail-role-diagnostic-20260903
    paths:
      - .github/workflows/toronto-aic-detail-role-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4

      - name: Inspect current public AIC detail HTML for explicit project roles
        shell: python
        run: |
          import html
          import json
          import re
          import time
          import urllib.parse
          import urllib.request
          from collections import Counter
          from html.parser import HTMLParser
          from pathlib import Path

          DATA = Path('data/toronto/market/current/open_licensed/toronto_aic_applications.json')
          payload = json.loads(DATA.read_text(encoding='utf-8'))
          rows = []
          if isinstance(payload, dict):
              for key in ('applications','rows','records'):
                  if isinstance(payload.get(key), list):
                      rows = [row for row in payload[key] if isinstance(row, dict)]
                      break
          elif isinstance(payload, list):
              rows = [row for row in payload if isinstance(row, dict)]
          if not rows:
              raise SystemExit('No AIC application rows found')

          class TextExtractor(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.parts = []
              def handle_data(self, data):
                  value = re.sub(r'\s+', ' ', html.unescape(data or '')).strip()
                  if value:
                      self.parts.append(value)

          role_terms = (
              'applicant', 'owner', 'architect', 'engineer', 'engineering', 'consultant',
              'contractor', 'planner', 'project manager', 'contact', 'agent', 'developer',
          )

          samples = []
          seen = set()
          for row in rows:
              folder = str(row.get('FOLDERRSN') or '').strip()
              prop = str(row.get('PROPERTYRSN') or row.get('MAINPROPERTYRSN') or '').strip()
              if not folder or not prop or folder in seen:
                  continue
              seen.add(folder)
              samples.append(row)
              if len(samples) >= 20:
                  break

          result_rows = []
          hit_counts = Counter()
          for index, row in enumerate(samples, start=1):
              folder = str(row.get('FOLDERRSN') or '').strip()
              prop = str(row.get('PROPERTYRSN') or row.get('MAINPROPERTYRSN') or '').strip()
              url = 'https://www.toronto.ca/city-government/planning-development/application-details/?' + urllib.parse.urlencode({'id': folder, 'pid': prop})
              req = urllib.request.Request(url, headers={
                  'User-Agent': 'TowerSignal-AIC-Role-Diagnostic/1.0',
                  'Accept': 'text/html,application/xhtml+xml',
              })
              try:
                  with urllib.request.urlopen(req, timeout=60) as response:
                      raw = response.read().decode('utf-8', errors='replace')
                      status = response.status
                      final_url = response.geturl()
              except Exception as exc:
                  result_rows.append({'folder_rsn': folder, 'application_number': row.get('APPLICATION_NUMBER'), 'url': url, 'error': f'{type(exc).__name__}: {exc}'})
                  continue

              parser = TextExtractor()
              parser.feed(raw)
              text = ' | '.join(parser.parts)
              lower = text.lower()
              hits = {}
              for term in role_terms:
                  positions = [m.start() for m in re.finditer(re.escape(term), lower)]
                  if positions:
                      hit_counts[term] += 1
                      snippets = []
                      for pos in positions[:3]:
                          start = max(0, pos - 140)
                          end = min(len(text), pos + len(term) + 240)
                          snippets.append(re.sub(r'\s+', ' ', text[start:end]).strip())
                      hits[term] = snippets

              # Also expose labels/keys found directly in markup around likely role terms.
              markup_keys = sorted(set(re.findall(r'(?i)(?:name|id|class|data-[a-z0-9_-]+)=["\'][^"\']*(?:applicant|owner|architect|engineer|consultant|contractor|planner|developer|contact)[^"\']*["\']', raw)))[:50]
              result_rows.append({
                  'folder_rsn': folder,
                  'property_rsn': prop,
                  'application_number': row.get('APPLICATION_NUMBER'),
                  'full_address': row.get('FULL_ADDRESS'),
                  'status_code': status,
                  'final_url': final_url,
                  'html_bytes': len(raw.encode('utf-8')),
                  'visible_text_chars': len(text),
                  'role_hits': hits,
                  'role_markup_keys': markup_keys,
                  'recaptcha_mentions': lower.count('recaptcha') + raw.lower().count('recaptcha'),
              })
              time.sleep(0.15)

          print('AIC_SOURCE_ROWS=', len(rows))
          print('SAMPLED_DETAIL_PAGES=', len(samples))
          print('ROLE_PAGE_HIT_COUNTS=', json.dumps(dict(sorted(hit_counts.items())), sort_keys=True))
          for item in result_rows:
              print('AIC_DETAIL=', json.dumps(item, ensure_ascii=False, sort_keys=True))
