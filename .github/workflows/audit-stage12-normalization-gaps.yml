name: Audit DEC region and ABO spend normalization
on:
  push:
    branches: [audit/full-lineage-20260923-1350]
    paths:
      - docs/audits/2026-09-23/audit_stage12_normalization_gaps.py
      - .github/workflows/audit-stage12-normalization-gaps.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Quantify current normalization gaps
        run: python -u docs/audits/2026-09-23/audit_stage12_normalization_gaps.py
      - name: Persist results
        run: |
          mkdir -p docs/audits/2026-09-23/stage12-normalization-gaps
          cp .audit-stage12/*.json docs/audits/2026-09-23/stage12-normalization-gaps/
          git config user.name "TowerSignal Audit"
          git config user.email "actions@users.noreply.github.com"
          git add docs/audits/2026-09-23/stage12-normalization-gaps
          git commit -m "audit: persist DEC region and ABO spend normalization gaps"
          git pull --rebase origin audit/full-lineage-20260923-1350
          git push origin HEAD:audit/full-lineage-20260923-1350
