name: Resolve TowerSignal Neon project

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/neon-project-resolution-20260923.yml'

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      TOWERSIGNAL_DATABASE_URL: ${{ secrets.TOWERSIGNAL_DATABASE_URL }}
      TARGET_BRANCH_ID: br-orange-bar-aujld2d5
    steps:
      - name: Inspect available Neon control-plane credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in NEON_API_KEY NEON_PROJECT_ID DATABASE_URL NEON_DATABASE_URL TOWERSIGNAL_DATABASE_URL; do
            if [ -n "${!name:-}" ]; then
              echo "$name=PRESENT"
            else
              echo "$name=MISSING"
            fi
          done

      - name: Resolve project from API key when available
        if: ${{ env.NEON_API_KEY != '' }}
        shell: bash
        run: |
          set -euo pipefail
          projects_json="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${NEON_API_KEY}" \
            "https://console.neon.tech/api/v2/projects?limit=100")"
          found=""
          while IFS= read -r project_id; do
            [ -n "$project_id" ] || continue
            branches_json="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${NEON_API_KEY}" \
              "https://console.neon.tech/api/v2/projects/${project_id}/branches?limit=100")"
            if printf '%s' "$branches_json" | jq -e --arg branch "$TARGET_BRANCH_ID" '.branches[]? | select(.id == $branch)' >/dev/null; then
              found="$project_id"
              break
            fi
          done < <(printf '%s' "$projects_json" | jq -r '.projects[]?.id')
          if [ -z "$found" ]; then
            echo "TOWERSIGNAL_NEON_PROJECT_ID=NOT_FOUND"
            exit 3
          fi
          echo "TOWERSIGNAL_NEON_PROJECT_ID=$found"

      - name: Verify direct database credential without exposing it
        if: ${{ env.DATABASE_URL != '' || env.NEON_DATABASE_URL != '' || env.TOWERSIGNAL_DATABASE_URL != '' }}
        shell: bash
        run: |
          set -euo pipefail
          url="${TOWERSIGNAL_DATABASE_URL:-${NEON_DATABASE_URL:-${DATABASE_URL:-}}}"
          psql "$url" -v ON_ERROR_STOP=1 -Atc "select 'DATABASE_CONNECTION=OK', current_database();" 
