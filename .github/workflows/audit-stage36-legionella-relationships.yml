name: Replay Legionella named-building relationships
on:
  push:
    branches: [audit/full-lineage-20260923-1350]
    paths:
      - docs/audits/2026-09-23/audit_stage36_legionella_relationships.py
      - .github/workflows/audit-stage36-legionella-relationships.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay named-building relationship contract
        run: python -u docs/audits/2026-09-23/audit_stage36_legionella_relationships.py
      - name: Persist results
        run: |
          mkdir -p docs/audits/2026-09-23/stage36-legionella-relationships
          cp .audit-stage36/*.json docs/audits/2026-09-23/stage36-legionella-relationships/
          git config user.name "TowerSignal Audit"
          git config user.email "actions@users.noreply.github.com"
          git add docs/audits/2026-09-23/stage36-legionella-relationships
          git commit -m "audit: persist Legionella relationship replay"
          git pull --rebase origin audit/full-lineage-20260923-1350
          git push origin HEAD:audit/full-lineage-20260923-1350
