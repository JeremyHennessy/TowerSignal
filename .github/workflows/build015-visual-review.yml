name: Build 015 visual review

on:
  push:
    branches:
      - agent/product-redesign-20260826

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Start preview
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 > /tmp/towersignal-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/TowerSignal/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/towersignal-preview.log
          exit 1
      - name: Capture reference workspaces
        run: |
          mkdir -p design-review
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright'
          const browser = await chromium.launch({ headless: true })
          const page = await browser.newPage({ viewport: { width: 1672, height: 941 }, deviceScaleFactor: 1 })
          const base = 'http://127.0.0.1:4173/TowerSignal/'
          const routes = [
            ['prospect', '#/prospect'],
            ['monitor', '#/monitor'],
            ['map', '#/map'],
            ['nys-market', '#/nys'],
            ['nys-changes', '#/nys-changes'],
            ['opportunities', '#/opportunities'],
            ['portfolios', '#/portfolios'],
            ['workflow', '#/workflow'],
            ['source-health', '#/source-health'],
          ]
          for (const [name, hash] of routes) {
            await page.goto(base + hash, { waitUntil: 'networkidle', timeout: 90000 })
            await page.screenshot({ path: `design-review/${name}.png`, fullPage: true })
          }
          await page.goto(base + '#/prospect', { waitUntil: 'networkidle', timeout: 90000 })
          const first = page.locator('.account-table tbody tr').first()
          if (await first.count()) {
            await first.click()
            await page.waitForLoadState('networkidle')
            await page.screenshot({ path: 'design-review/account.png', fullPage: true })
          }
          await browser.close()
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: build015-visual-review
          path: design-review
          retention-days: 7
