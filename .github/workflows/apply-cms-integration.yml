name: Apply CMS institutional context integration

on:
  push:
    branches:
      - agent/cms-institutional-current-main-20260907
    paths:
      - '.github/workflows/apply-cms-integration.yml'
      - 'scripts/_apply_cms_integration.py'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cms-institutional-current-main-20260907
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply CMS integration patch
        run: python scripts/_apply_cms_integration.py
      - name: Run CMS and coverage regressions
        run: python -m unittest tests.python.test_cms_institutional_context tests.python.test_coverage_audit -v
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Verify combined frontend and production build
        run: |
          npm run lint
          npm run typecheck
          npm test -- --run
          npm run build
      - name: Commit validated non-workflow integration
        run: |
          git config user.name 'TowerSignal Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/types/data.ts src/components/DetailPanel.tsx src/components/AccountSectionNavigator.tsx scripts/build_coverage_audit.py scripts/validate_coverage_audit.py tests/python/test_coverage_audit.py
          git commit -m 'Integrate bounded CMS institutional account context'
          git push origin HEAD:agent/cms-institutional-current-main-20260907
