name: Verify domestic water and provider cache

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/domestic-water-cache.yml'
      - 'scripts/towersignal/domestic_water.py'
      - 'scripts/build_domestic_water_cache.py'
      - 'scripts/validate_domestic_water_cache.py'
      - 'tests/python/test_domestic_water.py'
      - 'docs/BUILD017_DOMESTIC_WATER_PROVIDER_INTELLIGENCE.md'

permissions:
  contents: read

concurrency:
  group: towersignal-domestic-water-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build exact-count domestic-water/provider cache
        run: python scripts/build_domestic_water_cache.py --output domestic-water-cache/cache.json --page-size 50000
      - name: Validate evidence, exact counts and production volume
        run: python scripts/validate_domestic_water_cache.py --cache domestic-water-cache/cache.json --max-age-days 1 --require-production-volume
      - name: Upload verified domestic-water/provider cache
        uses: actions/upload-artifact@v4
        with:
          name: towersignal-domestic-water-cache
          path: domestic-water-cache/cache.json
          retention-days: 7

  integration:
    if: ${{ github.event_name == 'pull_request' }}
    needs: build-cache
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download verified domestic-water cache
        uses: actions/download-artifact@v4
        with:
          name: towersignal-domestic-water-cache
          path: .verified-domestic-water
      - name: Revalidate downloaded cache
        run: python scripts/validate_domestic_water_cache.py --cache .verified-domestic-water/cache.json --max-age-days 1 --require-production-volume
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Python tests
        run: python -m unittest discover -s tests/python -p 'test_*.py' -v
      - name: Lint frontend
        run: npm run lint
      - name: Typecheck frontend
        run: npm run typecheck
      - name: Frontend tests
        run: npm test
      - name: Production build
        run: npm run build
