name: Validate ABO current repair
on:
  push:
    branches: [fix/abo-spend-identity-current-20260923]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest tests.python.test_nys_authority_procurement -v
      - run: python -m unittest discover -s tests/python -p 'test_*.py' -v
