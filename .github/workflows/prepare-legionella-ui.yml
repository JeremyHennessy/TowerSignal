name: Apply exact isolated Legionella UI edits
on:
  push:
    branches: ['agent/legionella-tower-matching-20260915']
    paths: ['.github/workflows/prepare-legionella-ui.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Apply checksum-pinned edits to this branch only and remove preparation tools
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          branch=agent/legionella-tower-matching-20260915
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$EXPECTED_SHA"
          python scripts/prepare_legionella_ui.py
          git diff --check
          git rm scripts/prepare_legionella_ui.py .github/workflows/prepare-legionella-ui.yml
          git add src/components/SystemTable.tsx src/components/Filters.tsx src/components/DetailPanel.tsx src/components/ChangesView.tsx .github/workflows/pages.yml tests/e2e/property-enforcement.spec.ts
          git config user.name 'TowerSignal Engineering'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Wire linked Legionnaires incidents into NYC Prospect, Map filters, Monitor and Account Evidence'
          git push origin HEAD:refs/heads/$branch
          git log -1 --format='%H %T'
