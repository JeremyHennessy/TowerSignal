name: Prepare exact Legionella UI file objects
on:
  push:
    branches: ['agent/legionella-tower-matching-20260915']
    paths: ['.github/workflows/prepare-legionella-ui.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Apply checksum-pinned edits without moving any branch
        run: |
          python scripts/prepare_legionella_ui.py
          git diff --check
      - name: Store file objects for authorized connector commit
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const files = ['src/components/SystemTable.tsx','src/components/Filters.tsx','src/components/DetailPanel.tsx','src/components/ChangesView.tsx','.github/workflows/pages.yml','tests/e2e/property-enforcement.spec.ts'];
            const entries=[];
            for (const path of files) {
              const content=fs.readFileSync(path,'utf8');
              const blob=(await github.rest.git.createBlob({...context.repo,content,encoding:'utf-8'})).data;
              entries.push({path,mode:'100644',type:'blob',sha:blob.sha,sha256:crypto.createHash('sha256').update(content).digest('hex')});
            }
            core.info(JSON.stringify({source_sha:context.sha,entries},null,2));
            fs.writeFileSync(process.env.RUNNER_TEMP+'/legionella-ui-objects.json',JSON.stringify({source_sha:context.sha,entries},null,2));
      - uses: actions/upload-artifact@v4
        with:
          name: legionella-ui-file-objects
          path: ${{ runner.temp }}/legionella-ui-objects.json
          retention-days: 3
