name: Audit served company identity invariants
on:
  push:
    branches: [audit/full-lineage-20260923-1350]
    paths:
      - docs/audits/2026-09-23/audit_stage38_company_identity.py
      - .github/workflows/audit-stage38-company-identity.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit company identity graph invariants
        run: python -u docs/audits/2026-09-23/audit_stage38_company_identity.py
      - name: Persist results
        run: |
          mkdir -p docs/audits/2026-09-23/stage38-company-identity
          cp .audit-stage38/*.json docs/audits/2026-09-23/stage38-company-identity/
          git config user.name "TowerSignal Audit"
          git config user.email "actions@users.noreply.github.com"
          git add docs/audits/2026-09-23/stage38-company-identity
          git commit -m "audit: persist company identity invariants"
          git pull --rebase origin audit/full-lineage-20260923-1350
          git push origin HEAD:audit/full-lineage-20260923-1350
