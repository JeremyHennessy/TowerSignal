name: Fast release company CRM and service application

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fast-company-crm-service-release-20260924.yml'
      - 'database/migrations/004a_company_audit_refinement.sql'
      - 'database/migrations/005_service_reporting_foundation.sql'
      - 'database/migrations/005a_service_fk_delete_fix.sql'
      - 'database/migrations/006_internal_sales_crm.sql'
      - 'database/migrations/007_master_sales_accounts.sql'
      - 'database/migrations/008_rollup_review_queue.sql'
      - 'database/migrations/009_authoritative_sales_workflow.sql'
      - 'database/migrations/010_demo_proposal_workflow.sql'
      - 'database/migrations/011_customer_lifecycle.sql'
      - 'src/App.tsx'
      - 'src/companyAdmin/client.ts'
      - 'src/companyAdmin/import.ts'
      - 'src/companyAdmin/rollupSuggestions.ts'
      - 'src/companyAdmin/scoring.ts'
      - 'src/components/CompaniesPage.tsx'
      - 'src/components/AdminCompaniesPage.tsx'
      - 'src/components/AdminSalesTodayPanel.tsx'
      - 'src/components/AdminCompanyProfilePage.tsx'
      - 'src/components/UserAccountPage.tsx'
      - 'src/components/CompanyAdminPanel.tsx'
      - 'src/components/CompanySalesCrmPanel.tsx'
      - 'src/components/CompanyDemoProposalPanel.tsx'
      - 'src/components/CompanyCustomerLifecyclePanel.tsx'
      - 'src/components/CompanySalesAccountPanel.tsx'
      - 'src/components/CompanyRollupReviewPanel.tsx'
      - 'src/components/CompanyAdminWorkspace.tsx'
      - 'src/components/CompanyFamilyPanel.tsx'
      - 'src/components/CompanyProfilePage.tsx'
      - 'src/components/DetailPanel.tsx'
      - 'src/components/ServiceOperationsPage.tsx'
      - 'src/components/ServiceReportingPanel.tsx'
      - 'src/main.tsx'
      - 'src/serviceReporting/client.ts'
      - 'src/styles/company-admin.css'
      - 'src/styles/company-admin-dashboard.css'
      - 'src/styles/known-firms.css'
      - 'src/styles/auth-gate.css'
      - 'src/styles/service-operations.css'
      - 'src/styles/service-reporting.css'
      - 'src/types/serviceReporting.ts'
      - 'src/types/companyAdmin.ts'
      - 'tests/frontend/CompanyAdmin.test.tsx'
      - 'tests/frontend/InternalSalesCrm.test.ts'
      - 'tests/frontend/AuthoritativeSalesWorkflow.test.ts'
      - 'tests/frontend/DemoProposalWorkflow.test.ts'
      - 'tests/frontend/CustomerLifecycle.test.ts'
      - 'tests/frontend/AdminSalesToday.test.ts'
      - 'tests/frontend/MasterSalesAccounts.test.ts'
      - 'tests/frontend/RollupSuggestions.test.ts'
      - 'tests/frontend/SalesScoring.test.ts'
      - 'tests/frontend/RollupReviewQueue.test.ts'
      - 'tests/frontend/CompanyAdminDirectoryFilters.test.ts'
      - 'tests/frontend/UserAccountAdminAccess.test.tsx'
      - 'tests/frontend/CompanyResearchQueueSync.test.ts'
      - 'tests/frontend/SeparateCompanyAdmin.test.ts'
      - 'tests/frontend/ServiceOperationsPage.test.tsx'
      - 'tests/frontend/ServiceReportingMigration.test.ts'

permissions:
  contents: read
  actions: write
  pages: write
  id-token: write

concurrency:
  group: fast-company-crm-service-release-20260924
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ACCEPTED_PRODUCT_SHA: 01222ffd6381405f9544566f5d83f31f967fece4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Confirm company evidence schema is available
        env:
          DATABASE_URL: ${{ secrets.TOWERSIGNAL_DATABASE_URL_UNPOOLED }}
          PGOPTIONS: -c default_transaction_read_only=on -c statement_timeout=30000
        run: |
          set -euo pipefail
          count="$(psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('company_parent_entities','company_parent_relationships','company_enrichment_sources','company_enrichment_runs','company_enrichment_candidates')")"
          test "$count" = 5
          test "$(psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -Atc "SELECT to_regprocedure('public.towersignal_company_admin_snapshot()') IS NOT NULL")" = t
          test "$(psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -Atc "SELECT to_regprocedure('public.towersignal_company_evidence_snapshot()') IS NOT NULL")" = t

      - name: Prove application-only delta from last successful full Pages release
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$ACCEPTED_PRODUCT_SHA"
          git diff --name-only "$ACCEPTED_PRODUCT_SHA" HEAD | sort > /tmp/release-diff.txt
          cat /tmp/release-diff.txt
          python - <<'PY'
          from pathlib import Path
          allowed = {
            '.gitignore',
            '.github/workflows/company-data-audit.yml',
            '.github/workflows/company-evidence-ci.yml',
            '.github/workflows/company-enrichment.yml',
            'database/audits/company_parent_enrichment.sql',
            'database/migrations/013_company_parent_enrichment.sql',
            'database/migrations/014_admin_account_snapshot.sql',
            'database/migrations/015_company_evidence_snapshot.sql',
            'tests/frontend/CompanyEvidenceSnapshot.test.ts',
            'src/companyAdmin/directory.ts',
            'src/components/AdminFirmDirectory.tsx',
            'tests/frontend/AdminFirmDirectory.test.tsx',
            'src/companyAdmin/accountMapping.ts',
            'tests/frontend/AccountMapping.test.ts',
            'docs/company-enrichment-20260925.md',
            'scripts/company_enrichment.py',
            'src/companyAdmin/evidence.ts',
            'src/components/CompanyEvidencePanel.tsx',
            'tests/database/company_evidence_bootstrap.sql',
            'tests/database/company_evidence.sql',
            'tests/database/company_enrichment_worker.py',
            'tests/frontend/CompanyEvidence.test.tsx',
            'tests/python/test_company_enrichment.py',
            '.github/workflows/fast-company-crm-service-release-20260924.yml',
            '.github/workflows/fast-company-admin-import-release-20260923.yml',
            'database/migrations/004a_company_audit_refinement.sql',
            'database/migrations/005_service_reporting_foundation.sql',
            'database/migrations/005a_service_fk_delete_fix.sql',
            'database/migrations/006_internal_sales_crm.sql',
            'database/migrations/007_master_sales_accounts.sql',
            'database/migrations/008_rollup_review_queue.sql',
            'database/migrations/009_authoritative_sales_workflow.sql',
            'database/migrations/010_demo_proposal_workflow.sql',
            'database/migrations/011_customer_lifecycle.sql',
            'src/App.tsx',
            'src/companyAdmin/client.ts',
            'src/companyAdmin/import.ts',
            'src/companyAdmin/rollupSuggestions.ts',
            'src/companyAdmin/scoring.ts',
            'src/components/AdminCompaniesPage.tsx',
            'src/components/AdminCompanyProfilePage.tsx',
            'src/components/AdminSalesTodayPanel.tsx',
            'src/components/CompaniesPage.tsx',
            'src/components/CompanyAdminPanel.tsx',
            'src/components/CompanyAdminWorkspace.tsx',
            'src/components/CompanyFamilyPanel.tsx',
            'src/components/CompanyProfilePage.tsx',
            'src/components/CompanyRollupReviewPanel.tsx',
            'src/components/CompanySalesAccountPanel.tsx',
            'src/components/CompanySalesCrmPanel.tsx',
            'src/components/CompanyDemoProposalPanel.tsx',
            'src/components/CompanyCustomerLifecyclePanel.tsx',
            'src/components/DetailPanel.tsx',
            'src/components/ServiceOperationsPage.tsx',
            'src/components/ServiceReportingPanel.tsx',
            'src/components/UserAccountPage.tsx',
            'src/main.tsx',
            'src/serviceReporting/client.ts',
            'src/styles/auth-gate.css',
            'src/styles/company-admin-dashboard.css',
            'src/styles/company-admin.css',
            'src/styles/service-operations.css',
            'src/styles/service-reporting.css',
            'src/types/companyAdmin.ts',
            'src/types/serviceReporting.ts',
            'tests/frontend/AdminSalesToday.test.ts',
            'tests/frontend/AuthoritativeSalesWorkflow.test.ts',
            'tests/frontend/DemoProposalWorkflow.test.ts',
            'tests/frontend/CustomerLifecycle.test.ts',
            'tests/frontend/CompanyAdmin.test.tsx',
            'tests/frontend/CompanyAdminDirectoryFilters.test.ts',
            'tests/frontend/CompanyAdminImport.test.ts',
            'tests/frontend/CompanyResearchQueueSync.test.ts',
            'tests/frontend/InternalSalesCrm.test.ts',
            'tests/frontend/MasterSalesAccounts.test.ts',
            'tests/frontend/RollupReviewQueue.test.ts',
            'tests/frontend/RollupSuggestions.test.ts',
            'tests/frontend/SalesScoring.test.ts',
            'tests/frontend/SeparateCompanyAdmin.test.ts',
            'tests/frontend/ServiceOperationsPage.test.tsx',
            'tests/frontend/ServiceReportingMigration.test.ts',
            'tests/frontend/UserAccountAdminAccess.test.tsx',
          }
          actual = {line.strip() for line in Path('/tmp/release-diff.txt').read_text().splitlines() if line.strip()}
          assert actual == allowed, (actual, allowed)
          forbidden = [p for p in actual if p.startswith(('public/data/','scripts/','.history-store/','data/')) and p != 'scripts/company_enrichment.py']
          assert not forbidden, forbidden
          print(f'APPLICATION_ONLY_DELTA=PASS files={len(actual)}')
          PY

      - name: Stop obsolete push-triggered full Pages releases after exact proof
        uses: actions/github-script@v7
        with:
          script: |
            const runs=(await github.rest.actions.listWorkflowRunsForRepo({...context.repo,per_page:100})).data.workflow_runs;
            for (const run of runs) {
              if (
                run.path === '.github/workflows/pages.yml' &&
                run.event === 'push' &&
                ['queued','in_progress','waiting','pending'].includes(run.status)
              ) {
                core.info(`Cancelling superseded full Pages push run ${run.id} @ ${run.head_sha}`);
                await github.rest.actions.cancelWorkflowRun({...context.repo,run_id:run.id}).catch(error => {
                  if (error.status !== 409) throw error;
                });
              }
            }

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install exact frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Resolve latest successful production baseline
        id: baseline
        uses: actions/github-script@v7
        with:
          script: |
            const workflowPath='.github/workflows/fast-company-crm-service-release-20260924.yml';
            const runs=(await github.rest.actions.listWorkflowRunsForRepo({
              ...context.repo,
              per_page:100,
            })).data.workflow_runs;
            const candidates=runs
              .filter(run=>run.id!==context.runId && run.path===workflowPath && run.conclusion==='success')
              .sort((a,b)=>new Date(b.updated_at)-new Date(a.updated_at));
            for(const run of candidates){
              const artifacts=(await github.rest.actions.listWorkflowRunArtifacts({
                ...context.repo,
                run_id:run.id,
                per_page:100,
              })).data.artifacts;
              const artifact=
                artifacts.find(item=>item.name==='company-crm-service-production-baseline'&&!item.expired) ||
                artifacts.find(item=>item.name==='github-pages'&&!item.expired);
              if(!artifact) continue;
              core.info(`Using verified baseline ${artifact.name} from successful run ${run.id} @ ${run.head_sha}`);
              core.setOutput('run_id',String(run.id));
              core.setOutput('artifact_name',artifact.name);
              core.setOutput('head_sha',run.head_sha);
              return;
            }
            core.setFailed('No successful unexpired CRM production baseline artifact is available');

      - name: Download latest successful production baseline
        uses: actions/download-artifact@v4
        with:
          repository: JeremyHennessy/TowerSignal
          run-id: ${{ steps.baseline.outputs.run_id }}
          name: ${{ steps.baseline.outputs.artifact_name }}
          github-token: ${{ github.token }}
          path: .accepted-site

      - name: Freeze accepted production data byte-for-byte
        shell: bash
        env:
          BASELINE_ARTIFACT_NAME: ${{ steps.baseline.outputs.artifact_name }}
        run: |
          set -euo pipefail
          mkdir -p .rollback .source-data public/data
          if [ "$BASELINE_ARTIFACT_NAME" = "github-pages" ]; then
            archive="$(find .accepted-site -type f | head -1)"
            test -n "$archive"
            tar -xf "$archive" -C .rollback
          else
            cp -R .accepted-site/. .rollback/
          fi
          test -d .rollback/data
          rm -rf public/data
          cp -R .rollback/data public/data
          cp -R public/data .source-data/data
          python - <<'PY'
          import hashlib, json, pathlib
          root=pathlib.Path('.source-data/data')
          hashes={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*')) if p.is_file()}
          assert hashes
          pathlib.Path('accepted-data-sha256.json').write_text(json.dumps(hashes,sort_keys=True))
          print(f'FROZEN_ACCEPTED_DATA=PASS files={len(hashes)}')
          PY

      - name: Verify application
        shell: bash
        run: |
          set -euo pipefail
          npm run lint
          npm run typecheck
          npm test
          npm run build
          grep -R -Fq "Service operations" dist/assets
          grep -R -Fq "Sales & account command center" dist/assets
          grep -R -Fq "Parent company hierarchy" dist/assets
          grep -R -Fq "Active sales pipeline" dist/assets
          grep -R -Fq "Sales pipeline & follow-up" dist/assets
          grep -R -Fq "Demos & proposals" dist/assets
          grep -R -Fq "Customer lifecycle" dist/assets
          grep -R -Fq "Master sales account" dist/assets
          grep -R -Fq "Company mapping review" dist/assets
          grep -R -Fq "Account classification" dist/assets
          grep -R -Fq "What needs attention" dist/assets
          grep -R -Fq "Priority target accounts" dist/assets
          grep -R -Fq "Company master & relationship record" dist/assets
          grep -R -Fq "Parent mapping & enrichment" dist/assets
          python - <<'PY'
          import hashlib, json, pathlib
          expected=json.loads(pathlib.Path('accepted-data-sha256.json').read_text())
          root=pathlib.Path('dist/data')
          actual={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*')) if p.is_file()}
          assert actual == expected, 'Application-only build changed accepted production data'
          print(f'APPLICATION_BUILD=PASS data_files={len(actual)}')
          PY

      - name: Install public-auth browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Verify candidate public auth gate
        env:
          BASE_URL: http://127.0.0.1:4173/TowerSignal/
        shell: bash
        run: |
          set -euo pipefail
          npx vite preview --host 127.0.0.1 --port 4173 > /tmp/towersignal-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/TowerSignal/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/TowerSignal/ >/dev/null
          npx playwright test --config=playwright.public-auth.config.ts

      - name: Retain application-only release proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: company-crm-service-application-proof
          path: |
            accepted-data-sha256.json
            playwright-report
            test-results
          retention-days: 30

      - name: Upload verified application candidate
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Retain verified production candidate as durable baseline
        uses: actions/upload-artifact@v4
        with:
          name: company-crm-service-production-baseline
          path: dist
          retention-days: 30
          if-no-files-found: error

      - name: Stage accepted production site for rollback
        uses: actions/upload-pages-artifact@v3
        with:
          name: company-crm-service-rollback
          path: .rollback

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified company CRM and service application
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install hosted acceptance dependencies
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium webkit
      - name: Verify hosted public auth gate
        env:
          BASE_URL: ${{ needs.deploy.outputs.page_url }}
        run: npx playwright test --config=playwright.public-auth.config.ts
      - name: Verify hosted application bundle markers
        env:
          BASE_URL: ${{ needs.deploy.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          html="$(curl --fail --silent --show-error --location "$BASE_URL")"
          asset="$(printf '%s' "$html" | grep -oE 'assets/index-[^"]+\.js' | head -1)"
          test -n "$asset"
          curl --fail --silent --show-error --location "${BASE_URL%/}/$asset" --output /tmp/towersignal-index.js
          grep -Fq "Service operations" /tmp/towersignal-index.js
          grep -Fq "Sales & account command center" /tmp/towersignal-index.js
          grep -Fq "Parent company hierarchy" /tmp/towersignal-index.js
          grep -Fq "Active sales pipeline" /tmp/towersignal-index.js
          grep -Fq "Sales pipeline & follow-up" /tmp/towersignal-index.js
          grep -Fq "Demos & proposals" /tmp/towersignal-index.js
          grep -Fq "Customer lifecycle" /tmp/towersignal-index.js
          grep -Fq "Master sales account" /tmp/towersignal-index.js
          grep -Fq "Company mapping review" /tmp/towersignal-index.js
          grep -Fq "Account classification" /tmp/towersignal-index.js
          grep -Fq "What needs attention" /tmp/towersignal-index.js
          grep -Fq "Priority target accounts" /tmp/towersignal-index.js
          grep -Fq "Company master & relationship record" /tmp/towersignal-index.js
          grep -Fq "Parent mapping & enrichment" /tmp/towersignal-index.js

  rollback:
    if: ${{ always() && needs.deploy.result == 'success' && needs.verify.result == 'failure' }}
    needs: [build, deploy, verify]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Restore last successful full Pages site
        uses: actions/deploy-pages@v4
        with:
          artifact_name: company-crm-service-rollback
