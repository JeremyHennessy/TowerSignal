name: Fast release company CRM and service application

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fast-company-crm-service-release-20260924.yml'
      - 'database/migrations/004a_company_audit_refinement.sql'
      - 'database/migrations/005_service_reporting_foundation.sql'
      - 'database/migrations/005a_service_fk_delete_fix.sql'
      - 'src/App.tsx'
      - 'src/companyAdmin/client.ts'
      - 'src/components/CompaniesPage.tsx'
      - 'src/components/CompanyAdminPanel.tsx'
      - 'src/components/CompanyAdminWorkspace.tsx'
      - 'src/components/DetailPanel.tsx'
      - 'src/components/ServiceOperationsPage.tsx'
      - 'src/components/ServiceReportingPanel.tsx'
      - 'src/main.tsx'
      - 'src/serviceReporting/client.ts'
      - 'src/styles/company-admin.css'
      - 'src/styles/service-operations.css'
      - 'src/styles/service-reporting.css'
      - 'src/types/serviceReporting.ts'
      - 'tests/frontend/CompanyAdmin.test.tsx'
      - 'tests/frontend/CompanyAdminDirectoryFilters.test.ts'
      - 'tests/frontend/CompanyResearchQueueSync.test.ts'
      - 'tests/frontend/ServiceOperationsPage.test.tsx'
      - 'tests/frontend/ServiceReportingMigration.test.ts'

permissions:
  contents: read
  actions: write
  pages: write
  id-token: write

concurrency:
  group: fast-company-crm-service-release-20260924
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ACCEPTED_PRODUCT_SHA: 01222ffd6381405f9544566f5d83f31f967fece4
      ACCEPTED_PAGES_RUN: '35932617987'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove application-only delta from last successful full Pages release
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$ACCEPTED_PRODUCT_SHA"
          git diff --name-only "$ACCEPTED_PRODUCT_SHA" HEAD | sort > /tmp/release-diff.txt
          cat /tmp/release-diff.txt
          python - <<'PY'
          from pathlib import Path
          allowed = {
            '.github/workflows/fast-company-crm-service-release-20260924.yml',
            'database/migrations/004a_company_audit_refinement.sql',
            'database/migrations/005_service_reporting_foundation.sql',
            'database/migrations/005a_service_fk_delete_fix.sql',
            'src/App.tsx',
            'src/companyAdmin/client.ts',
            'src/components/CompaniesPage.tsx',
            'src/components/CompanyAdminPanel.tsx',
            'src/components/CompanyAdminWorkspace.tsx',
            'src/components/DetailPanel.tsx',
            'src/components/ServiceOperationsPage.tsx',
            'src/components/ServiceReportingPanel.tsx',
            'src/main.tsx',
            'src/serviceReporting/client.ts',
            'src/styles/company-admin.css',
            'src/styles/service-operations.css',
            'src/styles/service-reporting.css',
            'src/types/serviceReporting.ts',
            'tests/frontend/CompanyAdmin.test.tsx',
            'tests/frontend/CompanyAdminDirectoryFilters.test.ts',
            'tests/frontend/CompanyResearchQueueSync.test.ts',
            'tests/frontend/ServiceOperationsPage.test.tsx',
            'tests/frontend/ServiceReportingMigration.test.ts',
          }
          actual = {line.strip() for line in Path('/tmp/release-diff.txt').read_text().splitlines() if line.strip()}
          assert actual == allowed, (actual, allowed)
          forbidden = [p for p in actual if p.startswith(('public/data/','scripts/','.history-store/','data/'))]
          assert not forbidden, forbidden
          print(f'APPLICATION_ONLY_DELTA=PASS files={len(actual)}')
          PY

      - name: Stop obsolete push-triggered full Pages releases after exact proof
        uses: actions/github-script@v7
        with:
          script: |
            const runs=(await github.rest.actions.listWorkflowRunsForRepo({...context.repo,per_page:100})).data.workflow_runs;
            for (const run of runs) {
              if (
                run.path === '.github/workflows/pages.yml' &&
                run.event === 'push' &&
                ['queued','in_progress','waiting','pending'].includes(run.status)
              ) {
                core.info(`Cancelling superseded full Pages push run ${run.id} @ ${run.head_sha}`);
                await github.rest.actions.cancelWorkflowRun({...context.repo,run_id:run.id}).catch(error => {
                  if (error.status !== 409) throw error;
                });
              }
            }

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install exact frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Download last successful full Pages artifact
        uses: actions/download-artifact@v4
        with:
          repository: JeremyHennessy/TowerSignal
          run-id: ${{ env.ACCEPTED_PAGES_RUN }}
          name: github-pages
          github-token: ${{ github.token }}
          path: .accepted-site

      - name: Freeze accepted production data byte-for-byte
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .rollback .source-data public/data
          archive="$(find .accepted-site -type f | head -1)"
          test -n "$archive"
          tar -xf "$archive" -C .rollback
          test -d .rollback/data
          rm -rf public/data
          cp -R .rollback/data public/data
          cp -R public/data .source-data/data
          python - <<'PY'
          import hashlib, json, pathlib
          root=pathlib.Path('.source-data/data')
          hashes={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*')) if p.is_file()}
          assert hashes
          pathlib.Path('accepted-data-sha256.json').write_text(json.dumps(hashes,sort_keys=True))
          print(f'FROZEN_ACCEPTED_DATA=PASS files={len(hashes)}')
          PY

      - name: Verify application
        shell: bash
        run: |
          set -euo pipefail
          npm run lint
          npm run typecheck
          npm test
          npm run build
          grep -R -Fq "Service operations" dist/assets
          grep -R -Fq "CRM relationship status" dist/assets
          grep -R -Fq "Company master & relationship record" dist/assets
          python - <<'PY'
          import hashlib, json, pathlib
          expected=json.loads(pathlib.Path('accepted-data-sha256.json').read_text())
          root=pathlib.Path('dist/data')
          actual={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*')) if p.is_file()}
          assert actual == expected, 'Application-only build changed accepted production data'
          print(f'APPLICATION_BUILD=PASS data_files={len(actual)}')
          PY

      - name: Install public-auth browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Verify candidate public auth gate
        env:
          BASE_URL: http://127.0.0.1:4173/TowerSignal/
        shell: bash
        run: |
          set -euo pipefail
          npx vite preview --host 127.0.0.1 --port 4173 > /tmp/towersignal-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/TowerSignal/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/TowerSignal/ >/dev/null
          npx playwright test --config=playwright.public-auth.config.ts

      - name: Retain application-only release proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: company-crm-service-application-proof
          path: |
            accepted-data-sha256.json
            playwright-report
            test-results
          retention-days: 30

      - name: Upload verified application candidate
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Stage accepted full Pages site for rollback
        uses: actions/upload-pages-artifact@v3
        with:
          name: company-crm-service-rollback
          path: .rollback

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified company CRM and service application
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install hosted acceptance dependencies
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium webkit
      - name: Verify hosted public auth gate
        env:
          BASE_URL: ${{ needs.deploy.outputs.page_url }}
        run: npx playwright test --config=playwright.public-auth.config.ts
      - name: Verify hosted application bundle markers
        env:
          BASE_URL: ${{ needs.deploy.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          html="$(curl --fail --silent --show-error --location "$BASE_URL")"
          asset="$(printf '%s' "$html" | grep -oE 'assets/index-[^"]+\.js' | head -1)"
          test -n "$asset"
          curl --fail --silent --show-error --location "${BASE_URL%/}/$asset" --output /tmp/towersignal-index.js
          grep -Fq "Service operations" /tmp/towersignal-index.js
          grep -Fq "CRM relationship status" /tmp/towersignal-index.js
          grep -Fq "Company master & relationship record" /tmp/towersignal-index.js

  rollback:
    if: ${{ always() && needs.deploy.result == 'success' && needs.verify.result == 'failure' }}
    needs: [build, deploy, verify]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Restore last successful full Pages site
        uses: actions/deploy-pages@v4
        with:
          artifact_name: company-crm-service-rollback
