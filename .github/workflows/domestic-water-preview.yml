name: Domestic Water Preview

on:
  push:
    branches: [agent/domestic-water-roof-intel-20260904]

permissions:
  contents: read

jobs:
  verify-domestic-water:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test domestic-water normalization
        run: python -m unittest tests.python.test_domestic_water -v
      - name: Build fresh NYC base data
        run: python scripts/build_data.py --output preview-data
      - name: Attach live exact-BIN domestic-water sources
        run: python scripts/build_domestic_water_data.py --output preview-data
      - name: Report representative domestic-water accounts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('preview-data/systems.json').read_text())
          rows = [r for r in payload['systems'] if r.get('dwt_planimetric_tank_count') or r.get('dwt_compliance_record_count') or r.get('dwt_self_report_record_count')]
          rows.sort(key=lambda r: (-(r.get('dwt_planimetric_tank_count') or 0), -(r.get('dwt_self_report_record_count') or 0), r.get('system_id') or ''))
          print(json.dumps({
              'metadata': {k:v for k,v in payload['metadata'].items() if k.startswith('dwt_')},
              'summary': {k:v for k,v in payload['summary'].items() if 'dwt_' in k or 'domestic_water' in k},
              'representative_accounts': [{
                  'system_id': r['system_id'],
                  'bin': r.get('bin'),
                  'address': r.get('address'),
                  'borough': r.get('borough'),
                  'dwt_planimetric_tank_count': r.get('dwt_planimetric_tank_count'),
                  'dwt_compliance_record_count': r.get('dwt_compliance_record_count'),
                  'dwt_self_report_record_count': r.get('dwt_self_report_record_count'),
                  'dwt_latest_status': r.get('dwt_latest_status'),
                  'dwt_latest_activity_year': r.get('dwt_latest_activity_year'),
                  'dwt_latest_self_report_inspection_date': r.get('dwt_latest_self_report_inspection_date'),
              } for r in rows[:20]],
          }, indent=2))
          PY
      - name: Upload domestic-water coverage evidence
        uses: actions/upload-artifact@v4
        with:
          name: domestic-water-preview
          path: |
            preview-data/domestic-water-coverage.json
            preview-data/metadata.json
          retention-days: 7
