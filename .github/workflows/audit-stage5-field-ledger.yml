name: Build core source-field ledger batch
on:
  push:
    branches: [audit/full-lineage-20260923-1350]
    paths:
      - docs/audits/2026-09-23/build_stage5_field_ledger.py
      - .github/workflows/audit-stage5-field-ledger.yml
permissions:
  contents: write
jobs:
  ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build field ledger batch from current official schemas
        run: python -u docs/audits/2026-09-23/build_stage5_field_ledger.py
      - name: Persist compact ledger results to audit branch
        run: |
          mkdir -p docs/audits/2026-09-23/stage5-field-ledger
          cp .audit-stage5/source-field-ledger-batch.json docs/audits/2026-09-23/stage5-field-ledger/
          cp .audit-stage5/source-field-ledger-batch-summary.json docs/audits/2026-09-23/stage5-field-ledger/
          git config user.name "TowerSignal Audit"
          git config user.email "actions@users.noreply.github.com"
          git add docs/audits/2026-09-23/stage5-field-ledger
          git commit -m "audit: persist core source-field ledger batch"
          git push origin HEAD:audit/full-lineage-20260923-1350
