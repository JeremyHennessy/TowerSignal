name: Apply OATH adaptive agency-page retries

on:
  push:
    branches:
      - agent/oath-adaptive-agency-pages-20260907
    paths:
      - '.github/workflows/patch-oath-adaptive-agency.yml'
      - 'scripts/_patch_oath_adaptive_agency.py'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/oath-adaptive-agency-pages-20260907
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply adaptive agency-page patch
        run: python scripts/_patch_oath_adaptive_agency.py
      - name: Run focused OATH regressions
        run: python -m unittest tests.python.test_oath_fetch -v
      - name: Compile OATH source
        run: python -m py_compile scripts/towersignal/oath.py
      - name: Commit validated OATH source and tests
        run: |
          git config user.name 'TowerSignal Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/towersignal/oath.py tests/python/test_oath_fetch.py
          git commit -m 'Retry OATH agency seek pages adaptively before fallback'
          git push origin HEAD:agent/oath-adaptive-agency-pages-20260907
