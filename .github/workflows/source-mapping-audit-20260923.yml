name: Read-only all-source mapping audit
on:
  push:
    branches: [audit/source-mapping-20260923]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: source-mapping-audit-20260923
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capture code, hosted baseline and independent official evidence
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          mkdir -p audit-evidence
          git archive --format=tar.gz --output=audit-evidence/repository-source.tar.gz HEAD
          python - <<'PY'
          import json, gzip, hashlib, time, urllib.request, urllib.parse, concurrent.futures
          from pathlib import Path
          from datetime import datetime, timezone
          OUT=Path('audit-evidence'); evidence=[]; errors=[]
          def request(url):
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'TowerSignal-read-only-source-audit/1.0'}),timeout=100) as r:
                          raw=r.read(); headers=dict(r.headers)
                      return raw,headers
                  except Exception as e:
                      if attempt==2: raise
                      time.sleep(5*(attempt+1))
          def save(name,data):
              raw=json.dumps(data,separators=(',',':')).encode()
              with gzip.open(OUT/(name+'.json.gz'),'wb') as f:f.write(raw)
          def fetch_json(url,label):
              raw,headers=request(url); value=json.loads(raw)
              evidence.append({'label':label,'url':url,'retrieved_at':datetime.now(timezone.utc).isoformat(),'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest(),'last_modified':headers.get('Last-Modified'),'etag':headers.get('ETag')})
              return value
          base='https://jeremyhennessy.github.io/TowerSignal/data/'
          hosted={}
          for name in ['systems','metadata','source-health','verification','coverage-audit','nyc-water-signals','cms-institutional-context','property-enforcement','legacy-dob-projects','domestic-water-market','nyc-building-water-signal-coverage','domestic-water-coverage','nyc-service-line-coverage','historical-311-context-coverage']:
              try:
                  value=fetch_json(base+name+'.json','hosted/'+name); save('hosted-'+name,value); hosted[name]=value
                  print('HOSTED',name, 'captured',flush=True)
              except Exception as e: errors.append({'source':'hosted/'+name,'error':str(e)})
          systems=hosted['systems']['systems']
          value=fetch_json(base+'details/20/2000014227.json','hosted-target');save('hosted-target',value)
          def full(dataset,order,select='*',where=None,label=None):
              label=label or dataset
              before=fetch_json('https://data.cityofnewyork.us/api/views/'+dataset+'.json',label+'/metadata-before')
              save(label+'-metadata',before)
              rows=[]; offset=0; pages=0
              while True:
                  args={'$limit':50000,'$offset':offset,'$order':order,'$select':select}
                  if where:args['$where']=where
                  url='https://data.cityofnewyork.us/resource/'+dataset+'.json?'+urllib.parse.urlencode(args)
                  chunk=fetch_json(url,label+'/page-'+str(pages))
                  if not isinstance(chunk,list):raise RuntimeError('Not a row array: '+label)
                  rows.extend(chunk);pages+=1
                  if len(chunk)<50000:break
                  offset+=len(chunk)
                  if pages>30:raise RuntimeError('Refusing silent truncation '+label)
              after=fetch_json('https://data.cityofnewyork.us/api/views/'+dataset+'.json',label+'/metadata-after')
              count=None
              try:
                  args={'$select':'count(*)'}
                  if where:args['$where']=where
                  count=int(fetch_json('https://data.cityofnewyork.us/resource/'+dataset+'.json?'+urllib.parse.urlencode(args),label+'/filtered-count')[0]['count'])
              except Exception as e:errors.append({'source':label+'/count','error':str(e),'telemetry_only':True})
              status={'dataset_id':dataset,'rows':len(rows),'count':count,'pages':pages,'exhausted':True,'source_unchanged':before.get('rowsUpdatedAt')==after.get('rowsUpdatedAt'),'count_matches':None if count is None else count==len(rows),'where':where}
              save(label,rows);save(label+'-coverage',status);print('OFFICIAL',json.dumps(status),flush=True)
              return rows
          tasks=[('y4fw-iqfr','system_id,:id','*','registry'),('f9wb-g8mb','system_id,inspection_date,:id','*','inspections'),('tesw-yqqr','registrationid,:id','registrationid,buildingid,boroid,boro,block,lot,bin,lastregistrationdate','hpd-registrations')]
          results={}
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:
              futures={pool.submit(full,d,o,s,None,label):label for d,o,s,label in tasks}
              for f in concurrent.futures.as_completed(futures):
                  label=futures[f]
                  try: results[label]=f.result()
                  except Exception as e:errors.append({'source':label,'error':str(e)});print('SOURCE_ERROR',label,str(e),flush=True)
          def norm(v):
              try:return str(int(float(v)))
              except (ValueError,TypeError):return None
          bbls={norm(b) for s in systems for b in [s.get('bbl'),s.get('registry_bbl'),*(s.get('bbl_aliases') or [])] if norm(b)}
          bins={norm(s.get('bin')) for s in systems if norm(s.get('bin'))}
          def regbbl(r):
              try:return str(int(r['boroid']))+str(int(r['block'])).zfill(5)+str(int(r['lot'])).zfill(4)
              except Exception:return None
          relevant=[r for r in results.get('hpd-registrations',[]) if regbbl(r) in bbls or norm(r.get('bin')) in bins]
          save('hpd-relevant-registrations',relevant)
          ids=sorted({norm(r.get('registrationid')) for r in relevant if norm(r.get('registrationid'))},key=int)
          contacts=[]
          for start in range(0,len(ids),250):
              subset=ids[start:start+250]
              try:
                  args={'$where':'registrationid in ('+','.join(subset)+')','$order':'registrationid,registrationcontactid','$limit':50000}
                  url='https://data.cityofnewyork.us/resource/feu5-w2e2.json?'+urllib.parse.urlencode(args)
                  chunk=fetch_json(url,'hpd-contacts/'+str(start));
                  if len(chunk)>=50000:raise RuntimeError('Contact chunk hit cap')
                  contacts.extend(chunk)
              except Exception as e:errors.append({'source':'hpd-contacts','registration_ids':subset,'error':str(e)})
          save('hpd-contacts',contacts)
          print('HPD_SCOPE',json.dumps({'all_registration_rows':len(results.get('hpd-registrations',[])),'relevant_registration_rows':len(relevant),'registration_ids':len(ids),'contacts':len(contacts)}),flush=True)
          save('request-evidence',evidence);save('errors',errors)
          (OUT/'capture-summary.json').write_text(json.dumps({'source_head':'${{ github.sha }}','hosted_systems':len(systems),'hosted_metadata':hosted['systems']['metadata'],'independent_rows':{k:len(v) for k,v in results.items()},'hpd_relevant_registrations':len(relevant),'hpd_contacts':len(contacts),'errors':errors},indent=2))
          print('CAPTURE_COMPLETE',json.dumps({'systems':len(systems),'independent_rows':{k:len(v) for k,v in results.items()},'hpd_contacts':len(contacts),'errors':errors}),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-mapping-audit-capture
          path: audit-evidence
          retention-days: 14
          if-no-files-found: error
