name: Read-only all-source mapping audit
on:
  push:
    branches: [audit/source-mapping-20260923]
    paths: [.github/workflows/source-mapping-audit-20260923.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: source-mapping-audit-20260923
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent supplementary evidence
        run: |
          mkdir -p supplementary-evidence
          python - <<'PY'
          import json,gzip,time,hashlib,urllib.request,urllib.parse,concurrent.futures
          from pathlib import Path
          from datetime import datetime,timezone
          O=Path('supplementary-evidence'); evidence=[]; errors=[]
          def save(n,v):
              with gzip.open(O/(n+'.json.gz'),'wt') as f:json.dump(v,f,separators=(',',':'))
          def get(url,label):
              for a in range(3):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'TowerSignal-independent-mapping-audit/1.0'}),timeout=100) as r:raw=r.read()
                      v=json.loads(raw);evidence.append({'label':label,'url':url,'retrieved_at':datetime.now(timezone.utc).isoformat(),'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw)});return v
                  except Exception:
                      if a==2:raise
                      time.sleep(5*(a+1))
          def source(host,dataset,label,where=None):
              before=get(host+'/api/views/'+dataset+'.json',label+'/metadata');save(label+'-metadata',before)
              rows=[];offset=0
              while True:
                  args={'$limit':50000,'$offset':offset,'$order':':id'}
                  if where:args['$where']=where
                  chunk=get(host+'/resource/'+dataset+'.json?'+urllib.parse.urlencode(args),label+'/rows-'+str(offset))
                  if not isinstance(chunk,list):raise RuntimeError('Expected rows '+label)
                  rows.extend(chunk)
                  if len(chunk)<50000:break
                  offset+=len(chunk)
                  if offset>2000000:raise RuntimeError('Refusing truncated source '+label)
              after=get(host+'/api/views/'+dataset+'.json',label+'/metadata-after')
              args={'$select':'count(*)'}
              if where:args['$where']=where
              count=int(get(host+'/resource/'+dataset+'.json?'+urllib.parse.urlencode(args),label+'/count')[0]['count'])
              status={'dataset_id':dataset,'rows':len(rows),'count':count,'count_matches':count==len(rows),'source_unchanged':before.get('rowsUpdatedAt')==after.get('rowsUpdatedAt'),'where':where,'exhausted':True}
              save(label,rows);save(label+'-coverage',status);print('OFFICIAL',label,json.dumps(status),flush=True)
              if not status['count_matches'] or not status['source_unchanged']:raise RuntimeError('Source did not remain complete/stable '+label)
              return len(rows)
          city='https://data.cityofnewyork.us';state='https://health.data.ny.gov';site='https://jeremyhennessy.github.io/TowerSignal/data/'
          hosted=get(site+'systems.json','hosted/systems');save('hosted-systems',hosted)
          save('hosted-nys-systems',get(site+'nys-systems.json','hosted/nys-systems'))
          bins=sorted({s['bin'] for s in hosted['systems'] if s.get('bin') and len(s['bin'])==7 and s['bin'][1:]!='000000' and (s.get('hpd_contact_count')==0 or 'CONFLICT' in str(s.get('bbl_identity_status')) or 'UNRESOLVED' in str(s.get('bbl_identity_status')))}|{'1089723','1088152','1088432','1016877'})
          tasks=[(state,'24a4-muw7','nys-registry',None),(city,'gjm4-k24g','dwt-self-reports',None),(city,'rytv-g5ui','dwt-compliance',None),(city,'feu5-w2e2','hpd-zero-contacts','registrationid=0'),(city,'tesw-yqqr','hpd-zero-registrations','registrationid=0')]
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:
              fs={pool.submit(source,*t):t[2] for t in tasks}
              for f in concurrent.futures.as_completed(fs):
                  try:f.result()
                  except Exception as e:errors.append({'source':fs[f],'error':str(e)})
          # Full HPD address fields for the independently identified contact/identity review cases.
          candidate_bins=['3000417','1090462','1089237','1016877','1048068','1089723','1056989']
          source(city,'tesw-yqqr','hpd-review-full','bin in ('+','.join(candidate_bins)+')')
          # Query missing-contact and ambiguous-identity properties by non-placeholder BIN.
          footprint_rows=[]
          for start in range(0,len(bins),150):
              batch=bins[start:start+150]
              args={'$where':'bin in ('+','.join(batch)+')','$limit':50000,'$order':'bin,objectid','$select':'bin,base_bbl,mappluto_bbl,objectid,name,the_geom'}
              try:
                  chunk=get(city+'/resource/5zhs-2jue.json?'+urllib.parse.urlencode(args),'footprints/'+str(start))
                  if len(chunk)>=50000:raise RuntimeError('Footprint query hit cap')
                  footprint_rows.extend(chunk)
              except Exception as e:errors.append({'source':'footprints','bins':batch,'error':str(e)})
          save('review-footprints',footprint_rows)
          save('request-evidence',evidence);save('errors',errors)
          print('SUPPLEMENT_COMPLETE',json.dumps({'requested_nonplaceholder_bins':len(bins),'footprint_rows':len(footprint_rows),'errors':errors}),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-mapping-supplement
          path: supplementary-evidence
          retention-days: 14
          if-no-files-found: error
