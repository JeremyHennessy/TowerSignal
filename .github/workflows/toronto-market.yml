name: Toronto Market Build

on:
  workflow_dispatch:
  push:
    branches:
      - agent/toronto-market-20260828
    paths:
      - scripts/toronto_market_common.py
      - scripts/toronto_market_core.py
      - scripts/toronto_identity_normalize.py
      - scripts/toronto_aic_corpus.py
      - scripts/toronto_aerial_detector.py
      - docs/TORONTO_MARKET.md
      - .github/workflows/toronto-market.yml

permissions:
  contents: write

concurrency:
  group: toronto-market-build
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile Toronto market scripts
        run: |
          python -m py_compile \
            scripts/toronto_market_common.py \
            scripts/toronto_market_core.py \
            scripts/toronto_identity_normalize.py \
            scripts/toronto_aic_corpus.py \
            scripts/toronto_aerial_detector.py

      - name: Build canonical source candidates and official-source joins
        run: python scripts/toronto_market_core.py core

      - name: Normalize current municipal Address Point identity
        run: python scripts/toronto_identity_normalize.py

      - name: Validate core outputs
        run: |
          for file in \
            data/toronto/market/current/property_spine.json \
            data/toronto/market/current/identity_contract.json \
            data/toronto/market/current/reconciliation_summary.json \
            data/toronto/market/current/reconciliation_details.json \
            data/toronto/market/current/property_source_links.json \
            data/toronto/market/current/open_licensed/toronto_highrise_residential_health_hazards.json \
            data/toronto/market/current/open_licensed/toronto_aic_applications.json \
            data/toronto/market/current/construction_act_source_policy.json; do
              python -m json.tool "$file" >/dev/null
          done
          python - <<'PY'
          import json
          from pathlib import Path
          market=Path('data/toronto/market/current')
          spine=json.loads((market/'property_spine.json').read_text())
          recon=json.loads((market/'reconciliation_details.json').read_text())
          props=spine['properties']
          ids=[p['property_id'] for p in props]
          assert len(ids)==len(set(ids)), 'duplicate canonical property IDs'
          assert all(i.startswith('toronto-address-point:') for i in ids), 'old Toronto property ID namespace remains'
          assert len(recon['records'])==177, 'POC reconciliation ledger must contain 177 records'
          assert len({r['property_key'] for r in recon['records']})==177, 'POC reconciliation keys not unique'
          assert recon['resolved_count']+recon['unresolved_count']==177
          print(json.dumps({'canonical_properties':len(props),'poc_resolved':recon['resolved_count'],'poc_unresolved':recon['unresolved_count']},indent=2))
          PY

      - name: Upload core market state
        uses: actions/upload-artifact@v4
        with:
          name: toronto-market-core
          path: data/toronto/market/current/
          retention-days: 30

  aic-corpus:
    needs: core
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF parser
        run: python -m pip install --disable-pip-version-check 'pypdf>=5,<7'

      - name: Restore core market state
        uses: actions/download-artifact@v4
        with:
          name: toronto-market-core
          path: data/toronto/market/current

      - name: Parse AIC supporting-document shard
        run: python scripts/toronto_aic_corpus.py --shard-index ${{ matrix.shard }} --shard-count 8 --workers 2

      - name: Upload AIC shard
        uses: actions/upload-artifact@v4
        with:
          name: toronto-aic-shard-${{ matrix.shard }}
          path: data/toronto/market/current/work/aic_corpus_shard_${{ matrix.shard }}.json
          retention-days: 30

  aerial:
    needs: core
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install aerial-analysis dependencies
        run: python -m pip install --disable-pip-version-check 'numpy>=2,<3' 'pillow>=11,<13' 'scikit-learn>=1.6,<2'

      - name: Restore core market state
        uses: actions/download-artifact@v4
        with:
          name: toronto-market-core
          path: data/toronto/market/current

      - name: Build targeted 2025 aerial weak-label detector
        run: python scripts/toronto_aerial_detector.py --max-score 1200 --save-review 50

      - name: Upload aerial analysis
        uses: actions/upload-artifact@v4
        with:
          name: toronto-aerial-analysis
          path: |
            data/toronto/market/current/aerial_model_report.json
            data/toronto/market/current/aerial_candidates.json
            data/toronto/market/current/work/aerial_review/
          if-no-files-found: warn
          retention-days: 30

  finalize:
    needs: [core, aic-corpus, aerial]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore core market state
        uses: actions/download-artifact@v4
        with:
          name: toronto-market-core
          path: data/toronto/market/current

      - name: Restore all AIC shards
        uses: actions/download-artifact@v4
        with:
          pattern: toronto-aic-shard-*
          path: data/toronto/market/current/work
          merge-multiple: true

      - name: Restore aerial analysis
        uses: actions/download-artifact@v4
        with:
          name: toronto-aerial-analysis
          path: data/toronto/market/current

      - name: Build AIC aggregate, relationship graph and coverage report
        run: python scripts/toronto_market_core.py finalize

      - name: Validate final public-safe outputs
        run: |
          for file in \
            data/toronto/market/current/property_spine.json \
            data/toronto/market/current/identity_contract.json \
            data/toronto/market/current/reconciliation_details.json \
            data/toronto/market/current/aic_corpus_summary.json \
            data/toronto/market/current/aic_document_index.json \
            data/toronto/market/current/aic_application_scan_status.json \
            data/toronto/market/current/aic_explicit_tower_candidates.json \
            data/toronto/market/current/entity_graph.json \
            data/toronto/market/current/coverage_report.json; do
              python -m json.tool "$file" >/dev/null
          done
          if [ -f data/toronto/market/current/aerial_model_report.json ]; then
            python -m json.tool data/toronto/market/current/aerial_model_report.json >/dev/null
          fi
          python - <<'PY'
          import json, math
          from pathlib import Path
          market=Path('data/toronto/market/current')
          def load(name): return json.loads((market/name).read_text())
          spine=load('property_spine.json'); links=load('property_source_links.json'); graph=load('entity_graph.json'); coverage=load('coverage_report.json')
          ids={p['property_id'] for p in spine['properties']}
          assert len(ids)==len(spine['properties'])
          assert all(l['property_id'] in ids for l in links.get('links',[])), 'broken property source link'
          for edge in graph.get('edges',[]):
            pid=edge.get('property_id') or edge.get('target_property_id') or edge.get('source_property_id')
            if pid: assert pid in ids, f'broken entity graph property reference {pid}'
          def walk(v):
            if isinstance(v,float): assert math.isfinite(v), 'NaN/Infinity in output'
            elif isinstance(v,dict):
              for x in v.values(): walk(x)
            elif isinstance(v,list):
              for x in v: walk(x)
          for payload in (spine,links,graph,coverage): walk(payload)
          true_cov=coverage.get('true_cooling_tower_market_coverage',{})
          assert true_cov.get('coverage_percent') is None, 'true Toronto market denominator must remain unknown unless separately validated'
          print('final structural validation passed')
          PY

      - name: Upload full Toronto market artifact before cleanup
        uses: actions/upload-artifact@v4
        with:
          name: toronto-market-full-${{ github.run_id }}
          path: data/toronto/market/current/
          retention-days: 30

      - name: Remove artifact-only working files before Git persistence
        run: rm -rf data/toronto/market/current/work

      - name: Persist successful Toronto market snapshot
        run: |
          if [ -z "$(git status --porcelain -- data/toronto/market/current)" ]; then
            echo "Toronto market snapshot unchanged."
            exit 0
          fi
          git config user.name "TowerSignal Toronto Market Bot"
          git config user.email "towersignal-market@users.noreply.github.com"
          git add data/toronto/market/current
          git commit -m "Toronto market: refresh canonical property and evidence layers"
          git push origin HEAD:agent/toronto-market-20260828
