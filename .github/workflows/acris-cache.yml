name: Refresh verified ACRIS cache

on:
  workflow_dispatch:
  schedule:
    - cron: '23 8 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/acris-cache.yml'
      - 'scripts/towersignal/acris.py'
      - 'scripts/towersignal/bbl_identity.py'
      - 'scripts/towersignal/building_footprints.py'
      - 'scripts/towersignal/planimetrics.py'
      - 'scripts/towersignal/pluto.py'
      - 'scripts/build_acris_cache.py'
      - 'scripts/validate_acris_cache.py'
      - 'scripts/verify_live_acris.py'
      - 'scripts/attach_acris.py'
      - 'scripts/attach_acris_health.py'
      - 'tests/python/test_acris_cache_builder.py'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/acris-cache.yml'
      - '.github/workflows/pages.yml'
      - 'scripts/towersignal/acris.py'
      - 'scripts/towersignal/bbl_identity.py'
      - 'scripts/towersignal/building_footprints.py'
      - 'scripts/towersignal/planimetrics.py'
      - 'scripts/towersignal/pluto.py'
      - 'scripts/build_acris_cache.py'
      - 'scripts/validate_acris_cache.py'
      - 'scripts/verify_live_acris.py'
      - 'scripts/attach_acris.py'
      - 'scripts/attach_acris_health.py'
      - 'src/components/AcrisActivitySection.tsx'
      - 'src/components/DetailPanel.tsx'
      - 'src/types/acris.ts'
      - 'src/utils/export.ts'
      - 'tests/python/test_acris.py'
      - 'tests/python/test_acris_cache_builder.py'

permissions:
  contents: write
  actions: write

concurrency:
  group: towersignal-acris-cache-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build bounded ACRIS cache from current canonical NYC BBL universe
        run: python scripts/build_acris_cache.py --output acris-cache/cache.json
      - name: Validate cache size, structure and production volume
        run: python scripts/validate_acris_cache.py --cache acris-cache/cache.json --max-age-days 1 --require-production-volume
      - name: Independently verify sampled cache rows against live ACRIS
        run: python scripts/verify_live_acris.py --cache acris-cache/cache.json --sample-size 5
      - name: Upload verified ACRIS cache
        uses: actions/upload-artifact@v4
        with:
          name: towersignal-acris-cache
          path: acris-cache/cache.json
          retention-days: 7

  integration:
    if: ${{ github.event_name == 'pull_request' }}
    needs: build-cache
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Check out durable TowerSignal history for the verified OATH cache
        uses: actions/checkout@v4
        with:
          ref: data/towersignal-history
          path: .history-store
          fetch-depth: 1
          sparse-checkout: data/history
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download freshly verified ACRIS cache
        uses: actions/download-artifact@v4
        with:
          name: towersignal-acris-cache
          path: .verified-acris
      - name: Generate current NYC canonical property universe
        timeout-minutes: 45
        run: python scripts/build_data.py --output public/data
      - name: Attach freshly verified ACRIS cache
        run: python scripts/attach_acris.py --output public/data --cache .verified-acris/cache.json
      - name: Require canonical ACRIS cache universe alignment
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          metadata = (json.loads(Path('public/data/systems.json').read_text(encoding='utf-8')).get('metadata') or {})
          if metadata.get('acris_cache_available') is not True:
              raise SystemExit('Verified ACRIS cache did not attach to the generated product')
          if metadata.get('acris_cache_universe_aligned') is not True:
              raise SystemExit('Verified ACRIS cache does not match the current canonical TowerSignal BBL universe')
          print(json.dumps({
              'acris_cache_generated_at': metadata.get('acris_cache_generated_at'),
              'acris_requested_bbl_count': metadata.get('acris_requested_bbl_count'),
              'acris_matched_bbl_count': metadata.get('acris_matched_bbl_count'),
              'acris_matched_document_count': metadata.get('acris_matched_document_count'),
              'acris_cache_universe_aligned': metadata.get('acris_cache_universe_aligned'),
          }, indent=2))
          PY

  persist-cache:
    if: ${{ github.event_name != 'pull_request' }}
    needs: build-cache
    runs-on: ubuntu-latest
    steps:
      - name: Check out durable ACRIS cache branch
        uses: actions/checkout@v4
        with:
          ref: data/towersignal-acris
          fetch-depth: 1
      - name: Download verified ACRIS cache
        uses: actions/download-artifact@v4
        with:
          name: towersignal-acris-cache
          path: .verified-acris
      - name: Persist verified cache
        run: |
          mkdir -p data/acris
          cp .verified-acris/cache.json data/acris/cache.json
          git config user.name "TowerSignal ACRIS Cache Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/acris/cache.json
          if git diff --cached --quiet; then
            echo "ACRIS cache unchanged"
          else
            git commit -m "data: persist verified bounded ACRIS cache [skip ci]"
            git push origin HEAD:data/towersignal-acris
          fi

  deploy-refreshed-cache:
    if: ${{ github.event_name != 'pull_request' }}
    needs: persist-cache
    runs-on: ubuntu-latest
    steps:
      - name: Deploy product with last verified ACRIS cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main -f require_acris=true
