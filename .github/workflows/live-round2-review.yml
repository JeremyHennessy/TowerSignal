name: Live Workflow/account round 2 review

on:
  push:
    branches: [agent/live-visual-round2-20260912]
    paths:
      - .github/workflows/live-round2-review.yml
      - tests/e2e/live-round2-review.spec.ts

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install hosted browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Capture live desktop and iPhone acceptance
        env:
          BASE_URL: https://jeremyhennessy.github.io/TowerSignal/
        run: >-
          npx playwright test tests/e2e/live-round2-review.spec.ts
          --project=desktop-chromium --project=iphone
      - name: Upload live review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-round2-review-${{ github.run_id }}
          path: |
            review-artifacts/
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: warn
