name: Wire historical 311 into NYC water context CLI

on:
  push:
    branches:
      - agent/historical-311-context-current-main-20260907
    paths:
      - '.github/workflows/wire-historical-311-cli.yml'
      - 'scripts/_wire_historical_311_cli.py'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/historical-311-context-current-main-20260907
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wire bounded historical context into production CLI
        run: python scripts/_wire_historical_311_cli.py
      - name: Run water and historical context regressions
        run: python -m unittest tests.python.test_historical_311_context tests.python.test_coverage_audit -v
      - name: Commit validated CLI wiring
        run: |
          git config user.name 'TowerSignal Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/attach_nyc_water_signals.py
          git commit -m 'Build bounded historical 311 context in NYC water pipeline'
          git push origin HEAD:agent/historical-311-context-current-main-20260907
