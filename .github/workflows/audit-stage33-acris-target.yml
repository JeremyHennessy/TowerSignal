name: Replay ACRIS target relationships independently
on:
  push:
    branches: [audit/full-lineage-20260923-1350]
    paths:
      - docs/audits/2026-09-23/audit_stage33_acris_target.py
      - .github/workflows/audit-stage33-acris-target.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay served ACRIS cutoff and property graph
        run: python -u docs/audits/2026-09-23/audit_stage33_acris_target.py
      - name: Persist results
        run: |
          mkdir -p docs/audits/2026-09-23/stage33-acris-target
          cp .audit-stage33/*.json docs/audits/2026-09-23/stage33-acris-target/
          git config user.name "TowerSignal Audit"
          git config user.email "actions@users.noreply.github.com"
          git add docs/audits/2026-09-23/stage33-acris-target
          git commit -m "audit: persist independent ACRIS target replay"
          git pull --rebase origin audit/full-lineage-20260923-1350
          git push origin HEAD:audit/full-lineage-20260923-1350
