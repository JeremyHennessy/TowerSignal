name: Toronto Explicit Role Field Diagnostic

on:
  push:
    branches:
      - agent/toronto-role-field-diagnostic-20260903
    paths:
      - .github/workflows/toronto-role-field-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile diagnostic
        run: python -m py_compile scripts/diagnose_toronto_role_fields.py

      - name: Inventory explicit role-like fields
        run: python scripts/diagnose_toronto_role_fields.py --output toronto-role-field-diagnostic.json

      - name: Upload diagnostic report
        uses: actions/upload-artifact@v4
        with:
          name: toronto-role-field-diagnostic
          path: toronto-role-field-diagnostic.json
          retention-days: 7
