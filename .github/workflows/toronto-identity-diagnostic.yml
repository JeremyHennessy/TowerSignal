name: Toronto Identity Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - agent/toronto-approved-recovery-20260831
    paths:
      - .github/workflows/toronto-identity-diagnostic.yml

permissions:
  contents: read

jobs:
  inspect-address-points:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Inspect current City Address Point rows
        shell: python
        run: |
          import csv
          import io
          import urllib.request

          url = 'https://ckan0.cf.opendata.inter.prod-toronto.ca/dataset/abedd8bc-e3dd-4d45-8e69-79165a76e4fa/resource/64d4e54b-738f-4cd9-a9e7-8050fac8a52f/download/address-points-4326.csv'
          with urllib.request.urlopen(url, timeout=120) as response:
              text = response.read().decode('utf-8-sig', errors='replace')

          targets = {'8127974', '12763885'}
          exact_addresses = {'89 HUMBER COLLEGE BLVD', '90 ADELAIDE ST W', '92 ADELAIDE ST W', '94 ADELAIDE ST W'}
          rows = []
          for row in csv.DictReader(io.StringIO(text)):
              apid = (row.get('ADDRESS_POINT_ID') or '').strip()
              address = (row.get('ADDRESS_FULL') or '').strip().upper()
              linked = (row.get('ADDRESS_POINT_ID_LINK') or '').strip()
              address_link = (row.get('ADDRESS_LINK') or '').strip().upper()
              if apid in targets or linked in targets or address in exact_addresses or '89 HUMBER COLLEGE' in address or ('ADELAIDE ST W' in address and any(address.startswith(n + ' ') for n in ('90','92','94'))):
                  rows.append(row)

          fields = ['ADDRESS_POINT_ID','ADDRESS_ID','ADDRESS_POINT_ID_LINK','ADDRESS_ID_LINK','ADDRESS_LINK','ADDRESS_FULL','PLACE_NAME','MUNICIPALITY_NAME','geometry']
          print(f'MATCH_COUNT={len(rows)}')
          for row in rows:
              print('---')
              for field in fields:
                  print(f'{field}={row.get(field)}')
