name: Prove ArcNY hosted fixture

on:
  push:
    branches:
      - agent/arcny-hosted-fixture-proof-20260917

permissions:
  contents: read

concurrency:
  group: arcny-hosted-fixture-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: Prove isolated ArcNY seed and hosted Workflow behavior
        env:
          BASE_URL: https://jeremyhennessy.github.io/TowerSignal/
        run: npx playwright test tests/e2e/workflow-external-leads.spec.ts
      - name: Retain focused hosted proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arcny-hosted-fixture-proof
          path: |
            playwright-report/**
            test-results/**
            !test-results/.auth/**
          retention-days: 14
          if-no-files-found: warn
