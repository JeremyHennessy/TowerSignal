name: Build 004 Pages Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: List recent main workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?branch=main&per_page=10" \
            | python -c 'import json,sys; d=json.load(sys.stdin); [print(r["id"], r["name"], r["status"], r["conclusion"], r["head_sha"], r["html_url"]) for r in d["workflow_runs"]]'
