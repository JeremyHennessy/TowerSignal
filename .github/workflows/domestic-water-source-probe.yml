name: Domestic Water Source Probe

on:
  push:
    branches: [agent/domestic-water-roof-intel-20260904]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe authoritative DWT sources
        run: |
          python - <<'PY'
          import json, sys
          sys.path.insert(0, 'scripts')
          from towersignal.domestic_water import (
              fetch_planimetric_water_tanks_by_bin,
              fetch_dwt_compliance_by_bin,
              fetch_dwt_self_reports_by_bin,
          )
          bins = ['1015862', '1089811', '1084781', '1001227']
          physical, physical_meta = fetch_planimetric_water_tanks_by_bin(bins, batch_size=4)
          compliance, compliance_meta = fetch_dwt_compliance_by_bin(bins, batch_size=4)
          reports, reports_meta = fetch_dwt_self_reports_by_bin(bins, batch_size=4)
          print(json.dumps({
              'physical_meta': physical_meta,
              'physical_counts': {k: len(v) for k,v in physical.items()},
              'physical_examples': {k: v[:2] for k,v in physical.items()},
              'compliance_meta': compliance_meta,
              'compliance_counts': {k: len(v) for k,v in compliance.items()},
              'compliance_examples': {k: v[:2] for k,v in compliance.items()},
              'self_report_meta': reports_meta,
              'self_report_counts': {k: len(v) for k,v in reports.items()},
              'self_report_examples': {k: v[:2] for k,v in reports.items()},
          }, indent=2))
          PY
