name: Diagnose Planimetric inventory

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/diagnose_planimetric_inventory.py'
      - 'tests/python/test_planimetric_inventory_diagnostic.py'
      - '.github/workflows/planimetric-inventory-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run focused diagnostic tests
        run: python -m unittest tests.python.test_planimetric_inventory_diagnostic -v
      - name: Reconcile complete 2022 physical inventory to current regulatory registry
        run: python scripts/diagnose_planimetric_inventory.py --output planimetric-inventory-diagnostic.json
      - name: Show diagnostic summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('planimetric-inventory-diagnostic.json').read_text())
          print(json.dumps({
              'sources': report['sources'],
              'summary': report['summary'],
              'borough_breakdown': report['borough_breakdown'],
              'physical_source_profile': report['physical_source_profile'],
              'recommendation': report['recommendation'],
          }, indent=2))
          PY
      - name: Upload diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: planimetric-inventory-diagnostic
          path: planimetric-inventory-diagnostic.json
          retention-days: 30
