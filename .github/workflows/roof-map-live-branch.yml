name: Roof map live branch diagnostic

on:
  push:
    branches: [agent/planimetric-rooftop-20260904]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify NYS 2022 orthophoto tile service
        run: |
          python - <<'PY'
          import json
          from urllib.request import Request, urlopen

          service = 'https://orthos.its.ny.gov/arcgis/rest/services/wms/2022/MapServer?f=pjson'
          with urlopen(Request(service, headers={'User-Agent': 'TowerSignal/1.0'}), timeout=60) as response:
              metadata = json.load(response)
          if not metadata.get('singleFusedMapCache'):
              raise RuntimeError('NYS 2022 orthophoto service is not reporting a fused tile cache')
          lods = metadata.get('tileInfo', {}).get('lods') or []
          levels = {int(item['level']) for item in lods if 'level' in item}
          if 19 not in levels:
              raise RuntimeError(f'NYS 2022 orthophoto cache is missing level 19: {sorted(levels)}')

          # Manhattan test point near 40.75, -73.985 at Web Mercator/XYZ z19.
          tile = 'https://orthos.its.ny.gov/arcgis/rest/services/wms/2022/MapServer/tile/19/197050/154395'
          with urlopen(Request(tile, headers={'User-Agent': 'TowerSignal/1.0'}), timeout=60) as response:
              content_type = response.headers.get_content_type()
              sample = response.read(64)
          if not content_type.startswith('image/') or not sample:
              raise RuntimeError(f'NYS orthophoto tile did not return image bytes: {content_type!r}')
          print(json.dumps({'result': 'PASS', 'tile': tile, 'content_type': content_type, 'sample_bytes': len(sample)}))
          PY
      - name: Build live NYC payload with roof-map context
        run: python scripts/build_data.py --output public/data
      - name: Independently verify generated NYC payload
        run: python scripts/verify_live_data.py --systems public/data/systems.json --details public/data/details --output artifacts/generated-live-verification.json --sample-size 5
      - name: Build NYS payload required by source-health gate
        run: python scripts/build_nys_data.py --output public/data
      - name: Validate source-health attachment and coverage
        run: python scripts/build_source_health.py --output public/data
      - name: Preserve diagnostic reports
        uses: actions/upload-artifact@v4
        with:
          name: roof-map-live-verification
          path: |
            artifacts/generated-live-verification.json
            public/data/source-health.json
          retention-days: 7
