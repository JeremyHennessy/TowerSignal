name: Refresh full application lineage on current main
on:
  push:
    branches: [audit/full-lineage-20260923-1350]
    paths:
      - .github/workflows/audit-current-main-application-lineage.yml
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser dependencies
        run: npm install --no-audit --no-fund
      - name: Stage 13 current runtime denominator
        run: |
          node docs/audits/2026-09-23/build_stage13_application_register.mjs
          rm -rf docs/audits/2026-09-23/stage13-application-register
          mkdir -p docs/audits/2026-09-23/stage13-application-register
          cp .audit-stage13/*.json docs/audits/2026-09-23/stage13-application-register/
      - name: Stage 14 initial lineage classes
        run: |
          python -u docs/audits/2026-09-23/build_stage14_application_lineage.py
          rm -rf docs/audits/2026-09-23/stage14-application-lineage
          mkdir -p docs/audits/2026-09-23/stage14-application-lineage
          cp .audit-stage14/*.json docs/audits/2026-09-23/stage14-application-lineage/
      - name: Stage 16 recursive backtrace
        run: |
          python -u docs/audits/2026-09-23/build_stage16_application_backtrace.py
          rm -rf docs/audits/2026-09-23/stage16-application-backtrace
          mkdir -p docs/audits/2026-09-23/stage16-application-backtrace
          cp .audit-stage16/*.json docs/audits/2026-09-23/stage16-application-backtrace/
      - name: Stage 17 callback lineage
        run: |
          python -u docs/audits/2026-09-23/build_stage17_callback_lineage.py
          rm -rf docs/audits/2026-09-23/stage17-callback-lineage
          mkdir -p docs/audits/2026-09-23/stage17-callback-lineage
          cp .audit-stage17/*.json docs/audits/2026-09-23/stage17-callback-lineage/
      - name: Stage 18 expanded local collections
        run: |
          python -u docs/audits/2026-09-23/build_stage18_expanded_application_lineage.py
          rm -rf docs/audits/2026-09-23/stage18-expanded-application-lineage
          mkdir -p docs/audits/2026-09-23/stage18-expanded-application-lineage
          cp .audit-stage18/*.json docs/audits/2026-09-23/stage18-expanded-application-lineage/
      - name: Stage 19 typed lineage
        run: |
          python -u docs/audits/2026-09-23/build_stage19_typed_application_lineage.py
          rm -rf docs/audits/2026-09-23/stage19-typed-application-lineage
          mkdir -p docs/audits/2026-09-23/stage19-typed-application-lineage
          cp .audit-stage19/*.json docs/audits/2026-09-23/stage19-typed-application-lineage/
      - name: Stage 20 final reconciliation
        run: |
          python -u docs/audits/2026-09-23/build_stage20_final_application_ledger.py
          rm -rf docs/audits/2026-09-23/stage20-final-application-ledger
          mkdir -p docs/audits/2026-09-23/stage20-final-application-ledger
          cp .audit-stage20/*.json docs/audits/2026-09-23/stage20-final-application-ledger/
      - name: Record aligned production code SHA
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          main_parent=subprocess.check_output(['git','rev-parse','c5be362316bc8294e1d0970419d70817ebdf9718'],text=True).strip()
          p=Path('docs/audits/2026-09-23/stage20-final-application-ledger/current-main-baseline.json')
          p.write_text(json.dumps({'audit_checkout_sha':sha,'production_main_included_sha':main_parent,'current_main_alignment':'PR_319_MERGED_INTO_AUDIT_BRANCH'},indent=2))
          PY
      - name: Persist refreshed current-main application evidence
        run: |
          git config user.name "TowerSignal Audit"
          git config user.email "actions@users.noreply.github.com"
          git add docs/audits/2026-09-23/stage13-application-register docs/audits/2026-09-23/stage14-application-lineage docs/audits/2026-09-23/stage16-application-backtrace docs/audits/2026-09-23/stage17-callback-lineage docs/audits/2026-09-23/stage18-expanded-application-lineage docs/audits/2026-09-23/stage19-typed-application-lineage docs/audits/2026-09-23/stage20-final-application-ledger
          git commit -m "audit: refresh full application lineage on current main"
          git pull --rebase origin audit/full-lineage-20260923-1350
          git push origin HEAD:audit/full-lineage-20260923-1350
