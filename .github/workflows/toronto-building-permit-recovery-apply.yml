name: Toronto Building Permit Deterministic Recovery

on:
  push:
    branches:
      - agent/toronto-building-permit-recovery-20260903
    paths:
      - .github/workflows/toronto-building-permit-recovery-apply.yml

permissions:
  contents: write

concurrency:
  group: toronto-building-permit-recovery-apply
  cancel-in-progress: false

jobs:
  apply-verify-and-persist:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact recovery branch
        uses: actions/checkout@v4
        with:
          ref: agent/toronto-building-permit-recovery-20260903
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Prove strict permit snapshots are unchanged
        run: |
          git diff --exit-code 101c6808b22bb5ce69a16697f97df95424ad0e2c -- \
            data/toronto/warehouse/current/open_licensed/toronto_building_permits_active_targeted.json \
            data/toronto/warehouse/current/open_licensed/toronto_building_permits_cleared_targeted_since_2017.json

      - name: Compile deterministic recovery implementation
        run: python -m py_compile scripts/apply_toronto_building_permit_recovery.py

      - name: Apply static recovery manifest without network access
        run: python scripts/apply_toronto_building_permit_recovery.py

      - name: Recompute coverage and public Toronto payload
        run: |
          python scripts/toronto_final_coverage.py
          python scripts/build_toronto_app_data.py

      - name: Validate official source actions
        run: python scripts/validate_toronto_source_actions.py --strict --record-sample-size 5

      - name: Audit source semantics cardinality and stable row resolution
        run: |
          python scripts/audit_toronto_source_semantics.py --strict
          python scripts/audit_toronto_public_notice_cardinality.py
          python scripts/audit_toronto_source_row_resolution.py --strict

      - name: Validate final market and recovery contract
        run: |
          python scripts/validate_toronto_market.py
          python scripts/toronto_final_validate.py
          PYTHONPATH=.:scripts python -m unittest tests.python.test_toronto_building_permit_recovery -v
          python - <<'PY'
          import json
          from pathlib import Path

          market = Path('data/toronto/market/current')
          recovery = json.loads((market / 'building_permit_recovery_report.json').read_text(encoding='utf-8'))
          strict = json.loads((market / 'building_permit_apply_report.json').read_text(encoding='utf-8'))
          payload = json.loads(Path('public/data/toronto-market.json').read_text(encoding='utf-8'))
          graph = json.loads((market / 'entity_graph.json').read_text(encoding='utf-8'))
          permit_sources = {'toronto_building_permits_active_targeted', 'toronto_building_permits_cleared_targeted_since_2017'}

          assert strict['metrics']['final_properties'] == 13371
          assert strict['metrics']['final_source_links'] == 40012
          assert recovery['status'] == 'PASSED'
          assert recovery['metrics']['recovered_rows'] == 47
          assert recovery['metrics']['new_properties'] == 9
          assert recovery['metrics']['remaining_unresolved_rows'] == 3
          assert recovery['metrics']['final_properties'] == 13380
          assert recovery['metrics']['final_source_links'] == 40059
          assert recovery['metrics']['final_permit_links'] == 1291
          assert recovery['metrics']['final_permit_linked_properties'] == 700
          assert recovery['metrics']['relationship_edges_before_and_after'] == 6343
          assert recovery['metrics']['linked_source_families'] == 16
          assert payload['counts']['canonical_properties'] == 13380
          assert payload['counts']['source_links'] == 40059
          assert payload['counts']['official_source_families'] == 16
          assert payload['counts']['relationship_edges'] == 6343
          assert payload['counts']['documentary_confirmed_properties'] == 47
          new_ids = set(recovery['new_property_ids'])
          app_new = [prop for prop in payload['properties'] if prop['property_id'] in new_ids]
          assert len(app_new) == 9
          assert all(prop['tower_evidence_status'] == 'NO_TOWER_ASSERTION' for prop in app_new)
          assert not [edge for edge in graph.get('edges', []) if edge.get('source_key') in permit_sources]
          assert {(item['source_key'], item['permit_identity']) for item in recovery['remaining_unresolved']} == {
              ('toronto_building_permits_active_targeted', '12 148282 BLD::00'),
              ('toronto_building_permits_cleared_targeted_since_2017', '17 139058 MSA::00'),
              ('toronto_building_permits_cleared_targeted_since_2017', '16 146056 MSA::00'),
          }
          print(json.dumps({'status': 'TORONTO_PERMIT_RECOVERY_CONTRACT_PASSED', 'counts': payload['counts'], 'recovery': recovery['metrics']}, indent=2))
          PY

      - name: Verify frontend behavior and production build
        env:
          VITE_ENABLE_TORONTO: 'true'
          VITE_TORONTO_PREVIEW: 'true'
        run: |
          npm run lint
          npm run typecheck
          npm exec vitest run -- tests/frontend/TorontoMarket.test.tsx
          npm exec vite build -- --base=/ --outDir=dist-permit-recovery-candidate
          test -z "$(git diff 101c6808b22bb5ce69a16697f97df95424ad0e2c -- src/styles)" || { echo 'Recovery phase modified approved styles'; git diff 101c6808b22bb5ce69a16697f97df95424ad0e2c -- src/styles; exit 1; }

      - name: Persist verified recovery outputs
        run: |
          git config user.name "TowerSignal Permit Recovery Bot"
          git config user.email "towersignal-permit-recovery@users.noreply.github.com"
          git add \
            data/toronto/market/current/property_spine.json \
            data/toronto/market/current/property_source_links.json \
            data/toronto/market/current/entity_graph.json \
            data/toronto/market/current/coverage_report.json \
            data/toronto/market/current/building_permit_recovery_report.json \
            data/toronto/market/current/source_action_qa.json \
            data/toronto/market/current/source_semantic_audit.json \
            data/toronto/market/current/public_notice_cardinality_audit.json \
            data/toronto/market/current/source_row_resolution_audit.json \
            data/toronto/market/current/qa_report.json \
            public/data/toronto-market.json
          git diff --cached --quiet && { echo 'No verified recovery outputs to persist'; exit 1; }
          git commit -m "Toronto: recover deterministic building permit identities"
          git push origin HEAD:agent/toronto-building-permit-recovery-20260903
          echo "TORONTO_PERMIT_RECOVERY_SHA=$(git rev-parse HEAD)"
