name: Dispatch verified private Blob data copy once

on:
  push:
    branches: [agent/azure-data-copy-dispatch-20260911]
    paths: [.github/workflows/dispatch-azure-data-copy-once.yml]

permissions:
  contents: read
  pull-requests: read
  actions: write

concurrency:
  group: dispatch-azure-data-copy-once
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # No checkout and no Azure secrets on this unmerged branch.
      - name: Dispatch only the exact merged and CI-tested data-copy workflow
        uses: actions/github-script@v7
        with:
          script: |
            const repo = {owner: 'JeremyHennessy', repo: 'TowerSignal'};
            const mainSha = 'e88e4c76030ccc4064c91209d5883244639c8823';
            const headSha = '736f86b86c63dcba09e3f9084b0f4e201b0ebe3f';
            const workflow = 'azure-data-copy.yml';
            if (context.repo.owner !== repo.owner || context.repo.repo !== repo.repo ||
                context.ref !== 'refs/heads/agent/azure-data-copy-dispatch-20260911') {
              throw new Error('Unexpected repository or dispatch branch');
            }
            const main = (await github.rest.git.getRef({...repo, ref: 'heads/main'})).data;
            if (main.object.sha !== mainSha) throw new Error('Main moved; stop before dispatch');
            const pr = (await github.rest.pulls.get({...repo, pull_number: 222})).data;
            if (!pr.merged || pr.head.sha !== headSha || pr.merge_commit_sha !== mainSha) {
              throw new Error('PR 222 is not the exact tested merge');
            }
            for (const [run_id, sha] of [[34593103081, headSha], [34544249376, '53f7016404774821051e5ebd02eeb5382dded55f']]) {
              const run = (await github.rest.actions.getWorkflowRun({...repo, run_id})).data;
              if (run.head_sha !== sha || run.status !== 'completed' || run.conclusion !== 'success') {
                throw new Error('Exact-head CI or source release gate is not green');
              }
            }
            const file = (await github.rest.repos.getContent({...repo, path: '.github/workflows/' + workflow, ref: mainSha})).data;
            if (file.type !== 'file' || file.sha !== '8dc32b92f6b75ed1f48e6de582e238e7399abcfc') {
              throw new Error('Data-copy workflow differs from reviewed contents');
            }
            const runs = (await github.rest.actions.listWorkflowRuns({...repo, workflow_id: workflow,
              head_sha: mainSha, event: 'workflow_dispatch', per_page: 100})).data;
            if (runs.total_count > 0) {
              core.info('Copy already dispatched for this exact merge; no duplicate created');
              return;
            }
            const current = (await github.rest.git.getRef({...repo, ref: 'heads/main'})).data;
            if (current.object.sha !== mainSha) throw new Error('Main moved during checks');
            await github.rest.actions.createWorkflowDispatch({...repo, workflow_id: workflow, ref: 'main'});
            core.info('Requested the private data copy on main; inspect its actual upload and readback result separately.');
