name: Roof map visual QA

on:
  push:
    branches: [agent/planimetric-rooftop-20260904]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Generate current NYC roof-map data
        run: python scripts/build_data.py --output public/data
      - name: Select representative roof-map cases
        run: |
          mkdir -p artifacts/roof-map-qa
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          payload = json.loads(Path('public/data/systems.json').read_text())
          systems = payload['systems']
          by_id = {row['system_id']: row for row in systems}
          selected = []
          used = set()

          def add(label, row):
              if not row or row['system_id'] in used:
                  return
              used.add(row['system_id'])
              selected.append({
                  'label': label,
                  'system_id': row['system_id'],
                  'bin': row.get('bin'),
                  'address': row.get('address'),
                  'tower_count': int(row.get('planimetric_building_tower_count') or 0),
                  'footprint_match': bool(row.get('building_footprint_match')),
                  'footprint_count': int(row.get('building_footprint_count') or 0),
              })

          add('demo-example', by_id.get('2000015564'))
          add('single-tower', next((r for r in systems if int(r.get('planimetric_building_tower_count') or 0) == 1 and r.get('building_footprint_match')), None))
          multi = max((r for r in systems if r.get('building_footprint_match')), key=lambda r: int(r.get('planimetric_building_tower_count') or 0), default=None)
          add('multi-tower', multi)

          bin_counts = Counter(r.get('bin') for r in systems if r.get('bin'))
          shared = next((r for r in systems if r.get('bin') and bin_counts[r['bin']] > 1 and int(r.get('planimetric_building_tower_count') or 0) > 0 and r.get('building_footprint_match')), None)
          add('multi-system-building', shared)
          add('no-2022-tower-polygon', next((r for r in systems if int(r.get('planimetric_building_tower_count') or 0) == 0 and r.get('building_footprint_match')), None))

          if len(selected) < 4:
              raise RuntimeError(f'Could not select enough representative cases: {selected}')
          Path('artifacts/roof-map-qa/cases.json').write_text(json.dumps(selected, indent=2))
          print(json.dumps(selected, indent=2))
          PY
      - name: Start TowerSignal
        run: |
          nohup npx vite --host 127.0.0.1 --port 4173 > /tmp/towersignal-vite.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173/TowerSignal/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/towersignal-vite.log
          exit 1
      - name: Capture and verify roof maps
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import path from 'node:path'
          import { chromium } from '@playwright/test'

          const out = 'artifacts/roof-map-qa'
          const cases = JSON.parse(fs.readFileSync(`${out}/cases.json`, 'utf8'))
          const browser = await chromium.launch()
          const results = []
          const fatalConsole = []

          async function waitForAerial(page) {
            await page.waitForFunction(() => [...document.querySelectorAll('.planimetric-map img.leaflet-tile')].some(img => img.src.includes('orthos.its.ny.gov') && img.complete && img.naturalWidth > 0), null, { timeout: 45000 })
          }

          for (const testCase of cases) {
            const context = await browser.newContext({ viewport: { width: 1440, height: 1000 }, deviceScaleFactor: 1 })
            const page = await context.newPage()
            const consoleErrors = []
            page.on('console', msg => { if (msg.type() === 'error') consoleErrors.push(msg.text()) })
            page.on('pageerror', err => consoleErrors.push(`pageerror: ${err.message}`))
            const url = `http://127.0.0.1:4173/TowerSignal/#/account/${encodeURIComponent(testCase.system_id)}`
            await page.goto(url, { waitUntil: 'networkidle', timeout: 120000 })
            if ((await page.locator('body').innerText()).includes('Intelligence workspace unavailable')) throw new Error(`${testCase.label}: workspace unavailable`)
            const section = page.locator('section.planimetric-section')
            await section.waitFor({ state: 'visible', timeout: 60000 })
            await section.scrollIntoViewIfNeeded()
            const map = section.locator('.planimetric-map')
            await map.waitFor({ state: 'visible', timeout: 30000 })
            await waitForAerial(page)

            const summary = await section.locator('.planimetric-summary strong').innerText()
            const aerialLoaded = await map.locator('img.leaflet-tile').evaluateAll(imgs => imgs.some(img => img.src.includes('orthos.its.ny.gov') && img.complete && img.naturalWidth > 0))
            const buildingPaths = await map.locator('path[stroke="#ffffff"]').count()
            const towerPaths = await map.locator('path[fill="#f59e0b"]').count()
            const layerControl = await map.locator('.leaflet-control-layers').count()
            const scaleControl = await map.locator('.leaflet-control-scale').count()
            const legend = await section.locator('.roof-map-legend').count()

            if (!aerialLoaded) throw new Error(`${testCase.label}: NYS aerial imagery did not load`)
            if (testCase.footprint_match && buildingPaths < 1) throw new Error(`${testCase.label}: building outline SVG not rendered`)
            if (testCase.tower_count > 0 && towerPaths < 1) throw new Error(`${testCase.label}: cooling-tower polygon SVG not rendered`)
            if (layerControl !== 1 || scaleControl !== 1 || legend !== 1) throw new Error(`${testCase.label}: expected map controls/legend missing`)

            await map.locator('.leaflet-control-layers').hover()
            const streetLabel = map.locator('.leaflet-control-layers-base label', { hasText: 'Street map' })
            await streetLabel.click()
            await page.waitForFunction(() => [...document.querySelectorAll('.planimetric-map img.leaflet-tile')].some(img => img.src.includes('tile.openstreetmap.org') && img.complete && img.naturalWidth > 0), null, { timeout: 30000 })
            await map.locator('.leaflet-control-layers').hover()
            await map.locator('.leaflet-control-layers-base label', { hasText: '2022 NYS aerial' }).click()
            await waitForAerial(page)

            const safe = `${testCase.label}-${testCase.system_id}`.replace(/[^a-zA-Z0-9_-]/g, '-')
            await section.screenshot({ path: `${out}/${safe}-section-desktop.png` })
            await page.screenshot({ path: `${out}/${safe}-full-desktop.png`, fullPage: true })

            results.push({ ...testCase, url, summary, aerialLoaded, buildingPaths, towerPaths, layerControl, scaleControl, legend, consoleErrors })
            fatalConsole.push(...consoleErrors.filter(text => !text.includes('favicon') && !text.includes('Failed to load resource: the server responded with a status of 404')))
            await context.close()
          }

          const mobileCase = cases.find(c => c.label === 'demo-example') ?? cases[0]
          const mobileContext = await browser.newContext({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 1 })
          const mobilePage = await mobileContext.newPage()
          await mobilePage.goto(`http://127.0.0.1:4173/TowerSignal/#/account/${encodeURIComponent(mobileCase.system_id)}`, { waitUntil: 'networkidle', timeout: 120000 })
          const mobileSection = mobilePage.locator('section.planimetric-section')
          await mobileSection.waitFor({ state: 'visible', timeout: 60000 })
          await mobileSection.scrollIntoViewIfNeeded()
          await waitForAerial(mobilePage)
          const mobileBox = await mobileSection.boundingBox()
          if (!mobileBox || mobileBox.width > 390.5) throw new Error(`mobile: roof-map section overflows viewport (${mobileBox?.width})`)
          await mobileSection.screenshot({ path: `${out}/mobile-${mobileCase.system_id}-section.png` })
          await mobilePage.screenshot({ path: `${out}/mobile-${mobileCase.system_id}-full.png`, fullPage: true })
          await mobileContext.close()
          await browser.close()

          const report = { result: 'PASS', cases: results, mobile: { system_id: mobileCase.system_id, section_width: mobileBox.width }, fatalConsoleErrors: fatalConsole }
          fs.writeFileSync(`${out}/qa-report.json`, JSON.stringify(report, null, 2))
          if (fatalConsole.length) throw new Error(`Browser console errors: ${fatalConsole.join(' | ')}`)
          console.log(JSON.stringify(report, null, 2))
          NODE
      - name: Upload visual QA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roof-map-visual-qa
          path: artifacts/roof-map-qa
          retention-days: 7
