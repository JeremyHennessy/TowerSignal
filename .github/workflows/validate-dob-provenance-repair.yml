name: Validate DOB provenance repair
on:
  push:
    branches: [repair/dob-provenance-20260923]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Targeted provenance tests
        run: npx vitest run tests/frontend/DobPropertyProvenance.test.ts
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Full frontend tests
        run: npm test
