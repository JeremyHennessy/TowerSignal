name: Verify NYC distribution drinking-water quality cache

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/nyc-distribution-water-cache.yml'
      - 'scripts/towersignal/nyc_distribution_water.py'
      - 'scripts/towersignal/fetch.py'
      - 'scripts/build_nyc_distribution_water_cache.py'
      - 'scripts/validate_nyc_distribution_water_cache.py'
      - 'tests/python/test_nyc_distribution_water.py'
      - 'docs/BUILD017H_NYC_DISTRIBUTION_WATER.md'

permissions:
  contents: read

concurrency:
  group: towersignal-nyc-distribution-water-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build exact-count NYC distribution drinking-water cache
        run: python scripts/build_nyc_distribution_water_cache.py --output nyc-distribution-water/cache.json --page-size 50000
      - name: Validate source count, measurement qualifiers and evidence boundary
        run: python scripts/validate_nyc_distribution_water_cache.py --cache nyc-distribution-water/cache.json --max-age-days 1 --require-production-volume
      - name: Run distribution-water tests
        run: python -m unittest tests.python.test_nyc_distribution_water -v
      - name: Upload verified distribution-water cache
        uses: actions/upload-artifact@v4
        with:
          name: towersignal-nyc-distribution-water-cache
          path: nyc-distribution-water/cache.json
          retention-days: 7

  integration:
    if: ${{ github.event_name == 'pull_request' }}
    needs: build-cache
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download verified distribution-water cache
        uses: actions/download-artifact@v4
        with:
          name: towersignal-nyc-distribution-water-cache
          path: .verified-nyc-distribution-water
      - name: Revalidate downloaded cache
        run: python scripts/validate_nyc_distribution_water_cache.py --cache .verified-nyc-distribution-water/cache.json --max-age-days 1 --require-production-volume
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Python tests
        run: python -m unittest discover -s tests/python -p 'test_*.py' -v
      - name: Lint frontend
        run: npm run lint
      - name: Typecheck frontend
        run: npm run typecheck
      - name: Frontend tests
        run: npm test
      - name: Production build
        run: npm run build
