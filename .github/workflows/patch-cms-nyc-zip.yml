name: Patch CMS NYC ZIP boundary

on:
  push:
    branches:
      - agent/cms-nyc-property-diagnostic-20260907
    paths:
      - '.github/workflows/patch-cms-nyc-zip.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cms-nyc-property-diagnostic-20260907
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tighten Queens ZIP ranges
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/diagnose_cms_nyc_facilities.py')
          text = path.read_text()
          old = '        or 11351 <= number <= 11697\n'
          new = '        or 11351 <= number <= 11451\n        or 11691 <= number <= 11697\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one Queens range anchor, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Run exact-property identity regressions
        run: python -m unittest tests.python.test_cms_nyc_facility_diagnostic -v
      - name: Commit corrected boundary
        run: |
          git config user.name 'TowerSignal Diagnostic Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/diagnose_cms_nyc_facilities.py
          git commit -m 'Correct CMS NYC ZIP boundary'
          git push origin HEAD:agent/cms-nyc-property-diagnostic-20260907
