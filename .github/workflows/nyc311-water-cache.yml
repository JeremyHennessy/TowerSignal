name: Verify NYC 311 water service-request cache

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/nyc311-water-cache.yml'
      - 'scripts/towersignal/nyc311_water.py'
      - 'scripts/build_nyc311_water_cache.py'
      - 'scripts/validate_nyc311_water_cache.py'
      - 'tests/python/test_nyc311_water.py'
      - 'docs/BUILD017C_NYC311_WATER.md'

permissions:
  contents: read

concurrency:
  group: towersignal-nyc311-water-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build exact-count NYC 311 water service-request cache
        run: >-
          python scripts/build_nyc311_water_cache.py
          --requests nyc311-water-cache/requests.ndjson.gz
          --properties nyc311-water-cache/properties.ndjson.gz
          --summary nyc311-water-cache/summary.json
          --page-size 50000
      - name: Validate exact source partitions, evidence and BBL profiles
        run: >-
          python scripts/validate_nyc311_water_cache.py
          --requests nyc311-water-cache/requests.ndjson.gz
          --properties nyc311-water-cache/properties.ndjson.gz
          --summary nyc311-water-cache/summary.json
          --max-age-days 1
          --require-production-volume
      - name: Upload verified NYC 311 water cache
        uses: actions/upload-artifact@v4
        with:
          name: towersignal-nyc311-water-cache
          path: nyc311-water-cache/
          retention-days: 7

  integration:
    if: ${{ github.event_name == 'pull_request' }}
    needs: build-cache
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download verified NYC 311 water cache
        uses: actions/download-artifact@v4
        with:
          name: towersignal-nyc311-water-cache
          path: .verified-nyc311-water
      - name: Revalidate downloaded NYC 311 water cache
        run: >-
          python scripts/validate_nyc311_water_cache.py
          --requests .verified-nyc311-water/requests.ndjson.gz
          --properties .verified-nyc311-water/properties.ndjson.gz
          --summary .verified-nyc311-water/summary.json
          --max-age-days 1
          --require-production-volume
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Python tests
        run: python -m unittest discover -s tests/python -p 'test_*.py' -v
      - name: Lint frontend
        run: npm run lint
      - name: Typecheck frontend
        run: npm run typecheck
      - name: Frontend tests
        run: npm test
      - name: Production build
        run: npm run build
