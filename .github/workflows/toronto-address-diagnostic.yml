name: Toronto Address Points Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - agent/toronto-market-20260828
    paths:
      - .github/workflows/toronto-address-diagnostic.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Inspect unresolved POC identities against current Address Points
        shell: python
        run: |
          import csv
          import io
          import urllib.request

          missing_ids = {"14188741", "8127974", "12763885"}
          target_streets = {
              "YORK RD": {"1"},
              "BAY ST": {"10", "20"},
              "LAKE SHORE BLVD W": {"3197", "3199"},
              "HUMBER COLLEGE BLVD": {"89"},
              "ADELAIDE ST W": {"90", "94"},
          }
          url = "https://ckan0.cf.opendata.inter.prod-toronto.ca/dataset/abedd8bc-e3dd-4d45-8e69-79165a76e4fa/resource/64d4e54b-738f-4cd9-a9e7-8050fac8a52f/download/address-points-4326.csv"
          request = urllib.request.Request(url, headers={"User-Agent": "TowerSignal-Toronto-Diagnostic/0.3"})
          with urllib.request.urlopen(request, timeout=120) as response:
              raw = response.read()
          reader = csv.DictReader(io.StringIO(raw.decode("utf-8-sig", errors="replace")))
          id_hits = []
          address_hits = []
          fields = (
              "ADDRESS_POINT_ID", "ADDRESS_POINT_ID_LINK", "ADDRESS_ID", "ADDRESS_ID_LINK",
              "ADDRESS_STRING_ID", "LINEAR_NAME_ID", "CENTRELINE_ID", "ADDRESS_NUMBER",
              "LO_NUM", "HI_NUM", "LINEAR_NAME_FULL", "ADDRESS_FULL", "PLACE_NAME",
              "ADDRESS_STATUS", "MUNICIPALITY", "MUNICIPALITY_NAME"
          )
          for row in reader:
              if row.get("ADDRESS_POINT_ID") in missing_ids:
                  id_hits.append({k: row.get(k) for k in fields})
              street = str(row.get("LINEAR_NAME_FULL") or "").upper()
              number = str(row.get("ADDRESS_NUMBER") or "").upper()
              if street in target_streets and number in target_streets[street]:
                  address_hits.append({k: row.get(k) for k in fields})
          print("MISSING_ID_HITS=", id_hits)
          print("TARGET_ADDRESS_HITS_COUNT=", len(address_hits))
          for hit in address_hits:
              print("TARGET_ADDRESS_HIT=", hit)
