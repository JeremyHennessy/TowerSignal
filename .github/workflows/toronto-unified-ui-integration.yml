name: Toronto Unified UI Integration

on:
  push:
    branches:
      - agent/toronto-unified-20260904
    paths:
      - .github/workflows/toronto-unified-ui-integration.yml

permissions:
  contents: write

jobs:
  integrate-verify-persist:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout unified Toronto release branch
        uses: actions/checkout@v4
        with:
          ref: agent/toronto-unified-20260904
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Import exact verified Benchmarking and commercial export files
        run: |
          git fetch origin 8ae6bb013c1aed5832e68046648b11e398b88016 14c2881dee8d5521dcf7f5003dee4933904b8b92 --no-tags || true
          git checkout 8ae6bb013c1aed5832e68046648b11e398b88016 -- \
            data/toronto/warehouse/current/open_licensed/ontario_ewrb_large_buildings.json \
            data/toronto/warehouse/current/open_licensed/ontario_ewrb_year_repair_report.json \
            public/data/toronto-ewrb-market.json \
            scripts/build_toronto_ewrb_market_context.py \
            scripts/patch_toronto_commercial_export_ui.py \
            scripts/pull_ontario_open_building_environment.py \
            src/components/TorontoBenchmarkingPage.tsx \
            src/components/TorontoParityShell.tsx \
            src/styles/toronto-parity.css \
            src/utils/torontoCommercialExport.ts \
            tests/frontend/TorontoBenchmarkingPage.test.tsx \
            tests/frontend/TorontoCommercialExport.test.ts \
            tests/python/test_ontario_open_building_environment.py \
            tests/python/test_toronto_ewrb_market_context.py

      - name: Import exact verified Monitor files
        run: |
          git checkout 14c2881dee8d5521dcf7f5003dee4933904b8b92 -- \
            public/data/toronto-changes.json \
            scripts/build_toronto_history.py \
            src/components/TorontoMonitorPage.tsx \
            src/styles/toronto-monitor.css \
            src/types/torontoHistory.ts \
            tests/frontend/TorontoMonitorPage.test.tsx \
            tests/frontend/TorontoMonitorShell.test.tsx \
            tests/python/test_toronto_history.py

      - name: Compose Monitor into Benchmarking and commercial shell
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/components/TorontoParityShell.tsx')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              if old not in text:
                  if new in text:
                      return
                  raise SystemExit(f'{label} anchor changed')
              text = text.replace(old, new, 1)

          benchmark_import = "import { TorontoBenchmarkingPage } from './TorontoBenchmarkingPage'\n"
          if "import { TorontoMonitorPage } from './TorontoMonitorPage'" not in text:
              replace_once(benchmark_import, benchmark_import + "import { TorontoMonitorPage } from './TorontoMonitorPage'\n", 'Monitor import')

          replace_once(
              "type TorontoWorkspace = 'market' | 'benchmarking' | 'prospects' | 'opportunities' | 'companies' | 'portfolios' | 'watchlist' | 'sources'",
              "type TorontoWorkspace = 'market' | 'monitor' | 'benchmarking' | 'prospects' | 'opportunities' | 'companies' | 'portfolios' | 'watchlist' | 'sources'",
              'workspace union',
          )
          replace_once(
              "    { value: 'market', label: 'Market' },\n    { value: 'benchmarking', label: 'Benchmarking' },",
              "    { value: 'market', label: 'Market' },\n    { value: 'monitor', label: 'Monitor' },\n    { value: 'benchmarking', label: 'Benchmarking' },",
              'workspace tabs',
          )
          replace_once(
              "    if (view === 'market' || view === 'benchmarking' || payload || error) return",
              "    if (view === 'market' || view === 'monitor' || view === 'benchmarking' || payload || error) return",
              'lazy load guard',
          )
          replace_once(
              "    {view === 'market' ? explorer : <>\n      {view === 'benchmarking' && <TorontoBenchmarkingPage />}\n      {error && view !== 'benchmarking' && <section",
              "    {view === 'market' ? explorer : <>\n      {view === 'monitor' && <TorontoMonitorPage />}\n      {view === 'benchmarking' && <TorontoBenchmarkingPage />}\n      {error && view !== 'monitor' && view !== 'benchmarking' && <section",
              'special workspace render',
          )
          replace_once(
              "      {view !== 'benchmarking' && !error && !payload && <section",
              "      {view !== 'monitor' && view !== 'benchmarking' && !error && !payload && <section",
              'loading guard',
          )
          replace_once(
              "This beta watchlist stays in this browser and does not imply monitoring of source changes.",
              "This beta watchlist stays in this browser. Monitor separately shows verified release-to-release source changes.",
              'watchlist semantics',
          )
          path.write_text(text, encoding='utf-8')

      - name: Verify EWRB and Monitor data contracts
        env:
          PYTHONPATH: .:scripts
        run: |
          python -m unittest \
            tests.python.test_ontario_open_building_environment \
            tests.python.test_toronto_ewrb_market_context \
            tests.python.test_toronto_history -v
          python - <<'PY'
          import json
          from pathlib import Path
          ewrb = json.loads(Path('public/data/toronto-ewrb-market.json').read_text(encoding='utf-8'))
          history = json.loads(Path('public/data/toronto-changes.json').read_text(encoding='utf-8'))
          assert ewrb['scope'] == 'TORONTO_AGGREGATE_ONLY'
          assert ewrb['identity_contract']['property_level_links'] == 0
          assert ewrb['reporting_years'] == [2018, 2019, 2020, 2021, 2022, 2023, 2024]
          assert history['schema_version'] == 'toronto-history-1.0'
          assert history['event_count'] == len(history['events']) == 1809
          assert history['properties_with_changes'] == 917
          print('TORONTO_UNIFIED_AUXILIARY_DATA_CONTRACTS=PASSED')
          PY

      - name: Verify complete Toronto frontend
        run: |
          npm install --no-audit --no-fund
          npm run lint
          npm run typecheck
          npm test -- --run
          VITE_ENABLE_TORONTO=true VITE_TORONTO_PREVIEW=true npm exec vite build -- --base=/ --outDir=dist-toronto-unified-ui

      - name: Verify core Toronto market payload remained on strict parity data
        run: |
          git diff --exit-code 517afead3e9be4f8945439e28e3977f91c956a25 -- public/data/toronto-market.json
          git diff --exit-code 517afead3e9be4f8945439e28e3977f91c956a25 -- data/toronto/market/current/property_spine.json data/toronto/market/current/property_source_links.json data/toronto/market/current/entity_graph.json

      - name: Persist unified Toronto UI and auxiliary data
        run: |
          git config user.name "TowerSignal Toronto Release Bot"
          git config user.email "towersignal-toronto-release@users.noreply.github.com"
          git rm .github/workflows/toronto-unified-ui-integration.yml
          git add \
            data/toronto/warehouse/current/open_licensed/ontario_ewrb_large_buildings.json \
            data/toronto/warehouse/current/open_licensed/ontario_ewrb_year_repair_report.json \
            public/data/toronto-ewrb-market.json \
            public/data/toronto-changes.json \
            scripts/build_toronto_ewrb_market_context.py \
            scripts/patch_toronto_commercial_export_ui.py \
            scripts/pull_ontario_open_building_environment.py \
            scripts/build_toronto_history.py \
            src/components/TorontoBenchmarkingPage.tsx \
            src/components/TorontoMonitorPage.tsx \
            src/components/TorontoParityShell.tsx \
            src/styles/toronto-parity.css \
            src/styles/toronto-monitor.css \
            src/types/torontoHistory.ts \
            src/utils/torontoCommercialExport.ts \
            tests/frontend/TorontoBenchmarkingPage.test.tsx \
            tests/frontend/TorontoCommercialExport.test.ts \
            tests/frontend/TorontoMonitorPage.test.tsx \
            tests/frontend/TorontoMonitorShell.test.tsx \
            tests/python/test_ontario_open_building_environment.py \
            tests/python/test_toronto_ewrb_market_context.py \
            tests/python/test_toronto_history.py
          git diff --cached --quiet && { echo 'No verified unified Toronto UI changes to persist'; exit 1; }
          git commit -m "Toronto: unify Benchmarking, Monitor, and commercial exports"
          git push origin HEAD:agent/toronto-unified-20260904
          echo "TORONTO_UNIFIED_UI_SHA=$(git rev-parse HEAD)"
