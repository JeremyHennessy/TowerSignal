name: Patch OATH first-page timeout fallback

on:
  push:
    branches:
      - agent/oath-first-page-timeout-fallback-20260907
    paths:
      - '.github/workflows/patch-oath-first-page-timeout.yml'
      - 'scripts/_patch_oath_first_page_timeout.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/oath-first-page-timeout-fallback-20260907
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply branch-only OATH patch
        run: python scripts/_patch_oath_first_page_timeout.py
      - name: Run focused OATH regressions
        run: python -m unittest tests.python.test_oath_fetch -v
      - name: Commit validated patch and remove temporary machinery
        run: |
          rm .github/workflows/patch-oath-first-page-timeout.yml
          rm scripts/_patch_oath_first_page_timeout.py
          git config user.name 'TowerSignal Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Fallback when OATH agency scan times out'
          git push origin HEAD:agent/oath-first-page-timeout-fallback-20260907
