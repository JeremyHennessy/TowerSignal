name: Verify Build 016H explicit DBA identity

on:
  push:
    branches: [agent/build016h-explicit-dba-identity]
    paths:
      - 'scripts/towersignal/company_identity.py'
      - 'scripts/towersignal/company_intelligence.py'
      - 'scripts/towersignal/deal_validation.py'
      - 'scripts/validate_deal_validation.py'
      - 'data/fixtures/deal-validation-cohort.json'
      - 'tests/python/test_explicit_dba_identity.py'
      - '.github/workflows/verify-build016h-dba.yml'

permissions:
  contents: read

jobs:
  live-dba-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out last verified Checkbook NYC cache
        uses: actions/checkout@v4
        with:
          ref: data/towersignal-checkbook
          path: .checkbook-store
          fetch-depth: 1
          sparse-checkout: data/checkbook
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch current City Record procurement
        run: python scripts/build_city_record_procurement.py --output public/data/procurement-city-record.json
      - name: Attach and validate durable Checkbook procurement
        run: |
          python scripts/validate_checkbook_cache.py --cache .checkbook-store/data/checkbook/cache.json --max-age-days 2 --require-production-volume
          cp .checkbook-store/data/checkbook/cache.json public/data/procurement-checkbook.json
      - name: Fetch statewide NYS authority procurement
        run: python scripts/build_nys_authority_procurement.py --output public/data/procurement-nys-authorities.json --cohort data/fixtures/deal-validation-cohort.json
      - name: Validate statewide NYS authority procurement
        run: python scripts/validate_nys_authority_procurement.py --input public/data/procurement-nys-authorities.json
      - name: Rebuild company intelligence with explicit DBA aliases
        run: python scripts/build_company_intelligence.py --city-record public/data/procurement-city-record.json --checkbook public/data/procurement-checkbook.json --extra-procurement public/data/procurement-nys-authorities.json --output public/data/companies.json
      - name: Validate company aggregation
        run: python scripts/validate_company_intelligence.py --companies public/data/companies.json --city-record public/data/procurement-city-record.json --checkbook public/data/procurement-checkbook.json --extra-procurement public/data/procurement-nys-authorities.json
      - name: Rebuild deal-validation report
        run: python scripts/build_deal_validation.py --city-record public/data/procurement-city-record.json --checkbook public/data/procurement-checkbook.json --extra-procurement public/data/procurement-nys-authorities.json --cohort data/fixtures/deal-validation-cohort.json --output public/data/deal-validation.json
      - name: Validate revised methodology and holdout lock
        run: python scripts/validate_deal_validation.py --report public/data/deal-validation.json
      - name: Assert and print Tower Water DBA evidence boundary
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('public/data/deal-validation.json').read_text())
          companies = json.loads(Path('public/data/companies.json').read_text())
          tower = next(row for row in report['targets'] if row['id'] == 'tower_water_2026')
          dba_companies = [
              row for row in companies['companies']
              if any(alias.get('resolution_method') == 'EXPLICIT_SOURCE_DBA_ALIAS' and alias.get('alias') == 'Tower Water'
                     for alias in row.get('aliases') or [])
          ]
          if tower['coverage_status'] != 'OBSERVED_IN_CURRENT_SOURCES':
              raise SystemExit('Tower Water was not observed through explicit source DBA evidence')
          if 'EXPLICIT_SOURCE_DBA_ALIAS' not in tower.get('identity_match_methods', []):
              raise SystemExit('Tower Water did not disclose explicit DBA identity match method')
          if not dba_companies:
              raise SystemExit('Company intelligence did not expose Tower Water as an explicit DBA alias')
          gate = report['validation_gate']
          if gate.get('score_authorization_locked') is not True:
              raise SystemExit('Score authorization holdout lock is not active')
          if gate.get('opportunity_score_2_allowed') is not False or gate.get('home_deal_model_allowed') is not False:
              raise SystemExit('Predictive/deal model permission must remain disabled')
          print(json.dumps({
              'summary': report['summary'],
              'validation_gate': gate,
              'tower_water': tower,
              'companies_with_tower_water_explicit_dba_alias': len(dba_companies),
              'explicit_dba_alias_count': companies['summary'].get('explicit_dba_alias_count'),
          }, indent=2, sort_keys=True))
          PY
      - name: Publish Build 016H-A proof
        uses: actions/upload-artifact@v4
        with:
          name: build016h-explicit-dba-proof
          path: |
            public/data/companies.json
            public/data/deal-validation.json
            public/data/procurement-nys-authorities.json
          retention-days: 14
