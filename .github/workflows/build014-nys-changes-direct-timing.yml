name: Build 014 NYS changes timestamp-card timing

on:
  push:
    branches: [agent/build014-nys-changes-timestamp-card-20260826]

permissions:
  contents: read
  actions: read

jobs:
  iphone-direct:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download exact current production data artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: .production-artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 32979767411
      - name: Reuse exact production data
        run: |
          mkdir -p .production-dist public/data .root/TowerSignal
          tar -xf .production-artifact/artifact.tar -C .production-dist
          cp -R .production-dist/data/. public/data/
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build timestamp-card diagnostic candidate
        run: |
          npm run build
          cp -R dist/. .root/TowerSignal/
      - name: Install WebKit
        run: npx playwright install --with-deps webkit
      - name: Serve candidate
        run: |
          python3 -m http.server 4173 --directory .root > /tmp/towersignal.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:4173/TowerSignal/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:4173/TowerSignal/ >/dev/null
      - name: Time raw NYS card plus one formatted timestamp in WebKit
        env:
          BASE_URL: http://localhost:4173/TowerSignal/
        run: npx playwright test tests/e2e/nys-changes-direct-timing.spec.ts --project=iphone --workers=1 --reporter=list
