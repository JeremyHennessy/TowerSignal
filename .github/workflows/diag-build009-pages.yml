name: Diagnostic Build 009 Pages Run

on:
  push:
    branches: [agent/diag-build009-pages]

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Find exact main Pages run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET_SHA: b2dce1fb60b628ef29612bbcb7aafb2baa095601
        run: |
          python - <<'PY'
          import json, os, urllib.request
          repo = os.environ['REPO']
          target = os.environ['TARGET_SHA']
          token = os.environ['GH_TOKEN']
          headers = {'Authorization': f'Bearer {token}', 'Accept': 'application/vnd.github+json'}
          def get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as r:
                  return json.load(r)
          runs = get(f'https://api.github.com/repos/{repo}/actions/runs?branch=main&event=push&per_page=30')['workflow_runs']
          matches = [r for r in runs if r.get('head_sha') == target and r.get('name') == 'Deploy GitHub Pages']
          if not matches:
              raise SystemExit(f'No Deploy GitHub Pages run found for {target}')
          run = matches[0]
          print('RUN', json.dumps({k: run.get(k) for k in ('id','status','conclusion','html_url','head_sha','created_at','updated_at')}, sort_keys=True))
          jobs = get(run['jobs_url'])['jobs']
          for job in jobs:
              print('JOB', json.dumps({'id':job['id'],'name':job['name'],'status':job['status'],'conclusion':job['conclusion']}, sort_keys=True))
          PY
