name: Diagnostic Build 009 Pages Run

on:
  push:
    branches: [agent/diag-build009-pages]
    paths-ignore: [diag-build009-result.json]

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find exact main Pages run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET_SHA: b2dce1fb60b628ef29612bbcb7aafb2baa095601
        run: |
          python - <<'PY'
          import json, os, urllib.request
          repo = os.environ['REPO']
          target = os.environ['TARGET_SHA']
          token = os.environ['GH_TOKEN']
          headers = {'Authorization': f'Bearer {token}', 'Accept': 'application/vnd.github+json'}
          def get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as r:
                  return json.load(r)
          runs = get(f'https://api.github.com/repos/{repo}/actions/runs?branch=main&event=push&per_page=30')['workflow_runs']
          matches = [r for r in runs if r.get('head_sha') == target and r.get('name') == 'Deploy GitHub Pages']
          if not matches:
              raise SystemExit(f'No Deploy GitHub Pages run found for {target}')
          run = matches[0]
          jobs = get(run['jobs_url'])['jobs']
          result = {
              'run': {k: run.get(k) for k in ('id','status','conclusion','html_url','head_sha','created_at','updated_at')},
              'jobs': [{'id':j['id'],'name':j['name'],'status':j['status'],'conclusion':j['conclusion']} for j in jobs],
          }
          open('diag-build009-result.json','w').write(json.dumps(result, indent=2, sort_keys=True))
          print(json.dumps(result, indent=2, sort_keys=True))
          PY
      - name: Commit diagnostic result to disposable branch
        run: |
          git config user.name "TowerSignal Diagnostic Bot"
          git config user.email "actions@users.noreply.github.com"
          git add diag-build009-result.json
          git commit -m "diagnostic: capture Build 009 Pages run [skip ci]" || exit 0
          git push
