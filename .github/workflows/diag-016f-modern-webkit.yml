name: Diagnostic 016F modern WebKit

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/diag-016f-modern-webkit.yml'

permissions:
  contents: read

jobs:
  browser-auth-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install repository dependencies
        run: npm install --no-audit --no-fund
      - name: Overlay current Playwright test harness only
        run: npm install --no-save --no-audit --no-fund @playwright/test@1.62.1
      - name: Install current Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Control — classify deployed Chromium auth persistence
        env:
          BASE_URL: https://jeremyhennessy.github.io/TowerSignal/
        run: npx playwright test tests/e2e/auth-persistence.diag.spec.ts --project=desktop-chromium --no-deps
      - name: Experiment — classify deployed WebKit auth persistence
        if: always()
        env:
          BASE_URL: https://jeremyhennessy.github.io/TowerSignal/
        run: npx playwright test tests/e2e/auth-persistence.diag.spec.ts --project=iphone --no-deps
