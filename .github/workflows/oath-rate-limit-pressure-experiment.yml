name: OATH rate-limit pressure experiment

on:
  push:
    branches:
      - agent/oath-rate-limit-pressure-20260908
    paths:
      - '.github/workflows/oath-rate-limit-pressure-experiment.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/oath-rate-limit-pressure-20260908
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply one request-pressure hypothesis
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^DEFAULT_MAX_WORKERS = 4$' scripts/towersignal/oath.py
          sed -i 's/^DEFAULT_MAX_WORKERS = 4$/DEFAULT_MAX_WORKERS = 2/' scripts/towersignal/oath.py
          grep -q '^DEFAULT_MAX_WORKERS = 2$' scripts/towersignal/oath.py
      - name: Run focused OATH regressions
        run: python -m unittest tests.python.test_oath_fetch -v
      - name: Commit only the tested transport change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'TowerSignal Reliability Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/towersignal/oath.py
          git diff --cached --quiet && exit 0
          git commit -m 'Reduce OATH exact fallback concurrency under rate limiting'
          git push origin HEAD:agent/oath-rate-limit-pressure-20260908
