name: Patch legacy identity audit

on:
  push:
    branches:
      - agent/legacy-dob-bis-diagnostic-20260907
    paths:
      - '.github/workflows/patch-legacy-identity-audit.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/legacy-dob-bis-diagnostic-20260907
      - name: Add registration BBL quality by borough
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/diagnose_legacy_dob_history.py')
          text = path.read_text(encoding='utf-8')
          marker = '''    by_borough = Counter()
          for bbl in legacy_bbls:
              code = bbl.zfill(10)[0]
              by_borough[BOROUGH_NAMES.get(code, "UNKNOWN").title()] += 1

          report = {'''
          replacement = '''    by_borough = Counter()
          for bbl in legacy_bbls:
              code = bbl.zfill(10)[0]
              by_borough[BOROUGH_NAMES.get(code, "UNKNOWN").title()] += 1

          published_systems_by_borough: Counter[str] = Counter()
          systems_with_valid_bbl_by_borough: Counter[str] = Counter()
          systems_without_valid_bbl_by_borough: Counter[str] = Counter()
          bbl_prefix_by_borough: Counter[str] = Counter()
          published_borough_bbl_prefix_mismatch_count = 0
          for row, bbl in zip(systems, system_bbls):
              published = str(row.get("borough") or "UNKNOWN").strip().upper() or "UNKNOWN"
              published_systems_by_borough[published] += 1
              if not bbl:
                  systems_without_valid_bbl_by_borough[published] += 1
                  continue
              systems_with_valid_bbl_by_borough[published] += 1
              prefix_name = BOROUGH_NAMES.get(bbl.zfill(10)[0], "UNKNOWN")
              bbl_prefix_by_borough[prefix_name] += 1
              published_code = BOROUGH_CODES.get(published)
              if published_code is None and published in BOROUGH_NAMES:
                  published_code = published
              if published_code is not None and published_code != bbl.zfill(10)[0]:
                  published_borough_bbl_prefix_mismatch_count += 1

          report = {'''
          marker = marker.replace('          ', '    ')
          replacement = replacement.replace('          ', '    ')
          if marker not in text:
              raise SystemExit('Could not locate borough summary block')
          text = text.replace(marker, replacement, 1)
          old = '''        "borough_breakdown": dict(sorted(by_borough.items())),
          "incremental_examples": {'''.replace('          ', '    ')
          new = '''        "borough_breakdown": dict(sorted(by_borough.items())),
          "registration_identity_quality": {
              "published_systems_by_borough": dict(sorted(published_systems_by_borough.items())),
              "systems_with_valid_bbl_by_published_borough": dict(sorted(systems_with_valid_bbl_by_borough.items())),
              "systems_without_valid_bbl_by_published_borough": dict(sorted(systems_without_valid_bbl_by_borough.items())),
              "valid_bbl_prefix_counts": dict(sorted(bbl_prefix_by_borough.items())),
              "published_borough_bbl_prefix_mismatch_count": published_borough_bbl_prefix_mismatch_count,
          },
          "incremental_examples": {'''.replace('          ', '    ')
          if old not in text:
              raise SystemExit('Could not locate report borough field')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Add identity-quality regression assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/python/test_legacy_dob_bis_diagnostic.py')
          text = path.read_text(encoding='utf-8')
          needle = '        self.assertFalse(report["identity_contract"]["fuzzy_matching_used"])\n'
          addition = '''        self.assertEqual(report["registration_identity_quality"]["published_borough_bbl_prefix_mismatch_count"], 0)
          self.assertEqual(report["registration_identity_quality"]["systems_with_valid_bbl_by_published_borough"], {
              "UNKNOWN": 3,
          })
          '''.replace('          ', '        ')
          if needle not in text:
              raise SystemExit('Could not locate diagnostic assertions')
          text = text.replace(needle, addition + needle, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Run focused tests and commit
        run: |
          python -m unittest tests.python.test_legacy_dob_bis_diagnostic -v
          git config user.name "TowerSignal Diagnostic Bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/diagnose_legacy_dob_history.py tests/python/test_legacy_dob_bis_diagnostic.py
          git commit -m "Audit cooling-tower BBL quality by borough"
          git push origin HEAD:agent/legacy-dob-bis-diagnostic-20260907
