name: Verify all NYC Monitor tables and tabs
on:
  push:
    branches: [agent/nyc-monitor-format-20260915]
permissions:
  contents: read
  actions: read
concurrency:
  group: monitor-format-candidate
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require accepted NYC Priority 1.1 release
        uses: actions/github-script@v7
        with:
          script: |
            const r=(await github.rest.actions.getWorkflowRun({...context.repo,run_id:35034217352})).data;
            if(r.conclusion!=='success'||r.path!=='.github/workflows/nyc-evidence-release.yml') throw new Error('Immediate NYC release is not fully accepted');
      - uses: actions/download-artifact@v4
        with:
          name: nyc-evidence-tested-candidate
          run-id: 35032234529
          github-token: ${{ github.token }}
          path: .baseline/archive
      - name: Preserve and identify actual hosted immediate baseline
        run: |
          mkdir -p .baseline/site proof
          tar -xzf .baseline/archive/candidate.tgz -C .baseline/site
          python scripts/verify_monitor_format.py baseline --site .baseline/site
          cp .baseline/archive/candidate.tgz proof/rollback.tgz
          rm .baseline/archive/*.tgz
      - name: Full source regressions and production build
        run: |
          npm install --no-audit --no-fund
          npm run lint
          npm run typecheck
          npm test
          python -m unittest discover -s tests/python -p 'test_*.py'
          npm run build
      - name: Preserve all source facts and seal Monitor-only presentation candidate
        run: |
          cp -a .baseline/site/data/. dist/data/
          python scripts/verify_monitor_format.py prepare --site dist --baseline .baseline/site --proof proof
          git archive --format=zip HEAD > proof/source.zip
      - run: npx playwright install --with-deps chromium webkit
      - name: Full desktop and iPhone acceptance, every Monitor tab and all-route visual regression
        env:
          CANDIDATE_ROOT: dist
          BASE_URL: https://jeremyhennessy.github.io/TowerSignal/
        run: npm run test:e2e
      - name: Require unchanged production baseline and exact tested bytes
        run: |
          python scripts/verify_monitor_format.py baseline --site .baseline/site
          python scripts/verify_monitor_format.py integrity --site dist --proof proof
          tar -czf proof/candidate.tgz -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: monitor-format-tested-candidate
          path: proof/
          compression-level: 0
          retention-days: 30
      - name: Retain browser evidence even on failed acceptance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitor-format-candidate-browser-proof
          path: |
            playwright-report/
            test-results/
            !test-results/.auth/**
            dist/monitor-format-release.json
          retention-days: 30
