name: Compare HPD seek and offset pagination
on:
  push:
    branches: [audit/full-lineage-20260923-1350]
    paths:
      - docs/audits/2026-09-23/audit_stage37_hpd_pagination.py
      - .github/workflows/audit-stage37-hpd-pagination.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare current seek and offset population
        run: python -u docs/audits/2026-09-23/audit_stage37_hpd_pagination.py
      - name: Persist results
        run: |
          mkdir -p docs/audits/2026-09-23/stage37-hpd-pagination
          cp .audit-stage37/*.json docs/audits/2026-09-23/stage37-hpd-pagination/
          git config user.name "TowerSignal Audit"
          git config user.email "actions@users.noreply.github.com"
          git add docs/audits/2026-09-23/stage37-hpd-pagination
          git commit -m "audit: persist HPD pagination parity proof"
          git pull --rebase origin audit/full-lineage-20260923-1350
          git push origin HEAD:audit/full-lineage-20260923-1350
