      - name: Verify enrichment acceptance
        shell: bash
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -P pager=off <<'SQL'
          DO $$
          DECLARE v_batch integer; v_primary_conflicts integer; v_mapped integer;
          BEGIN
            SELECT count(*) INTO v_batch
            FROM public.company_private_contacts
            WHERE last_change_batch_id='sales-enrichment-tranche1-20260924';
            SELECT count(*) INTO v_primary_conflicts
            FROM (
              SELECT sales_account_id
              FROM public.company_private_contacts
              WHERE active AND primary_contact AND sales_account_id IS NOT NULL
              GROUP BY sales_account_id
              HAVING count(*)>1
            ) x;
            SELECT count(*) INTO v_mapped
            FROM public.company_private_contacts
            WHERE last_change_batch_id='sales-enrichment-tranche1-20260924'
              AND sales_account_id IS NOT NULL;
            IF v_batch < 20 OR v_primary_conflicts <> 0 OR v_mapped <> v_batch THEN
              RAISE EXCEPTION 'Enrichment acceptance failed batch=% conflicts=% mapped=%',v_batch,v_primary_conflicts,v_mapped;
            END IF;
          END $$;

          SELECT 'SALES_ENRICHMENT_TRANCHE1=PASS' AS result,
                 (SELECT count(*) FROM public.company_private_contacts) AS total_contacts,
                 (SELECT count(*) FROM public.company_private_contacts WHERE last_change_batch_id='sales-enrichment-tranche1-20260924') AS tranche_contacts,
                 (SELECT count(*) FROM public.company_private_contacts WHERE active AND primary_contact) AS primary_contacts,
                 (SELECT count(*) FROM public.company_private_contacts WHERE active AND contact_role IN ('decision-maker','executive','champion')) AS buying_contacts;
          SQL
