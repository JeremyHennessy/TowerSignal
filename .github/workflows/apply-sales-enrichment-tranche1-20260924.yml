        shell: bash
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -P pager=off <<'SQL'
          DO $$
          DECLARE v_accounts integer; v_users integer; v_admins integer;
          BEGIN
            SELECT count(*) INTO v_accounts
            FROM public.company_sales_accounts
            WHERE sales_account_id IN (
              'sales-account-23384e4c27d8d4c717bd',
              'sales-account-414c1fd143a3f77e9309',
              'sales-account-32209d8221aab24730e0',
              'sales-account-9af56529abd9946c378f',
              'sales-account-b1bbc3219867e8d1c0ba',
              'sales-account-454f9e82f6552a974d1b',
              'sales-account-b5adc85c07b325599f45',
              'sales-account-be31e5f5fd42d12a6cc6',
              'sales-account-545269f3100ddda7327c',
              'sales-account-fd51dd8485f84b0cbd0a',
              'sales-account-42494fec2d9099ba11b5'
            ) AND record_status='active';
            SELECT count(*) INTO v_users FROM neon_auth."user";
            SELECT count(*) INTO v_admins FROM neon_auth."user" WHERE lower(coalesce(role,''))='admin';
            IF v_accounts <> 11 OR v_users <> 2 OR v_admins <> 2 THEN
              RAISE EXCEPTION 'Enrichment guard failed accounts=% users=% admins=%',v_accounts,v_users,v_admins;
            END IF;
          END $$;
          SELECT 'SALES_ENRICHMENT_PRECHECK=PASS' AS result,
                 (SELECT count(*) FROM public.company_private_contacts) AS contacts;
          SQL

