name: Dispatch reviewed Blob publisher acceptance

on:
  push:
    branches: [agent/blob-publisher-control-20260911]
    paths: [.github/workflows/dispatch-blob-publisher.yml]

permissions:
  contents: read
  pull-requests: read
  actions: write

concurrency:
  group: dispatch-reviewed-blob-publisher
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # No checkout, Azure environment, storage key, data transfer or site deployment here.
      - uses: actions/github-script@v7
        with:
          script: |
            const repo = {owner: 'JeremyHennessy', repo: 'TowerSignal'};
            const mainSha = 'bc29f20b4be89989ce7b29c781944e722fc4fd2a';
            const headSha = '1ad648b8a30e043eb71e8eb97adf509431b1a2c1';
            const workflow = 'azure-data-publish.yml';
            if (context.ref !== 'refs/heads/agent/blob-publisher-control-20260911' ||
                context.repo.owner !== repo.owner || context.repo.repo !== repo.repo) {
              throw new Error('Unexpected acceptance dispatch context');
            }
            const main = (await github.rest.git.getRef({...repo, ref: 'heads/main'})).data;
            if (main.object.sha !== mainSha) throw new Error('Main moved before dispatch');
            const pr = (await github.rest.pulls.get({...repo, pull_number: 224})).data;
            if (!pr.merged || pr.head.sha !== headSha || pr.merge_commit_sha !== mainSha) {
              throw new Error('PR 224 is not the exact reviewed merge');
            }
            const ci = (await github.rest.actions.getWorkflowRun({...repo, run_id: 34599466511})).data;
            if (ci.head_sha !== headSha || ci.status !== 'completed' || ci.conclusion !== 'success') {
              throw new Error('Exact publisher CI has not succeeded');
            }
            for (const [path, sha] of [
              ['.github/workflows/' + workflow, 'bb55519a27a5efa86a9e3fc73721f6c3b3960a70'],
              ['scripts/blob_release_store.py', '12b8534505534902dc9c0e19a382476d28ba7148'],
              ['scripts/publish_pages_to_blob.py', 'ee8de7317819cf4a4da855bf3a839c3b4812551c']
            ]) {
              const file = (await github.rest.repos.getContent({...repo, path, ref: mainSha})).data;
              if (file.type !== 'file' || file.sha !== sha) throw new Error('Reviewed publisher file changed');
            }
            const runs = (await github.rest.actions.listWorkflowRuns({...repo, workflow_id: workflow,
              head_sha: mainSha, event: 'workflow_dispatch', per_page: 100})).data;
            if (runs.total_count > 0) {
              core.info('An acceptance run already exists for this exact merge; no duplicate requested');
              return;
            }
            const current = (await github.rest.git.getRef({...repo, ref: 'heads/main'})).data;
            if (current.object.sha !== mainSha) throw new Error('Main moved during validation');
            await github.rest.actions.createWorkflowDispatch({...repo, workflow_id: workflow,
              ref: 'main', inputs: {operation: 'bootstrap'}});
            core.info('Requested reviewed bootstrap only. This is not an Azure success result.');
