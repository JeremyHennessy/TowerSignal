name: Audit DOB job work-type classification context
on:
  push:
    branches: [audit/full-lineage-20260923-1350]
    paths:
      - docs/audits/2026-09-23/audit_dob_job_worktypes.py
      - .github/workflows/audit-stage8-dob-worktypes.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Quantify work-type information loss
        run: python -u docs/audits/2026-09-23/audit_dob_job_worktypes.py
      - name: Persist results
        run: |
          mkdir -p docs/audits/2026-09-23/stage8-dob-worktypes
          cp .audit-stage8/*.json docs/audits/2026-09-23/stage8-dob-worktypes/
          git config user.name "TowerSignal Audit"
          git config user.email "actions@users.noreply.github.com"
          git add docs/audits/2026-09-23/stage8-dob-worktypes
          git commit -m "audit: persist DOB work-type classification audit"
          git pull --rebase origin audit/full-lineage-20260923-1350
          git push origin HEAD:audit/full-lineage-20260923-1350
