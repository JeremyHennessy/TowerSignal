name: Build 011 live history proof

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  prove-live-dob-history:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Check out durable TowerSignal history
        uses: actions/checkout@v4
        with:
          ref: data/towersignal-history
          path: .history-store
          fetch-depth: 1
          sparse-checkout: data/history
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and generate current NYC data
        run: python scripts/build_data.py --output public/data
      - name: Validate current source-health coverage
        run: python scripts/build_source_health.py --output public/data --previous-snapshot .history-store/data/history/latest.json
      - name: Build first DOB-aware historical observation
        run: python scripts/build_history.py --output public/data --previous-snapshot .history-store/data/history/latest.json --previous-events .history-store/data/history/events.json
      - name: Enforce durable history size and growth gates
        run: python scripts/validate_history_store.py --current public/data/history/latest.json --previous .history-store/data/history/latest.json
      - name: Prove migration is a silent DOB baseline
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          latest_path = Path('public/data/history/latest.json')
          changes_path = Path('public/data/changes.json')
          previous_path = Path('.history-store/data/history/latest.json')
          latest = json.loads(latest_path.read_text())
          changes = json.loads(changes_path.read_text())
          previous = json.loads(previous_path.read_text())

          previous_markers = sum(1 for row in previous.get('systems', []) if row.get('dob_history_initialized'))
          current_markers = sum(1 for row in latest.get('systems', []) if row.get('dob_history_initialized'))
          current_dob_filings = sum(len(row.get('dob_jobs') or {}) for row in latest.get('systems', []))
          detected_at = changes['observed_at']
          new_dob_events = [
              event for event in changes.get('events', [])
              if event.get('detected_at') == detected_at and str(event.get('event_type', '')).startswith('DOB_')
          ]
          size_bytes = latest_path.stat().st_size

          print(json.dumps({
              'previous_dob_markers': previous_markers,
              'current_dob_markers': current_markers,
              'current_system_count': len(latest.get('systems', [])),
              'durable_per_system_dob_filing_states': current_dob_filings,
              'new_dob_event_count': len(new_dob_events),
              'history_size_bytes': size_bytes,
              'history_size_mib': round(size_bytes / 1024 / 1024, 2),
          }, indent=2))

          assert previous_markers == 0, 'Expected preserved Build 010/010.1 history to predate DOB event baselining'
          assert current_markers == len(latest.get('systems', [])), 'Every current system must carry the DOB baseline marker'
          assert current_dob_filings > 0, 'Live DOB filing state was not attached to history'
          assert not new_dob_events, f'First DOB-aware refresh emitted synthetic DOB events: {new_dob_events[:3]}'
          PY
