name: Validate DOB provenance current repair
on:
  push:
    branches: [fix/dob-provenance-current-20260923]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx vitest run tests/frontend/DobPropertyProvenance.test.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
