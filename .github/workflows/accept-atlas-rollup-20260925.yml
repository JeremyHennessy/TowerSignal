name: Accept Atlas reviewed roll-up

on:
  push:
    branches:
      - ops/accept-atlas-rollup-20260925
    paths:
      - 'database/ops/accept_atlas_rollup_20260925.sql'
      - '.github/workflows/accept-atlas-rollup-20260925.yml'

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.TOWERSIGNAL_DATABASE_URL_UNPOOLED }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply evidence-reviewed Atlas roll-up
        shell: bash
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -P pager=off -f database/ops/accept_atlas_rollup_20260925.sql
