name: Verify reconciled NYC evidence candidate
on:
  push:
    branches: [agent/nyc-completion-20260915]
permissions:
  contents: read
  actions: read
concurrency:
  group: nyc-evidence-candidate
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require accepted Source Health runtime
        uses: actions/github-script@v7
        with:
          script: |
            const r=(await github.rest.actions.getWorkflowRun({...context.repo,run_id:35027760290})).data;
            if(r.conclusion!=='success'||r.path!=='.github/workflows/source-health-release.yml') throw new Error('Source Health baseline is not accepted');
      - uses: actions/download-artifact@v4
        with:
          name: source-health-candidate
          run-id: 35025802101
          github-token: ${{ github.token }}
          path: .baseline/archive
      - name: Preserve exact still-hosted rollback runtime
        run: |
          (cd .baseline/archive && sha256sum --check source-health-candidate.tar.sha256)
          mkdir -p .baseline/site proof
          tar -xf .baseline/archive/source-health-candidate.tar -C .baseline/site
          python scripts/verify_nyc_evidence_release.py baseline --site .baseline/site
          gzip -1 -c .baseline/archive/source-health-candidate.tar > proof/rollback.tgz
          rm .baseline/archive/*.tar
      - name: Test source and frontend changes
        run: |
          npm install --no-audit --no-fund
          npm run lint
          npm run typecheck
          npm test
          python -m unittest discover -s tests/python -p 'test_*.py'
          npm run build
      - name: Attach reviewed scores without rewriting source facts or the Home match index
        run: |
          cp -a .baseline/site/data/. dist/data/
          python scripts/build_coverage_audit.py --output dist/data
          python scripts/attach_reviewed_intelligence.py --output dist/data
          python scripts/validate_reviewed_intelligence.py --output dist/data --baseline .baseline/site/data
          python - <<'PYREPEAT'
          import hashlib,json,pathlib,sys
          sys.path.insert(0,'scripts')
          from attach_reviewed_intelligence import attach
          root=pathlib.Path('dist/data')
          def hashes():
              result={}
              for p in root.rglob('*'):
                  if p.is_file():
                      with p.open('rb') as f: result[str(p.relative_to(root))]=hashlib.file_digest(f,'sha256').hexdigest()
              return result
          before=hashes()
          attach(root)
          after=hashes()
          assert before==after, 'Repeat attachment changed generated output'
          pathlib.Path('proof/repeatability.json').write_text(json.dumps({'files_checked':len(before),'changed_files':0,'repeat_attachment_byte_identical':True},indent=2)+'\n')
          print('Repeat attachment: every runtime data file is byte-identical',len(before))
          PYREPEAT
          python scripts/verify_nyc_evidence_release.py seal --site dist --proof proof
      - run: npx playwright install --with-deps chromium webkit
      - name: Candidate desktop and iPhone acceptance with all route and tab screenshots
        env:
          CANDIDATE_ROOT: dist
          BASE_URL: https://jeremyhennessy.github.io/TowerSignal/
        run: npm run test:e2e
      - name: Preserve unchanged baseline and exact tested candidate
        run: |
          python scripts/verify_nyc_evidence_release.py baseline --site .baseline/site
          python scripts/verify_nyc_evidence_release.py integrity --site dist --proof proof
          tar -czf proof/candidate.tgz -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: nyc-evidence-tested-candidate
          path: proof/
          retention-days: 30
      - name: Retain browser, model and source proof even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nyc-evidence-candidate-proof
          path: |
            playwright-report/
            test-results/
            !test-results/.auth/**
            source-health-proof/
            dist/data/priority-model-review.json
            dist/nyc-evidence-release.json
          retention-days: 30
