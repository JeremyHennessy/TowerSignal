name: Release obsolete Monitor proof queue
on:
  push:
    branches: [work/monitor-obsolete-run-20260915]
permissions:
  contents: read
  actions: write
jobs:
  cancel-obsolete-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Cancel only superseded candidate, never a production release
        uses: actions/github-script@v7
        with:
          script: |
            const old=(await github.rest.actions.getWorkflowRun({...context.repo,run_id:35042084621})).data;
            const next=(await github.rest.actions.getWorkflowRun({...context.repo,run_id:35042108468})).data;
            const ref=(await github.rest.git.getRef({...context.repo,ref:'heads/agent/nyc-monitor-format-20260915'})).data;
            const path='.github/workflows/monitor-format-candidate.yml';
            if(old.path!==path||old.head_sha!=='415138ac948380b89fc986221723d15f6c32e5a0'||next.path!==path||next.head_sha!=='f4d3872ae5d942ea6798d9e6c860004b6277acad'||ref.object.sha!==next.head_sha) throw new Error('Candidate identity changed; no cancellation');
            const proof={obsolete_run:old.id,obsolete_head:old.head_sha,obsolete_status:old.status,replacement_run:next.id,replacement_head:next.head_sha,reason:'Fresh 320px context was correctly sized but unauthenticated because WebKit keeps the signed-in user in tab memory when the cross-site cookie is blocked. Replacement authenticates the same existing E2E account inside the fresh 320px context and retains all UI/data assertions.'};
            if(old.status!=='completed') {
              await github.rest.actions.cancelWorkflowRun({...context.repo,run_id:old.id});
              proof.cancellation_requested=true;
            }
            require('fs').writeFileSync('queue-repair.json',JSON.stringify(proof,null,2));
            core.info(JSON.stringify(proof));
      - uses: actions/upload-artifact@v4
        with:
          name: monitor-proof-queue-repair
          path: queue-repair.json
          retention-days: 7
