name: Toronto AIC Transport Windows

on:
  push:
    branches:
      - agent/toronto-market-20260828
    paths:
      - .github/workflows/toronto-aic-transport-windows.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe current and numeric AIC transports and inspect current JS assets
        shell: python
        run: |
          import html, re, urllib.parse, urllib.request

          headers={
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36',
            'Accept':'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',
            'Accept-Language':'en-CA,en;q=0.9',
          }
          tests=[
            ('current_40_bushby','https://www.toronto.ca/city-government/planning-development/application-details/?id=5565655&pid=881473&title=40-BUSHBY-DR'),
            ('numeric_40_bushby','https://app.toronto.ca/DevelopmentApplications/associatedApplicationsList.do?action=init&folderRsn=5565655&isCofASearch=false&isTlabSearch=false'),
            ('numeric_old_known','https://app.toronto.ca/DevelopmentApplications/associatedApplicationsList.do?action=init&folderRsn=3689514&isCofASearch=false&isTlabSearch=false'),
            ('numeric_69_old_mill','https://app.toronto.ca/DevelopmentApplications/associatedApplicationsList.do?action=init&folderRsn=5744189&isCofASearch=false&isTlabSearch=false'),
            ('aic_numeric_40_bushby','https://app.toronto.ca/AIC/index.do?folderRsn=5565655'),
          ]
          page_body=''
          for name,url in tests:
            try:
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=45) as response:
                body=response.read(5_000_000).decode('utf-8',errors='replace')
                print('TEST=',name,'STATUS=',response.status,'FINAL=',response.geturl(),'TYPE=',response.headers.get('content-type'),'BYTES=',len(body))
                print('SNIP=',re.sub(r'\s+',' ',body[:5000])[:2000])
                print('ATTACHMENT_RSNS=',re.findall(r'attachmentRsn[=\\"\']+([0-9]+)',body,re.I)[:20])
                print('SUPPORTING_LINKS=',re.findall(r'href=[\\"\']([^\\"\']*(?:Supporting|attachmentRsn|viewSupportingDocs)[^\\"\']*)',body,re.I)[:20])
                if name=='current_40_bushby': page_body=body
            except Exception as exc:
              print('TEST_ERROR=',name,type(exc).__name__,str(exc))

          if page_body:
            current='https://www.toronto.ca/city-government/planning-development/application-details/?id=5565655&pid=881473&title=40-BUSHBY-DR'
            scripts=[]
            for raw in re.findall(r'<script[^>]+src=[\"\']([^\"\']+)',page_body,re.I):
              src=urllib.parse.urljoin(current,html.unescape(raw))
              if src not in scripts: scripts.append(src)
            print('SCRIPT_COUNT=',len(scripts))
            patterns=('application-details','folderrsn','propertyrsn','aic','supporting','document','attachment','/api/','wp-json','FeatureServer/60')
            for src in scripts:
              try:
                req=urllib.request.Request(src,headers={'User-Agent':headers['User-Agent'],'Accept':'*/*'})
                with urllib.request.urlopen(req,timeout=45) as response:
                  data=response.read(12_000_000).decode('utf-8',errors='replace')
              except Exception as exc:
                print('SCRIPT_ERROR=',src,type(exc).__name__,str(exc)); continue
              low=data.lower()
              hits=[p for p in patterns if p.lower() in low]
              if not hits: continue
              print('SCRIPT_MATCH=',src,'BYTES=',len(data),'HITS=',hits)
              for p in hits:
                pos=low.find(p.lower()); start=max(0,pos-1200); end=min(len(data),pos+2600)
                print('CONTEXT_PATTERN=',p,'CONTEXT=',re.sub(r'\s+',' ',data[start:end])[:5000])
