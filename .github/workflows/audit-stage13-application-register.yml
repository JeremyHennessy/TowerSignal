name: Build deduplicated application-field register
on:
  push:
    branches: [audit/full-lineage-20260923-1350]
    paths:
      - docs/audits/2026-09-23/build_stage13_application_register.mjs
      - .github/workflows/audit-stage13-application-register.yml
permissions:
  contents: write
jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install parser dependency
        run: npm install --no-audit --no-fund
      - name: Build current runtime application register
        run: node docs/audits/2026-09-23/build_stage13_application_register.mjs
      - name: Persist results
        run: |
          mkdir -p docs/audits/2026-09-23/stage13-application-register
          cp .audit-stage13/*.json docs/audits/2026-09-23/stage13-application-register/
          git config user.name "TowerSignal Audit"
          git config user.email "actions@users.noreply.github.com"
          git add docs/audits/2026-09-23/stage13-application-register
          git commit -m "audit: persist deduplicated application-field register"
          git pull --rebase origin audit/full-lineage-20260923-1350
          git push origin HEAD:audit/full-lineage-20260923-1350
