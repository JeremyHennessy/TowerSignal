name: Account PDF isolated workbench
on:
  push:
    branches: [agent/approved-account-pdf-20260922]
    paths: [.github/workflows/account-pdf-workbench.yml]
permissions:
  contents: read
jobs:
  workbench:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Package isolated source and installed toolchain (no credentials)
        run: tar -czf /tmp/account-pdf-workbench.tar.gz src tests scripts config public package.json package-lock.json node_modules index.html vite.config.ts tsconfig*.json eslint.config.js playwright*.ts .github/workflows
      - uses: actions/upload-artifact@v4
        with:
          name: account-pdf-workbench
          path: /tmp/account-pdf-workbench.tar.gz
          retention-days: 1
