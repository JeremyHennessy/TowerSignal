name: Account PDF isolated workbench
on:
  push:
    branches: [agent/approved-account-pdf-20260922]
    paths: [.github/workflows/account-pdf-workbench.yml, scripts/prepare-account-report-fonts.mjs]
permissions:
  contents: read
jobs:
  workbench:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/prepare-account-report-fonts.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: account-pdf-report-assets
          path: public/report-assets
          retention-days: 1
