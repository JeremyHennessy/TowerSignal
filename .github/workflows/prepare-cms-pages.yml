name: Prepare CMS Pages integration

on:
  push:
    branches:
      - agent/cms-institutional-current-main-20260907
    paths:
      - '.github/workflows/prepare-cms-pages.yml'
      - 'scripts/_patch_cms_pages.py'

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate patched Pages workflow
        run: python scripts/_patch_cms_pages.py
      - name: Assert CMS production steps are present
        run: |
          grep -q 'Build exact-BBL CMS institutional facility context' .github/workflows/pages.yml
          grep -q 'Validate CMS institutional facility context' .github/workflows/pages.yml
          grep -q 'Attach exact-BBL CMS institutional facility context' .github/workflows/pages.yml
      - uses: actions/upload-artifact@v4
        with:
          name: cms-pages-workflow
          path: .github/workflows/pages.yml
          retention-days: 7
