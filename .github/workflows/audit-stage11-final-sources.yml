name: Build final unresolved source-field ledger
on:
  push:
    branches: [audit/full-lineage-20260923-1350]
    paths:
      - docs/audits/2026-09-23/build_stage11_final_sources.py
      - .github/workflows/audit-stage11-final-sources.yml
permissions:
  contents: write
jobs:
  ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build remaining source-field ledger
        run: python -u docs/audits/2026-09-23/build_stage11_final_sources.py
      - name: Persist results
        run: |
          mkdir -p docs/audits/2026-09-23/stage11-final-sources
          cp .audit-stage11/*.json docs/audits/2026-09-23/stage11-final-sources/
          git config user.name "TowerSignal Audit"
          git config user.email "actions@users.noreply.github.com"
          git add docs/audits/2026-09-23/stage11-final-sources
          git commit -m "audit: persist final unresolved source-field ledger"
          git pull --rebase origin audit/full-lineage-20260923-1350
          git push origin HEAD:audit/full-lineage-20260923-1350
