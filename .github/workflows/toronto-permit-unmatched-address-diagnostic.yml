name: Toronto Permit Unmatched Address Diagnostic

on:
  push:
    branches:
      - agent/toronto-building-permit-diagnostic-20260903
    paths:
      - .github/workflows/toronto-permit-unmatched-address-diagnostic.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4

      - name: Resolve unmatched permit addresses against current Address Points
        shell: python
        run: |
          import csv
          import io
          import json
          import urllib.request

          permit_geo_ids = {"9344875", "6387861", "8127974"}
          targets = {
              ("100", "EMMETT AVE"),
              ("951", "CARLAW AVE"),
              ("89", "HUMBER COLLEGE BLVD"),
          }
          url = "https://ckan0.cf.opendata.inter.prod-toronto.ca/dataset/abedd8bc-e3dd-4d45-8e69-79165a76e4fa/resource/64d4e54b-738f-4cd9-a9e7-8050fac8a52f/download/address-points-4326.csv"
          request = urllib.request.Request(url, headers={"User-Agent": "TowerSignal-Permit-Address-Diagnostic/1.0"})
          with urllib.request.urlopen(request, timeout=180) as response:
              raw = response.read()
          reader = csv.DictReader(io.StringIO(raw.decode("utf-8-sig", errors="replace")))
          fieldnames = reader.fieldnames or []
          print("ADDRESS_POINT_FIELDS=", json.dumps(fieldnames))
          hits = []
          for row in reader:
              apid = str(row.get("ADDRESS_POINT_ID") or "").strip()
              number = str(row.get("ADDRESS_NUMBER") or row.get("LO_NUM") or "").strip().upper()
              street = str(row.get("LINEAR_NAME_FULL") or "").strip().upper()
              if apid in permit_geo_ids or (number, street) in targets:
                  hits.append({field: row.get(field) for field in fieldnames})
          print("MATCH_COUNT=", len(hits))
          for hit in hits:
              print("MATCH=", json.dumps(hit, ensure_ascii=False, sort_keys=True))
