name: Validate company DB migration

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/company-db-activation-20260923.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.TOWERSIGNAL_DATABASE_URL_UNPOOLED }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify direct production connection
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DATABASE_URL:-}" || { echo "DATABASE_URL_SECRET=MISSING"; exit 2; }
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atc "select 'DATABASE_CONNECTION=OK', current_database(), current_user;"

      - name: Validate migration and roll back
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'BEGIN;'
            cat database/migrations/002_company_database.sql
            echo 'ROLLBACK;'
          } | psql "$DATABASE_URL" -v ON_ERROR_STOP=1
          echo "MIGRATION_ROLLBACK_VALIDATION=PASS"

      - name: Confirm production schema unchanged
        shell: bash
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atc "select to_regclass('public.company_private_profiles') is null, to_regclass('public.company_admin_access') is null;"
