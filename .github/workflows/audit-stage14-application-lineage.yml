name: Build application-expression lineage classes
on:
  push:
    branches: [audit/full-lineage-20260923-1350]
    paths:
      - docs/audits/2026-09-23/build_stage14_application_lineage.py
      - .github/workflows/audit-stage14-application-lineage.yml
permissions:
  contents: write
jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Classify application expression lineage
        run: python -u docs/audits/2026-09-23/build_stage14_application_lineage.py
      - name: Persist results
        run: |
          mkdir -p docs/audits/2026-09-23/stage14-application-lineage
          cp .audit-stage14/*.json docs/audits/2026-09-23/stage14-application-lineage/
          git config user.name "TowerSignal Audit"
          git config user.email "actions@users.noreply.github.com"
          git add docs/audits/2026-09-23/stage14-application-lineage
          git commit -m "audit: persist application-expression lineage classes"
          git pull --rebase origin audit/full-lineage-20260923-1350
          git push origin HEAD:audit/full-lineage-20260923-1350
