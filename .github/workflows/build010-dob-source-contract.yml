name: Build 010 live DOB integration

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live-dob-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build full live TowerSignal data with DOB NOW enrichment
        run: python scripts/build_data.py --output /tmp/towersignal-data

      - name: Validate source-health attachment on live build
        run: python scripts/build_source_health.py --output /tmp/towersignal-data

      - name: Verify generated DOB payload integrity
        shell: python
        run: |
          import json
          from pathlib import Path

          root = Path('/tmp/towersignal-data')
          payload = json.loads((root / 'systems.json').read_text())
          metadata = payload['metadata']
          summary = payload['summary']
          systems = payload['systems']

          required_metadata = (
              'dob_requested_bbl_count',
              'dob_matched_bbl_count',
              'dob_matched_filing_count',
              'dob_explicit_cooling_tower_filing_count',
              'dob_mechanical_or_boiler_filing_count',
          )
          missing = [key for key in required_metadata if key not in metadata]
          if missing:
              raise SystemExit(f'Missing DOB metadata fields: {missing}')
          if metadata['dob_requested_bbl_count'] <= 0:
              raise SystemExit('DOB join requested zero BBLs')
          if metadata['dob_matched_bbl_count'] <= 0 or metadata['dob_matched_filing_count'] <= 0:
              raise SystemExit('DOB exact-BBL join produced no live matches')
          if summary.get('systems_with_dob_activity', 0) <= 0:
              raise SystemExit('Generated summary has no systems with DOB activity')

          candidate = next((row for row in systems if row.get('dob_activity_count', 0) > 0), None)
          if candidate is None:
              raise SystemExit('No generated system carries DOB activity counts')
          safe = ''.join(ch for ch in candidate['system_id'] if ch.isalnum() or ch in ('-', '_'))
          detail_path = root / 'details' / (safe[:2] or 'xx').lower() / f'{safe}.json'
          detail = json.loads(detail_path.read_text())
          jobs = detail.get('dob_activity_history') or []
          if not jobs:
              raise SystemExit(f"DOB summary/detail attachment mismatch for {candidate['system_id']}")
          if not all(job.get('match_basis') == 'BBL_EXACT' for job in jobs):
              raise SystemExit(f"Non-exact DOB match basis found for {candidate['system_id']}")

          source_health = {entry['source_key']: entry for entry in metadata.get('source_health', [])}
          dob_health = source_health.get('dob_now_jobs')
          if not dob_health or dob_health.get('status') == 'FAILED':
              raise SystemExit(f'DOB source-health missing or failed: {dob_health}')
          if dob_health.get('attached_entity_count', 0) <= 0 or dob_health.get('displayed_entity_count', 0) <= 0:
              raise SystemExit(f'DOB source-health attachment/display proof failed: {dob_health}')

          print(json.dumps({
              'registered_systems': summary['registered_systems'],
              'requested_bbls': metadata['dob_requested_bbl_count'],
              'matched_bbls': metadata['dob_matched_bbl_count'],
              'matched_filings': metadata['dob_matched_filing_count'],
              'explicit_cooling_tower_filings': metadata['dob_explicit_cooling_tower_filing_count'],
              'mechanical_or_boiler_filings': metadata['dob_mechanical_or_boiler_filing_count'],
              'systems_with_dob_activity': summary.get('systems_with_dob_activity', 0),
              'systems_with_recent_dob_activity': summary.get('systems_with_recent_dob_activity', 0),
              'systems_with_explicit_cooling_tower_dob_activity': summary.get('systems_with_explicit_cooling_tower_dob_activity', 0),
              'sample_system_id': candidate['system_id'],
              'sample_system_dob_jobs': len(jobs),
              'dob_source_health': dob_health,
          }, indent=2))
