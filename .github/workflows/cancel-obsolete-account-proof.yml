name: Cancel obsolete Account proof
on:
  push:
    branches: [agent/account-unblock-harness-20260918]
    paths: [.github/workflows/cancel-obsolete-account-proof.yml]
permissions:
  actions: write
  contents: read
jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel only the superseded Account delivery proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST repos/JeremyHennessy/TowerSignal/actions/runs/35379736291/cancel || true
          echo "Superseded b96eaf6 proof cancelled; current exact head is 18c21ea5f7e536fb94479ef8c8ac4065045597f4."
