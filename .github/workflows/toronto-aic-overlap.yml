name: Toronto AIC Overlap

on:
  push:
    branches:
      - agent/toronto-market-20260828
    paths:
      - .github/workflows/toronto-aic-overlap.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  overlap:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [4, 5, 6, 7]
    steps:
      - name: Checkout exact overlap head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF parser
        run: python -m pip install --disable-pip-version-check 'pypdf>=5,<7'
      - name: Restore verified Toronto core artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/toronto/market/current
          gh run download 33214362483 --repo JeremyHennessy/TowerSignal --name toronto-market-core --dir data/toronto/market/current
      - name: Parse queued AIC shard at conservative overlap concurrency
        run: python scripts/toronto_aic_corpus.py --shard-index ${{ matrix.shard }} --shard-count 8 --workers 1
      - name: Upload overlapped AIC shard
        uses: actions/upload-artifact@v4
        with:
          name: toronto-aic-overlap-shard-${{ matrix.shard }}
          path: data/toronto/market/current/work/aic_corpus_shard_${{ matrix.shard }}.json
          retention-days: 30

  handoff:
    needs: overlap
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Wait until original shards 0-3 are safely uploaded
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 240); do
            names="$(gh api 'repos/JeremyHennessy/TowerSignal/actions/runs/33214362483/artifacts?per_page=100' --jq '.artifacts[].name' || true)"
            count=0
            for shard in 0 1 2 3; do
              if grep -Fxq "toronto-aic-shard-${shard}" <<<"$names"; then count=$((count+1)); fi
            done
            echo "Original reusable AIC shards 0-3: $count/4"
            if [ "$count" -eq 4 ]; then exit 0; fi
            status="$(gh api 'repos/JeremyHennessy/TowerSignal/actions/runs/33214362483' --jq '.status')"
            if [ "$status" = "completed" ]; then
              echo 'Original run completed before four reusable first-wave shards were available.' >&2
              exit 1
            fi
            sleep 60
          done
          echo 'Timed out waiting for original AIC shards 0-3.' >&2
          exit 1
      - name: Cancel redundant second-wave original run and superseded finalizer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run cancel 33214362483 --repo JeremyHennessy/TowerSignal || true
          gh run cancel 33216236368 --repo JeremyHennessy/TowerSignal || true
          echo 'Reusable shards are secured; redundant workflows cancellation requested.'
