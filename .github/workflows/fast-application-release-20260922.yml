name: Deploy Account header application-only release

on:
  push:
    branches:
      - agent/account-header-format-20260922
      - main
    paths:
      - .github/workflows/fast-application-release-20260922.yml
      - src/main.tsx
      - src/styles/account-header.css
      - tests/e2e/account-header.spec.ts

permissions:
  contents: read
  actions: write
  pages: write
  id-token: write

concurrency:
  group: fast-application-release-20260922
  cancel-in-progress: true

env:
  VITE_REPORT_APPLICATION_SHA: ${{ github.sha }}
  EXPECTED_REPORT_SHA: ${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stop the competing full-data release after the main promotion
        if: github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const runs=(await github.rest.actions.listWorkflowRunsForRepo({...context.repo,head_sha:context.sha,per_page:100})).data.workflow_runs;
            for (const run of runs) {
              if (run.path === '.github/workflows/pages.yml' && ['queued','in_progress','waiting','pending'].includes(run.status)) {
                core.info(`Cancelling competing canonical Pages run ${run.id}`);
                await github.rest.actions.cancelWorkflowRun({...context.repo,run_id:run.id}).catch(error => {
                  if (error.status !== 409) throw error;
                });
              }
            }

      - name: Prove header-only delta against the accepted approved-PDF baseline
        env:
          EXPECTED_PRODUCT: 6afb6ad88407b2778bb230ebce0afae2cc34eba5
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$EXPECTED_PRODUCT"
          git diff --name-only "$EXPECTED_PRODUCT" HEAD > /tmp/release-diff.txt
          cat /tmp/release-diff.txt
          python - <<'PY'
          from pathlib import Path
          allowed={
            '.github/workflows/fast-application-release-20260922.yml',
            'src/main.tsx',
            'src/styles/account-header.css',
            'tests/e2e/account-header.spec.ts',
          }
          actual={line.strip() for line in Path('/tmp/release-diff.txt').read_text().splitlines() if line.strip()}
          assert actual == allowed, (actual, allowed)
          PY
          git diff --exit-code "$EXPECTED_PRODUCT" HEAD -- src/components src/data src/domain src/utils src/styles/client-site-report.css docs/approved-baselines tests/fixtures tests/e2e/approved-account-pdf.spec.ts scripts/verify-account-pdf.py vite.config.ts tsconfig.json tsconfig.app.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install exact frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Download exact accepted approved-PDF site and data
        uses: actions/download-artifact@v4
        with:
          repository: JeremyHennessy/TowerSignal
          run-id: 35789610808
          name: github-pages
          github-token: ${{ github.token }}
          path: .accepted-site

      - name: Freeze accepted data byte-for-byte
        run: |
          set -euo pipefail
          mkdir -p .rollback .source-data public/data
          archive="$(find .accepted-site -type f | head -1)"
          tar -xf "$archive" -C .rollback
          rm -rf public/data
          cp -R .rollback/data public/data
          cp -R public/data .source-data/data
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('.source-data/data')
          hashes={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*')) if p.is_file()}
          pathlib.Path('accepted-data-sha256.json').write_text(json.dumps(hashes,sort_keys=True))
          print(f'Frozen {len(hashes):,} data files from accepted main 6afb6ad')
          PY

      - name: Verify and build exact application
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build
          python - <<'PY'
          import hashlib,json,pathlib
          expected=json.loads(pathlib.Path('accepted-data-sha256.json').read_text())
          root=pathlib.Path('dist/data')
          actual={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*')) if p.is_file()}
          assert actual == expected, 'Application-only build changed the frozen data snapshot'
          print(f'All {len(actual):,} deployed data files remain byte-for-byte identical to accepted main 6afb6ad')
          PY

      - name: Install candidate browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Verify Account header, approved PDF and existing release regressions before deploy
        env:
          BASE_URL: https://jeremyhennessy.github.io/TowerSignal/
          CANDIDATE_ROOT: ${{ github.workspace }}/dist
        run: |
          npx playwright test tests/e2e/account-header.spec.ts tests/e2e/approved-account-pdf.spec.ts tests/e2e/fast-application-release-20260922.spec.ts tests/e2e/source-health-coverage.spec.ts tests/e2e/city-record-semantics.spec.ts --project=desktop-chromium --project=iphone

      - name: Inspect actual four-page PDF bytes
        run: |
          python -m pip install --quiet PyMuPDF==1.24.14
          python scripts/verify-account-pdf.py

      - name: Retain pre-deploy Account screenshots and PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fast-application-candidate-proof
          path: |
            playwright-report
            test-results
          retention-days: 30

      - name: Upload exact application candidate
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Stage exact prior site for rollback
        uses: actions/upload-pages-artifact@v3
        with:
          name: fast-release-rollback
          path: .rollback

      - name: Retain frozen-data manifest
        uses: actions/upload-artifact@v4
        with:
          name: fast-release-data-proof
          path: accepted-data-sha256.json
          retention-days: 30

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy exact verified application
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    if: github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install hosted acceptance dependencies
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium webkit
      - name: Verify actual hosted Account header, layout and PDF
        env:
          BASE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          GITHUB_RUN_ID="${GITHUB_RUN_ID}-hosted" npx playwright test tests/e2e/account-header.spec.ts tests/e2e/approved-account-pdf.spec.ts tests/e2e/fast-application-release-20260922.spec.ts tests/e2e/source-health-coverage.spec.ts tests/e2e/city-record-semantics.spec.ts --project=desktop-chromium --project=iphone
      - name: Inspect actual hosted four-page PDF bytes
        run: |
          python -m pip install --quiet PyMuPDF==1.24.14
          python scripts/verify-account-pdf.py
      - name: Retain hosted screenshots and PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fast-application-hosted-proof
          path: |
            playwright-report
            test-results
          retention-days: 30

  rollback:
    if: ${{ always() && github.ref == 'refs/heads/main' && needs.deploy.result == 'success' && needs.verify.result == 'failure' }}
    needs: [build, deploy, verify]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Restore exact prior approved-PDF site
        uses: actions/deploy-pages@v4
        with:
          artifact_name: fast-release-rollback
