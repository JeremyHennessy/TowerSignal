name: Deploy verified application-only release

on:
  push:
    branches:
      - agent/fast-application-release-20260922
      - main
    paths:
      - .github/workflows/fast-application-release-20260922.yml
      - .github/workflows/account-reviewed-delivery.yml
      - tests/e2e/fast-application-release-20260922.spec.ts

permissions:
  contents: read
  actions: write
  pages: write
  id-token: write

concurrency:
  group: fast-application-release-20260922
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stop the competing full-data release after the main promotion
        if: github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const runs=(await github.rest.actions.listWorkflowRunsForRepo({...context.repo,head_sha:context.sha,per_page:100})).data.workflow_runs;
            for (const run of runs) {
              if (run.path === '.github/workflows/pages.yml' && ['queued','in_progress','waiting','pending'].includes(run.status)) {
                core.info(`Cancelling competing canonical Pages run ${run.id}`);
                await github.rest.actions.cancelWorkflowRun({...context.repo,run_id:run.id}).catch(error => {
                  if (error.status !== 409) throw error;
                });
              }
            }

      - name: Prove exact accepted application plus release-control-only delta
        env:
          EXPECTED_PRODUCT: 1a6d85675cb95feb314502aeb154aa2a6b45b598
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$EXPECTED_PRODUCT"
          git diff --name-only "$EXPECTED_PRODUCT" HEAD > /tmp/release-diff.txt
          cat /tmp/release-diff.txt
          python - <<'PY'
          from pathlib import Path
          allowed={
            '.github/workflows/fast-application-release-20260922.yml',
            '.github/workflows/account-reviewed-delivery.yml',
            'tests/e2e/fast-application-release-20260922.spec.ts',
          }
          actual={line.strip() for line in Path('/tmp/release-diff.txt').read_text().splitlines() if line.strip()}
          assert actual == allowed, (actual, allowed)
          PY
          git diff --exit-code "$EXPECTED_PRODUCT" HEAD -- src package.json vite.config.ts tsconfig.json tsconfig.app.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install exact frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Download deployed Pages 230 snapshot
        uses: actions/download-artifact@v4
        with:
          repository: JeremyHennessy/TowerSignal
          run-id: 35744133412
          name: github-pages
          github-token: ${{ github.token }}
          path: .pages230

      - name: Freeze Pages 230 data byte-for-byte
        run: |
          set -euo pipefail
          mkdir -p .rollback .source-data public/data
          archive="$(find .pages230 -type f | head -1)"
          tar -xf "$archive" -C .rollback
          rm -rf public/data
          cp -R .rollback/data public/data
          cp -R public/data .source-data/data
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('.source-data/data')
          hashes={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*')) if p.is_file()}
          pathlib.Path('pages230-data-sha256.json').write_text(json.dumps(hashes,sort_keys=True))
          print(f'Frozen {len(hashes):,} data files from Pages 230')
          PY

      - name: Verify and build exact main application
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build
          python - <<'PY'
          import hashlib,json,pathlib
          expected=json.loads(pathlib.Path('pages230-data-sha256.json').read_text())
          root=pathlib.Path('dist/data')
          actual={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*')) if p.is_file()}
          assert actual == expected, 'Application-only build changed the frozen data snapshot'
          print(f'All {len(actual):,} deployed data files remain byte-for-byte identical to Pages 230')
          PY

      - name: Install candidate browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Verify exact reported Account, PDF and hosted-failure corrections before deploy
        env:
          BASE_URL: https://jeremyhennessy.github.io/TowerSignal/
          CANDIDATE_ROOT: ${{ github.workspace }}/dist
        run: |
          npx playwright test             tests/e2e/fast-application-release-20260922.spec.ts             tests/e2e/source-health-coverage.spec.ts             tests/e2e/city-record-semantics.spec.ts             --project=desktop-chromium             --project=iphone

      - name: Preserve authenticated browser state
        run: |
          mkdir -p release-auth
          cp test-results/.auth/desktop.json release-auth/desktop.json
          cp test-results/.auth/iphone.json release-auth/iphone.json
          test -s release-auth/desktop.json
          test -s release-auth/iphone.json

      - name: Upload authenticated browser state
        uses: actions/upload-artifact@v4
        with:
          name: fast-release-auth-state
          path: release-auth
          retention-days: 1

      - name: Upload exact application candidate
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Stage exact prior site for rollback
        uses: actions/upload-pages-artifact@v3
        with:
          name: fast-release-rollback
          path: .rollback

      - name: Retain frozen-data manifest
        uses: actions/upload-artifact@v4
        with:
          name: fast-release-data-proof
          path: pages230-data-sha256.json
          retention-days: 30

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy exact verified application
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    if: github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install hosted acceptance dependencies
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium webkit

      - name: Download pre-deploy authenticated browser state
        uses: actions/download-artifact@v4
        with:
          name: fast-release-auth-state
          path: release-auth

      - name: Install preserved auth state
        run: |
          mkdir -p test-results/.auth
          cp release-auth/desktop.json test-results/.auth/desktop.json
          cp release-auth/iphone.json test-results/.auth/iphone.json
          test -s test-results/.auth/desktop.json
          test -s test-results/.auth/iphone.json

      - name: Verify actual hosted 225 Broadway layout and PDF
        env:
          BASE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          npx playwright test             tests/e2e/fast-application-release-20260922.spec.ts             tests/e2e/source-health-coverage.spec.ts             tests/e2e/city-record-semantics.spec.ts             --project=desktop-chromium             --project=iphone             --no-deps
      - name: Retain hosted screenshots and PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fast-application-hosted-proof
          path: |
            playwright-report
            test-results
          retention-days: 30

  rollback:
    if: ${{ always() && github.ref == 'refs/heads/main' && needs.deploy.result == 'success' && needs.verify.result == 'failure' }}
    needs: [build, deploy, verify]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Restore exact prior Pages 230 site
        uses: actions/deploy-pages@v4
        with:
          artifact_name: fast-release-rollback
