name: Dispatch approved Azure browser probe once

on:
  push:
    branches: [agent/azure-probe-dispatch-20260911]
    paths: [.github/workflows/azure-probe-dispatch-once.yml]

permissions:
  contents: read
  pull-requests: read
  actions: write

concurrency:
  group: azure-browser-probe-dispatch-once
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # No checkout, no Azure secrets, and no deployment from this branch.
      - name: Dispatch only the exact reviewed probe after checking its gates
        uses: actions/github-script@v7
        with:
          script: |
            const repo = { owner: 'JeremyHennessy', repo: 'TowerSignal' };
            const expectedMain = '11f8bca62b5d7b11fe2d26ee0fb0a4316f919874';
            const expectedHead = '3531d6be5d59041cae9196dff7820339e8c2c860';
            const workflow = 'azure-blob-browser-check.yml';
            if (context.repo.owner !== repo.owner || context.repo.repo !== repo.repo ||
                context.ref !== 'refs/heads/agent/azure-probe-dispatch-20260911') {
              throw new Error('Unexpected repository or dispatch branch');
            }
            const main = (await github.rest.git.getRef({ ...repo, ref: 'heads/main' })).data;
            if (main.object.sha !== expectedMain) throw new Error('Main moved; stop before dispatch');
            const pr = (await github.rest.pulls.get({ ...repo, pull_number: 220 })).data;
            if (!pr.merged || pr.head.sha !== expectedHead || pr.merge_commit_sha !== expectedMain) {
              throw new Error('PR 220 is not the exact approved merge');
            }
            for (const [run_id, head_sha] of [[34544249376, '53f7016404774821051e5ebd02eeb5382dded55f'], [34545099426, expectedHead]]) {
              const run = (await github.rest.actions.getWorkflowRun({ ...repo, run_id })).data;
              if (run.head_sha !== head_sha || run.status !== 'completed' || run.conclusion !== 'success') {
                throw new Error('Required exact-head verification has not succeeded');
              }
            }
            const file = (await github.rest.repos.getContent({ ...repo, path: '.github/workflows/' + workflow, ref: expectedMain })).data;
            if (file.type !== 'file' || file.sha !== '71988f67dba68d381d8eee4c327e9c80e9b88b3a') {
              throw new Error('Browser probe differs from reviewed contents');
            }
            const runs = (await github.rest.actions.listWorkflowRuns({ ...repo, workflow_id: workflow, head_sha: expectedMain, event: 'workflow_dispatch', per_page: 100 })).data;
            if (runs.total_count > 0) {
              core.info('Browser probe already dispatched for this exact merge; no duplicate created');
              return;
            }
            const current = (await github.rest.git.getRef({ ...repo, ref: 'heads/main' })).data;
            if (current.object.sha !== expectedMain) throw new Error('Main moved during checks');
            await github.rest.actions.createWorkflowDispatch({ ...repo, workflow_id: workflow, ref: 'main' });
            core.info('Requested the reviewed browser probe on main. This is not a success result for the probe.');
