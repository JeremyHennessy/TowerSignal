name: Build 014 iPhone timing diagnostic

on:
  push:
    branches: [agent/build014-iphone-timeout-diagnostic-20260826]

permissions:
  contents: read

jobs:
  iphone-timing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install WebKit
        run: npx playwright install --with-deps webkit
      - name: Repeat exact hosted iPhone suite with diagnostic timeout
        env:
          BASE_URL: https://jeremyhennessy.github.io/TowerSignal/
        run: npx playwright test tests/e2e/live.spec.ts --project=iphone --timeout=120000 --repeat-each=3 --workers=1 --reporter=list
