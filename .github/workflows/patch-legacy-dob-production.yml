name: Apply legacy DOB production integration

on:
  push:
    branches:
      - agent/legacy-dob-production-20260907
    paths:
      - '.github/workflows/patch-legacy-dob-production.yml'
      - 'scripts/patch_legacy_dob_production_integration.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/legacy-dob-production-20260907
      - name: Apply bounded source and UI integration
        run: python scripts/patch_legacy_dob_production_integration.py
      - name: Run focused fixture tests
        env:
          PYTHONPATH: scripts
        run: python -m unittest tests.python.test_legacy_dob_project_cache -v
      - name: Verify patch cleanliness
        run: git diff --check
      - name: Remove temporary patch machinery
        run: rm scripts/patch_legacy_dob_production_integration.py .github/workflows/patch-legacy-dob-production.yml
      - name: Commit production integration
        run: |
          git config user.name "TowerSignal Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/DetailPanel.tsx scripts/build_source_health.py scripts/build_coverage_audit.py .github/workflows/pages.yml scripts/patch_legacy_dob_production_integration.py .github/workflows/patch-legacy-dob-production.yml
          git commit -m "Integrate bounded legacy DOB project context"
          git push origin HEAD:agent/legacy-dob-production-20260907
