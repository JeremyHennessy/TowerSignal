name: Build 010.1 hosted verification

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-live-build010-1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Wait for deployed Pages CSS to contain the proven mobile grid fix
        shell: bash
        run: |
          set -euo pipefail
          live_url="https://jeremyhennessy.github.io/TowerSignal/"
          expected='grid-template-columns:minmax(0,1fr) minmax(0,1fr)'
          for attempt in $(seq 1 60); do
            html="$(curl --fail --silent --show-error --location "${live_url}?verify=${GITHUB_RUN_ID}-${attempt}" || true)"
            css_path="$(printf '%s' "$html" | grep -oE 'href="[^"]+\.css"' | head -1 | sed -E 's/^href="//;s/"$//' || true)"
            if [[ -n "$css_path" ]]; then
              if [[ "$css_path" == http* ]]; then
                css_url="$css_path"
              elif [[ "$css_path" == /* ]]; then
                css_url="https://jeremyhennessy.github.io${css_path}"
              else
                css_url="${live_url}${css_path#./}"
              fi
              css="$(curl --fail --silent --show-error --location "${css_url}?verify=${GITHUB_RUN_ID}-${attempt}" || true)"
              if printf '%s' "$css" | grep -Fq "$expected"; then
                echo "Verified deployed CSS contains Build 010.1 mobile grid constraint: $css_url"
                exit 0
              fi
            fi
            sleep 5
          done
          echo "Build 010.1 CSS constraint was not observed on the deployed Pages site."
          exit 1

      - name: Install hosted-test browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Verify deployed site in desktop and iPhone browser contexts
        env:
          BASE_URL: https://jeremyhennessy.github.io/TowerSignal/
        run: npx playwright test tests/e2e/live.spec.ts --reporter=list
