name: Build 010 WebKit hidden diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-webkit-hidden:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Install WebKit browser
        run: npx playwright install --with-deps webkit

      - name: Test Changes switch without display-none hiding
        env:
          BASE_URL: https://jeremyhennessy.github.io/TowerSignal/
        run: npx playwright test tests/e2e/build010-webkit-hidden.spec.ts --project=iphone --reporter=list
