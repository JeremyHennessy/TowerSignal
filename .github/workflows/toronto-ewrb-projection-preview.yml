name: Toronto EWRB Projection Preview

on:
  push:
    branches:
      - agent/toronto-ewrb-projection-20260904
    paths:
      - .github/workflows/toronto-ewrb-projection-preview.yml

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/toronto-ewrb-projection-20260904
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect persisted EWRB contract
        env:
          PYTHONPATH: .:scripts
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          p = Path('data/toronto/warehouse/current/open_licensed/ontario_ewrb_large_buildings.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          rows = [x for x in data.get('toronto_rows', []) if isinstance(x, dict)]
          print('metadata=', json.dumps(data.get('metadata', {}), indent=2)[:12000])
          print('toronto_rows=', len(rows))
          keys = Counter(k for row in rows for k in row)
          print('keys=', json.dumps(keys.most_common(), indent=2)[:12000])
          for row in rows[:3]:
              print('sample=', json.dumps(row, ensure_ascii=False, default=str)[:12000])
          PY
      - name: Preview exact canonical address projection
        env:
          PYTHONPATH: .:scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/toronto_extend_source_links.py')
          text = p.read_text(encoding='utf-8')
          anchor = '    ("ontario_bps_energy_2024", WAREHOUSE / "open_licensed/ontario_bps_energy_2024.json"),\n'
          if anchor not in text:
              raise SystemExit('extension anchor changed')
          text = text.replace(anchor, anchor + '    ("ontario_ewrb_large_buildings", WAREHOUSE / "open_licensed/ontario_ewrb_large_buildings.json"),\n', 1)
          p.write_text(text, encoding='utf-8')
          PY
          python scripts/toronto_extend_source_links.py > /tmp/extension.log
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('data/toronto/market/current/source_link_extension_report.json').read_text(encoding='utf-8'))
          e = report['structured_extensions']['ontario_ewrb_large_buildings']
          print('EWRB_PROJECTION=', json.dumps(e, indent=2))
          links = json.loads(Path('data/toronto/market/current/property_source_links.json').read_text(encoding='utf-8'))
          ewrb = [x for x in links['links'] if x.get('source_key') == 'ontario_ewrb_large_buildings']
          print('EWRB_LINKS=', len(ewrb))
          print('EWRB_PROPERTIES=', len({x['property_id'] for x in ewrb}))
          print('EWRB_SAMPLE_LINKS=', json.dumps(ewrb[:10], indent=2))
          assert e['status'] == 'JOINED'
          assert e['ambiguous_address_rows_not_forced'] >= 0
          PY
