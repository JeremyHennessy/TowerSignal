name: Build relationship evidence matrix
on:
  push:
    branches: [audit/full-lineage-20260923-1350]
    paths:
      - docs/audits/2026-09-23/build_stage31_relationship_evidence.py
      - .github/workflows/audit-stage31-relationship-evidence.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build relationship evidence matrix
        run: python -u docs/audits/2026-09-23/build_stage31_relationship_evidence.py
      - name: Persist results
        run: |
          mkdir -p docs/audits/2026-09-23/stage31-relationship-evidence
          cp .audit-stage31/*.json docs/audits/2026-09-23/stage31-relationship-evidence/
          git config user.name "TowerSignal Audit"
          git config user.email "actions@users.noreply.github.com"
          git add docs/audits/2026-09-23/stage31-relationship-evidence
          git commit -m "audit: persist relationship evidence matrix"
          git pull --rebase origin audit/full-lineage-20260923-1350
          git push origin HEAD:audit/full-lineage-20260923-1350
