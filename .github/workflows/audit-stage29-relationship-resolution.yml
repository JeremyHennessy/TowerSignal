name: Resolve dynamic relationship contracts
on:
  push:
    branches: [audit/full-lineage-20260923-1350]
    paths:
      - docs/audits/2026-09-23/build_stage29_relationship_resolution.py
      - .github/workflows/audit-stage29-relationship-resolution.yml
permissions:
  contents: write
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve relationship contract expressions
        run: python -u docs/audits/2026-09-23/build_stage29_relationship_resolution.py
      - name: Persist results
        run: |
          mkdir -p docs/audits/2026-09-23/stage29-relationship-resolution
          cp .audit-stage29/*.json docs/audits/2026-09-23/stage29-relationship-resolution/
          git config user.name "TowerSignal Audit"
          git config user.email "actions@users.noreply.github.com"
          git add docs/audits/2026-09-23/stage29-relationship-resolution
          git commit -m "audit: persist relationship contract resolution"
          git pull --rebase origin audit/full-lineage-20260923-1350
          git push origin HEAD:audit/full-lineage-20260923-1350
