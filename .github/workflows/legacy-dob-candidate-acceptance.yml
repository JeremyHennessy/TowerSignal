# Acceptance-only branch. Never merge this workflow to main.
name: Accept bounded legacy DOB candidate on full verified cohort

on:
  push:
    branches: [agent/legacy-dob-candidate-acceptance-20260911]
    paths: [.github/workflows/legacy-dob-candidate-acceptance.yml]

permissions:
  contents: read
  actions: read

jobs:
  accept:
    runs-on: ubuntu-24.04
    timeout-minutes: 160
    environment: azure-production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 828f44dffa01be3feeee1d4722a6a65458b62ac1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source and read-only Blob dependencies
        run: python -m pip install --disable-pip-version-check requests azure-storage-blob==12.25.1
      - name: Restore exact verified production property cohort from immutable Blob release
        env:
          AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_CONTAINER: ${{ vars.AZURE_STORAGE_CONTAINER }}
          AZURE_STORAGE_PREFIX: ${{ vars.AZURE_STORAGE_PREFIX }}
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          from azure.storage.blob import BlobServiceClient

          expected_source_run=34544249376
          expected_source_sha='53f7016404774821051e5ebd02eeb5382dded55f'
          expected_runtime_prefix='towersignal-data/migrations/github-34593386563-1/runtime'
          expected_systems_sha='c18196cc1459878d36e27aa33cec81a906bda7304ba1e5a9b37864bd36ce5aff'
          expected_runtime_manifest_sha='e47e6d3c84c772926572769aade742732b596ec5f2fc4f70cc8dd8ce8052056a'
          expected_runtime_complete_sha='1061e5fc4c535a3cd1691f038eae93215d9989d903d71b83d5f33426b994f001'

          account=os.environ['AZURE_STORAGE_ACCOUNT']
          container=os.environ['AZURE_STORAGE_CONTAINER']
          prefix=os.environ['AZURE_STORAGE_PREFIX'].strip('/')
          key=os.environ['AZURE_STORAGE_KEY']
          service=BlobServiceClient(account_url=f'https://{account}.blob.core.windows.net',credential=key)
          client=service.get_container_client(container)

          pointer_blob=f'{prefix}/pointers/production-current.json'
          current=json.loads(client.download_blob(pointer_blob).readall())
          assert current['domain']=='TOWERSIGNAL_BLOB_RELEASE'
          assert current['source']['run_id']==expected_source_run
          assert current['source']['source_sha']==expected_source_sha
          assert current['runtime']['data_prefix']==expected_runtime_prefix
          assert current['runtime']['manifest']['sha256']==expected_runtime_manifest_sha
          assert current['runtime']['complete']['sha256']==expected_runtime_complete_sha

          systems_blob=f"{current['runtime']['data_prefix']}/systems.json"
          systems_bytes=client.download_blob(systems_blob).readall()
          assert hashlib.sha256(systems_bytes).hexdigest()==expected_systems_sha

          root=Path(os.environ['RUNNER_TEMP'])/'legacy-candidate'
          root.mkdir()
          (root/'systems.json').write_bytes(systems_bytes)
          payload=json.loads(systems_bytes)
          bbls={str(s.get('bbl')) for s in payload['systems'] if s.get('bbl')}
          assert len(payload['systems'])==4894
          assert len(bbls)==3802
          proof={
            'systems':len(payload['systems']),
            'bbls':len(bbls),
            'source_run_id':current['source']['run_id'],
            'source_sha':current['source']['source_sha'],
            'systems_sha256':expected_systems_sha,
            'runtime_data_prefix':current['runtime']['data_prefix'],
            'blob_access':'read-only'
          }
          (root/'cohort-proof.json').write_text(json.dumps(proof,indent=2)+'\n')
          print(json.dumps(proof,indent=2))
          PY
      - name: Run exact candidate builder with production 150-minute bound
        timeout-minutes: 150
        run: |
          START=$(date +%s)
          python -u scripts/build_legacy_dob_project_cache.py --output "$RUNNER_TEMP/legacy-candidate"
          END=$(date +%s)
          printf '{"wall_seconds":%s,"candidate_sha":"828f44dffa01be3feeee1d4722a6a65458b62ac1"}\n' "$((END-START))" > "$RUNNER_TEMP/legacy-candidate/timing.json"
      - name: Validate actual production cache without weaker thresholds
        run: |
          python scripts/validate_legacy_dob_project_cache.py \
            --cache "$RUNNER_TEMP/legacy-candidate/legacy-dob-projects.json" \
            --max-age-days 1 --require-production-volume
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'legacy-candidate'
          payload=json.loads((root/'legacy-dob-projects.json').read_text())
          timing=json.loads((root/'timing.json').read_text())
          cohort=json.loads((root/'cohort-proof.json').read_text())
          summary=payload['summary'];source=payload['source']
          assert source['requested_bbl_count']==3802
          assert timing['wall_seconds'] < 9000
          result={'status':'PASS','wall_seconds':timing['wall_seconds'],'requested_bbl_count':source['requested_bbl_count'],
                  'source_matched_bbl_count':source['source_matched_bbl_count'],'exact_bbl_job_count':source['exact_bbl_job_count'],
                  'retained_bbl_count':summary['retained_bbl_count'],'retained_record_count':summary['retained_record_count'],
                  'explicit_cooling_tower_record_count':summary['explicit_cooling_tower_record_count'],
                  'recent_relevant_project_record_count':summary['recent_relevant_project_record_count'],
                  'candidate_sha':timing['candidate_sha'],'max_concurrent_requests':3,
                  'request_start_interval_seconds':5,'source_contract_changed':False,
                  'azure_accessed':True,'azure_access_mode':'read-only','cohort_source_run_id':cohort['source_run_id'],
                  'cohort_systems_sha256':cohort['systems_sha256']}
          (root/'acceptance.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          PY
      - name: Retain actual production cache and acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-dob-candidate-acceptance-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/legacy-candidate/legacy-dob-projects.json
            ${{ runner.temp }}/legacy-candidate/timing.json
            ${{ runner.temp }}/legacy-candidate/cohort-proof.json
            ${{ runner.temp }}/legacy-candidate/acceptance.json
          retention-days: 14
          if-no-files-found: warn
