name: Accept bounded legacy DOB candidate on full verified cohort

on:
  push:
    branches: [agent/legacy-dob-candidate-acceptance-20260911]
    paths: [.github/workflows/legacy-dob-candidate-acceptance.yml]

permissions:
  contents: read
  actions: read

jobs:
  accept:
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c7c7013887f91733b4c03381887474a005fc30ef
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Restore exact verified production property cohort
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib,json,os,sys,tarfile,zipfile
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from migrate_data_to_blob import GitHubReader
          reader=GitHubReader()
          meta=reader.get('/actions/artifacts/10181150350')
          digest='e1672458b40c4b77d92b0f47b7fe84a32ef54920a7fa4af1cb70e4c1bb8f975c'
          assert not meta['expired'] and meta['name']=='github-pages'
          assert meta['digest']=='sha256:'+digest and meta['workflow_run']['id']==34544249376
          assert meta['workflow_run']['head_sha']=='53f7016404774821051e5ebd02eeb5382dded55f'
          root=Path(os.environ['RUNNER_TEMP'])/'legacy-candidate';root.mkdir()
          archive=root/'baseline.zip';reader.download('/actions/artifacts/10181150350/zip',archive)
          with archive.open('rb') as f: assert hashlib.file_digest(f,'sha256').hexdigest()==digest
          assert archive.stat().st_size==meta['size_in_bytes']
          with zipfile.ZipFile(archive) as z:
            assert z.namelist()==['artifact.tar']
            found=False
            with z.open('artifact.tar') as f,tarfile.open(fileobj=f,mode='r|*') as tar:
              for item in tar:
                if item.name.removeprefix('./')=='data/systems.json':
                  assert item.isfile() and item.size<100*1024**2 and not found
                  (root/'systems.json').write_bytes(tar.extractfile(item).read());found=True
            assert found
          payload=json.loads((root/'systems.json').read_text())
          bbls={str(s.get('bbl')) for s in payload['systems'] if s.get('bbl')}
          assert len(payload['systems'])==4894 and len(bbls)==3802
          print(json.dumps({'systems':len(payload['systems']),'bbls':len(bbls),'artifact_id':meta['id'],'sha256':digest},indent=2))
          PY
      - name: Run exact candidate builder with production 90-minute bound
        timeout-minutes: 90
        run: |
          START=$(date +%s)
          python -u scripts/build_legacy_dob_project_cache.py --output "$RUNNER_TEMP/legacy-candidate"
          END=$(date +%s)
          printf '{"wall_seconds":%s,"candidate_sha":"c7c7013887f91733b4c03381887474a005fc30ef"}\n' "$((END-START))" > "$RUNNER_TEMP/legacy-candidate/timing.json"
      - name: Validate actual production cache without weaker thresholds
        run: |
          python scripts/validate_legacy_dob_project_cache.py \
            --cache "$RUNNER_TEMP/legacy-candidate/legacy-dob-projects.json" \
            --max-age-days 1 --require-production-volume
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'legacy-candidate'
          payload=json.loads((root/'legacy-dob-projects.json').read_text())
          timing=json.loads((root/'timing.json').read_text())
          summary=payload['summary'];source=payload['source']
          assert source['requested_bbl_count']==3802
          assert timing['wall_seconds'] < 5400
          result={'status':'PASS','wall_seconds':timing['wall_seconds'],'requested_bbl_count':source['requested_bbl_count'],
                  'source_matched_bbl_count':source['source_matched_bbl_count'],'exact_bbl_job_count':source['exact_bbl_job_count'],
                  'retained_bbl_count':summary['retained_bbl_count'],'retained_record_count':summary['retained_record_count'],
                  'explicit_cooling_tower_record_count':summary['explicit_cooling_tower_record_count'],
                  'recent_relevant_project_record_count':summary['recent_relevant_project_record_count'],
                  'candidate_sha':timing['candidate_sha'],'max_concurrent_requests':4,
                  'source_contract_changed':False,'azure_accessed':False}
          (root/'acceptance.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          PY
      - name: Retain actual production cache and acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-dob-candidate-acceptance-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/legacy-candidate/legacy-dob-projects.json
            ${{ runner.temp }}/legacy-candidate/timing.json
            ${{ runner.temp }}/legacy-candidate/acceptance.json
          retention-days: 14
          if-no-files-found: warn
