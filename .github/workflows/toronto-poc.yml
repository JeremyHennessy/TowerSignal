name: Toronto POC Extract

on:
  workflow_dispatch:
  push:
    branches:
      - agent/toronto-poc-20260828
    paths:
      - scripts/build_toronto_poc.py
      - scripts/enrich_toronto_poc_tdsb_identity.py
      - scripts/normalize_toronto_poc_permit_timing.py
      - scripts/enrich_toronto_poc_rentsafe.py
      - scripts/classify_toronto_poc_lifecycle.py
      - scripts/build_toronto_poc_demo_accounts.py
      - scripts/pull_toronto_bulk_sources.py
      - scripts/pull_toronto_additional_sources.py
      - scripts/enrich_toronto_targeted_large_sources.py
      - scripts/normalize_toronto_warehouse.py
      - scripts/join_toronto_warehouse_to_poc.py
      - docs/TORONTO_POC.md
      - .github/workflows/toronto-poc.yml

permissions:
  contents: write

concurrency:
  group: toronto-poc-extract
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: agent/toronto-poc-20260828

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Toronto warehouse parser dependency
        run: python -m pip install --disable-pip-version-check 'openpyxl>=3.1,<4'

      - name: Compile Toronto POC scripts
        run: |
          python -m py_compile scripts/build_toronto_poc.py
          python -m py_compile scripts/enrich_toronto_poc_tdsb_identity.py
          python -m py_compile scripts/normalize_toronto_poc_permit_timing.py
          python -m py_compile scripts/enrich_toronto_poc_rentsafe.py
          python -m py_compile scripts/classify_toronto_poc_lifecycle.py
          python -m py_compile scripts/build_toronto_poc_demo_accounts.py
          python -m py_compile scripts/pull_toronto_bulk_sources.py
          python -m py_compile scripts/pull_toronto_additional_sources.py
          python -m py_compile scripts/enrich_toronto_targeted_large_sources.py
          python -m py_compile scripts/normalize_toronto_warehouse.py
          python -m py_compile scripts/join_toronto_warehouse_to_poc.py

      - name: Extract Toronto POC evidence
        run: python scripts/build_toronto_poc.py --output data/toronto/poc/current

      - name: Normalize permit source state versus recency
        run: python scripts/normalize_toronto_poc_permit_timing.py --output data/toronto/poc/current

      - name: Enrich exact TDSB school identity
        run: python scripts/enrich_toronto_poc_tdsb_identity.py --output data/toronto/poc/current

      - name: Join exact RentSafeTO account context
        run: python scripts/enrich_toronto_poc_rentsafe.py --output data/toronto/poc/current

      - name: Classify source-backed tower lifecycle direction
        run: python scripts/classify_toronto_poc_lifecycle.py --output data/toronto/poc/current

      - name: Assemble deterministic demo accounts
        run: python scripts/build_toronto_poc_demo_accounts.py --output data/toronto/poc/current

      - name: Pull broad Toronto and Ontario warehouse sources
        run: python scripts/pull_toronto_bulk_sources.py --output data/toronto/warehouse/current

      - name: Pull additional Toronto source families
        run: python scripts/pull_toronto_additional_sources.py --output data/toronto/warehouse/current

      - name: Normalize Toronto warehouse municipal scope and licences
        run: python scripts/normalize_toronto_warehouse.py --output data/toronto/warehouse/current

      - name: Target business licences and 311 to POC property spine
        run: python scripts/enrich_toronto_targeted_large_sources.py --poc data/toronto/poc/current --warehouse data/toronto/warehouse/current

      - name: Join warehouse sources to POC properties
        run: python scripts/join_toronto_warehouse_to_poc.py --poc data/toronto/poc/current --warehouse data/toronto/warehouse/current

      - name: Validate generated JSON
        run: |
          python -m json.tool data/toronto/poc/current/summary.json >/dev/null
          python -m json.tool data/toronto/poc/current/properties.json >/dev/null
          python -m json.tool data/toronto/poc/current/evidence.json >/dev/null
          python -m json.tool data/toronto/poc/current/rentsafe_matches.json >/dev/null
          python -m json.tool data/toronto/poc/current/demo_accounts.json >/dev/null
          python -m json.tool data/toronto/warehouse/current/source_inventory.json >/dev/null
          python -m json.tool data/toronto/warehouse/current/join_summary.json >/dev/null
          python -m json.tool data/toronto/warehouse/current/property_joins.json >/dev/null
          python -m json.tool data/toronto/warehouse/current/business_licence_matches.json >/dev/null
          python -m json.tool data/toronto/warehouse/current/311_matches.json >/dev/null
          python -m json.tool data/toronto/warehouse/current/open_licensed/renewable_energy_installations.json >/dev/null
          python -m json.tool data/toronto/warehouse/current/open_licensed/311_service_requests_metadata.json >/dev/null
          python -m json.tool data/toronto/warehouse/current/open_licensed/mls_business_licences_permits_metadata.json >/dev/null

      - name: Upload Toronto POC artifact
        uses: actions/upload-artifact@v4
        with:
          name: toronto-poc-${{ github.run_id }}
          path: data/toronto/poc/current/
          retention-days: 30

      - name: Upload full Toronto source warehouse artifact
        uses: actions/upload-artifact@v4
        with:
          name: toronto-warehouse-${{ github.run_id }}
          path: data/toronto/warehouse/current/
          retention-days: 30

      - name: Remove rights-review raw records before public git persistence
        shell: bash
        run: rm -rf data/toronto/warehouse/current/rights_review

      - name: Persist successful Toronto snapshots on experiment branch
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- data/toronto/poc/current data/toronto/warehouse/current)" ]; then
            echo "Toronto snapshots unchanged."
            exit 0
          fi
          git config user.name "TowerSignal Toronto POC Bot"
          git config user.email "towersignal-poc@users.noreply.github.com"
          git add data/toronto/poc/current data/toronto/warehouse/current
          git commit -m "Toronto POC: refresh extracted public-record evidence and warehouse"
          git push origin HEAD:agent/toronto-poc-20260828
