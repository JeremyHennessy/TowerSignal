name: Account candidate proof

on:
  push:
    branches:
      - agent/account-candidate-proof-20260918
    paths:
      - '.github/workflows/account-candidate-proof.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: account-candidate-proof
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Download accepted Pages 215 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .accepted-pages .candidate-pages
          gh run download 35334719612 -n github-pages -D .accepted-pages
          ARCHIVE="$(find .accepted-pages -type f | head -n 1)"
          test -n "$ARCHIVE"
          tar -xf "$ARCHIVE" -C .candidate-pages
          test -f .candidate-pages/index.html
          test -f .candidate-pages/data/systems.json
      - name: Overlay exact candidate application assets
        run: |
          npm run build
          cp dist/index.html .candidate-pages/index.html
          rm -rf .candidate-pages/assets
          cp -R dist/assets .candidate-pages/assets
      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: Verify Account candidate on accepted production data
        env:
          BASE_URL: https://jeremyhennessy.github.io/TowerSignal/
          CANDIDATE_ROOT: ${{ github.workspace }}/.candidate-pages
        run: >-
          npx playwright test
          tests/e2e/account-mode-layout.spec.ts
          tests/e2e/account-evidence-architecture.spec.ts
          --project=desktop-chromium
          --project=iphone
      - name: Retain Account candidate browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: account-candidate-proof
          path: |
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 14
