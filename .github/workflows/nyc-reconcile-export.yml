name: Export current NYC source for conflict review
on:
  push:
    branches: [work/nyc-reconcile-20260915]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 13711cfe2e8631d88099feac6cc03a0e7e34248f
          persist-credentials: false
      - name: Export exact candidate and source checksums
        run: |
          mkdir -p /tmp/nyc-release-source
          git archive --format=zip HEAD -o /tmp/nyc-release-source/source.zip
          git rev-parse HEAD > /tmp/nyc-release-source/commit.txt
          git rev-parse HEAD^{tree} > /tmp/nyc-release-source/tree.txt
          git ls-tree -r HEAD > /tmp/nyc-release-source/git-files.txt
      - uses: actions/upload-artifact@v4
        with:
          name: nyc-source-13711cfe
          path: /tmp/nyc-release-source/
          retention-days: 7
