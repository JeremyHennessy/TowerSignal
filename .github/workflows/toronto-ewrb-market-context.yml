name: Toronto EWRB Market Context

on:
  push:
    branches:
      - agent/toronto-ewrb-projection-20260904
    paths:
      - .github/workflows/toronto-ewrb-market-context.yml

permissions:
  contents: write

jobs:
  build-context:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/toronto-ewrb-projection-20260904
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify EWRB normalization and aggregate-only contract
        env:
          PYTHONPATH: .:scripts
        run: |
          python -m unittest tests.python.test_ontario_open_building_environment tests.python.test_toronto_ewrb_market_context -v
          python scripts/build_toronto_ewrb_market_context.py
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('public/data/toronto-ewrb-market.json').read_text(encoding='utf-8'))
          assert payload['scope'] == 'TORONTO_AGGREGATE_ONLY'
          assert payload['reporting_years'] == [2018, 2019, 2020, 2021, 2022, 2023, 2024]
          assert payload['toronto_reporting_rows'] == 11595
          assert payload['identity_contract']['property_level_links'] == 0
          assert 'properties' not in payload and 'rows' not in payload
          assert sum(item['reporting_rows'] for item in payload['annual']) == 11595
          print('TORONTO_EWRB_AGGREGATE_CONTEXT=PASSED')
          PY
      - name: Persist verified aggregate artifact
        run: |
          git config user.name "TowerSignal Ontario Data Bot"
          git config user.email "towersignal-ontario@users.noreply.github.com"
          git rm .github/workflows/toronto-ewrb-market-context.yml
          git add scripts/build_toronto_ewrb_market_context.py tests/python/test_toronto_ewrb_market_context.py public/data/toronto-ewrb-market.json
          git commit -m "Toronto: add aggregate Ontario EWRB market context"
          git push origin HEAD:agent/toronto-ewrb-projection-20260904
          echo "EWRB_CONTEXT_SHA=$(git rev-parse HEAD)"
