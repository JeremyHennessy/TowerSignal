name: Probe official published Labor Law decision evidence

on:
  push:
    branches:
      - agent/labor-law-decision-probe-20260916
    paths:
      - .github/workflows/labor-law-decision-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe official selected-trial-court RSS
        run: |
          mkdir -p probe-output
          python - <<'PY' | tee probe-output/summary.json
          import html, json, re, urllib.request, xml.etree.ElementTree as ET

          FEED = 'https://www.nycourts.gov/reporter/RSS/misc.xml'
          HEADERS = {'User-Agent': 'TowerSignal-law-reporting-probe/1.0'}

          def fetch(url):
              req = urllib.request.Request(url, headers=HEADERS)
              with urllib.request.urlopen(req, timeout=90) as response:
                  return response.read(), response.headers.get('Content-Type')

          raw, feed_type = fetch(FEED)
          root = ET.fromstring(raw)
          items = []
          for item in root.findall('.//item'):
              items.append({
                  'title': (item.findtext('title') or '').strip(),
                  'link': (item.findtext('link') or '').strip(),
                  'pub_date': (item.findtext('pubDate') or '').strip(),
                  'description': html.unescape(item.findtext('description') or ''),
              })

          labor = []
          failures = []
          address_patterns = [
              re.compile(r'\b\d{1,5}\s+(?:East|West|North|South|E\.?|W\.?|N\.?|S\.?)?\s*[A-Z][A-Za-z0-9 .\'\-]{1,60}\s+(?:Street|St\.?|Avenue|Ave\.?|Road|Rd\.?|Boulevard|Blvd\.?|Place|Pl\.?|Lane|Ln\.?|Drive|Dr\.?|Broadway)\b', re.I),
          ]
          index_pattern = re.compile(r'INDEX NO\.\s*([0-9/\-]+)', re.I)
          nyscef_pattern = re.compile(r'NYSCEF DOC\. NO\.\s*([0-9]+)', re.I)
          sections_pattern = re.compile(r'Labor Law\s*(?:§§?|sections?)?\s*([0-9(),\s]+)', re.I)

          for entry in items[:80]:
              if not entry['link']:
                  continue
              try:
                  body, content_type = fetch(entry['link'])
                  text = body.decode('utf-8', 'ignore')
                  clean = html.unescape(re.sub(r'\s+', ' ', re.sub(r'<[^>]+>', ' ', text)))
                  if not re.search(r'Labor Law', clean, re.I):
                      continue
                  addresses = []
                  for pattern in address_patterns:
                      for match in pattern.finditer(clean):
                          value = re.sub(r'\s+', ' ', match.group(0)).strip(' ,.;')
                          if value not in addresses:
                              addresses.append(value)
                  sections = sorted({m.group(1).strip() for m in sections_pattern.finditer(clean) if m.group(1).strip()})
                  labor.append({
                      **entry,
                      'content_type': content_type,
                      'labor_law_mentions': len(re.findall(r'Labor Law', clean, re.I)),
                      'labor_law_sections': sections,
                      'explicit_address_candidates': addresses[:12],
                      'index_numbers': sorted(set(index_pattern.findall(clean))),
                      'nyscef_document_numbers': sorted(set(nyscef_pattern.findall(clean))),
                      'mentions_property_terms': bool(re.search(r'premises|property|building|construction site|work site|worksite', clean, re.I)),
                  })
              except Exception as exc:
                  failures.append({'link': entry['link'], 'error': f'{type(exc).__name__}: {exc}'})

          print(json.dumps({
              'feed': FEED,
              'feed_content_type': feed_type,
              'feed_item_count': len(items),
              'inspected_item_count': min(len(items), 80),
              'labor_law_decision_count_in_inspected_items': len(labor),
              'labor_law_decisions_with_address_candidate': sum(1 for item in labor if item['explicit_address_candidates']),
              'labor_law_decisions_with_nyscef_metadata': sum(1 for item in labor if item['index_numbers'] or item['nyscef_document_numbers']),
              'retrieval_failure_count': len(failures),
              'examples': labor[:12],
              'failures': failures[:10],
              'coverage_boundary': 'Official Reports RSS contains selected trial-court decisions, not a comprehensive new-case filing feed. Absence cannot be treated as no Labor Law litigation.',
              'attachment_boundary': 'Only decision text that explicitly identifies a subject property may be considered for TowerSignal property attachment; party/counsel addresses are not sufficient.',
          }, indent=2, sort_keys=True))
          PY
      - name: Upload retained source-contract proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: labor-law-decision-source-probe
          path: probe-output/**
          retention-days: 30
