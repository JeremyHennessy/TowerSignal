name: Probe official published Labor Law decision evidence

on:
  push:
    branches:
      - agent/labor-law-decision-probe-20260916
    paths:
      - .github/workflows/labor-law-decision-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe official appellate and selected-trial-court RSS feeds
        run: |
          mkdir -p probe-output
          python - <<'PY' | tee probe-output/summary.json
          import concurrent.futures, html, json, re, urllib.request, xml.etree.ElementTree as ET

          FEEDS = {
              'APP_DIV_FIRST': 'https://www.nycourts.gov/reporter/RSS/AD1st.xml',
              'APP_DIV_SECOND': 'https://www.nycourts.gov/reporter/RSS/AD2d.xml',
              'SELECTED_TRIAL': 'https://www.nycourts.gov/reporter/RSS/misc.xml',
          }
          MAX_ITEMS_PER_FEED = 80
          HEADERS = {'User-Agent': 'TowerSignal-law-reporting-probe/1.2'}
          ADDRESS_EXPR = (
              r'\d{1,5}\s+(?:East|West|North|South|E\.?|W\.?|N\.?|S\.?)?\s*'
              r'[A-Z][A-Za-z0-9 .\'\-]{1,70}\s+'
              r'(?:Street|St\.?|Avenue|Ave\.?|Road|Rd\.?|Boulevard|Blvd\.?|Place|Pl\.?|Lane|Ln\.?|Drive|Dr\.?|Broadway)'
          )
          ADDRESS = re.compile(r'\b' + ADDRESS_EXPR + r'\b', re.I)
          SUBJECT_PATTERNS = [
              re.compile(r'(?:premises|property|building|construction\s+site|work\s*site|worksite|project)\s+(?:located\s+|situated\s+)?(?:at|on)\s+(?P<address>' + ADDRESS_EXPR + r')\b', re.I),
              re.compile(r'(?:working|performing\s+work|employed)\s+(?:at|on)\s+(?:the\s+)?(?:premises|property|building|construction\s+site|work\s*site|worksite|project)?\s*(?:located\s+)?(?:at|on)?\s*(?P<address>' + ADDRESS_EXPR + r')\b', re.I),
              re.compile(r'(?:accident|incident|injur(?:y|ies)|fall)\s+(?:occurred|happened|took\s+place)\s+(?:at|on)\s+(?:the\s+)?(?:premises|property|building|construction\s+site|work\s*site|worksite|project)?\s*(?:located\s+)?(?:at|on)?\s*(?P<address>' + ADDRESS_EXPR + r')\b', re.I),
          ]
          INDEX = re.compile(r'(?:INDEX\s+NO\.?|Index\s+No\.?)\s*[:#]?\s*([0-9A-Za-z/\-]+)', re.I)
          NYSCEF = re.compile(r'NYSCEF\s+DOC\.\s+NO\.\s*([0-9]+)', re.I)
          CASE_NO = re.compile(r'(?:Case\s+No\.?)\s*[:#]?\s*([0-9A-Za-z/\-]+)', re.I)
          SECTIONS = re.compile(r'Labor\s+Law\s*(?:§§?|sections?)?\s*([0-9(),\s]+)', re.I)

          def fetch(url):
              req = urllib.request.Request(url, headers=HEADERS)
              with urllib.request.urlopen(req, timeout=90) as response:
                  return response.read(), response.headers.get('Content-Type')

          def parse_feed(label, url):
              raw, content_type = fetch(url)
              root = ET.fromstring(raw)
              all_items = root.findall('.//item')
              rows = []
              for item in all_items[:MAX_ITEMS_PER_FEED]:
                  rows.append({
                      'feed': label,
                      'feed_url': url,
                      'feed_content_type': content_type,
                      'title': (item.findtext('title') or '').strip(),
                      'link': (item.findtext('link') or '').strip(),
                      'pub_date': (item.findtext('pubDate') or '').strip(),
                      'description': html.unescape(item.findtext('description') or ''),
                  })
              return len(all_items), rows

          feed_counts, candidates, feed_failures = {}, [], []
          for label, url in FEEDS.items():
              try:
                  total, rows = parse_feed(label, url)
                  feed_counts[label] = {'feed_url': url, 'item_count': total, 'inspected_item_count': len(rows)}
                  candidates.extend(rows)
              except Exception as exc:
                  feed_failures.append({'feed': label, 'url': url, 'error': f'{type(exc).__name__}: {exc}'})

          def inspect(entry):
              if not entry['link']:
                  return {'kind': 'skip'}
              try:
                  body, content_type = fetch(entry['link'])
                  clean = html.unescape(re.sub(r'\s+', ' ', re.sub(r'<[^>]+>', ' ', body.decode('utf-8', 'ignore'))))
                  if not re.search(r'Labor\s+Law', clean, re.I):
                      return {'kind': 'non_labor'}
                  explicit = []
                  for pattern in SUBJECT_PATTERNS:
                      for match in pattern.finditer(clean):
                          address = re.sub(r'\s+', ' ', match.group('address')).strip(' ,.;')
                          if address not in [row['address'] for row in explicit]:
                              left, right = max(0, match.start() - 120), min(len(clean), match.end() + 120)
                              explicit.append({'address': address, 'context': clean[left:right]})
                  all_addresses = []
                  for match in ADDRESS.finditer(clean):
                      address = re.sub(r'\s+', ' ', match.group(0)).strip(' ,.;')
                      if address not in all_addresses:
                          all_addresses.append(address)
                  explicit_addresses = {row['address'] for row in explicit}
                  rejected = [{'address': address, 'reason': 'address appears in decision but not in explicit subject-worksite syntax'} for address in all_addresses if address not in explicit_addresses][:12]
                  return {'kind': 'labor', 'record': {
                      **entry,
                      'decision_content_type': content_type,
                      'labor_law_mentions': len(re.findall(r'Labor\s+Law', clean, re.I)),
                      'labor_law_sections': sorted({m.group(1).strip() for m in SECTIONS.finditer(clean) if m.group(1).strip()}),
                      'index_numbers': sorted(set(INDEX.findall(clean))),
                      'case_numbers': sorted(set(CASE_NO.findall(clean))),
                      'nyscef_document_numbers': sorted(set(NYSCEF.findall(clean))),
                      'explicit_subject_property_candidates': explicit[:8],
                      'rejected_address_candidates': rejected,
                      'attachment_eligible': bool(explicit),
                  }}
              except Exception as exc:
                  return {'kind': 'failure', 'record': {'feed': entry['feed'], 'link': entry['link'], 'error': f'{type(exc).__name__}: {exc}'}}

          labor, failures = [], []
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              for result in pool.map(inspect, candidates):
                  if result['kind'] == 'labor': labor.append(result['record'])
                  elif result['kind'] == 'failure': failures.append(result['record'])

          by_feed = {}
          for label in FEEDS:
              rows = [row for row in labor if row['feed'] == label]
              by_feed[label] = {
                  'labor_law_decision_count': len(rows),
                  'attachment_eligible_count': sum(1 for row in rows if row['attachment_eligible']),
                  'with_index_or_case_number': sum(1 for row in rows if row['index_numbers'] or row['case_numbers']),
              }

          print(json.dumps({
              'feeds': feed_counts,
              'feed_retrieval_failures': feed_failures,
              'inspected_decision_count': len(candidates),
              'labor_law_decision_count': len(labor),
              'attachment_eligible_count': sum(1 for row in labor if row['attachment_eligible']),
              'retrieval_failure_count': len(failures),
              'by_feed': by_feed,
              'examples': labor[:30],
              'failures': failures[:20],
              'coverage_boundary': 'Official Reports covers all appellate decisions but only selected trial-court decisions. This is published-decision evidence, not a comprehensive Supreme Court filing or NYSCEF docket feed; absence cannot be treated as no Labor Law litigation.',
              'attachment_boundary': 'Property attachment requires an address captured by explicit subject-worksite syntax in the decision text. Case citations, party names and counsel/firm addresses are excluded.',
              'liability_boundary': 'A published decision is litigation evidence and may describe allegations, motions, or rulings. Presence does not itself establish current liability, safety condition, or cooling-tower relevance.',
          }, indent=2, sort_keys=True))
          PY
      - name: Upload retained source-contract proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: labor-law-decision-source-probe
          path: probe-output/**
          retention-days: 30
