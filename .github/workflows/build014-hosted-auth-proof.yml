name: Build 014 hosted auth proof

on:
  push:
    branches: [agent/build014-hosted-auth-proof-20260826]

permissions:
  contents: read

jobs:
  hosted-auth-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Prove production sign-in and fresh-session workflow recovery
        run: npx playwright test tests/e2e/hosted-workflow-auth.spec.ts --project=desktop-chromium
