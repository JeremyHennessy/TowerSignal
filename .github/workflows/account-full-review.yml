name: Full Account actual-hosted review (non-production)

on:
  push:
    branches:
      - agent/account-full-review-20260918
    paths:
      - '.github/workflows/account-full-review.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: account-full-review-20260918
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Record actual-hosted review identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p review
          git rev-parse HEAD > review/review-head.txt
          printf '%s\n' 'ACTUAL HOSTED: no candidate asset routing, no data overlays, no build or deploy' 'Previously reviewed candidate: 04e5505475077544d350d85f3a4586ad12155bdf' 'Earlier candidate diagnostic run: 35358122545' > review/provenance.txt
          gh api repos/JeremyHennessy/TowerSignal/branches/main --jq '.commit.sha' > review/main-at-start.txt
          gh api repos/JeremyHennessy/TowerSignal/pulls/278 --jq '{number,state,draft,head:.head.sha,base:.base.sha}' > review/pr278-at-start.json
          curl --fail --location --max-time 90 https://jeremyhennessy.github.io/TowerSignal/ -o review/live-index-before.html
          curl --fail --location --max-time 90 https://jeremyhennessy.github.io/TowerSignal/data/metadata.json -o review/live-metadata-before.json
          sha256sum review/live-index-before.html review/live-metadata-before.json > review/live-sha256-before.txt
      - name: Install established frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Install desktop and iPhone browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: Review actual hosted Account modes and distinct source-rich accounts
        env:
          BASE_URL: https://jeremyhennessy.github.io/TowerSignal/
        run: |
          test -z "${CANDIDATE_ROOT:-}"
          npx playwright test tests/e2e/account-full-review.spec.ts --project=desktop-chromium --project=iphone
      - name: Record final hosted identity
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/JeremyHennessy/TowerSignal/branches/main --jq '.commit.sha' > review/main-at-end.txt
          curl --fail --location --max-time 90 https://jeremyhennessy.github.io/TowerSignal/ -o review/live-index-after.html
          sha256sum review/live-index-after.html > review/live-sha256-after.txt
          cp package-lock.json review/resolved-dependencies.json
      - name: Retain actual-hosted browser review only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: account-full-review-actual-hosted
          path: |
            playwright-report
            review
          retention-days: 14
          if-no-files-found: error
