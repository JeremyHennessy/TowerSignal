name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      require_acris:
        description: Require a verified ACRIS cache in the deployed product
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '17 10 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out durable TowerSignal history
        uses: actions/checkout@v4
        with:
          ref: data/towersignal-history
          path: .history-store
          fetch-depth: 1
          sparse-checkout: data/history
      - name: Check out last verified ACRIS cache
        uses: actions/checkout@v4
        with:
          ref: data/towersignal-acris
          path: .acris-store
          fetch-depth: 1
          sparse-checkout: data/acris
      - name: Check out last verified Checkbook NYC cache
        uses: actions/checkout@v4
        with:
          ref: data/towersignal-checkbook
          path: .checkbook-store
          fetch-depth: 1
          sparse-checkout: data/checkbook
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Fetch, validate and generate current NYC data
        run: python scripts/build_data.py --output public/data
      - name: Attach exact-BIN domestic-water roof and inspection context
        run: python scripts/build_domestic_water_data.py --output public/data
      - name: Build domestic-water provider/lab/DEC market cache
        run: python scripts/build_domestic_water_market_cache.py --output public/data/domestic-water-market.json --page-size 50000
      - name: Validate domestic-water provider/lab/DEC market cache
        run: python scripts/validate_domestic_water_market_cache.py --cache public/data/domestic-water-market.json --max-age-days 1 --require-production-volume
      - name: Build provider identity review queue
        run: python scripts/build_provider_resolution_review.py --domestic-cache public/data/domestic-water-market.json --output public/data/provider-resolution-review.json
      - name: Validate provider identity review queue
        run: python scripts/validate_provider_resolution_review.py --review public/data/provider-resolution-review.json --require-production-volume
      - name: Build NYC building-water signal cache
        run: python scripts/build_nyc_water_signals_cache.py --output public/data/nyc-water-signals.json --page-size 50000
      - name: Validate NYC building-water signal cache
        run: python scripts/validate_nyc_water_signals_cache.py --cache public/data/nyc-water-signals.json --max-age-days 1 --require-production-volume
      - name: Attach exact-BBL/BIN NYC building-water signals
        run: python scripts/attach_nyc_water_signals.py --output public/data --cache public/data/nyc-water-signals.json
      - name: Build exact-count NYC lead service-line cache
        run: >-
          python scripts/build_lead_service_line_cache.py
          --output .lead-service-line-cache/lead-service-lines.ndjson.gz
          --summary .lead-service-line-cache/summary.json
          --page-size 50000
      - name: Validate NYC lead service-line cache
        run: >-
          python scripts/validate_lead_service_line_cache.py
          --data .lead-service-line-cache/lead-service-lines.ndjson.gz
          --summary .lead-service-line-cache/summary.json
          --max-age-days 1
          --require-production-volume
      - name: Attach exact-BBL NYC lead service-line records
        run: >-
          python scripts/attach_nyc_service_lines.py
          --output public/data
          --data .lead-service-line-cache/lead-service-lines.ndjson.gz
          --summary .lead-service-line-cache/summary.json
      - name: Build NYC distribution water-quality cache
        run: python scripts/build_nyc_distribution_water_cache.py --output public/data/nyc-distribution-water.json --page-size 50000
      - name: Validate NYC distribution water-quality cache
        run: python scripts/validate_nyc_distribution_water_cache.py --cache public/data/nyc-distribution-water.json --max-age-days 1 --require-production-volume
      - name: Probe ELAP public source contract
        run: python scripts/probe_elap_search.py > public/data/elap-source-probe.json
      - name: Validate ELAP public source contract
        run: python scripts/validate_elap_source_probe.py --probe public/data/elap-source-probe.json
      - name: Fetch, validate and normalize NYC City Record procurement
        run: python scripts/build_city_record_procurement.py --output public/data/procurement-city-record.json
      - name: Attach last verified Checkbook NYC procurement cache
        run: |
          python scripts/validate_checkbook_cache.py --cache .checkbook-store/data/checkbook/cache.json --max-age-days 2 --require-production-volume
          cp .checkbook-store/data/checkbook/cache.json public/data/procurement-checkbook.json
      - name: Fetch and normalize statewide NYS authority procurement
        run: python scripts/build_nys_authority_procurement.py --output public/data/procurement-nys-authorities.json --cohort data/fixtures/deal-validation-cohort.json
      - name: Validate statewide NYS authority procurement
        run: python scripts/validate_nys_authority_procurement.py --input public/data/procurement-nys-authorities.json
      - name: Build Open Book NY water procurement cache
        run: python scripts/build_openbook_water_cache.py --output public/data/procurement-openbook-water.json
      - name: Validate Open Book NY water procurement cache
        run: python scripts/validate_openbook_water_cache.py --cache public/data/procurement-openbook-water.json --max-age-days 1 --require-production-volume
      - name: Build NYCHA water-contract release-line cache
        run: python scripts/build_nycha_water_cache.py --output public/data/procurement-nycha-water.json --fiscal-year-count 5 --page-size 5000
      - name: Validate NYCHA water-contract release-line cache
        run: python scripts/validate_nycha_water_cache.py --cache public/data/procurement-nycha-water.json --max-age-days 1 --require-production-volume
      - name: Build conservative observed-vendor company intelligence
        run: >-
          python scripts/build_company_intelligence.py
          --city-record public/data/procurement-city-record.json
          --checkbook public/data/procurement-checkbook.json
          --extra-procurement public/data/procurement-nys-authorities.json
          --extra-procurement public/data/procurement-openbook-water.json
          --extra-procurement public/data/procurement-nycha-water.json
          --output public/data/companies.json
      - name: Verify cross-source company aggregation
        run: >-
          python scripts/validate_company_intelligence.py
          --companies public/data/companies.json
          --city-record public/data/procurement-city-record.json
          --checkbook public/data/procurement-checkbook.json
          --extra-procurement public/data/procurement-nys-authorities.json
          --extra-procurement public/data/procurement-openbook-water.json
          --extra-procurement public/data/procurement-nycha-water.json
      - name: Build empirical Deal Intelligence validation
        run: >-
          python scripts/build_deal_validation.py
          --city-record public/data/procurement-city-record.json
          --checkbook public/data/procurement-checkbook.json
          --extra-procurement public/data/procurement-nys-authorities.json
          --extra-procurement public/data/procurement-openbook-water.json
          --extra-procurement public/data/procurement-nycha-water.json
          --cohort data/fixtures/deal-validation-cohort.json
          --output public/data/deal-validation.json
      - name: Validate Deal Intelligence methodology and gate
        run: python scripts/validate_deal_validation.py --report public/data/deal-validation.json
      - name: Attach last verified ACRIS timing cache
        run: python scripts/attach_acris.py --output public/data --cache .acris-store/data/acris/cache.json
      - name: Validate verified ACRIS cache when present
        if: ${{ hashFiles('.acris-store/data/acris/cache.json') != '' }}
        run: python scripts/validate_acris_cache.py --cache .acris-store/data/acris/cache.json --max-age-days 30 --require-production-volume
      - name: Require attached verified ACRIS cache when requested
        if: ${{ inputs.require_acris }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          cache_path = Path('.acris-store/data/acris/cache.json')
          if not cache_path.exists():
              raise SystemExit('Required verified ACRIS cache is missing from data/towersignal-acris')
          payload = json.loads(Path('public/data/systems.json').read_text(encoding='utf-8'))
          metadata = payload.get('metadata') or {}
          if metadata.get('acris_cache_available') is not True:
              raise SystemExit('Required ACRIS cache did not attach to the generated product')
          if metadata.get('acris_cache_universe_aligned') is not True:
              raise SystemExit('Required ACRIS cache is not aligned to the current TowerSignal BBL universe')
          print(json.dumps({
              'acris_cache_generated_at': metadata.get('acris_cache_generated_at'),
              'acris_matched_bbl_count': metadata.get('acris_matched_bbl_count'),
              'acris_matched_document_count': metadata.get('acris_matched_document_count'),
          }, indent=2))
          PY
      - name: Fetch, validate and generate current NYS registry data
        run: python scripts/build_nys_data.py --output public/data
      - name: Build NYS public-water system cache
        run: python scripts/build_nys_public_water_cache.py --output public/data/nys-public-water.json
      - name: Validate NYS public-water system cache
        run: python scripts/validate_nys_public_water_cache.py --cache public/data/nys-public-water.json --max-age-days 1 --require-production-volume
      - name: Build NYS LSLI detail cache
        run: python scripts/build_nys_lsli_detail_cache.py --output public/data/nys-lsli-details.json --request-delay-seconds 0.05 --max-workers 6
      - name: Validate NYS LSLI detail cache
        run: python scripts/validate_nys_lsli_detail_cache.py --cache public/data/nys-lsli-details.json --max-age-days 1 --require-production-volume
      - name: Build NYS address-level service-line summary
        run: >-
          python scripts/build_nys_service_line_inventory_cache.py
          --data .nys-service-lines/service-lines.csv.gz
          --summary public/data/nys-service-line-inventory-summary.json
      - name: Validate NYS address-level service-line summary
        run: >-
          python scripts/validate_nys_service_line_inventory_cache.py
          --data .nys-service-lines/service-lines.csv.gz
          --summary public/data/nys-service-line-inventory-summary.json
          --max-age-days 1
          --require-production-volume
      - name: Build and validate source-health coverage
        run: python scripts/build_source_health.py --output public/data --previous-snapshot .history-store/data/history/latest.json
      - name: Attach domestic-water source health
        run: python scripts/attach_domestic_water_health.py --output public/data --previous-snapshot .history-store/data/history/latest.json
      - name: Attach ACRIS cache health and freshness
        run: python scripts/attach_acris_health.py --output public/data
      - name: Build deterministic NYC historical changes
        run: python scripts/build_history.py --output public/data --previous-snapshot .history-store/data/history/latest.json --previous-events .history-store/data/history/events.json
      - name: Build deterministic NYS historical changes
        run: python scripts/build_nys_history.py --output public/data --previous-snapshot .history-store/data/history/nys/latest.json --previous-events .history-store/data/history/nys/events.json
      - name: Validate durable NYC history size and growth
        run: python scripts/validate_history_store.py --current public/data/history/latest.json --previous .history-store/data/history/latest.json
      - name: Validate durable NYS history size and growth
        run: python scripts/validate_nys_history_store.py --current public/data/history/nys/latest.json --previous .history-store/data/history/nys/latest.json
      - name: Independently verify generated systems and OATH cases against current NYC sources
        run: python scripts/verify_live_data.py --sample-size 5
      - name: Independently verify generated domestic-water context against current sources
        run: python scripts/verify_live_domestic_water.py --output public/data --sample-size 3
      - name: Independently verify generated NYS equipment against current NYS source
        run: python scripts/verify_live_nys.py --sample-size 5
      - name: Python fixture tests
        run: python -m unittest discover -s tests/python -p 'test_*.py' -v
      - name: Lint frontend
        run: npm run lint
      - name: Typecheck frontend
        run: npm run typecheck
      - name: Frontend tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Stage history state for post-deploy persistence
        uses: actions/upload-artifact@v4
        with:
          name: towersignal-history-state
          path: |
            public/data/history/latest.json
            public/data/history/events.json
            public/data/history/nys/latest.json
            public/data/history/nys/events.json
            public/data/source-health.json
          retention-days: 7
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Install hosted-test browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Verify deployed site in desktop and iPhone browser contexts
        env:
          BASE_URL: ${{ needs.deploy.outputs.page_url }}
          REQUIRE_ACRIS: ${{ inputs.require_acris }}
        run: npm run test:e2e
      - name: Upload browser verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-browser-verification
          path: playwright-report
          retention-days: 14

  persist-history:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out durable history branch
        uses: actions/checkout@v4
        with:
          ref: data/towersignal-history
          fetch-depth: 1
      - name: Download verified history state
        uses: actions/download-artifact@v4
        with:
          name: towersignal-history-state
          path: .verified-history
      - name: Persist verified observation, event and source-health history
        run: |
          mkdir -p data/history/nys
          cp .verified-history/history/latest.json data/history/latest.json
          cp .verified-history/history/events.json data/history/events.json
          cp .verified-history/history/nys/latest.json data/history/nys/latest.json
          cp .verified-history/history/nys/events.json data/history/nys/events.json
          cp .verified-history/source-health.json data/history/source-health.json
          git config user.name "TowerSignal History Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/history
          if git diff --cached --quiet; then
            echo "History state unchanged"
          else
            git commit -m "history: persist verified TowerSignal observation [skip ci]"
            git push origin HEAD:data/towersignal-history
          fi
