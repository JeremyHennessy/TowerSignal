name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out durable TowerSignal history
        uses: actions/checkout@v4
        with:
          ref: data/towersignal-history
          path: .history-store
          fetch-depth: 1
          sparse-checkout: data/history
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Fetch, validate and generate current NYC data
        run: python scripts/build_data.py --output public/data
      - name: Build and validate source-health coverage
        run: python scripts/build_source_health.py --output public/data --previous-snapshot .history-store/data/history/latest.json
      - name: Build deterministic historical changes
        run: python scripts/build_history.py --output public/data --previous-snapshot .history-store/data/history/latest.json --previous-events .history-store/data/history/events.json
      - name: Validate durable history size and growth
        run: python scripts/validate_history_store.py --current public/data/history/latest.json --previous .history-store/data/history/latest.json
      - name: Independently verify generated systems and OATH cases against current NYC sources
        run: python scripts/verify_live_data.py --sample-size 5
      - name: Python fixture tests
        run: python -m unittest discover -s tests/python -p 'test_*.py' -v
      - name: Lint frontend
        run: npm run lint
      - name: Typecheck frontend
        run: npm run typecheck
      - name: Frontend tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Stage history state for post-deploy persistence
        uses: actions/upload-artifact@v4
        with:
          name: towersignal-history-state
          path: |
            public/data/history/latest.json
            public/data/history/events.json
          retention-days: 7
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Install hosted-test browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Verify deployed site in desktop and iPhone browser contexts
        env:
          BASE_URL: ${{ needs.deploy.outputs.page_url }}
        run: npm run test:e2e
      - name: Upload browser verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-browser-verification
          path: playwright-report
          retention-days: 14

  persist-history:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out durable history branch
        uses: actions/checkout@v4
        with:
          ref: data/towersignal-history
          fetch-depth: 1
      - name: Download verified history state
        uses: actions/download-artifact@v4
        with:
          name: towersignal-history-state
          path: .verified-history
      - name: Persist verified observation and event history
        run: |
          mkdir -p data/history
          cp .verified-history/latest.json data/history/latest.json
          cp .verified-history/events.json data/history/events.json
          git config user.name "TowerSignal History Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/history/latest.json data/history/events.json
          if git diff --cached --quiet; then
            echo "History state unchanged"
          else
            git commit -m "history: persist verified TowerSignal observation [skip ci]"
            git push origin HEAD:data/towersignal-history
          fi
