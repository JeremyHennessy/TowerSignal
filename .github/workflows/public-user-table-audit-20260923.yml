name: Identify public user-owned tables

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/public-user-table-audit-20260923.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.TOWERSIGNAL_DATABASE_URL_UNPOOLED }}
    steps:
      - name: List public tables with user_id
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DATABASE_URL:-}" || exit 2
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atc "select table_name from information_schema.columns where table_schema='public' and column_name='user_id' order by table_name;"
