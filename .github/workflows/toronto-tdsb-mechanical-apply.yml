name: Toronto TDSB Mechanical Renewal Apply

on:
  push:
    branches:
      - agent/toronto-tdsb-mechanical-apply-20260904
    paths:
      - .github/workflows/toronto-tdsb-mechanical-apply.yml

permissions:
  contents: write
  actions: read

jobs:
  apply-verify-and-persist:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout exact TDSB apply branch
        uses: actions/checkout@v4
        with:
          ref: agent/toronto-tdsb-mechanical-apply-20260904
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Download verified strict-SHA TDSB artifact
        uses: actions/download-artifact@v4
        with:
          name: toronto-tdsb-strict-snapshot
          path: /tmp/tdsb-strict
          github-token: ${{ github.token }}
          repository: JeremyHennessy/TowerSignal
          run-id: 33810060526

      - name: Compile TDSB ingestion scripts
        run: |
          python -m py_compile scripts/build_toronto_tdsb_mechanical_snapshot.py scripts/apply_toronto_tdsb_mechanical_renewals.py

      - name: Build verified TDSB source snapshot
        env:
          PYTHONPATH: scripts
        run: |
          python scripts/build_toronto_tdsb_mechanical_snapshot.py /tmp/tdsb-strict/toronto-tdsb-strict-snapshot.json

      - name: Apply exact TDSB renewals offline
        env:
          PYTHONPATH: scripts
        run: python scripts/apply_toronto_tdsb_mechanical_renewals.py

      - name: Add TDSB source projection plumbing
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path_name: str, old: str, new: str) -> None:
              path = Path(path_name)
              text = path.read_text(encoding='utf-8')
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'Patch anchor changed: {path_name}: {old!r}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          path = 'scripts/toronto_app_sources.py'
          replace_once(path,
              '    "toronto_building_permits_cleared_targeted_since_2017": "https://open.toronto.ca/dataset/building-permits-cleared-permits/",\n    "toronto_public_notices_exact_prior_poc": "https://open.toronto.ca/dataset/public-notices/",',
              '    "toronto_building_permits_cleared_targeted_since_2017": "https://open.toronto.ca/dataset/building-permits-cleared-permits/",\n    "tdsb_facility_condition_renewal": "https://www.tdsb.on.ca/Community/Planning/School-Facilities/Facility-Condition-Index",\n    "toronto_public_notices_exact_prior_poc": "https://open.toronto.ca/dataset/public-notices/",')
          replace_once(path,
              '    "www.toronto.ca",\n}',
              '    "www.toronto.ca",\n    "www.tdsb.on.ca",\n}')
          replace_once(path,
              '        "toronto_building_permits_cleared_targeted_since_2017": warehouse / "open_licensed/toronto_building_permits_cleared_targeted_since_2017.json",\n        "toronto_public_notices_exact_prior_poc": warehouse / "open_licensed/toronto_public_notices.json",',
              '        "toronto_building_permits_cleared_targeted_since_2017": warehouse / "open_licensed/toronto_building_permits_cleared_targeted_since_2017.json",\n        "tdsb_facility_condition_renewal": warehouse / "open_licensed/tdsb_facility_condition_renewal.json",\n        "toronto_public_notices_exact_prior_poc": warehouse / "open_licensed/toronto_public_notices.json",')
          anchor = '''    elif key == "toronto_public_notices_exact_prior_poc":\n'''
          insert = '''    elif key == "tdsb_facility_condition_renewal":\n        record_url = valid_public_url(row.get("school_page_url"))\n        signals = ", ".join(str(value).replace("_", " ") for value in (row.get("signals") or []))\n        priority = text(row.get("priority"))\n        result.update(\n            dataset_link_label="Open TDSB facility condition source",\n            record_url=record_url,\n            record_link_label="Open official TDSB facility condition page" if record_url else None,\n            record_title=text(row.get("school_name")),\n            record_date=None,\n            record_status=f"{priority.title()} priority renewal" if priority else "Published renewal evidence",\n            record_details=details(\n                ("School number", row.get("school_id")),\n                ("Published school address", row.get("published_address")),\n                ("Renewal priority", row.get("priority")),\n                ("Mechanical signals", signals),\n                ("Renewal scope", row.get("renewal_text")),\n            ),\n        )\n''' + anchor
          replace_once(path, anchor, insert)

          row_audit = 'scripts/audit_toronto_source_row_resolution.py'
          replace_once(row_audit,
              '    "toronto_building_permits_cleared_targeted_since_2017": ("_towersignal_source_address",),\n    "renewable_energy_installations": ("CLIENT_ADDRESS", "ADDRESS_FULL"),',
              '    "toronto_building_permits_cleared_targeted_since_2017": ("_towersignal_source_address",),\n    "tdsb_facility_condition_renewal": ("_towersignal_source_address",),\n    "renewable_energy_installations": ("CLIENT_ADDRESS", "ADDRESS_FULL"),')

          ui = 'src/components/TorontoMarketPage.tsx'
          replace_once(ui,
              "  toronto_building_permits_cleared_targeted_since_2017: 'Toronto cleared building permits',\n  ontario_environmental_compliance_reports: 'Ontario environmental compliance',",
              "  toronto_building_permits_cleared_targeted_since_2017: 'Toronto cleared building permits',\n  tdsb_facility_condition_renewal: 'TDSB facility condition renewals',\n  ontario_environmental_compliance_reports: 'Ontario environmental compliance',")

      - name: Add persisted TDSB regression tests
        shell: python
        run: |
          from pathlib import Path
          Path('tests/python/test_toronto_tdsb_mechanical_renewal_apply.py').write_text(r'''from __future__ import annotations

import json
import unittest
from pathlib import Path

ROOT = Path(__file__).resolve().parents[2]
MARKET = ROOT / "data/toronto/market/current"
SNAPSHOT = ROOT / "data/toronto/warehouse/current/open_licensed/tdsb_facility_condition_renewal.json"
SOURCE = "tdsb_facility_condition_renewal"


class TorontoTdsbMechanicalRenewalApplyTests(unittest.TestCase):
    def test_persisted_source_and_apply_counts(self) -> None:
        snapshot = json.loads(SNAPSHOT.read_text(encoding="utf-8"))
        report = json.loads((MARKET / "tdsb_mechanical_renewal_apply_report.json").read_text(encoding="utf-8"))
        links = json.loads((MARKET / "property_source_links.json").read_text(encoding="utf-8"))
        self.assertEqual(len(snapshot["rows"]), 826)
        self.assertEqual(report["metrics"]["linked_records"], 782)
        self.assertEqual(report["metrics"]["unlinked_records"], 44)
        self.assertEqual(report["metrics"]["matched_property_roots"], 330)
        self.assertEqual(report["metrics"]["new_properties"], 289)
        self.assertEqual(report["metrics"]["final_properties"], 13669)
        self.assertEqual(report["metrics"]["final_source_links"], 40841)
        self.assertEqual(len([x for x in links["links"] if x.get("source_key") == SOURCE]), 782)
        self.assertEqual((links["sources"][SOURCE])["matched_canonical_properties"], 330)

    def test_tdsb_does_not_create_relationships_or_tower_promotions(self) -> None:
        report = json.loads((MARKET / "tdsb_mechanical_renewal_apply_report.json").read_text(encoding="utf-8"))
        graph = json.loads((MARKET / "entity_graph.json").read_text(encoding="utf-8"))
        app = json.loads((ROOT / "public/data/toronto-market.json").read_text(encoding="utf-8"))
        self.assertEqual(report["metrics"]["relationship_edges_added"], 0)
        self.assertEqual(report["metrics"]["tower_status_promotions"], 0)
        self.assertEqual(len(graph["edges"]), 6343)
        self.assertFalse(any(x.get("source_key") == SOURCE for x in graph["edges"]))
        by_id = {x["property_id"]: x for x in app["properties"]}
        for pid in report["new_property_ids"]:
            self.assertEqual(by_id[pid]["tower_evidence_status"], "NO_TOWER_ASSERTION")
        snapshot = json.loads(SNAPSHOT.read_text(encoding="utf-8"))
        tower_pids = {x["property_id"] for x in snapshot["rows"] if x.get("property_id") and "cooling_tower" in (x.get("signals") or [])}
        self.assertEqual(len(tower_pids), 13)
        self.assertTrue(all(by_id[pid]["tower_evidence_status"] == "CONFIRMED_DOCUMENTARY_TOWER" for pid in tower_pids))

    def test_unresolved_tdsb_rows_remain_unlinked(self) -> None:
        snapshot = json.loads(SNAPSHOT.read_text(encoding="utf-8"))
        unresolved = [x for x in snapshot["rows"] if x.get("resolution_status") != "EXACT_LITERAL_TDSB_CIVIC_ADDRESS_TO_UNIQUE_CURRENT_ROOT"]
        self.assertEqual(len(unresolved), 44)
        self.assertTrue(all(x.get("property_id") is None for x in unresolved))
        self.assertTrue(all(x.get("address_point_id") is None for x in unresolved))


if __name__ == "__main__":
    unittest.main()
''', encoding='utf-8')

      - name: Rebuild coverage and public Toronto payload
        env:
          PYTHONPATH: scripts
        run: |
          python scripts/toronto_final_coverage.py
          python scripts/build_toronto_app_data.py

      - name: Validate TDSB data contract before expensive audits
        env:
          PYTHONPATH: scripts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          app = json.loads(Path('public/data/toronto-market.json').read_text(encoding='utf-8'))
          report = json.loads(Path('data/toronto/market/current/tdsb_mechanical_renewal_apply_report.json').read_text(encoding='utf-8'))
          source = (app.get('source_coverage') or {}).get('tdsb_facility_condition_renewal') or {}
          assert app['counts']['canonical_properties'] == 13669, app['counts']
          assert app['counts']['source_links'] == 40841, app['counts']
          assert app['counts']['official_source_families'] == 17, app['counts']
          assert app['counts']['relationship_edges'] == 6343, app['counts']
          assert app['counts']['documentary_confirmed_properties'] == 47, app['counts']
          assert source.get('source_records') == 826, source
          assert source.get('matched_records') == 782, source
          assert source.get('matched_canonical_properties') == 330, source
          assert source.get('unmatched_source_records') == 44, source
          assert report['metrics']['tower_status_promotions'] == 0
          assert report['metrics']['relationship_edges_added'] == 0
          print('TDSB_APP_CONTRACT=PASSED')
          PY
          python -m unittest tests.python.test_toronto_tdsb_mechanical_renewal_apply -v
          python scripts/validate_toronto_market.py
          python scripts/toronto_final_validate.py

      - name: Validate official source actions
        env:
          PYTHONPATH: scripts
        run: python scripts/validate_toronto_source_actions.py --strict --record-sample-size 3

      - name: Audit source semantics and stable row resolution
        env:
          PYTHONPATH: scripts
        run: |
          python scripts/audit_toronto_source_semantics.py --strict
          python scripts/audit_toronto_source_row_resolution.py --strict

      - name: Re-run final structural validation after audits
        env:
          PYTHONPATH: scripts
        run: |
          python scripts/validate_toronto_market.py
          python scripts/toronto_final_validate.py
          python -m unittest tests.python.test_toronto_tdsb_mechanical_renewal_apply -v

      - name: Verify frontend and no style changes
        run: |
          npm run lint
          npm run typecheck
          npm exec vitest run -- tests/frontend/TorontoMarket.test.tsx
          VITE_ENABLE_TORONTO=true VITE_TORONTO_PREVIEW=true npm exec vite build -- --base=/ --outDir=dist-tdsb-candidate
          test -z "$(git diff a060e56d6ddf3f801df1960aaec09da4ddd31ae6 -- src/styles)" || { echo 'TDSB apply modified approved styles'; git diff a060e56d6ddf3f801df1960aaec09da4ddd31ae6 -- src/styles; exit 1; }

      - name: Persist verified TDSB source and market outputs
        run: |
          git config user.name "TowerSignal Toronto Data Bot"
          git config user.email "towersignal-toronto@users.noreply.github.com"
          git add \
            scripts/build_toronto_tdsb_mechanical_snapshot.py \
            scripts/apply_toronto_tdsb_mechanical_renewals.py \
            scripts/toronto_app_sources.py \
            scripts/audit_toronto_source_row_resolution.py \
            src/components/TorontoMarketPage.tsx \
            tests/python/test_toronto_tdsb_mechanical_renewal_apply.py \
            data/toronto/warehouse/current/open_licensed/tdsb_facility_condition_renewal.json \
            data/toronto/market/current/property_spine.json \
            data/toronto/market/current/property_source_links.json \
            data/toronto/market/current/entity_graph.json \
            data/toronto/market/current/coverage_report.json \
            data/toronto/market/current/source_action_qa.json \
            data/toronto/market/current/source_semantic_audit.json \
            data/toronto/market/current/source_row_resolution_audit.json \
            data/toronto/market/current/qa_report.json \
            data/toronto/market/current/tdsb_mechanical_renewal_apply_report.json \
            public/data/toronto-market.json
          git diff --cached --quiet && { echo 'No verified TDSB outputs to persist'; exit 1; }
          git commit -m "Toronto: add TDSB mechanical renewal intelligence"
          git push origin HEAD:agent/toronto-tdsb-mechanical-apply-20260904
          echo "TORONTO_TDSB_APPLY_SHA=$(git rev-parse HEAD)"
