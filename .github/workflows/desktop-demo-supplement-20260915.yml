name: Desktop demo supplemental views
on:
  push:
    branches: [capture/desktop-demo-20260915]
    paths: [.github/workflows/desktop-demo-supplement-20260915.yml, tests/e2e/promo-fresh-market.spec.ts]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Current desktop market and demonstration screenshots
        env:
          BASE_URL: https://jeremyhennessy.github.io/TowerSignal/
        run: npx playwright test tests/e2e/promo-fresh-market.spec.ts --project=desktop-chromium --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: towersignal-promo-fresh-market
          path: promo-fresh-market
          retention-days: 14
