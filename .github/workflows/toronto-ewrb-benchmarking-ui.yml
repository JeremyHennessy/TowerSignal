name: Toronto EWRB Benchmarking UI

# Verification rerun after hardening duplicate annual-selection assertions.
on:
  push:
    branches:
      - agent/toronto-ewrb-projection-20260904
    paths:
      - .github/workflows/toronto-ewrb-benchmarking-ui.yml

permissions:
  contents: write

jobs:
  wire-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/toronto-ewrb-projection-20260904
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wire aggregate benchmarking workspace
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/components/TorontoParityShell.tsx')
          text = path.read_text(encoding='utf-8')
          if "import { TorontoBenchmarkingPage } from './TorontoBenchmarkingPage'" not in text:
              text = text.replace("import type { TorontoMarketPayload, TorontoProperty, TorontoSourceLink } from '../types/toronto'\n", "import type { TorontoMarketPayload, TorontoProperty, TorontoSourceLink } from '../types/toronto'\nimport { TorontoBenchmarkingPage } from './TorontoBenchmarkingPage'\n", 1)
          text = text.replace("type TorontoWorkspace = 'market' | 'prospects' | 'opportunities' | 'companies' | 'portfolios' | 'watchlist' | 'sources'", "type TorontoWorkspace = 'market' | 'benchmarking' | 'prospects' | 'opportunities' | 'companies' | 'portfolios' | 'watchlist' | 'sources'", 1)
          text = text.replace("    { value: 'market', label: 'Market' },\n    { value: 'prospects', label: 'Prospects' },", "    { value: 'market', label: 'Market' },\n    { value: 'benchmarking', label: 'Benchmarking' },\n    { value: 'prospects', label: 'Prospects' },", 1)
          text = text.replace("    if (view === 'market' || payload || error) return", "    if (view === 'market' || view === 'benchmarking' || payload || error) return", 1)
          text = text.replace("    {view === 'market' ? explorer : <>\n      {error && <section", "    {view === 'market' ? explorer : <>\n      {view === 'benchmarking' && <TorontoBenchmarkingPage />}\n      {error && view !== 'benchmarking' && <section", 1)
          text = text.replace("      {!error && !payload && <section", "      {view !== 'benchmarking' && !error && !payload && <section", 1)
          path.write_text(text, encoding='utf-8')

          css = Path('src/styles/toronto-parity.css')
          style = css.read_text(encoding='utf-8')
          addition = '''\n.toronto-benchmarking-boundary{display:grid;gap:5px;border:1px solid #cbd9e8;background:#f6faff;border-radius:14px;padding:14px 16px;margin:12px 0 18px}.toronto-benchmarking-boundary strong{font-size:13px;color:#1b5d91}.toronto-benchmarking-boundary span{font-size:13px;color:#405064}.toronto-benchmarking-boundary small{color:#657488}.toronto-benchmarking-grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(260px,1fr);gap:14px}.toronto-benchmarking-card{border:1px solid #e0e6ee;background:#fff;border-radius:14px;padding:16px;min-width:0}.toronto-benchmarking-trend{grid-row:span 2}.toronto-benchmarking-card-heading{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px}.toronto-benchmarking-card-heading small{display:block;color:#6b7585;font-weight:700}.toronto-benchmarking-card-heading h2{font-size:17px;margin:2px 0 0}.toronto-benchmarking-card-heading a,.toronto-benchmarking-card-heading button{font-size:12px;font-weight:700;color:#155fa0;background:transparent;border:0;padding:0}.toronto-benchmark-bars{height:210px;display:flex;align-items:stretch;gap:8px;margin:8px 0 18px;border-bottom:1px solid #dfe5ed}.toronto-benchmark-bars button{border:0;background:transparent;padding:0 3px;flex:1;min-width:0;display:grid;grid-template-rows:1fr auto auto;gap:4px;align-items:end;color:#5a6676}.toronto-benchmark-bars button.selected{color:#155fa0}.toronto-benchmark-bar-track{height:150px;width:100%;display:flex;align-items:flex-end;justify-content:center}.toronto-benchmark-bar-track>span{display:block;width:min(36px,75%);min-height:8px;border-radius:7px 7px 0 0;background:currentColor;opacity:.72}.toronto-benchmark-bars strong{font-size:11px;white-space:nowrap}.toronto-benchmark-bars small{font-size:11px;padding-bottom:5px}.toronto-benchmark-list{display:grid;gap:0}.toronto-benchmark-list>div{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #edf0f4}.toronto-benchmark-list>div:last-child{border-bottom:0}.toronto-benchmark-list span{font-size:12px;color:#475569;min-width:0}.toronto-benchmark-list strong{font-size:12px}.toronto-benchmark-list small{font-size:11px;color:#7a8594;min-width:48px;text-align:right}\n@media(max-width:980px){.toronto-benchmarking-grid{grid-template-columns:1fr}.toronto-benchmarking-trend{grid-row:auto}}\n@media(max-width:600px){.toronto-benchmarking-card{padding:12px}.toronto-benchmarking-card-heading{flex-direction:column}.toronto-benchmark-bars{gap:3px;height:180px}.toronto-benchmark-bar-track{height:125px}.toronto-benchmark-bars strong{font-size:9px}.toronto-benchmark-bars small{font-size:10px}}\n'''
          if '.toronto-benchmarking-boundary' not in style:
              css.write_text(style.rstrip() + addition, encoding='utf-8')
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify benchmarking UI and existing parity workspaces
        run: |
          npm run lint
          npm run typecheck
          npm run test -- tests/frontend/TorontoBenchmarkingPage.test.tsx tests/frontend/TorontoParityShell.test.tsx tests/frontend/TorontoMarket.test.tsx
          VITE_ENABLE_TORONTO=true VITE_TORONTO_PREVIEW=true npm run build
      - name: Persist verified UI wiring
        run: |
          git config user.name "TowerSignal Ontario UI Bot"
          git config user.email "towersignal-ontario-ui@users.noreply.github.com"
          git rm .github/workflows/toronto-ewrb-benchmarking-ui.yml
          git add src/components/TorontoBenchmarkingPage.tsx src/components/TorontoParityShell.tsx src/styles/toronto-parity.css tests/frontend/TorontoBenchmarkingPage.test.tsx
          git commit -m "Add Toronto aggregate EWRB benchmarking workspace"
          git push origin HEAD:agent/toronto-ewrb-projection-20260904
          echo "EWRB_UI_SHA=$(git rev-parse HEAD)"
