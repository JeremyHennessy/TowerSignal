name: Promote verified NYC property identity artifact

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/promote-verified-property-identity-artifact-20260923.yml

permissions:
  contents: read
  actions: write
  pages: write
  id-token: write

concurrency:
  group: promote-verified-property-identity-artifact-20260923
  cancel-in-progress: true

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Cancel competing canonical Pages refresh for this workflow-only push
        uses: actions/github-script@v7
        with:
          script: |
            const runs = (await github.rest.actions.listWorkflowRunsForRepo({
              ...context.repo,
              head_sha: context.sha,
              per_page: 100
            })).data.workflow_runs;
            for (const run of runs) {
              if (run.path === '.github/workflows/pages.yml' &&
                  ['queued','in_progress','waiting','pending'].includes(run.status)) {
                core.info(`Cancelling competing canonical Pages run ${run.id}`);
                await github.rest.actions.cancelWorkflowRun({...context.repo, run_id: run.id})
                  .catch(error => { if (error.status !== 409) throw error; });
              }
            }

      - name: Download exact verified Pages artifact
        uses: actions/download-artifact@v4
        with:
          repository: JeremyHennessy/TowerSignal
          run-id: 35803035405
          name: github-pages
          github-token: ${{ github.token }}
          path: .verified-pages

      - name: Download exact prior hosted rollback artifact
        uses: actions/download-artifact@v4
        with:
          repository: JeremyHennessy/TowerSignal
          run-id: 35803035405
          name: expedited-property-identity-rollback
          github-token: ${{ github.token }}
          path: .rollback-pages

      - name: Materialize and revalidate exact verified site
        run: |
          set -euo pipefail
          mkdir -p .site .rollback-site
          tar -xf .verified-pages/artifact.tar -C .site
          tar -xf .rollback-pages/artifact.tar -C .rollback-site
          test -f .site/index.html
          test -f .site/data/systems.json
          test -f .site/data/details/20/2000014227.json
          python scripts/validate_bbl_identity.py --output .site/data --require-production-volume
          python scripts/validate_property_identity_acceptance.py --output .site/data --require-acris
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('.site/data/details/20/2000014227.json').read_text())
          i=d.get('identity') or {}
          b=d.get('building_context') or {}
          h=d.get('hpd_registration') or {}
          a=d.get('acris_activity') or {}
          assert i.get('registry_bbl') == '1011710154'
          assert i.get('property_bbl') == '1011717513'
          assert sorted(i.get('bbl_aliases') or []) == ['1011710154','1011717513']
          assert b.get('owner_name')
          assert h.get('registration_id')
          assert len(h.get('contacts') or []) > 0
          assert int(a.get('recent_document_count') or 0) > 0
          print(json.dumps({
            'status':'PASS',
            'owner':b.get('owner_name'),
            'hpd_contacts':len(h.get('contacts') or []),
            'acris_recent_documents':a.get('recent_document_count')
          }, indent=2))
          PY

      - name: Re-upload exact verified site into main-authorized run
        uses: actions/upload-pages-artifact@v3
        with:
          path: .site

      - name: Stage exact prior live site for rollback
        uses: actions/upload-pages-artifact@v3
        with:
          name: verified-property-identity-rollback
          path: .rollback-site

  deploy:
    needs: stage
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy exact verified identity release
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify hosted 400 West 61st identity and enrichment
        env:
          BASE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.parse, urllib.request
          base=os.environ['BASE_URL']
          if not base.endswith('/'): base += '/'
          url=urllib.parse.urljoin(base,'data/details/20/2000014227.json')
          for attempt in range(30):
              try:
                  with urllib.request.urlopen(url+f'?verify={attempt}', timeout=30) as r:
                      d=json.load(r)
                  i=d.get('identity') or {}
                  b=d.get('building_context') or {}
                  h=d.get('hpd_registration') or {}
                  a=d.get('acris_activity') or {}
                  assert i.get('registry_bbl') == '1011710154'
                  assert i.get('property_bbl') == '1011717513'
                  assert sorted(i.get('bbl_aliases') or []) == ['1011710154','1011717513']
                  assert i.get('bbl_identity_status') == 'RECONCILED_REGISTRY_BASE_TO_MAPPLUTO_BBL'
                  assert str(b.get('bbl') or '') == '1011717513'
                  assert b.get('owner_name')
                  assert h.get('registration_id')
                  assert len(h.get('contacts') or []) > 0
                  assert int(a.get('recent_document_count') or 0) > 0
                  print(json.dumps({
                    'status':'PASS',
                    'owner':b.get('owner_name'),
                    'hpd_contacts':len(h.get('contacts') or []),
                    'acris_recent_documents':a.get('recent_document_count')
                  }, indent=2))
                  break
              except Exception:
                  if attempt == 29: raise
                  time.sleep(10)
          PY

      - name: Install hosted browser dependencies
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium webkit

      - name: Verify live Account on desktop and iPhone
        env:
          BASE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          npx playwright test             tests/e2e/missing-sample-priority-release.spec.ts             tests/e2e/account-header.spec.ts             tests/e2e/account-correction-acceptance.spec.ts             --project=desktop-chromium --project=iphone

      - name: Retain live proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: promoted-property-identity-live-proof
          path: |
            playwright-report
            test-results
          retention-days: 30

  rollback:
    if: ${{ always() && needs.deploy.result == 'success' && needs.verify.result == 'failure' }}
    needs: [stage, deploy, verify]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Restore exact prior live site
        uses: actions/deploy-pages@v4
        with:
          artifact_name: verified-property-identity-rollback
