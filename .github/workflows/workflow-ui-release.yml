name: Release Workflow redesign with verified data

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/workflow-ui-release.yml
      - scripts/materialize_blob_runtime.py
      - tests/python/test_blob_runtime_materializer.py
      - src/main.tsx
      - src/App.tsx
      - src/components/AccountDecisionSummary.tsx
      - src/components/AccountModeTabs.tsx
      - src/components/AccountUnifiedTimeline.tsx
      - src/components/DetailPanel.tsx
      - src/components/WorkflowQuickEditor.tsx
      - src/components/WorkflowScaleWorkspace.tsx
      - src/components/WorkflowWorkspacePage.tsx
      - src/styles/workflow-account-round2.css
      - src/styles/workflow-scale-command-center.css
      - src/styles/workflow-round2-layout-fixes.css
      - tests/frontend/WorkflowScaleWorkspace.test.tsx
      - tests/e2e/workflow-command-center.spec.ts
      - tests/e2e/account-mode-layout.spec.ts
      - tests/e2e/account-report-density.spec.ts
      - tests/e2e/domestic-water.spec.ts
      - tests/e2e/roof-map.spec.ts
      - tests/e2e/sales-precall.spec.ts
      - tests/e2e/live.spec.ts

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: workflow-ui-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: azure-production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Validate candidate frontend
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build
      - name: Test Blob runtime materializer offline
        run: python -m unittest tests/python/test_blob_runtime_materializer.py -v
      - name: Install isolated Blob reader
        run: |
          python -m venv "$RUNNER_TEMP/blob-ui-release-tools"
          "$RUNNER_TEMP/blob-ui-release-tools/bin/pip" install --disable-pip-version-check azure-storage-blob==12.25.1
      - name: Materialize current verified Blob runtime
        env:
          AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_CONTAINER: ${{ vars.AZURE_STORAGE_CONTAINER }}
          AZURE_STORAGE_PREFIX: ${{ vars.AZURE_STORAGE_PREFIX }}
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/blob-ui-release-tools/bin/python" scripts/materialize_blob_runtime.py \
            --output dist/data \
            --proof "$RUNNER_TEMP/blob-runtime-proof.json"
          test -f dist/data/systems.json
          test -f dist/data/changes.json
      - name: Assemble UI release manifest
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, os

          proof = json.loads((Path(os.environ['RUNNER_TEMP']) / 'blob-runtime-proof.json').read_text(encoding='utf-8'))
          if proof.get('runtime_files', 0) < 100:
              raise SystemExit('Verified Blob runtime inventory is unexpectedly small')
          source = proof.get('source') or {}
          if source.get('workflow_id') != 339705737 or not source.get('run_id'):
              raise SystemExit('Verified Blob pointer is not sourced from a trusted Pages release')
          manifest = {
              'candidate_sha': '${{ github.sha }}',
              'verified_data_source': source,
              'verified_runtime_manifest': proof.get('runtime_manifest'),
              'verified_data_file_count': proof['runtime_files'],
              'verified_data_bytes': proof['runtime_bytes'],
              'verified_pointer_etag': proof.get('pointer_etag'),
          }
          Path('dist/workflow-ui-release.json').write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(manifest, indent=2))
          PY
          grep -R -q "Needs a date" dist/assets
          grep -R -q "Open full account" dist/assets
          grep -R -q "Account decision summary" dist/assets
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload candidate Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy candidate to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify deployed candidate bytes and Workflow bundle
        env:
          BASE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re, time, urllib.parse, urllib.request
          base = os.environ['BASE_URL'].rstrip('/') + '/'
          expected = '${{ github.sha }}'
          for attempt in range(30):
              try:
                  with urllib.request.urlopen(base + 'workflow-ui-release.json?attempt=' + str(attempt), timeout=15) as response:
                      manifest = json.load(response)
                  if manifest.get('candidate_sha') != expected:
                      raise RuntimeError(f"candidate SHA mismatch: {manifest.get('candidate_sha')} != {expected}")
                  source = manifest.get('verified_data_source') or {}
                  if source.get('workflow_id') != 339705737 or manifest.get('verified_data_file_count', 0) < 100:
                      raise RuntimeError('deployed release lacks trusted verified-data proof')
                  with urllib.request.urlopen(base + '?workflow-release=' + str(attempt), timeout=15) as response:
                      html = response.read().decode('utf-8')
                  scripts = re.findall(r'<script[^>]+src="([^"]+)"', html)
                  bundle = ''
                  for src in scripts:
                      url = urllib.parse.urljoin(base, src)
                      with urllib.request.urlopen(url, timeout=30) as response:
                          bundle += response.read().decode('utf-8', errors='ignore')
                  for marker in ('Needs a date', 'Open full account', 'Portfolio evidence coverage', 'Account decision summary'):
                      if marker not in bundle:
                          raise RuntimeError(f'missing deployed Workflow/account marker: {marker}')
                  print(json.dumps(manifest, indent=2))
                  break
              except Exception:
                  if attempt == 29:
                      raise
                  time.sleep(5)
          PY
      - name: Install frontend dependencies and hosted-test browsers
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium webkit
      - name: Full hosted desktop and iPhone acceptance
        env:
          BASE_URL: ${{ needs.deploy.outputs.page_url }}
        run: npm run test:e2e
      - name: Retain live Workflow screenshots and Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-redesign-live-verification-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 30
          if-no-files-found: warn
