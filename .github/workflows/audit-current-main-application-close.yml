name: Close current-main application lineage
on:
  push:
    branches: [audit/full-lineage-20260923-1350]
    paths:
      - docs/audits/2026-09-23/build_current_manual_review.py
      - docs/audits/2026-09-23/build_stage20_final_application_ledger.py
      - .github/workflows/audit-current-main-application-close.yml
permissions:
  contents: write
jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build complete current-main manual review
        run: |
          python -u docs/audits/2026-09-23/build_current_manual_review.py
          cp .audit-current-manual-final/manual-remaining-review.json docs/audits/2026-09-23/stage19-typed-application-lineage/manual-remaining-review.json
          mkdir -p docs/audits/2026-09-23/current-main-manual-review
          cp .audit-current-manual-final/current-main-manual-review-summary.json docs/audits/2026-09-23/current-main-manual-review/
      - name: Reconcile final current-main application ledger
        run: |
          python -u docs/audits/2026-09-23/build_stage20_final_application_ledger.py
          rm -rf docs/audits/2026-09-23/stage20-final-application-ledger
          mkdir -p docs/audits/2026-09-23/stage20-final-application-ledger
          cp .audit-stage20/*.json docs/audits/2026-09-23/stage20-final-application-ledger/
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('docs/audits/2026-09-23/stage20-final-application-ledger/current-main-baseline.json')
          p.write_text(json.dumps({
            'production_main_included_sha':'c5be362316bc8294e1d0970419d70817ebdf9718',
            'production_commit_title':'Add provenance to private company enrichment (#315)',
            'audit_branch_alignment':'main merged into audit branch by PR #319',
          },indent=2))
          PY
      - name: Persist current-main application closure
        run: |
          git config user.name "TowerSignal Audit"
          git config user.email "actions@users.noreply.github.com"
          git add docs/audits/2026-09-23/stage19-typed-application-lineage/manual-remaining-review.json docs/audits/2026-09-23/current-main-manual-review docs/audits/2026-09-23/stage20-final-application-ledger
          git commit -m "audit: close current-main application expression ledger"
          git pull --rebase origin audit/full-lineage-20260923-1350
          git push origin HEAD:audit/full-lineage-20260923-1350
