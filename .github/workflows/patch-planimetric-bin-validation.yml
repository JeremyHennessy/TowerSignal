name: Patch Planimetric diagnostic BIN validation

on:
  push:
    branches:
      - agent/planimetric-inventory-diagnostic-20260907
    paths:
      - '.github/workflows/patch-planimetric-bin-validation.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/planimetric-inventory-diagnostic-20260907
      - name: Reject source BIN zero and other non-NYC sentinels
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/diagnose_planimetric_inventory.py')
          text = path.read_text(encoding='utf-8')
          anchor = '''def _text(value: Any) -> str | None:\n    text = str(value or "").strip()\n    return text or None\n'''
          replacement = anchor + '''\n\ndef _inventory_bin(value: Any) -> str | None:\n    bin_value = normalize_bin(value)\n    if not bin_value or len(bin_value) != 7 or bin_value[0] not in BOROUGH_BY_BIN_PREFIX:\n        return None\n    return bin_value\n'''
          if text.count(anchor) != 1:
              raise SystemExit('Unable to locate _text anchor')
          text = text.replace(anchor, replacement)
          if text.count('normalize_bin(system.get("bin"))') != 1:
              raise SystemExit('Unexpected regulatory BIN normalization count')
          if text.count('normalize_bin(row.get("bin"))') != 1:
              raise SystemExit('Unexpected physical BIN normalization count')
          text = text.replace('normalize_bin(system.get("bin"))', '_inventory_bin(system.get("bin"))')
          text = text.replace('normalize_bin(row.get("bin"))', '_inventory_bin(row.get("bin"))')
          path.write_text(text, encoding='utf-8')

          test = Path('tests/python/test_planimetric_inventory_diagnostic.py')
          test_text = test.read_text(encoding='utf-8')
          test_text = test_text.replace(
              '''            {"globalid": "g-4", "bin": None, "sub_featur": "212000", "status": "Unchanged"},''',
              '''            {"globalid": "g-4", "bin": "0", "sub_featur": "212000", "status": "Unchanged"},''',
          )
          test.write_text(test_text, encoding='utf-8')
          PY
      - name: Commit correction and remove helper
        run: |
          git config user.name "TowerSignal Diagnostic Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/patch-planimetric-bin-validation.yml
          git add scripts/diagnose_planimetric_inventory.py tests/python/test_planimetric_inventory_diagnostic.py
          git commit -m "Treat Planimetric BIN zero as an unlinked source feature"
          git push origin HEAD:agent/planimetric-inventory-diagnostic-20260907
