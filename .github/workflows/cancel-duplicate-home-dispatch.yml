name: Cancel redundant NYC Home dispatch
on:
  push:
    branches: ['agent/nyc-release-dispatch-20260915']
    paths: ['.github/workflows/cancel-duplicate-home-dispatch.yml']
permissions:
  actions: write
jobs:
  cancel-duplicate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const active=(await github.rest.actions.getWorkflowRun({...context.repo,run_id:35020424389})).data;
            const duplicate=(await github.rest.actions.getWorkflowRun({...context.repo,run_id:35020557899})).data;
            if(active.path!=='.github/workflows/home-intelligence-release.yml' || duplicate.path!==active.path || duplicate.event!=='workflow_dispatch' || duplicate.head_sha!=='4a1499fab419e0b9f2b3607410d54adcb523ca57') throw new Error('Unexpected run identity');
            if(['pending','queued','waiting','requested'].includes(duplicate.status)) await github.rest.actions.cancelWorkflowRun({...context.repo,run_id:duplicate.id});
            else core.info('Duplicate is not queued; no active work was cancelled');
