name: Validate firm-site identity repair
on:
  push:
    branches: [repair/firm-site-identity-20260923]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Firm-site regression tests
        run: python -m unittest tests.python.test_known_firms -v
      - name: Full Python suite
        run: python -m unittest discover -s tests/python -p 'test_*.py' -v
