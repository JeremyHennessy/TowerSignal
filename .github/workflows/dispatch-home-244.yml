name: Dispatch verified NYC Home release 244
on:
  push:
    branches: ['agent/nyc-release-dispatch-20260915']
    paths: ['.github/workflows/dispatch-home-244.yml']
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const ref=(await github.rest.git.getRef({...context.repo,ref:'heads/main'})).data;
            if (ref.object.sha!=='4a1499fab419e0b9f2b3607410d54adcb523ca57') throw new Error('Main advanced; refusing a stale release');
            const runs=(await github.rest.actions.listWorkflowRunsForRepo({...context.repo,head_sha:ref.object.sha,per_page:100})).data.workflow_runs;
            if(runs.some(r=>r.path==='.github/workflows/home-intelligence-release.yml' && ['queued','in_progress','completed'].includes(r.status) && r.conclusion!=='failure')) {core.info('Release already started or completed; no duplicate dispatch');return;}
            await github.rest.actions.createWorkflowDispatch({...context.repo,workflow_id:'home-intelligence-release.yml',ref:'main',inputs:{pr_number:'244',candidate_sha:'fe9445a4b90374799f22d4e9a452d8562a369877',proof_run_id:'35018835198'}});
            core.info('Dispatched exact tested Home artifact for NYC GitHub Pages. Deployment acceptance remains required.');
