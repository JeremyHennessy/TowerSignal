name: Toronto ChemTRAC Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - agent/toronto-approved-recovery-20260831
    paths:
      - .github/workflows/toronto-chemtrac-diagnostic.yml

permissions:
  contents: read

jobs:
  inspect-skagway:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Reproduce 10 Skagway ChemTRAC cardinality
        shell: python
        run: |
          import json
          from collections import Counter, defaultdict
          from pathlib import Path

          ROOT = Path('.')
          files = {
              'chemtrac_history': ROOT / 'data/toronto/warehouse/current/open_licensed/chemtrac_history.json',
              'chemtrac_2024': ROOT / 'data/toronto/warehouse/current/open_licensed/chemtrac_2024.json',
          }

          def rows(payload):
              if isinstance(payload, list):
                  return [x for x in payload if isinstance(x, dict)]
              if isinstance(payload, dict):
                  for key in ('rows','records','toronto_rows','matches'):
                      value = payload.get(key)
                      if isinstance(value, list):
                          return [x for x in value if isinstance(x, dict)]
              return []

          matched = []
          for source, path in files.items():
              payload = json.loads(path.read_text(encoding='utf-8'))
              source_rows = rows(payload)
              for idx, row in enumerate(source_rows):
                  haystack = ' | '.join(str(v) for v in row.values() if v is not None).upper()
                  if '10 SKAGWAY' not in haystack:
                      continue
                  year = str(row.get('_towersignal_reporting_year') or ('2024' if source == 'chemtrac_2024' else ''))
                  signature = (
                      str(row.get('FACILITY_ID') or '').strip(),
                      year,
                      str(row.get('CHEMICAL_NAME') or '').strip(),
                      str(row.get('REL_AIR') or '').strip(),
                      str(row.get('REL_WATER') or '').strip(),
                      str(row.get('REL_LAND') or '').strip(),
                  )
                  matched.append((source, idx, signature, row))

          print(f'MATCHED_ROWS={len(matched)}')
          by_source = Counter(source for source, *_ in matched)
          print('BY_SOURCE=' + json.dumps(by_source, sort_keys=True))
          signatures = defaultdict(list)
          for source, idx, signature, row in matched:
              signatures[signature].append((source, idx, row.get('_id')))
          duplicates = {sig: vals for sig, vals in signatures.items() if len(vals) > 1}
          print(f'DUPLICATE_SIGNATURES={len(duplicates)}')
          for signature, vals in sorted(duplicates.items(), key=lambda item: str(item[0])):
              print('--- DUPLICATE')
              print('SIGNATURE=' + repr(signature))
              print('ROWS=' + repr(vals))
          for source, idx, signature, row in matched[:40]:
              print('--- ROW')
              print(f'SOURCE={source} INDEX={idx} _id={row.get("_id")} SIGNATURE={signature!r}')
              print('FACILITY_NAME=' + str(row.get('FACILITY_NAME')))
              print('ADDRESS=' + str(row.get('FACILITY_ADDRESS') or row.get('ADDRESS') or row.get('FACILITYADDRESS')))
