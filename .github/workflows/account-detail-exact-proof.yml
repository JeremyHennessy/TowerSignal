name: Prove exact account detail release head

on:
  push:
    branches: ['agent/account-detail-exact-proof-20260916']

permissions:
  contents: read

concurrency:
  group: account-detail-exact-proof
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact release candidate
        uses: actions/checkout@v4
        with:
          ref: d203594aed415fced5fc51c5a30022311293d552
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install existing dependencies
        run: npm install --no-audit --no-fund
      - name: Build exact candidate
        run: npm run build
      - name: Attach current hosted runtime required by account acceptance
        env:
          LIVE_DATA_BASE: https://jeremyhennessy.github.io/TowerSignal/data
        run: |
          set -euo pipefail
          mkdir -p dist/data dist/data/details/20
          for name in systems.json changes.json nys-systems.json nys-changes.json; do
            curl --fail --location --silent --show-error --retry 4 --retry-delay 2 --retry-all-errors \
              "${LIVE_DATA_BASE}/${name}" --output "dist/data/${name}"
            test -s "dist/data/${name}"
            node -e "JSON.parse(require('fs').readFileSync('dist/data/${name}', 'utf8'))"
          done
          for id in 2000015564 2000015594; do
            curl --fail --location --silent --show-error --retry 4 --retry-delay 2 --retry-all-errors \
              "${LIVE_DATA_BASE}/details/20/${id}.json" --output "dist/data/details/20/${id}.json"
            test -s "dist/data/details/20/${id}.json"
            node -e "JSON.parse(require('fs').readFileSync('dist/data/details/20/${id}.json', 'utf8'))"
          done
      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: Exact-head desktop and iPhone account acceptance
        env:
          CANDIDATE_ROOT: dist
          BASE_URL: https://jeremyhennessy.github.io/TowerSignal/
        run: npx playwright test tests/e2e/account-detail-polish.spec.ts tests/e2e/account-mode-layout.spec.ts tests/e2e/roof-map.spec.ts
      - name: Retain screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: account-detail-exact-proof
          path: |
            playwright-report/
            test-results/
            !test-results/.auth/**
          retention-days: 30
          if-no-files-found: warn
