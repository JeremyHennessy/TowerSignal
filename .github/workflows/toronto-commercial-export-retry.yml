name: Toronto Commercial Export Retry

on:
  push:
    branches:
      - agent/toronto-ewrb-projection-20260904
    paths:
      - .github/workflows/toronto-commercial-export-retry.yml

permissions:
  contents: write

jobs:
  verify-persist:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/toronto-ewrb-projection-20260904
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply reproducible commercial export UI patch
        run: python scripts/patch_toronto_commercial_export_ui.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify exports and all Toronto parity UI surfaces
        run: |
          npm run lint
          npm run typecheck
          npm run test -- tests/frontend/TorontoCommercialExport.test.ts tests/frontend/TorontoBenchmarkingPage.test.tsx tests/frontend/TorontoParityShell.test.tsx tests/frontend/TorontoMarket.test.tsx
          VITE_ENABLE_TORONTO=true VITE_TORONTO_PREVIEW=true npm run build
      - name: Persist verified export UI
        run: |
          git config user.name "TowerSignal Toronto UI Bot"
          git config user.email "towersignal-toronto-ui@users.noreply.github.com"
          git rm .github/workflows/toronto-commercial-export-ui.yml .github/workflows/toronto-commercial-export-retry.yml
          git add src/components/TorontoParityShell.tsx src/styles/toronto-parity.css src/utils/torontoCommercialExport.ts scripts/patch_toronto_commercial_export_ui.py tests/frontend/TorontoCommercialExport.test.ts
          git commit -m "Add Toronto commercial export and lead-summary actions"
          git push origin HEAD:agent/toronto-ewrb-projection-20260904
          echo "TORONTO_EXPORT_UI_SHA=$(git rev-parse HEAD)"
