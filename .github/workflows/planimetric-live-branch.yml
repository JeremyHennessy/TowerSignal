name: Planimetric live branch diagnostic

on:
  push:
    branches: [agent/planimetric-rooftop-20260904]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify current registry against raw NYC Planimetric features
        run: python scripts/verify_live_planimetrics.py --output artifacts/planimetric-live-verification.json
      - name: Build live NYC payload with Planimetric enrichment
        run: python scripts/build_data.py --output public/data
      - name: Independently verify generated NYC payload
        run: python scripts/verify_live_data.py --systems public/data/systems.json --details public/data/details --output artifacts/generated-live-verification.json --sample-size 5
      - name: Build NYS payload required by source-health gate
        run: python scripts/build_nys_data.py --output public/data
      - name: Validate source-health attachment and coverage
        run: python scripts/build_source_health.py --output public/data
      - name: Preserve diagnostic reports
        uses: actions/upload-artifact@v4
        with:
          name: planimetric-live-verification
          path: |
            artifacts/planimetric-live-verification.json
            artifacts/generated-live-verification.json
            public/data/source-health.json
          retention-days: 7
