name: Apply historical 311 context on current main

on:
  push:
    branches:
      - agent/historical-311-context-current-main-20260907
    paths:
      - '.github/workflows/patch-historical-311-current-main.yml'
      - 'scripts/_apply_historical_311_current_main.py'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/historical-311-context-current-main-20260907
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply current-main integration patch
        run: python scripts/_apply_historical_311_current_main.py
      - name: Run historical context and coverage regressions
        run: python -m unittest tests.python.test_historical_311_context tests.python.test_coverage_audit -v
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Verify frontend integration
        run: |
          npm run lint
          npm run typecheck
          npm test -- --run
          npm run build
      - name: Commit validated non-workflow integration
        run: |
          git config user.name 'TowerSignal Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/build_coverage_audit.py scripts/validate_coverage_audit.py tests/python/test_coverage_audit.py src/types/data.ts src/components/DetailPanel.tsx src/components/AccountSectionNavigator.tsx
          git commit -m 'Integrate bounded historical NYC 311 context on current main'
          git push origin HEAD:agent/historical-311-context-current-main-20260907
