name: Toronto Commercial Builder Index Transplant

on:
  push:
    branches:
      - agent/toronto-commercial-integration-20260904
    paths:
      - .github/workflows/toronto-commercial-builder-index-transplant.yml

permissions:
  contents: write

jobs:
  transplant-verify-persist:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout commercial integration branch
        uses: actions/checkout@v4
        with:
          ref: agent/toronto-commercial-integration-20260904
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Preserve current commercial payload
        run: cp public/data/toronto-market.json /tmp/toronto-market-reference.json

      - name: Cherry-pick only verified indexed builder feature commit
        run: |
          git cherry-pick --no-commit 60a7fb4af89236e8b8fdbb85b9f84d501bc056bc
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = "scripts/build_toronto_app_data.py scripts/toronto_app_sources.py tests/python/test_toronto_app_builder_index.py "

      - name: Reverify byte parity on commercial base
        env:
          PYTHONPATH: .:scripts
        run: |
          python -m py_compile scripts/toronto_app_sources.py scripts/build_toronto_app_data.py
          python -m unittest tests.python.test_toronto_app_builder_index -v
          python scripts/build_toronto_app_data.py
          cmp -s /tmp/toronto-market-reference.json public/data/toronto-market.json || { echo 'Builder transplant changed commercial payload bytes'; exit 1; }
          echo 'COMMERCIAL_BUILDER_BYTE_PARITY=PASSED'

      - name: Persist only builder fix and remove one-off workflow
        run: |
          cp /tmp/toronto-market-reference.json public/data/toronto-market.json
          git config user.name "TowerSignal Build Bot"
          git config user.email "towersignal-build@users.noreply.github.com"
          git rm .github/workflows/toronto-commercial-builder-index-transplant.yml
          git add scripts/build_toronto_app_data.py scripts/toronto_app_sources.py tests/python/test_toronto_app_builder_index.py
          git commit -m "Toronto: carry byte-identical indexed app builder"
          git push origin HEAD:agent/toronto-commercial-integration-20260904
          echo "TORONTO_COMMERCIAL_BUILDER_SHA=$(git rev-parse HEAD)"
