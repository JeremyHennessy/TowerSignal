name: Prove sealed Neon session bridge

on:
  push:
    branches:
      - agent/neon-auth-architecture-proof-20260917

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prove bridge auth, refresh, RLS and sign-out contract
        run: node scripts/probe_neon_sealed_session_bridge.mjs
