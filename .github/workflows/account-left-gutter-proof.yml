name: Prove Account gutter candidate

on:
  push:
    branches:
      - agent/account-left-gutter-proof-20260922

permissions:
  contents: read
  actions: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Reuse exact deployed Pages 230 data candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .accepted-pages .accepted-site public/data
          gh run download 35744133412 -n github-pages -D .accepted-pages
          archive="$(find .accepted-pages -type f | head -1)"
          tar -xf "$archive" -C .accepted-site
          rm -rf public/data
          cp -R .accepted-site/data public/data
          test -f public/data/systems.json
          test -f public/data/details/20/2000015564.json

      - name: Build exact gutter candidate against accepted data
        run: npm run build

      - name: Install candidate proof browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Verify 1792px desktop and iPhone candidate geometry
        env:
          BASE_URL: https://jeremyhennessy.github.io/TowerSignal/
          CANDIDATE_ROOT: ${{ github.workspace }}/dist
        run: |
          npx playwright test tests/e2e/account-left-gutter-proof.spec.ts             --project=desktop-chromium             --project=iphone

      - name: Retain visual proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: account-left-gutter-candidate-proof
          path: |
            playwright-report
            test-results
          retention-days: 30
