name: Toronto Monitor Build

on:
  push:
    branches:
      - agent/toronto-monitor-history-20260904
    paths:
      - .github/workflows/toronto-monitor-build.yml

permissions:
  contents: write

jobs:
  build-verify-persist:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Toronto Monitor branch
        uses: actions/checkout@v4
        with:
          ref: agent/toronto-monitor-history-20260904
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Recover last verified deployed Toronto baseline
        run: |
          git fetch origin 2eea1e2d5cbf0d9cf24d2325eb3a4222806ba6ea --no-tags || true
          git show 2eea1e2d5cbf0d9cf24d2325eb3a4222806ba6ea:public/data/toronto-market.json > /tmp/toronto-previous.json
          test -s /tmp/toronto-previous.json

      - name: Build release-to-release Toronto changes
        env:
          PYTHONPATH: .:scripts
        run: |
          DETECTED_AT=$(git show -s --format=%cI c014b9646a88fd5a8affe8b1c48518faa52a2765 | sed 's/+00:00/Z/')
          python scripts/build_toronto_history.py \
            --previous /tmp/toronto-previous.json \
            --current public/data/toronto-market.json \
            --output public/data/toronto-changes.json \
            --detected-at "$DETECTED_AT" \
            --previous-sha 2eea1e2d5cbf0d9cf24d2325eb3a4222806ba6ea \
            --current-sha c014b9646a88fd5a8affe8b1c48518faa52a2765

      - name: Verify Toronto history contract
        env:
          PYTHONPATH: .:scripts
        run: |
          python -m unittest tests.python.test_toronto_history -v
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('public/data/toronto-changes.json').read_text(encoding='utf-8'))
          assert payload['schema_version'] == 'toronto-history-1.0'
          assert payload['previous_release_sha'] == '2eea1e2d5cbf0d9cf24d2325eb3a4222806ba6ea'
          assert payload['current_release_sha'] == 'c014b9646a88fd5a8affe8b1c48518faa52a2765'
          assert payload['event_count'] == len(payload['events'])
          assert payload['event_count'] > 0
          ids = [e['event_id'] for e in payload['events']]
          assert len(ids) == len(set(ids))
          forbidden = {'SAMPLING_GAP_ENTERED','SAMPLING_GAP_RESOLVED','OATH_CASE_ADDED','OATH_STATUS_CHANGED','OATH_DECISION_CHANGED','OATH_PENALTY_CHANGED','OATH_BALANCE_CHANGED'}
          assert not forbidden.intersection(payload['event_type_counts'])
          for event in payload['events']:
              if event['event_type'].endswith('_RECORD_ADDED') or event['event_type'].endswith('_RECORD_REMOVED') or event['event_type'].startswith('AIC_APPLICATION_'):
                  assert event.get('source_key') and event.get('source_record_id'), event
          print(json.dumps({
              'event_count': payload['event_count'],
              'properties_with_changes': payload['properties_with_changes'],
              'event_type_counts': payload['event_type_counts'],
              'source_counts': payload['source_counts'],
          }, indent=2))
          PY

      - name: Verify Monitor frontend
        run: |
          npm install --no-audit --no-fund
          npm run lint
          npm run typecheck
          npm exec vitest run -- tests/frontend/TorontoMonitorPage.test.tsx tests/frontend/TorontoParityShell.test.tsx tests/frontend/TorontoMarket.test.tsx
          VITE_ENABLE_TORONTO=true VITE_TORONTO_PREVIEW=true npm exec vite build -- --base=/ --outDir=dist-toronto-monitor

      - name: Persist verified Monitor artifacts
        run: |
          git config user.name "TowerSignal Toronto History Bot"
          git config user.email "towersignal-toronto-history@users.noreply.github.com"
          git rm .github/workflows/toronto-monitor-build.yml
          git add scripts/build_toronto_history.py tests/python/test_toronto_history.py src/types/torontoHistory.ts src/components/TorontoMonitorPage.tsx src/styles/toronto-monitor.css tests/frontend/TorontoMonitorPage.test.tsx public/data/toronto-changes.json
          git diff --cached --quiet && { echo 'No verified Toronto Monitor outputs to persist'; exit 1; }
          git commit -m "Add verified Toronto release-change Monitor"
          git push origin HEAD:agent/toronto-monitor-history-20260904
          echo "TORONTO_MONITOR_SHA=$(git rev-parse HEAD)"
