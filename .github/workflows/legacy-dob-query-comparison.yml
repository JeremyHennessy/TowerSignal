name: Compare legacy DOB query predicate cost
on:
  push:
    branches: [agent/legacy-dob-timeout-diagnostic-20260911]
    paths: [.github/workflows/legacy-dob-query-comparison.yml]
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 29c7c90e9d3c178535641692f33c13d4d9388017
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare read-only artifact tool
        run: python -m pip install --disable-pip-version-check requests
      - name: Load checksum-pinned property universe and original query oracle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib,os,sys,tarfile,zipfile
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from migrate_data_to_blob import GitHubReader
          r=GitHubReader();out=Path(os.environ['RUNNER_TEMP'])/'query-comparison';out.mkdir()
          for aid,digest,run,filename in [
              (10181150350,'e1672458b40c4b77d92b0f47b7fe84a32ef54920a7fa4af1cb70e4c1bb8f975c',34544249376,'pages.zip'),
              (10274370503,'6555cdcddc8a33c7e2d2e3627f2c869bd6518497c9549e3e2454f5314233197b',34623649690,'oracle.zip')]:
              m=r.get(f'/actions/artifacts/{aid}')
              assert not m['expired'] and m['digest']=='sha256:'+digest and m['workflow_run']['id']==run
              p=out/filename;r.download(f'/actions/artifacts/{aid}/zip',p)
              with p.open('rb') as f:assert hashlib.file_digest(f,'sha256').hexdigest()==digest
              assert p.stat().st_size==m['size_in_bytes']
          with zipfile.ZipFile(out/'oracle.zip') as z:(out/'oracle.json').write_bytes(z.read('result.json'))
          with zipfile.ZipFile(out/'pages.zip') as z:
              assert z.namelist()==['artifact.tar']
              with z.open('artifact.tar') as f,tarfile.open(fileobj=f,mode='r|*') as t:
                  found=0
                  for m in t:
                      if m.name.removeprefix('./')=='data/systems.json':
                          assert m.isfile() and m.size<100*1024**2
                          (out/'systems.json').write_bytes(t.extractfile(m).read());found+=1
                  assert found==1
          PY
      - name: Require identical complete rows and a measured gain before scaling the same predicate
        timeout-minutes: 20
        run: |
          python -u - <<'PY'
          import hashlib,json,os,sys,time
          from pathlib import Path
          sys.path.insert(0,'scripts')
          import build_legacy_dob_project_cache as c
          out=Path(os.environ['RUNNER_TEMP'])/'query-comparison'
          payload=json.loads((out/'systems.json').read_text())
          oracle=json.loads((out/'oracle.json').read_text())
          assert oracle['status']=='COMPLETE'
          bbls=sorted({b for s in payload['systems'] if (b:=c.normalize_bbl(s.get('bbl'))) and c._bbl_components(b)},key=int)
          original=c._exact_where
          def bounded(chunk):
              exact=original(chunk)
              parts=[c._bbl_components(b) for b in chunk if c._bbl_components(b)]
              domains=[sorted({r[0] for r in parts}),sorted({r[1] for r in parts}),sorted({str(int(r[2])).zfill(5) for r in parts})]
              guards=[key+' in('+','.join("'"+v+"'" for v in values)+')' for key,values in zip(['borough','block','lot'],domains)]
              return ' AND '.join(guards)+' AND ('+exact+')'
          report={'original_code_sha':'29c7c90e9d3c178535641692f33c13d4d9388017','hypothesis':'redundant domain filters aid query planning; exact OR predicate and ordering preserved','comparisons':[]}
          def save():(out/'result.json').write_text(json.dumps(report,indent=2))
          def fingerprint(rows):return hashlib.sha256(('\n'.join(sorted(json.dumps(r,sort_keys=True,separators=(',',':')) for r in rows))+'\n').encode()).hexdigest()
          save()
          for prior in oracle['comparisons']:
              number=prior['batch'];chunk=bbls[(number-1)*30:number*30]
              assert hashlib.sha256(original(chunk).encode()).hexdigest()==prior['where_sha256']
              reference=next(v for v in prior['variants'] if v['server_sort'])
              tick=time.monotonic()
              rows=c.fetch_where(c.DATASET_ID,where=bounded(chunk),order_by='borough,block,lot,job_s1_no',select=c.SELECT,limit=c.FETCH_CAP,request_timeout=120)
              secs=time.monotonic()-tick
              entry={'batch':number,'seconds':round(secs,3),'prior_seconds':reference['seconds'],'rows':len(rows),'row_multiset_sha256':fingerprint(rows)}
              report['comparisons'].append(entry);save();print('PREDICATE_COMPARE='+json.dumps(entry),flush=True)
              assert len(rows)<c.FETCH_CAP and len(rows)==reference['rows'] and entry['row_multiset_sha256']==reference['row_multiset_sha256'],'Complete row parity failed'
              assert secs<reference['seconds']/4,'Insufficient measured improvement; do not scale or change production'
          c._exact_where=bounded
          fetch=c.fetch_where;started=time.monotonic();batch=0
          def observed(*args,**kwargs):
              global batch
              batch+=1;tick=time.monotonic()
              print(f'FULL_COHORT batch {batch}/127 start',flush=True)
              rows=fetch(*args,**kwargs)
              event={'batch':batch,'rows':len(rows),'seconds':round(time.monotonic()-tick,3),'elapsed':round(time.monotonic()-started,3)}
              with (out/'progress.jsonl').open('a') as f:f.write(json.dumps(event)+'\n')
              print('FULL_COHORT='+json.dumps(event),flush=True)
              return rows
          c.fetch_where=observed
          result=c.build(out)
          from validate_legacy_dob_project_cache import validate
          validation=validate(out/'legacy-dob-projects.json',max_age_days=1,require_production_volume=True)
          report.update(status='COMPLETE',full_cohort_seconds=round(time.monotonic()-started,3),full_cohort_batches=batch,validation=validation,summary=result['summary'])
          save();print('PREDICATE_FULL_RESULT='+json.dumps(report),flush=True)
          PY
      - name: Retain measured result and full-cohort cache
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-dob-predicate-comparison-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/query-comparison/result.json
            ${{ runner.temp }}/query-comparison/progress.jsonl
            ${{ runner.temp }}/query-comparison/legacy-dob-projects.json
          if-no-files-found: warn
          retention-days: 14
