name: Redesign Render Artifact

on:
  push:
    branches:
      - agent/product-redesign-20260826

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Create deterministic visual-QA data
        shell: bash
        run: |
          git show e328d2fc1cbfd42d3927a6a3c5f0e6990432aaca:.github/workflows/redesign-preview-artifact.yml > /tmp/original-preview.yml
          sed -n "/python - <<'PY'/,/^          PY$/p" /tmp/original-preview.yml | sed '1d;$d;s/^          //' > /tmp/preview_data.py
          python /tmp/preview_data.py
      - name: Build exact branch UI
        run: npx vite build
      - uses: actions/upload-artifact@v4
        with:
          name: towersignal-redesign-render
          path: dist
          retention-days: 1
