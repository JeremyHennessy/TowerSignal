name: Persist Toronto App Payload

on:
  push:
    branches:
      - agent/toronto-links-normalization-20260830
    paths:
      - .github/workflows/toronto-app-payload-persist.yml
      - scripts/build_toronto_app_data.py
      - scripts/toronto_app_sources.py
      - data/toronto/market/current/**
      - data/toronto/warehouse/current/**

permissions:
  contents: write

concurrency:
  group: toronto-app-payload-persist
  cancel-in-progress: false

jobs:
  build-validate-persist:
    runs-on: ubuntu-latest
    steps:
      - name: Check out isolated Toronto branch
        uses: actions/checkout@v4
        with:
          ref: agent/toronto-links-normalization-20260830

      - name: Build normalized Toronto app payload
        run: python scripts/build_toronto_app_data.py

      - name: Validate Toronto source adapter
        run: python -m unittest tests.python.test_toronto_app_sources -v

      - name: Persist public-safe payload
        shell: bash
        run: |
          if git diff --quiet -- public/data/toronto-market.json; then
            echo "Toronto app payload is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/toronto-market.json
          git commit -m "Toronto app: persist normalized source payload"
          git push origin HEAD:agent/toronto-links-normalization-20260830
