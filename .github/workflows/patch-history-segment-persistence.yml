name: Patch history segment persistence

on:
  push:
    branches:
      - agent/history-segmentation-20260907
    paths:
      - '.github/workflows/patch-history-segment-persistence.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/history-segmentation-20260907
      - name: Add segmented history to verified artifact and persistence
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/pages.yml')
          lines = path.read_text(encoding='utf-8').splitlines()

          latest_indexes = [i for i, line in enumerate(lines) if line.strip() == 'public/data/history/latest.json']
          if len(latest_indexes) != 1:
              raise SystemExit(f'Expected one artifact latest.json line, found {len(latest_indexes)}')
          i = latest_indexes[0]
          indent = lines[i][:len(lines[i]) - len(lines[i].lstrip())]
          if i + 1 >= len(lines) or lines[i + 1].strip() != 'public/data/history/segments/**':
              lines.insert(i + 1, indent + 'public/data/history/segments/**')

          copy_indexes = [i for i, line in enumerate(lines) if line.strip() == 'cp .verified-history/history/latest.json data/history/latest.json']
          if len(copy_indexes) != 1:
              raise SystemExit(f'Expected one persistence latest.json copy, found {len(copy_indexes)}')
          i = copy_indexes[0]
          indent = lines[i][:len(lines[i]) - len(lines[i].lstrip())]
          required = [
              indent + 'rm -rf data/history/segments',
              indent + 'cp -R .verified-history/history/segments data/history/segments',
          ]
          existing = lines[i + 1:i + 3]
          if existing != required:
              lines[i + 1:i + 1] = required

          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
      - name: Commit the workflow patch and remove this one-shot helper
        run: |
          git config user.name "TowerSignal History Migration Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/patch-history-segment-persistence.yml
          git add .github/workflows/pages.yml
          git commit -m "Persist segmented NYC history after hosted verification"
          git push origin HEAD:agent/history-segmentation-20260907
