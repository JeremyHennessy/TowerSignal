name: Patch OATH seek fallback

on:
  push:
    branches:
      - agent/oath-seek-fallback-20260907
    paths:
      - '.github/workflows/patch-oath-seek-fallback.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/oath-seek-fallback-20260907
      - name: Replace unstable offset pagination with seek pagination and exact-ticket fallback
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          oath_path = Path('scripts/towersignal/oath.py')
          text = oath_path.read_text(encoding='utf-8')
          start = text.index('def _fetch_cooling_tower_agency_cases(')
          end = text.index('\n\ndef fetch_oath_cases(', start)
          replacement = dedent('''
          def _fetch_exact_ticket_fallback(requested: set[str]) -> tuple[dict[str, dict[str, Any]], int]:
              requested_list = sorted(requested)
              batches = [
                  requested_list[start : start + DEFAULT_BATCH_SIZE]
                  for start in range(0, len(requested_list), DEFAULT_BATCH_SIZE)
              ]
              cases: dict[str, dict[str, Any]] = {}
              query_row_count = 0
              worker_count = max(1, min(DEFAULT_MAX_WORKERS, len(batches))) if batches else 1
              print(
                  f"[oath] Falling back to {len(batches):,} exact-ticket batches with {worker_count} worker(s) "
                  "after the agency slice failed to stabilize",
                  flush=True,
              )
              if batches:
                  with ThreadPoolExecutor(max_workers=worker_count) as executor:
                      futures = [executor.submit(_fetch_exact_ticket_batch, batch) for batch in batches]
                      for completed_count, future in enumerate(as_completed(futures), start=1):
                          batch, rows = future.result()
                          query_row_count += len(rows)
                          _merge_exact_ticket_batch(cases, batch, rows)
                          if completed_count % 25 == 0 or completed_count == len(batches):
                              print(
                                  f"[oath] Exact-ticket fallback completed {completed_count:,}/{len(batches):,} batches; "
                                  f"matched {len(cases):,}/{len(requested_list):,} tickets",
                                  flush=True,
                              )
              validate_match_coverage(len(requested_list), len(cases))
              return cases, query_row_count


          def _fetch_cooling_tower_agency_cases(requested: set[str]) -> tuple[dict[str, dict[str, Any]], int, bool]:
              where = _cooling_tower_agency_where()
              last_counts: tuple[int, int, int] | None = None

              for snapshot_attempt in range(1, OATH_AGENCY_SNAPSHOT_ATTEMPTS + 1):
                  expected_count = _fetch_agency_count(where)
                  print(
                      f"[oath] Fetching {expected_count:,} {OATH_COOLING_TOWER_AGENCY} cases "
                      f"(snapshot attempt {snapshot_attempt}/{OATH_AGENCY_SNAPSHOT_ATTEMPTS}) with seek pagination; "
                      f"intersecting with {len(requested):,} exact summons tickets",
                      flush=True,
                  )
                  cases: dict[str, dict[str, Any]] = {}
                  fetched_count = 0
                  cursor: str | None = None
                  while True:
                      page_where = where
                      if cursor is not None:
                          escaped_cursor = cursor.replace("'", "''")
                          page_where = f"{where} AND ticket_number > '{escaped_cursor}'"
                      rows = fetch_where(
                          OATH_DATASET_ID,
                          page_where,
                          order_by="ticket_number",
                          select=OATH_SELECT,
                          request_retries=OATH_RATE_LIMIT_RETRIES,
                          request_timeout=OATH_REQUEST_TIMEOUT_SECONDS,
                          limit=OATH_AGENCY_PAGE_SIZE,
                      )
                      if not rows:
                          break
                      raw_tickets = [str(row.get("ticket_number") or "").strip() for row in rows]
                      if any(not ticket for ticket in raw_tickets):
                          raise SourceFetchError("OATH agency seek page returned a row without ticket_number")
                      if raw_tickets != sorted(raw_tickets):
                          raise SourceFetchError("OATH agency seek page violated ticket_number ordering")
                      if cursor is not None and raw_tickets[0] <= cursor:
                          raise SourceFetchError(
                              f"OATH agency seek pagination did not advance beyond ticket_number {cursor}"
                          )
                      next_cursor = raw_tickets[-1]
                      if cursor is not None and next_cursor <= cursor:
                          raise SourceFetchError(
                              f"OATH agency seek cursor did not advance: {cursor} -> {next_cursor}"
                          )
                      fetched_count += len(rows)
                      for row in rows:
                          case = normalize_case(row)
                          if not case:
                              continue
                          ticket = case["ticket_number"]
                          if ticket not in requested:
                              continue
                          existing = cases.get(ticket)
                          if existing is None or _completeness(case) > _completeness(existing):
                              cases[ticket] = case
                      cursor = next_cursor
                      print(
                          f"[oath] Read {fetched_count:,}/{expected_count:,} agency-slice cases; "
                          f"matched {len(cases):,}/{len(requested):,} requested tickets; cursor={cursor}",
                          flush=True,
                      )
                      if len(rows) < OATH_AGENCY_PAGE_SIZE:
                          break

                  final_count = _fetch_agency_count(where)
                  last_counts = (expected_count, fetched_count, final_count)
                  if expected_count == fetched_count == final_count:
                      return cases, fetched_count, False

                  if snapshot_attempt < OATH_AGENCY_SNAPSHOT_ATTEMPTS:
                      print(
                          f"[oath] OATH agency slice changed during seek pagination: start count {expected_count:,}, "
                          f"fetched {fetched_count:,}, end count {final_count:,}; restarting from the first key",
                          flush=True,
                      )

              start_count, fetched_count, end_count = last_counts or (0, 0, 0)
              print(
                  f"[oath] OATH agency slice did not stabilize after {OATH_AGENCY_SNAPSHOT_ATTEMPTS} seek attempts: "
                  f"start count {start_count:,}, fetched {fetched_count:,}, end count {end_count:,}. "
                  "Using exact-ticket fallback rather than publishing a mixed agency snapshot.",
                  flush=True,
              )
              cases, query_row_count = _fetch_exact_ticket_fallback(requested)
              return cases, query_row_count, True
          ''').lstrip()
          text = text[:start] + replacement + text[end:]

          old_call = '''        cases, query_row_count = _fetch_cooling_tower_agency_cases(set(requested))
                  query_scope = (
                      f"OATH issuing_agency='{OATH_COOLING_TOWER_AGENCY}' rows intersected by exact "
                      "NYC Health summons_number values"
                  )'''
          old_call = dedent(old_call).replace('\n', '\n        ', 1) if False else old_call
          # Match by function call and the following query-scope block without relying on workflow indentation.
          call_start = text.index('        cases, query_row_count = _fetch_cooling_tower_agency_cases(set(requested))')
          scope_end = text.index('\n    else:', call_start)
          current_block = text[call_start:scope_end]
          expected_scope = '''        cases, query_row_count = _fetch_cooling_tower_agency_cases(set(requested))
                  query_scope = (
                      f"OATH issuing_agency='{OATH_COOLING_TOWER_AGENCY}' rows intersected by exact "
                      "NYC Health summons_number values"
                  )'''
          expected_scope = dedent(expected_scope).strip('\n')
          # Preserve exactly the existing query-scope text but change the call and append fallback provenance.
          changed_block = current_block.replace(
              'cases, query_row_count = _fetch_cooling_tower_agency_cases(set(requested))',
              'cases, query_row_count, used_exact_fallback = _fetch_cooling_tower_agency_cases(set(requested))',
              1,
          )
          changed_block += '\n        if used_exact_fallback:\n            query_scope += "; unstable agency snapshot fell back to exact ticket_number batches"'
          text = text[:call_start] + changed_block + text[scope_end:]
          oath_path.write_text(text, encoding='utf-8')

          test_path = Path('tests/python/test_oath_fetch.py')
          tests = test_path.read_text(encoding='utf-8')
          if 'self.assertEqual(offset, 0)' not in tests:
              raise SystemExit('Stable agency test no longer has the expected offset assertion')
          tests = tests.replace('self.assertEqual(offset, 0)', 'self.assertIsNone(offset)', 1)

          fn_marker = '    def test_large_ticket_set_fails_closed_when_agency_slice_never_stabilizes'
          fn_pos = tests.index(fn_marker)
          block_start = tests.rfind('    @patch(', 0, fn_pos)
          footer = tests.index('\n\n\nif __name__ == "__main__":', fn_pos)
          replacement_tests = dedent('''
              @patch("towersignal.oath._fetch_exact_ticket_batch")
              @patch("towersignal.oath.fetch_metadata", return_value={"name": "OATH test", "source_last_updated_at": "2026-09-06T00:00:00Z"})
              @patch("towersignal.oath.fetch_where")
              def test_large_ticket_set_falls_back_to_exact_batches_when_agency_slice_never_stabilizes(
                  self, fetch_where_mock, _fetch_metadata_mock, exact_batch_mock
              ):
                  requested = [f"{index:010d}" for index in range(1000)]
                  rows = [{"ticket_number": ticket, "hearing_status": "HEARING COMPLETED"} for ticket in requested]
                  fetch_where_mock.side_effect = [
                      [{"count": "1001"}], rows, [{"count": "1000"}],
                      [{"count": "1000"}], rows[:-1], [{"count": "999"}],
                  ]

                  def exact_side_effect(batch):
                      return batch, [{"ticket_number": ticket, "hearing_status": "HEARING COMPLETED"} for ticket in batch]

                  exact_batch_mock.side_effect = exact_side_effect
                  cases, metadata = fetch_oath_cases(requested)

                  self.assertEqual(set(cases), set(requested))
                  self.assertEqual(fetch_where_mock.call_count, 6)
                  self.assertEqual(exact_batch_mock.call_count, 4)
                  self.assertIn("fell back to exact ticket_number batches", metadata["source_query_scope"])
                  self.assertEqual(metadata["source_record_count"], len(requested))

              @patch("towersignal.oath.validate_match_coverage")
              @patch("towersignal.oath.OATH_AGENCY_PAGE_SIZE", 2)
              @patch("towersignal.oath.fetch_metadata", return_value={"name": "OATH test", "source_last_updated_at": "2026-09-06T00:00:00Z"})
              @patch("towersignal.oath.fetch_where")
              def test_large_ticket_set_uses_ticket_seek_cursor_between_pages(
                  self, fetch_where_mock, _fetch_metadata_mock, _coverage_mock
              ):
                  requested = ["0000000001", "0000000002", "0000000003"] + [f"9{index:09d}" for index in range(997)]
                  fetch_where_mock.side_effect = [
                      [{"count": "4"}],
                      [
                          {"ticket_number": "0000000001", "hearing_status": "HEARING COMPLETED"},
                          {"ticket_number": "0000000002", "hearing_status": "HEARING COMPLETED"},
                      ],
                      [
                          {"ticket_number": "0000000003", "hearing_status": "HEARING COMPLETED"},
                          {"ticket_number": "9999999999", "hearing_status": "HEARING COMPLETED"},
                      ],
                      [],
                      [{"count": "4"}],
                  ]

                  cases, metadata = fetch_oath_cases(requested)

                  self.assertEqual(set(cases), {"0000000001", "0000000002", "0000000003"})
                  self.assertEqual(metadata["source_record_count"], 4)
                  second_page_where = fetch_where_mock.call_args_list[2].args[1]
                  self.assertIn("ticket_number > '0000000002'", second_page_where)
                  self.assertIsNone(fetch_where_mock.call_args_list[1].kwargs.get("offset"))
          ''').strip('\n')
          # Restore class indentation after dedent.
          replacement_tests = '\n'.join('    ' + line if line else '' for line in replacement_tests.splitlines())
          tests = tests[:block_start] + replacement_tests + tests[footer:]
          test_path.write_text(tests, encoding='utf-8')
          PY
      - name: Run focused OATH tests before committing
        run: python -m unittest tests.python.test_oath_fetch -v
      - name: Commit code and test patch
        run: |
          git config user.name "TowerSignal Source Reliability Bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/towersignal/oath.py tests/python/test_oath_fetch.py
          git commit -m "Harden OATH pagination with seek and exact fallback"
          git push origin HEAD:agent/oath-seek-fallback-20260907
