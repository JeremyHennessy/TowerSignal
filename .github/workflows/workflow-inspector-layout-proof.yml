name: Verify NYC Workflow inspector layout

on:
  push:
    branches: ['agent/nyc-workflow-inspector-layout-20260916']

permissions:
  contents: read

concurrency:
  group: workflow-inspector-layout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install existing dependencies
        run: npm install --no-audit --no-fund
      - name: Static and unit regressions
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build
      - name: Attach current hosted core runtime data to candidate
        env:
          LIVE_DATA_BASE: https://jeremyhennessy.github.io/TowerSignal/data
        run: |
          set -euo pipefail
          mkdir -p dist/data
          for name in systems.json changes.json nys-systems.json nys-changes.json; do
            curl --fail --location --silent --show-error --retry 4 --retry-delay 2 --retry-all-errors \
              "${LIVE_DATA_BASE}/${name}" \
              --output "dist/data/${name}"
            test -s "dist/data/${name}"
            node -e "JSON.parse(require('fs').readFileSync('dist/data/${name}', 'utf8'))"
            echo "Attached ${name} ($(wc -c < "dist/data/${name}") bytes)"
          done
      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: Candidate Workflow desktop and iPhone acceptance
        env:
          CANDIDATE_ROOT: dist
          BASE_URL: https://jeremyhennessy.github.io/TowerSignal/
        run: npx playwright test tests/e2e/workflow-command-center.spec.ts tests/e2e/workflow-inspector-layout.spec.ts
      - name: Retain Workflow screenshots and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-inspector-layout-proof
          path: |
            playwright-report/
            test-results/
            !test-results/.auth/**
          retention-days: 30
          if-no-files-found: warn
