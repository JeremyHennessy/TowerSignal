name: Toronto Monitor Baseline Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - agent/toronto-approved-recovery-20260831
    paths:
      - .github/workflows/toronto-monitor-baseline-diagnostic.yml

permissions:
  contents: read

jobs:
  main-app-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact production main SHA
        uses: actions/checkout@v4
        with:
          ref: 91874fa1d9037b18cdc111de4c5b497420515128
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Run exact App test on production SHA
        run: npm test -- tests/frontend/App.test.tsx --reporter=verbose

  recovery-app-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Run exact App test on recovery branch
        run: npm test -- tests/frontend/App.test.tsx --reporter=verbose
