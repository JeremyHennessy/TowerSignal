name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - 'agent/**'

permissions:
  contents: read
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Identify exact main Pages run for compact Build 007
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 9e70e595e9e0cede4d3fe5e78e4dad68e3fb57f3
        run: |
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/pages.yml/runs?branch=main&event=push&per_page=20" > /tmp/pages-runs.json
          jq -c --arg sha "$TARGET_SHA" '.workflow_runs[] | select(.head_sha == $sha) | {id,status,conclusion,html_url,head_sha,run_number}' /tmp/pages-runs.json
          test "$(jq -r --arg sha "$TARGET_SHA" '[.workflow_runs[] | select(.head_sha == $sha)] | length' /tmp/pages-runs.json)" -gt 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Lint frontend
        run: npm run lint
      - name: Typecheck frontend
        run: npm run typecheck
      - name: Frontend tests
        run: npm test
      - name: Python tests
        run: python -m unittest discover -s tests/python -p 'test_*.py' -v
      - name: Production build
        run: npm run build
