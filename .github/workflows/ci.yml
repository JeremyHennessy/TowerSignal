name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - 'agent/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Lint frontend
        run: npm run lint
      - name: Typecheck frontend
        run: npm run typecheck
      - name: Frontend tests
        run: npm test
      - name: Python tests
        run: python -m unittest discover -s tests/python -p 'test_*.py' -v
      - name: Build current NYC + OATH data (Build 002 diagnostic)
        run: python scripts/build_data.py --output /tmp/towersignal-data
      - name: Independently verify current NYC + OATH data (Build 002 diagnostic)
        run: python scripts/verify_live_data.py --systems /tmp/towersignal-data/systems.json --details /tmp/towersignal-data/details --output /tmp/towersignal-verification.json --sample-size 5
      - name: Production build
        run: npm run build
