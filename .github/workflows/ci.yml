name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - 'agent/**'

permissions:
  contents: read
  actions: read

jobs:
  inspect-main-actions:
    runs-on: ubuntu-latest
    steps:
      - name: List recent main workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=main&per_page=20" \
            --jq '.workflow_runs[] | [.id, .name, .status, (.conclusion // "pending"), .head_sha, .html_url] | @tsv'
