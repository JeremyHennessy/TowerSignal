name: Verify PR280 frozen release v2

on:
  push:
    branches: [agent/pr280-frozen-proof-v2-20260921]
    paths:
      - .github/workflows/pr280-frozen-proof-v2.yml
      - tests/e2e/candidate-routes.ts

permissions:
  contents: read
  actions: read

jobs:
  frozen_regression:
    strategy:
      fail-fast: false
      matrix:
        browser: [desktop-chromium, iphone]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Prove product and acceptance test are byte-preserved
        run: |
          git fetch --depth=1 origin 057bd55208243d9f4df3822275c93441018f6505
          git diff --exit-code 057bd55208243d9f4df3822275c93441018f6505 HEAD -- src scripts package.json tests/e2e/final-release-acceptance.spec.ts
          python - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only','057bd55208243d9f4df3822275c93441018f6505','HEAD'],text=True).splitlines())
          expected={'.github/workflows/pr280-frozen-proof-v2.yml','tests/e2e/candidate-routes.ts'}
          assert changed==expected,(changed,expected)
          PY
      - uses: actions/download-artifact@v4
        with:
          name: account-reviewed-release-candidate
          run-id: 35380175972
          github-token: ${{ github.token }}
          path: .sealed
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Open exact accepted frozen Account candidate
        run: |
          test "$(cat .sealed/product-head.txt)" = 18c21ea5f7e536fb94479ef8c8ac4065045597f4
          (cd .sealed && sha256sum --check candidate.tgz.sha256)
          mkdir -p .candidate-pages
          tar -xzf .sealed/candidate.tgz -C .candidate-pages
          cp .sealed/resolved-dependencies.json package-lock.json
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium webkit
      - name: Run reconciled final acceptance against exact frozen candidate
        env:
          BASE_URL: https://jeremyhennessy.github.io/TowerSignal/
          CANDIDATE_ROOT: ${{ github.workspace }}/.candidate-pages
          REQUIRE_ACRIS: false
        run: >-
          npx playwright test tests/e2e/final-release-acceptance.spec.ts
          --project=${{ matrix.browser }}
          --output=test-results/pr280-frozen-${{ matrix.browser }}
      - name: Retain frozen-data browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr280-frozen-v2-${{ matrix.browser }}
          path: |
            playwright-report
            test-results/pr280-frozen-${{ matrix.browser }}
          retention-days: 30
