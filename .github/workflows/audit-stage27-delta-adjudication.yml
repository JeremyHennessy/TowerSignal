name: Adjudicate HPD DWT and facade population deltas
on:
  push:
    branches: [audit/full-lineage-20260923-1350]
    paths:
      - docs/audits/2026-09-23/audit_stage27_delta_adjudication.py
      - .github/workflows/audit-stage27-delta-adjudication.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Adjudicate remaining population deltas
        run: python -u docs/audits/2026-09-23/audit_stage27_delta_adjudication.py
      - name: Persist results
        run: |
          mkdir -p docs/audits/2026-09-23/stage27-delta-adjudication
          cp .audit-stage27/*.json docs/audits/2026-09-23/stage27-delta-adjudication/
          git config user.name "TowerSignal Audit"
          git config user.email "actions@users.noreply.github.com"
          git add docs/audits/2026-09-23/stage27-delta-adjudication
          git commit -m "audit: persist population delta adjudication"
          git pull --rebase origin audit/full-lineage-20260923-1350
          git push origin HEAD:audit/full-lineage-20260923-1350
