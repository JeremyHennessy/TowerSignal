name: Inspect production Neon Auth config safely

on:
  push:
    branches:
      - ops/neon-auth-key-check-20260924
    paths:
      - '.github/workflows/neon-auth-key-check-20260924.yml'

permissions:
  contents: read

jobs:
  inspect-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.TOWERSIGNAL_DATABASE_URL_UNPOOLED }}
    steps:
      - name: Inspect config and user baseline
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DATABASE_URL:-}"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -P pager=off -c "
            select id, email_and_password, allow_localhost
            from neon_auth.project_config;
          "
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -P pager=off -c "
            select email, role, banned, "emailVerified"
            from neon_auth."user"
            order by lower(email);
          "
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -P pager=off -c "
            select u.email, a."providerId", length(a.password) as password_length,
                   case when a.password like '%:%' then 2 else 1 end as password_parts
            from neon_auth."user" u
            left join neon_auth.account a on a."userId"=u.id
            order by lower(u.email), a."providerId";
          "
