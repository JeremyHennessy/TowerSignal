name: Inventory available secret names safely

on:
  push:
    branches:
      - ops/neon-auth-key-check-20260924
    paths:
      - '.github/workflows/neon-auth-key-check-20260924.yml'

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ALL_SECRETS_JSON: ${{ toJSON(secrets) }}
      ALL_VARS_JSON: ${{ toJSON(vars) }}
    steps:
      - name: Print names only
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          secrets = json.loads(os.environ.get("ALL_SECRETS_JSON") or "{}")
          variables = json.loads(os.environ.get("ALL_VARS_JSON") or "{}")
          print("SECRET_NAMES=" + ",".join(sorted(secrets)))
          print("VARIABLE_NAMES=" + ",".join(sorted(variables)))
          PY
