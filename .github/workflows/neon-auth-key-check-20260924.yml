name: Inspect production Neon Auth schema safely

on:
  push:
    branches:
      - ops/neon-auth-key-check-20260924
    paths:
      - '.github/workflows/neon-auth-key-check-20260924.yml'

permissions:
  contents: read

jobs:
  inspect-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.TOWERSIGNAL_DATABASE_URL_UNPOOLED }}
    steps:
      - name: Require production database credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DATABASE_URL:-}" || { echo "TOWERSIGNAL_DATABASE_URL_UNPOOLED is unavailable"; exit 1; }
      - name: Inspect Neon Auth table and column names
        shell: bash
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atc "
            select table_name || ':' || string_agg(column_name, ',' order by ordinal_position)
            from information_schema.columns
            where table_schema='neon_auth'
            group by table_name
            order by table_name;
          "
