name: Apply BBL history backfill safety

on:
  push:
    branches:
      - agent/exact-bin-mappluto-production-20260907
    paths:
      - '.github/workflows/patch-bbl-history-safety.yml'
      - 'scripts/patch_bbl_history_safety.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/exact-bin-mappluto-production-20260907
      - name: Apply identity-backfill history guard
        run: python scripts/patch_bbl_history_safety.py
      - name: Run focused history and BBL tests
        env:
          PYTHONPATH: scripts
        run: |
          python -m unittest tests.python.test_history -v
          python -m unittest tests.python.test_bbl_identity -v
      - name: Remove temporary patch machinery
        run: rm scripts/patch_bbl_history_safety.py .github/workflows/patch-bbl-history-safety.yml
      - name: Commit history safety integration
        run: |
          git config user.name "TowerSignal Identity Bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/towersignal/history.py tests/python/test_history.py scripts/patch_bbl_history_safety.py .github/workflows/patch-bbl-history-safety.yml
          git commit -m "Suppress synthetic history during BBL identity backfill"
          git push origin HEAD:agent/exact-bin-mappluto-production-20260907
