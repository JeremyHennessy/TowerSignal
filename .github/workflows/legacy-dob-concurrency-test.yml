name: Test bounded legacy DOB concurrency
on:
  push:
    branches: [agent/legacy-dob-timeout-diagnostic-20260911]
    paths: [.github/workflows/legacy-dob-concurrency-test.yml]
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 29c7c90e9d3c178535641692f33c13d4d9388017
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Restore exact property cohort and ordered-query reference hashes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib,os,sys,tarfile,zipfile
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from migrate_data_to_blob import GitHubReader
          reader=GitHubReader();out=Path(os.environ['RUNNER_TEMP'])/'legacy-concurrency';out.mkdir()
          sources=[(10181150350,'github-pages',34544249376,'53f7016404774821051e5ebd02eeb5382dded55f',
                    'e1672458b40c4b77d92b0f47b7fe84a32ef54920a7fa4af1cb70e4c1bb8f975c'),
                   (10269522018,'legacy-query-shape-34612691664',34612691664,'35313f8ced8e792064f6d43b3e85275221ae409c',
                    'f8c73ae97bb90e3efd3773e6d4a063ae4fad82f23cd80ce210eb85ec953efa1c')]
          for aid,name,run,sha,digest in sources:
              meta=reader.get(f'/actions/artifacts/{aid}')
              assert not meta['expired'] and meta['name']==name and meta['digest']=='sha256:'+digest
              assert meta['workflow_run']['id']==run and meta['workflow_run']['head_sha']==sha
              archive=out/f'{aid}.zip';reader.download(f'/actions/artifacts/{aid}/zip',archive)
              with archive.open('rb') as f:assert hashlib.file_digest(f,'sha256').hexdigest()==digest
              assert archive.stat().st_size==meta['size_in_bytes']
              with zipfile.ZipFile(archive) as z:
                  if name=='github-pages':
                      assert z.namelist()==['artifact.tar'];found=False
                      with z.open('artifact.tar') as f,tarfile.open(fileobj=f,mode='r|*') as tar:
                          for item in tar:
                              if item.name.removeprefix('./')=='data/systems.json':
                                  assert item.isfile() and item.size<100*1024**2 and not found
                                  (out/'systems.json').write_bytes(tar.extractfile(item).read());found=True
                      assert found
                  else:
                      assert z.namelist()==['comparison.json']
                      (out/'reference.json').write_bytes(z.read('comparison.json'))
          PY
      - name: Verify exact source and normalized rows under a four-request concurrency bound
        timeout-minutes: 9
        run: |
          python -u - <<'PY'
          import hashlib,json,os,sys,time,threading
          from concurrent.futures import ThreadPoolExecutor
          from datetime import date
          from pathlib import Path
          sys.path.insert(0,'scripts')
          import build_legacy_dob_project_cache as legacy
          out=Path(os.environ['RUNNER_TEMP'])/'legacy-concurrency'
          data=json.loads((out/'systems.json').read_text());ref=json.loads((out/'reference.json').read_text())
          assert ref['status']=='PASS' and ref['source_sha']=='29c7c90e9d3c178535641692f33c13d4d9388017'
          requested=sorted({b for r in data['systems'] if (b:=legacy.normalize_bbl(r.get('bbl'))) and legacy._bbl_components(b)},key=int)
          assert len(requested)==ref['property_count'];as_of=date.fromisoformat(data['metadata']['snapshot_date'])
          def digest(rows):
              values=sorted(json.dumps(r,sort_keys=True,separators=(',',':')) for r in rows)
              return hashlib.sha256(('\n'.join(values)+'\n').encode()).hexdigest()
          active=0;peak=0;lock=threading.Lock();started=time.monotonic()
          def fetch(spec):
              global active,peak
              start=(spec['batch']-1)*30;chunk=requested[start:start+30];assert len(chunk)==spec['bbls']
              with lock:active+=1;peak=max(peak,active)
              tick=time.monotonic()
              try:
                  rows=legacy.fetch_where(legacy.DATASET_ID,where=legacy._exact_where(chunk),order_by='borough,block,lot,job_s1_no',
                       select=legacy.SELECT,limit=legacy.FETCH_CAP,request_timeout=120)
              finally:
                  with lock:active-=1
              elapsed=round(time.monotonic()-tick,3)
              assert len(rows)<legacy.FETCH_CAP and all(legacy._source_bbl(r) in set(chunk) for r in rows)
              kept=[v for r in rows if (v:=legacy.normalize_job(r,as_of=as_of)) is not None]
              actual={'seconds':elapsed,'rows':len(rows),'row_multiset_sha256':digest(rows),
                      'retained_rows':len(kept),'retained_multiset_sha256':digest(kept)}
              before=spec['metrics']['original']
              parity=all(actual[k]==before[k] for k in ['rows','row_multiset_sha256','retained_rows','retained_multiset_sha256'])
              result={'batch':spec['batch'],'serial_reference':before,'concurrent':actual,'same_complete_rows':parity}
              print('CONCURRENT_BATCH='+json.dumps(result),flush=True)
              assert parity,'Original query returned different source rows'
              return result
          with ThreadPoolExecutor(max_workers=4) as pool:results=list(pool.map(fetch,ref['results']))
          elapsed=round(time.monotonic()-started,3);serial=sum(r['serial_reference']['seconds'] for r in results)
          report={'status':'PARITY_PASS','max_concurrent_requests':peak,'wall_seconds':elapsed,
                  'serial_reference_seconds':serial,'observed_speedup':serial/elapsed,'total_cohort_batches':ref['total_batches'],
                  'results':results,'all_queries_original':True,'production_changed':False,'azure_accessed':False}
          (out/'concurrency.json').write_text(json.dumps(report,indent=2)+'\n');print('CONCURRENCY_RESULT='+json.dumps(report),flush=True)
          assert peak<=4 and elapsed<serial*0.65,'No useful bounded-concurrency improvement'
          PY
      - name: Preserve actual measurements and complete row hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-concurrency-${{ github.run_id }}
          path: ${{ runner.temp }}/legacy-concurrency/concurrency.json
          retention-days: 14
          if-no-files-found: warn
