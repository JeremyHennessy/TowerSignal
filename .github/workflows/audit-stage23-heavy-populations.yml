name: Replay heavy NYC source populations independently
on:
  push:
    branches: [audit/full-lineage-20260923-1350]
    paths:
      - docs/audits/2026-09-23/audit_stage23_heavy_populations.py
      - .github/workflows/audit-stage23-heavy-populations.yml
permissions:
  contents: write
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay current 311 HPD and OATH populations
        run: python -u docs/audits/2026-09-23/audit_stage23_heavy_populations.py
      - name: Persist evidence
        if: always()
        run: |
          if [ -d .audit-stage23 ]; then
            mkdir -p docs/audits/2026-09-23/stage23-heavy-populations
            cp .audit-stage23/*.json docs/audits/2026-09-23/stage23-heavy-populations/ || true
            git config user.name "TowerSignal Audit"
            git config user.email "actions@users.noreply.github.com"
            git add docs/audits/2026-09-23/stage23-heavy-populations
            if ! git diff --cached --quiet; then
              git commit -m "audit: persist heavy NYC population replay"
              git pull --rebase origin audit/full-lineage-20260923-1350
              git push origin HEAD:audit/full-lineage-20260923-1350
            fi
          fi
