name: Audit live NYC account detail 2000015594

on:
  push:
    branches: ['agent/account-detail-2000015594-review-20260916']

permissions:
  contents: read

concurrency:
  group: account-detail-live-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Capture current hosted account data
        run: |
          set -euo pipefail
          mkdir -p audit-data
          curl --fail --location --silent --show-error --retry 4 --retry-delay 2 --retry-all-errors \
            https://jeremyhennessy.github.io/TowerSignal/data/systems.json \
            --output audit-data/systems.json
          curl --fail --location --silent --show-error --retry 4 --retry-delay 2 --retry-all-errors \
            https://jeremyhennessy.github.io/TowerSignal/data/details/20/2000015594.json \
            --output audit-data/2000015594.json
          python - <<'PY'
          import json
          from pathlib import Path

          systems = json.loads(Path('audit-data/systems.json').read_text(encoding='utf-8'))
          detail = json.loads(Path('audit-data/2000015594.json').read_text(encoding='utf-8'))
          summary = next((row for row in systems.get('systems', []) if row.get('system_id') == '2000015594'), None)
          if summary is None:
              raise SystemExit('System 2000015594 is missing from current systems.json')

          def shape(value):
              if isinstance(value, list):
                  return {'type': 'list', 'count': len(value)}
              if isinstance(value, dict):
                  return {'type': 'object', 'keys': sorted(value.keys())}
              return {'type': type(value).__name__, 'value': value}

          print('[ACCOUNT_DATA_SUMMARY]')
          print(json.dumps(summary, indent=2, sort_keys=True))
          print('[ACCOUNT_DETAIL_TOP_LEVEL_SHAPE]')
          print(json.dumps({key: shape(value) for key, value in detail.items()}, indent=2, sort_keys=True))

          inventory = {
              'system_id': summary.get('system_id'),
              'address': summary.get('address'),
              'borough': summary.get('borough'),
              'priority_score': summary.get('priority_score'),
              'primary_signal': summary.get('primary_signal'),
              'signal_types': summary.get('signal_types'),
              'identity': detail.get('identity'),
              'signal_count': len(detail.get('signals') or []),
              'signals': detail.get('signals') or [],
              'sample_date_count': len(((detail.get('sample_history') or {}).get('dates')) or []),
              'inspection_count': len(detail.get('inspection_history') or []),
              'oath_case_count': len(detail.get('oath_case_history') or []),
              'dob_activity_count': len(detail.get('dob_activity_history') or []),
              'legacy_dob_project_count': len(detail.get('legacy_dob_project_history') or detail.get('legacy_dob_projects') or []),
              'legionella_evidence_count': len(detail.get('legionella_building_evidence') or []),
              'source_count': len(((detail.get('metadata') or {}).get('sources')) or []),
              'source_names': [source.get('name') for source in ((detail.get('metadata') or {}).get('sources') or [])],
          }
          for key in [
              'building_context', 'hpd_registration', 'planimetric_context', 'domestic_water_context',
              'building_water_signals', 'historical_water_context', 'institutional_facility_context',
              'lead_service_line_context', 'acris_activity', 'property_enforcement', 'historical_profile', 'scoring'
          ]:
              if key in detail:
                  inventory[key] = shape(detail.get(key))
          print('[ACCOUNT_DATA_INVENTORY]')
          print(json.dumps(inventory, indent=2, sort_keys=True, default=str))
          PY
      - name: Install hosted-test browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Audit live detail page in desktop and iPhone contexts
        env:
          BASE_URL: https://jeremyhennessy.github.io/TowerSignal/
        run: npx playwright test tests/e2e/account-detail-live-audit.spec.ts
      - name: Retain account audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: account-detail-2000015594-live-audit
          path: |
            audit-data/
            playwright-report/
            test-results/
            !test-results/.auth/**
          retention-days: 30
          if-no-files-found: warn
