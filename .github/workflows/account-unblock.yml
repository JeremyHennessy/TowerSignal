name: Account unblock proof
on:
  push:
    branches: [agent/account-unblock-harness-20260918]
    paths: ['.github/workflows/account-unblock.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: account-unblock-proof
  cancel-in-progress: false
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 27151c871ade30dcb90a84e9296b05ed70f8d152
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Record and validate exact product
        run: |
          mkdir -p proof
          git rev-parse HEAD | tee proof/product-head.txt
          test "$(git rev-parse HEAD)" = 27151c871ade30dcb90a84e9296b05ed70f8d152
          npm install --no-audit --no-fund
          npm run lint
          npm run typecheck
          npm test -- --reporter=junit --outputFile=proof/vitest.xml
          python -m unittest discover -s tests/python -p 'test_*.py' -v > proof/python-tests.log 2>&1
          npm run build
          git archive --format=tar.gz HEAD src scripts tests .github package.json > proof/product-source.tar.gz
      - name: Stage accepted source bytes and prove deterministic account slices
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/JeremyHennessy/TowerSignal/actions/runs/35334719612 --jq '{id,head_sha,conclusion,path}' > proof/accepted-run.json
          test "$(gh api repos/JeremyHennessy/TowerSignal/actions/runs/35334719612 --jq .conclusion)" = success
          mkdir -p .accepted .candidate-pages
          gh run download 35334719612 -n github-pages -D .accepted
          ARCHIVE="$(find .accepted -type f | head -1)"
          sha256sum "$ARCHIVE" > proof/accepted-archive.sha256
          tar -xf "$ARCHIVE" -C .candidate-pages
          python scripts/build_account_procurement.py --output .candidate-pages/data > proof/projection.json
          find .candidate-pages/data/account-procurement -type f -print0 | sort -z | xargs -0 sha256sum > proof/projection-before.sha256
          python scripts/build_account_procurement.py --output .candidate-pages/data > proof/projection-repeat.json
          sha256sum --check proof/projection-before.sha256 > proof/repeat-check.txt
          cp dist/index.html .candidate-pages/index.html
          rm -rf .candidate-pages/assets
          cp -R dist/assets .candidate-pages/assets
          cp .candidate-pages/data/account-procurement/20/2000015564/index.json proof/account-procurement-example.json
          cp dist/index.html proof/index.html
          cp -R dist/assets proof/assets
          for f in auth.helpers.ts candidate-routes.ts; do
            gh api "repos/JeremyHennessy/TowerSignal/contents/tests/e2e/$f?ref=17a136f0f3d486ab50ea6970e761c77bb8f89205" --jq '.content' | base64 --decode > "tests/e2e/$f"
          done
          gh api 'repos/JeremyHennessy/TowerSignal/contents/tests/e2e/account-full-review.spec.ts?ref=0b63235f4eea96bdcf274a67a87a25886a0acac5' --jq '.content' | base64 --decode > tests/e2e/account-full-review.spec.ts
      - name: Retain input and deterministic data proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: account-unblock-input
          path: proof
          retention-days: 14
      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: Prove unchanged resize test, complete source parity and bounded network loading
        env:
          BASE_URL: https://jeremyhennessy.github.io/TowerSignal/
          CANDIDATE_ROOT: ${{ github.workspace }}/.candidate-pages
        run: |
          npx playwright test tests/e2e/account-correction-acceptance.spec.ts tests/e2e/account-sticky-header.spec.ts tests/e2e/account-mode-layout.spec.ts tests/e2e/account-procurement-loading.spec.ts tests/e2e/account-evidence-architecture.spec.ts --project=desktop-chromium --project=iphone --output=test-results/account-core
      - name: Retain complete Account browser proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: account-unblock-browser
          path: playwright-report
          retention-days: 14
      - name: Verify nine distinct source-rich accounts on both browsers
        env:
          BASE_URL: https://jeremyhennessy.github.io/TowerSignal/
          CANDIDATE_ROOT: ${{ github.workspace }}/.candidate-pages
        run: |
          rm -rf playwright-report
          npx playwright test tests/e2e/account-full-review.spec.ts --grep 'distinct source-rich' --project=desktop-chromium --project=iphone --no-deps --output=test-results/account-matrix
      - name: Retain source-rich account matrix
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: account-unblock-matrix
          path: playwright-report
          retention-days: 14
