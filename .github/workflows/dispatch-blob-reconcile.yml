name: Dispatch bounded Blob reconciliation

on:
  push:
    branches: [agent/azure-inventory-control-20260911]
    paths: [.github/workflows/dispatch-blob-reconcile.yml]

permissions:
  contents: read
  pull-requests: read
  actions: write

concurrency:
  group: dispatch-blob-reconcile
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # No Azure secrets here. The reviewed main workflow verifies all data before receipts.
      - uses: actions/github-script@v7
        with:
          script: |
            const repo = {owner: 'JeremyHennessy', repo: 'TowerSignal'};
            const mainSha = 'a2552d9ea7697a0854f4752aa10850dcad4bff4e';
            const headSha = '0d465521f62a1a998948e4702898f8b672468256';
            const operation = 'finalize';
            const workflow = 'azure-data-reconcile.yml';
            if (context.ref !== 'refs/heads/agent/azure-inventory-control-20260911' ||
                context.repo.owner !== repo.owner || context.repo.repo !== repo.repo) throw new Error('Unexpected dispatch context');
            const main = (await github.rest.git.getRef({...repo, ref: 'heads/main'})).data;
            if (main.object.sha !== mainSha) throw new Error('Main moved');
            const pr = (await github.rest.pulls.get({...repo, pull_number: 223})).data;
            if (!pr.merged || pr.head.sha !== headSha || pr.merge_commit_sha !== mainSha) throw new Error('Unexpected PR merge');
            const ci = (await github.rest.actions.getWorkflowRun({...repo, run_id: 34594345587})).data;
            if (ci.head_sha !== headSha || ci.status !== 'completed' || ci.conclusion !== 'success') throw new Error('Exact CI not green');
            for (const [path, sha] of [['.github/workflows/' + workflow, '5a44efc7b9caef735b88e05c1fe13b07f42c60dc'], ['scripts/reconcile_blob_copy.py', 'f4b800713477ae97a25b2190489eeb82f88f443b']]) {
              const file = (await github.rest.repos.getContent({...repo, path, ref: mainSha})).data;
              if (file.type !== 'file' || file.sha !== sha) throw new Error('Reviewed file changed');
            }
            const inspection = (await github.rest.actions.getWorkflowRun({...repo, run_id: 34594607140})).data;
            if (inspection.head_sha !== mainSha || inspection.status !== 'completed' || inspection.conclusion !== 'success') throw new Error('Inspection gate not green');
            // Its actual inspected report had 22,015 exact files plus 31 marked parent directories;
            // missing_files, extra_files, size_mismatches and invalid_directory_objects were empty.
            const evidence = (await github.rest.actions.getArtifact({...repo, artifact_id: 10262630044})).data;
            if (evidence.expired || evidence.digest !== 'sha256:c836db21a05d938c58127cb3eb1bb968cf3d5b87c51aae73b411f8b47a58044a') throw new Error('Inspection evidence changed');
            const runs = (await github.rest.actions.listWorkflowRuns({...repo, workflow_id: workflow,
              head_sha: mainSha, event: 'workflow_dispatch', per_page: 100})).data;
            if (runs.total_count !== 1 || runs.workflow_runs[0].id !== 34594607140) {
              core.info('Finalization already requested or run history changed; no duplicate'); return;
            }
            const current = (await github.rest.git.getRef({...repo, ref: 'heads/main'})).data;
            if (current.object.sha !== mainSha) throw new Error('Main moved during checks');
            await github.rest.actions.createWorkflowDispatch({...repo, workflow_id: workflow, ref: 'main', inputs: {operation}});
            core.info('Requested final verification and receipts only; no payload reupload or deletion.');
