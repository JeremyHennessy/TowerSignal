name: Validate service reporting migration

on:
  push:
    branches:
      - ops/validate-service-reporting-v2-20260924
    paths:
      - '.github/workflows/validate-service-reporting-20260924.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.TOWERSIGNAL_DATABASE_URL_UNPOOLED }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify service schema absent before test
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DATABASE_URL:-}" || { echo "DATABASE_URL_SECRET=MISSING"; exit 2; }
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atc "
            select
              to_regclass('public.service_sites') is null,
              to_regclass('public.service_visits') is null,
              to_regclass('public.service_documents') is null;
          "

      - name: Validate migration 005 inside one rollback transaction
        shell: bash
        run: |
          set -euo pipefail
          sed '/^BEGIN;$/d;/^COMMIT;$/d' database/migrations/005_service_reporting_foundation.sql > /tmp/migration005-body.sql
          {
            echo 'BEGIN;'
            cat /tmp/migration005-body.sql
            cat <<'SQL'
          DO $$
          DECLARE
            v_tables integer;
            v_rls integer;
            v_triggers integer;
          BEGIN
            SELECT count(*) INTO v_tables
            FROM pg_class c
            JOIN pg_namespace n ON n.oid=c.relnamespace
            WHERE n.nspname='public'
              AND c.relkind='r'
              AND c.relname IN (
                'service_clients','service_portfolios','service_sites','service_assets',
                'service_agreements','service_visits','service_measurements','service_actions',
                'service_reports','service_documents','service_change_log'
              );

            SELECT count(*) INTO v_rls
            FROM pg_class c
            JOIN pg_namespace n ON n.oid=c.relnamespace
            WHERE n.nspname='public'
              AND c.relrowsecurity
              AND c.relname IN (
                'service_clients','service_portfolios','service_sites','service_assets',
                'service_agreements','service_visits','service_measurements','service_actions',
                'service_reports','service_documents','service_change_log'
              );

            SELECT count(*) INTO v_triggers
            FROM pg_trigger t
            JOIN pg_class c ON c.oid=t.tgrelid
            JOIN pg_namespace n ON n.oid=c.relnamespace
            WHERE n.nspname='public'
              AND NOT t.tgisinternal
              AND t.tgname IN (
                'service_clients_audit','service_portfolios_audit','service_sites_audit',
                'service_assets_audit','service_agreements_audit','service_visits_audit',
                'service_measurements_audit','service_actions_audit','service_reports_audit',
                'service_documents_audit'
              );

            IF v_tables <> 11 OR v_rls <> 11 OR v_triggers <> 10 THEN
              RAISE EXCEPTION 'Service migration validation failed: tables=% rls=% triggers=%', v_tables, v_rls, v_triggers;
            END IF;
          END $$;
          ROLLBACK;
          SQL
          } | psql "$DATABASE_URL" -v ON_ERROR_STOP=1
          echo "SERVICE_REPORTING_ROLLBACK_VALIDATION=PASS"

      - name: Confirm production schema unchanged
        shell: bash
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atc "
            select
              to_regclass('public.service_sites') is null,
              to_regclass('public.service_visits') is null,
              to_regclass('public.service_documents') is null;
          "
