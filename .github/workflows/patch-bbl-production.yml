name: Patch exact-BIN MapPLUTO BBL production identity

on:
  push:
    branches:
      - agent/exact-bin-mappluto-production-20260907
    paths:
      - '.github/workflows/patch-bbl-production.yml'
      - 'scripts/patch_bbl_production.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/exact-bin-mappluto-production-20260907
      - name: Integrate exact-BIN BBL recovery into production build
        run: python scripts/patch_bbl_production.py
      - name: Run focused BBL identity tests
        env:
          PYTHONPATH: scripts
        run: python -m unittest tests.python.test_bbl_identity -v
      - name: Remove temporary patch machinery
        run: rm scripts/patch_bbl_production.py .github/workflows/patch-bbl-production.yml
      - name: Commit production identity integration
        run: |
          git config user.name "TowerSignal Identity Bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/build_data.py scripts/build_coverage_audit.py scripts/patch_bbl_production.py .github/workflows/patch-bbl-production.yml
          git commit -m "Recover missing BBL identity before property joins"
          git push origin HEAD:agent/exact-bin-mappluto-production-20260907
